 at their old version. The publish runs waiting in between were cancelled, and the last one built only what its own push changed. Every publish run must bring all copies up to date, whatever runs were cancelled before.", "decisions": ["compare the entries with the served list of copies, over building only what the last push changed", "accept that an entry whose copy never builds (mathe-karte) is retried and turns every run red until it is fixed or delisted"], "trigger": "\"Ich habe gerade https://lernapps.net/apps/naturwunder-quiz/ mit einer neuen Version versorgt. … Und warum ist start/naturwunder-quiz nicht erreichbar? https://github.com/lernapps/apps/pull/75 wurde doch gemergt?\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i257", "note": "changes how the publish workflow decides which copies to build"}], "groups": [{"repo": "apps", "message": "fix(publish): catch up on every copy that differs from what is served\n\n## Intent\n\nSix update pull requests merged in a row left four copies at their old version. The publish runs waiting in between were cancelled, and the last one built only what its own push changed. Every run must bring all copies up to date.\n\n## Key changes\n\n- The publish plan compares the entries with the served start/copies.txt and builds every app whose copy is missing or at another commit.\n- The plan records the bug and its side effect: an entry whose copy never builds is retried on every push, and the run stays red until it is fixed or delisted.", "reason": "The one commit of apps#78.", "sources": [{"sha": "b787176", "subject": "fix(publish): catch up on every copy that differs from what is served", "date": "2026-10-21T12:53:31+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 5, "sourceCount": 1, "misplaced": []}, {"id": "i261", "session": "session_01TWaqtQxxoFKpPiDyVgx79d", "from": "2026-10-21T13:10:35.844722Z", "to": "2026-10-21T15:34:47+02:00", "repos": ["apps"], "commit": "feat(update): every 30 minutes; auto-merge what lernapps update would have done", "intent": "Once an app is listed, each push to its main should lead to an update pull request in the app overview by itself. When the checks pass and the change is no more than what lernapps update would have done, it should merge without a person. Until now the update ran once a day and auto-merged only new versions of npm dependencies, so even a plain lernapps update needed a review.", "decisions": ["ask every 30 minutes, and by hand, over a token in every creator repo or a hosted webhook service", "open the pull request only once the app's address serves the new commit, so the listing check never sees the old version", "replay lernapps update on the listed commit and compare, over a list of allowed file changes", "also let through npm dependency versions and Markdown files, except in src/ and public/, which may reach learners", "the pinned tooling must be a commit on main of lernapps/tooling, so a fork cannot fake the result", "one pull request per app that later pushes move, over a new pull request per push"], "trigger": "\"I expected that once an app was listed, each push to main of the origin repo creates a PR in the apps repo. … If they succeed and only uncritical changes were done to the app (actually what lernapps update would have done, not more), then automerge it.\" … \"1. A. Can we trigger it manually too? 2. we could actually checkout the base version in the action, then run lernapps update and if it comes to the same result, we're good to go. Also, pure text changes (*.md) should also be ignored\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i257", "note": "changes when update pull requests open and which of them merge automatically"}], "groups": [{"repo": "apps", "message": "feat(update): every 30 minutes; auto-merge what lernapps update would have done\n\n## Intent\n\nOnce an app is listed, each push to its main should lead to an update pull request by itself. When the checks pass and the change is no more than what lernapps update would have done, it should merge without a person. Until now the update ran once a day and auto-merged only new npm versions, so even a plain lernapps update needed a review.\n\n## Key changes\n\n- The update workflow runs every 30 minutes and by hand, for one app or all.\n- It opens a pull request only once the app's own address serves the new commit, so the listing check sees the new version. Later pushes move the same pull request update/<id>; a pull request closed without merging stays closed; an unchanged branch is not pushed again.\n- To classify an update, it checks out the listed commit, runs lernapps update on it with the tooling the new commit pins, and compares the result with the new commit. It auto-merges when nothing else differs beyond versions of existing npm dependencies and Markdown files outside src/ and public/. Everything else gets the label review.\n- The pinned tooling must be a commit on main of lernapps/tooling.\n- The classification runs without a secret; only opening the pull request uses the app's token.\n- The plan records the decision.", "reason": "The one commit of apps#80.", "sources": [{"sha": "ce63db7", "subject": "feat(update): every 30 minutes; auto-merge what lernapps update would have done (#80)", "date": "2026-10-21T15:34:47+02:00", "pr": 80, "plan": false, "moved": []}]}], "messages": 3, "sourceCount": 1, "misplaced": []}, {"id": "i262", "session": "session_01TWaqtQxxoFKpPiDyVgx79d", "from": "2026-10-21T13:51:30.843924Z", "to": "2026-10-21T19:38:17+02:00", "repos": ["apps", "tooling"], "commit": "docs: explain how an app is listed and how a new version reaches its copy", "intent": "Listing and updating had changed so much that even the maintainer could no longer follow who triggers what. The architecture, the tooling's docs and the creators' pages must explain it clearly: the app overview as a system of its own, the way a new version reaches the copy, and a simple picture of the listing for creators. The build page should stay about building and only point creators on to publishing.", "decisions": ["the app overview (lernapps/apps) as an external system in the system context, for a consistent architecture", "a runtime scenario for a new version of a listed app and a decision record for the replay rule", "the creators' page shows only the initial listing, as five schematic steps coloured by who acts, over the full sequence diagram", "plain HTML and CSS for the steps, without an extra script", "the build page is only about building and ends with a call to publish, with a rocket; why lernapps.net serves a copy moves to the enter page"], "trigger": "\"actually, we'd want the architecture, building blocks and a runtime scenario in the architecture docs to explain this clearly + an update of the tooling dows and a section on listing.\" … \"It may be that we need to add the apps repo as external system (actor in the system context)\" … \"Ah, der Abschnitt zum veröffentlichen auf Bauen gehört da nicht hin. Beschränke dich da aufs Bauen …\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i261", "note": "documents the update flow and the copies"}], "groups": [{"repo": "tooling", "message": "docs: the app overview as an external system; how a new version reaches the copy\n\n## Intent\n\nListing and updating had changed so much that the process was hard to follow. The architecture and the tooling's docs must explain who triggers what, from the listing to a new version of a listed app.\n\n## Key changes\n\n- The system context shows the app overview (lernapps/apps) as an external system.\n- The runtime view gains a scenario for a new version of a listed app; the listing scenario includes publishing the copy.\n- A decision records the replay rule for update pull requests; the glossary explains copy and update pull request.\n- The deployment view no longer names the listing validation in the prose about the app's hosting.\n- The listing skill and the page \"GitHub, explained\" say what happens after the merge.\n\n## Dependencies and side effects\n\n- lernapps/apps 4f721e0 explains the listing on the creators' pages.", "reason": "The squash merge of tooling#136.", "sources": [{"sha": "4c13e5b", "subject": "docs: the app overview as an external system; how a new version reaches the copy (#136)", "date": "2026-10-21T19:38:17+02:00", "pr": 136, "plan": false, "moved": []}]}, {"repo": "apps", "message": "docs: the build page ends with a call to publish; the enter page shows the listing and why there is a copy\n\n## Intent\n\nCreators should see at a glance how listing works and why lernapps.net serves a copy of their app. The build page should stay about building and send creators on to publishing.\n\n## Key changes\n\n- The enter page shows the listing as five schematic steps, coloured by who acts, readable on a phone and on a desktop.\n- Below the steps, \"Deine App bleibt deine\" explains that the app stays the creator's, and that lernapps.net serves a copy and carries the regulatory part.\n- The build page ends with a call to action and a rocket: the app can be good software for you, but for the world to hear of it, publish it.\n\n## Dependencies and side effects\n\n- lernapps/tooling 4c13e5b explains the same process in the architecture.", "reason": "The squash merge of apps#81.", "sources": [{"sha": "4f721e0", "subject": "docs: the build page ends with a call to publish; the enter page shows the listing and why there is a copy (#81)", "date": "2026-10-21T19:38:13+02:00", "pr": 81, "plan": false, "moved": []}]}], "messages": 12, "sourceCount": 2, "misplaced": []}, {"id": "i263", "session": "session_01TqoeKKdQeuwnkRJYSrT1Lp", "from": "2026-10-18T21:48:35.163956Z", "to": "2026-10-18T22:00:49+00:00", "repos": ["apps"], "commit": "docs: llms.txt orients and links instead of repeating", "intent": "The catalog's llms.txt held far too much: every app, the build steps and the listing steps. It should orient an agent and link to the pages that hold the details.", "decisions": ["link the catalog and the app pages instead of listing every app", "point to /build/ and /enter/ instead of repeating their steps", "the tests check the build skill link on /build/ only"], "trigger": "\"Die llms.txt enthält viel zu viele Informationen. Sie soll orientieren, nicht alle Apps beschreiben. Das geht über Links viel besser\" … \"App bauen kann direkt auf die apps/build verweisen\" … \"Auch all eintragen kann man durch einen Link ersetzen\"", "kind": "docs", "confidence": "evidenced", "relations": [], "groups": [{"repo": "apps", "message": "docs: llms.txt orients and links instead of repeating\n\n## Intent\n\nThe catalog's llms.txt held every app, the build steps and the listing steps. It should orient an agent and link to the pages that hold the details.\n\n## Key changes\n\n- The list of apps gives way to a short section \"Apps finden\": it links the start page with the catalog, names the pattern of the app pages (`<id>/`) and links the English version.\n- \"Eine App bauen\" points to /build/ instead of repeating skill, command and npx block.\n- \"Eine App eintragen\" points to /enter/, the skill lernapps-listing and the fallback form or e-mail, instead of the conditions, the entry template and the pull request steps.\n- The entry-point tests expect the skill link and the create command on /build/, no longer in llms.txt.", "reason": "Three steps of one request that follow each other directly on slim-llms-txt (one pull request).", "sources": [{"sha": "e3dd1f7", "subject": "docs: replace app list in llms.txt with links to the catalog", "date": "2026-10-18T21:49:07+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "e3deb1f", "subject": "docs: point llms.txt to /build/ instead of repeating the build steps", "date": "2026-10-18T21:52:16+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i264", "why": "Same request: replace the build steps in llms.txt by a link; i264 has no commits left."}]}, {"sha": "e10f28c", "subject": "docs: point llms.txt to /enter/ instead of repeating the listing steps", "date": "2026-10-18T22:00:49+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i265", "why": "Same request: replace the listing steps in llms.txt by a link; i265 has no commits left."}]}]}], "messages": 1, "sourceCount": 3, "misplaced": []}, {"id": "i266", "session": "session_01TqoeKKdQeuwnkRJYSrT1Lp", "from": "2026-10-18T22:05:40.296787Z", "to": "2026-10-18T22:06:19+00:00", "repos": ["apps"], "commit": "docs: keep the listing guide in the catalog repo as /enter/llms.txt", "intent": "Everything about listings belongs to the catalog repo, but the steps, the entry template and how to read the results comment now stood nowhere once llms.txt only linked /enter/. Keep that guide in the catalog repo, next to the listing it explains.", "decisions": ["the listing guide lives in lernapps/apps, over the tooling repo", "a separate file /enter/llms.txt, linked from llms.txt"], "trigger": "\"Hm, eigentlich gehört alles rund um listings ins App repo. Was ist da in tooling? Verbinde es und verschiebe ggf\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i263", "note": "the steps left llms.txt and need a home"}], "groups": [{"repo": "apps", "message": "docs: keep the listing guide in this repo as /enter/llms.txt\n\n## Intent\n\nEverything about listings belongs to the catalog repo. Once llms.txt only links /enter/, the steps, the entry template and how to read the results comment need a place there.\n\n## Key changes\n\n- A new page /enter/llms.txt holds the steps, the entry template and how to read the results comment.\n- llms.txt only links it.\n\n## Dependencies and side effects\n\n- The skill lernapps-listing in lernapps/tooling follows this guide (78ccbc6, intent i267).", "reason": "Its own request, kept apart from the slimmer llms.txt.", "sources": [{"sha": "367f849", "subject": "docs: keep the listing guide in this repo as /enter/llms.txt", "date": "2026-10-18T22:06:19+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i267", "session": "session_01TqoeKKdQeuwnkRJYSrT1Lp", "from": "2026-10-18T22:13:49.649993Z", "to": "2026-10-18T22:15:48+00:00", "repos": ["tooling"], "commit": "docs(listing): the listing skill follows the listing guide in the apps repo", "intent": "Everything about listing an app belongs in the apps repo, and its listing guide now lives at apps/enter/llms.txt. The tooling's listing skill still pointed to apps/llms.txt, which is now only a short overview, so its step-by-step link ran into nothing. The skill should point to the new guide and stop repeating how to read the results comment.", "decisions": ["get write access to the tooling repo and change it in a pull request of its own, over leaving the change to the person", "the skill keeps one or two sentences on the results comment and points to the guide, over keeping its own copy of the steps"], "trigger": "\"Hol dir Schreibzugriff\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i266", "note": "moves the listing guide into the apps repo; this commit makes the tooling follow it"}], "groups": [{"repo": "tooling", "message": "docs(listing): the listing skill follows the listing guide in the apps repo\n\n## Intent\n\nEverything about listing an app belongs in the apps repo. Its listing guide now lives at apps/enter/llms.txt, and apps/llms.txt is only a short overview. The listing skill must point to the new guide, or its step-by-step link runs into nothing.\n\n## Key changes\n\n- The listing skill sends the assistant to https://lernapps.net/apps/enter/llms.txt for the steps.\n- How to read the results comment is no longer repeated in the skill; it names the guide and keeps only what happens after \"bestanden\".\n- The tooling's llms.txt and the risk \"Creators without a shell\" link the new guide; the guidance test expects the new address.\n\n## Dependencies and side effects\n\n- Needs the listing guide of the apps repo (apps#55), which must not be merged before this change.", "reason": "The only commit of this request.", "sources": [{"sha": "78ccbc6", "subject": "docs: listing skill follows the listing guide at apps/enter/llms.txt", "date": "2026-10-18T22:15:48+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i268", "session": "session_01VaEZaH57vtMVesfaA8P7Cg", "from": "2026-10-18T22:14:18.028998Z", "to": "2026-10-18T22:15:08+00:00", "repos": ["app-templates"], "commit": "feat(quiz, explainer): dark mode that follows the system", "intent": "Quiz and explainer apps showed only light colours. Learners who use a dark system setting should get a dark page in both archetypes.", "decisions": ["follow the system setting with prefers-color-scheme, over a manual light/dark switch", "SVG figures get CSS classes and keep their colour attributes as a fallback, over replacing the attributes", "only quiz and explainer, not the interactive archetype", "dark colours chosen by eye, contrast not measured yet"], "trigger": "\"Dark Mode für quiz und explainer\"", "kind": "feature", "confidence": "evidenced", "relations": [], "groups": [{"repo": "app-templates", "message": "feat(quiz, explainer): dark mode that follows the system\n\n## Intent\n\nQuiz and explainer apps showed only light colours. Learners who use a dark system setting should get a dark page in both archetypes.\n\n## Key changes\n\n- Both stylesheets switch to dark values when the system asks for it (prefers-color-scheme: dark): text, background, borders, accent, and the colours for right and wrong. The colour scheme is \"light dark\", so form controls switch too.\n- In the explainer, example and note boxes, the syntax colours of code and the white-on-accent texts also use the colour variables.\n- The explainer's SVG figures carry CSS classes, so they change colour in dark mode; their colour attributes stay as a fallback.\n\n## Dependencies and side effects\n\n- The dark colours were chosen by eye; the 4.5:1 contrast is not measured yet.\n- The interactive archetype has no dark mode yet.", "reason": "The only commit of this request.", "sources": [{"sha": "ca43aed", "subject": "Add dark mode to quiz and explainer", "date": "2026-10-18T22:15:08+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i269", "session": "session_01WZaGnsWHStXAvjxy5vRfB2", "from": "2026-10-21T16:32:04.813408Z", "to": "2026-10-21T17:30:54+00:00", "repos": ["apps", "docs", "lernapps.github.io", "tooling"], "commit": "feat(site-frame): the frame in the chosen language, the text in the one it exists in", "intent": "The tooling pages exist only in English. A click on them switched the whole site to English, and since no German version existed, there was no way back. Header and footer should always stay in the language the reader chose; the content should show in that language where it exists, and otherwise in the language it is available in.", "decisions": ["copy a page that exists in one language only into every language tree at build time, each copy with the frame of its tree, over a frame that follows the page's own language", "keep the chosen language in the address, without a cookie or browser storage", "a language switch on every page, the tooling included", "links between platform pages lead to the same page in the page's language", "carry lang on header, footer, skip link and preview banner, so screen readers read the frame right inside a page in another language"], "trigger": "\"Hier ist aufgefallen, dass es die tooling Seite nur auf Englisch. Gibt. Wenn man da drauf klickt, wechselt die gesamte Seite auf Englisch Englisch und auch nicht mehr zurück auf Deutsch\" … \"Rahmen immer in der gewählten Sprache, Inhalte wenn verfügbar in der gewählten, ansonsten als fallback die verfügbare\"", "kind": "fix", "confidence": "evidenced", "relations": [], "groups": [{"repo": "lernapps.github.io", "message": "feat(site-frame): the frame in the chosen language, the text in the one it exists in\n\n## Intent\n\nThe tooling and the platform design exist in English only. Their frame followed the page's own language, so a click on them switched the whole site to English, and with no German page to switch to, there was no way back. Header and footer should stay in the language the reader chose; the text should show in that language where it exists, and otherwise in the one it is available in.\n\n## Key changes\n\n- lernapps-frame copies a page that exists in one language only (the tooling, the platform design, the vision, the organisation), with the files of its folder, into every language tree it is missing from. Each copy gets the frame of its tree and a language switch.\n- Links to pages in a copy lead to the same page in its language. The tooling joins the translated sites, so the navigation leads English readers to /tooling/en/; the footer and the English home page link the English copies.\n- The frame carries lang on header, footer, skip link and preview banner, so screen readers read it right inside a page in another language.\n- lernapps-check accepts a page of the English tree whose frame says lang=\"en\".\n\n## Dependencies and side effects\n\n- lernapps/docs 3dff842, lernapps/tooling e8c5955 and lernapps/apps 4768bcd use the new frame.", "reason": "The first fix kept a German frame on English-only pages; the second, directly after it on the same branch, replaces that with a frame in the chosen language. Only the second state was meant to ship.", "sources": [{"sha": "2f300aa", "subject": "fix(site-frame): English-only pages keep the German frame", "date": "2026-10-21T17:03:22+00:00", "pr": null, "plan": false, "moved": []}, {"sha": " side effects\n\n- Needs lernapps/lernapps.github.io 10bc90b.", "reason": "The pin follows the merge of main into the branch, so it stays alone.", "sources": [{"sha": "1dc81c3", "subject": "chore(deps): pin @lernapps/site 10bc90b: the frame outside page scripts", "date": "2026-10-21T18:32:33+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "chore(deps): pin @lernapps/site 10bc90b: the frame outside page scripts\n\n## Intent\n\nThe frame could break a page that carries \"</head>\" as text inside a script. The app overview should use the fixed frame like the other sites.\n\n## Key changes\n\n- The app overview pins the site frame that puts itself in outside the page's scripts.\n\n## Dependencies and side effects\n\n- Needs lernapps/lernapps.github.io 10bc90b.", "reason": "The pin follows the merge of main into the branch, so it stays alone.", "sources": [{"sha": "e7246d5", "subject": "chore(deps): pin @lernapps/site 10bc90b: the frame outside page scripts", "date": "2026-10-21T18:32:41+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 4, "misplaced": []}, {"id": "i276", "session": "session_01XH9va3kk4VfE1qaUNPraF2", "from": "2026-10-12T12:58:17.711838Z", "to": "2026-10-12T16:42:20+00:00", "repos": ["apps"], "commit": "feat(entries): list the Naturwunder-Quiz", "intent": "The first full run of the quiz archetype: a fresh assistant builds a natural-wonders quiz only from the build page, the llms.txt files and the skills, without reading any repo, and takes it through publishing to a listing pull request. Every point where it stalls or guesses becomes a fix.", "decisions": ["a geography quiz with groups by kind and by continent; biology only as a possible second category later", "for secondary school learners, with a German Wikipedia link on every option, the wrong ones included", "the entry is checked against the published app with `lernapps check --entry` before the pull request"], "trigger": "\"Point an agen // the repos in the order of their first intent; colors repeat after six
const REPOS = [...new Set(DATA.slice().sort((a, b) => new Date(a.from) - new Date(b.from)).flatMap(d => d.repos))];
const color = r => `var(--r${Math.max(0, REPOS.indexOf(r)) % 6})`;
const KIND = { feature: "Feature", fix: "Fix", rework: "Umbau", eval: "Eval", docs: "Doku", chore: "Pflege" };
const fmt = new Intl.DateTimeFormat("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
const hm = new Intl.DateTimeFormat("de-DE", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Berlin" });
const day = new Intl.DateTimeFormat("de-DE", { day: "2-digit", month: "2-digit", timeZone: "Europe/Berlin" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const movedOf = d => d.groups.flatMap(g => g.sources.flatMap(s => s.moved.map(m => ({ ...m, sha: s.sha }))));
const flagged = d => d.confidence === "inferred" || movedOf(d).length > 0;
const MOVE = { moved: "verschoben aus", split: "abgetrennt von", dropped: "übernommen aus", "plan-rule": "Plan-Regel: gehört zu" };
const state = { repos: new Set(REPOS), q: "", onlyFlag: false, sel: null };

function span(d) {
  const a = new Date(d.from), b = new Date(d.to), min = Math.round((b - a) / 60000);
  const sameDay = day.format(a) === day.format(b);
  const len = min < 60 ? `${min} min` : min < 1440 ? `${Math.round(min / 6) / 10} h` : `${Math.round(min / 144) / 10} Tage`;
  return `${fmt.format(a)} – ${sameDay ? hm.format(b) : fmt.format(b)} · ${len}`;
}

function stats() {
  const src = DATA.reduce((n, d) => n + d.sourceCount, 0), now = DATA.reduce((n, d) => n + d.groups.length, 0);
  const repos = new Set(DATA.flatMap(d => d.repos)), multi = DATA.filter(d => d.repos.length > 1).length;
  const t = DATA.map(d => +new Date(d.from)).concat(DATA.map(d => +new Date(d.to)));
  const items = [[DATA.length, "Intents"], [`${src} → ${now}`, "alte → neue Commits"], [repos.size, "Repos"], [multi, "über mehrere Repos"],
    [DATA.filter(flagged).length, "zu prüfen"], [t.length ? `${day.format(Math.min(...t))}–${day.format(Math.max(...t))}` : "–", "Zeitraum"]];
  document.getElementById("stats").innerHTML = items.map(([b, s]) => `<div><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");
}

function timeline() {
  const svg = document.getElementById("timeline");
  const t0 = Math.min(...DATA.map(d => +new Date(d.from))), t1 = Math.max(...DATA.map(d => +new Date(d.to)));
  const left = 140, width = Math.max(720, svg.parentElement.clientWidth), right = 16, lane = 26, top = 22;
  const h = top + REPOS.length * lane + 8;
  svg.setAttribute("viewBox", `0 0 ${width} ${h}`); svg.setAttribute("width", width); svg.setAttribute("height", h);
  const x = t => left + (width - left - right) * ((t - t0) / Math.max(1, t1 - t0));
  const y = r => top + REPOS.indexOf(r) * lane + lane / 2;
  let out = REPOS.map(r => `<line class="lane" x1="${left}" x2="${width - right}" y1="${y(r)}" y2="${y(r)}"/><text x="0" y="${y(r) + 4}">${esc(r)}</text>`).join("");
  const days = []; for (let t = new Date(t0); t <= t1; t = new Date(+t + 864e5)) days.push(t);
  out += days.map(t => `<text x="${x(+t)}" y="12" text-anchor="middle">${esc(day.format(t))}</text>`).join("");
  out += DATA.map(d => {
    const xe = x(+new Date(d.to)), ys = d.repos.map(y), c = flagged(d) ? "var(--warn)" : "var(--accent)";
    const bar = d.repos.map(r => `<line x1="${x(+new Date(d.from))}" x2="${xe}" y1="${y(r)}" y2="${y(r)}" stroke="${color(r)}" stroke-opacity=".35" stroke-width="6"/>`).join("");
    const conn = ys.length > 1 ? `<line x1="${xe}" x2="${xe}" y1="${Math.min(...ys)}" y2="${Math.max(...ys)}" stroke="${c}" stroke-width="1.5"/>` : "";
    const dots = d.repos.map(r => `<circle cx="${xe}" cy="${y(r)}" r="4" fill="${color(r)}"/>`).join("");
    return `<g class="mark${state.sel === d.id ? " sel" : ""}" data-id="${d.id}" tabindex="0"><title>${esc(d.commit)}</title>${bar}${conn}${dots}</g>`;
  }).join("");
  svg.innerHTML = out;
  svg.querySelectorAll(".mark").forEach(g => {
    const go = () => select(g.dataset.id, true);
    g.addEventListener("click", go); g.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  });
}

function chips() {
  const el = document.getElementById("repoChips");
  el.innerHTML = REPOS.map(r => `<button class="chip" id="chip-${r.replace(/\W/g, "")}" aria-pressed="${state.repos.has(r)}" data-r="${r}"><i style="background:${color(r)}"></i>${esc(r)}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    const r = b.dataset.r; state.repos.has(r) ? state.repos.delete(r) : state.repos.add(r); chips(); cards();
  }));
}

function card(d) {
  const groups = d.groups.map(g => `
    <div class="group" style="--c:${color(g.repo)}">
      <div class="new"><span class="repo" style="--c:${color(g.repo)}">${esc(g.repo)}</span> ${esc((g.message || "").split("\n")[0])}</div>
      <ul class="src">${g.sources.map(s => `<li><span class="sha">${esc(s.sha)}</span> ${esc(s.subject)}${s.plan ? '<span class="plan">Plan</span>' : ""}${s.pr ? ` · #${s.pr}` : ""}${s.moved.map(m => ` <span class="move" title="${esc(m.why)}">${esc(MOVE[m.kind] || m.kind)} ${esc(m.from)}</span>`).join("")}</li>`).join("")}</ul>
    </div>`).join("");
  const mv = movedOf(d);
  const misplaced = mv.length ? `<div class="warnbox"><b>Zuordnung prüfen:</b> ${mv.length} Fall/Fälle, anders als der Zeitschnitt<ul class="moves">${mv.map(m => `<li><span class="sha">${esc(m.sha)}</span> ${esc(MOVE[m.kind] || m.kind)} ${esc(m.from)}: ${esc(m.why)}</li>`).join("")}</ul></div>` : "";
  const rel = (d.relations || []).map(r => `${r.type === "revises" ? "überarbeitet" : "setzt fort"} ${esc(r.intent)}${r.note ? ": " + esc(r.note) : ""}`).join("; ");
  const messages = d.groups.map(g => `<pre>${esc(g.repo)}\n\n${esc(g.message)}${g.reason ? `\n\n— Zusammenlegung: ${esc(g.reason)}` : ""}</pre>`).join("");
  return `<article class="card${state.sel === d.id ? " sel" : ""}" id="${d.id}">
    <div class="meta"><span class="id">${esc(d.id)}</span><span>${esc(span(d))}</span>
      ${d.repos.map(r => `<span class="repo" style="--c:${color(r)}">${esc(r)}</span>`).join("")}
      ${d.kind ? `<span class="pill">${esc(KIND[d.kind] || d.kind)}</span>` : ""}
      ${d.confidence === "inferred" ? '<span class="pill warn">erschlossen</span>' : ""}
      ${movedOf(d).length ? '<span class="pill warn">Zuordnung prüfen</span>' : ""}</div>
    <p class="commit">${esc(d.commit)}</p>
    <p class="intent">${esc(d.intent)}</p>
    ${d.decisions.length ? `<div><div class="label">Key Decisions</div><ul class="decisions">${d.decisions.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${misplaced}
    <div><div class="label">Quell-Commits → neue Commits (${d.sourceCount} → ${d.groups.length})</div><div class="groups">${groups}</div></div>
    <details><summary>Auslöser, Bezüge und vorgeschlagene Nachrichten</summary>
      ${d.trigger ? `<div class="label">Auslöser</div><blockquote>${esc(d.trigger)}</blockquote>` : ""}
      ${rel ? `<div class="label">Bezüge</div><p class="note">${rel}</p>` : ""}
      <div class="label">Neue Commit-Nachrichten</div>${messages}
      <p class="note">Session ${esc(d.session)} · ${d.messages} Nachricht(en) von dir</p>
    </details>
  </article>`;
}

function visible() {
  const q = state.q.toLowerCase();
  return DATA.filter(d => d.repos.some(r => state.repos.has(r)))
    .filter(d => !state.onlyFlag || flagged(d))
    .filter(d => !q || JSON.stringify([d.commit, d.intent, d.decisions, d.groups.map(g => [g.message, g.sources])]).toLowerCase().includes(q));
}

function cards() {
  const list = visible();
  document.getElementById("cards").innerHTML = list.length ? list.map(card).join("") : '<p class="empty">Kein Intent passt zu diesem Filter.</p>';
}

function select(id, scroll) {
  state.sel = id; timeline(); cards();
  const el = document.getElementById(id);
  if (el && scroll) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

DATA.sort((a, b) => new Date(a.from) - new Date(b.from));
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; cards(); });
document.getElementById("onlyFlag").addEventListener("change", e => { state.onlyFlag = e.target.checked; cards(); });
addEventListener("resize", () => timeline());
stats(); chips(); timeline(); cards();
if (location.hash && DATA.some(d => "#" + d.id === location.hash)) select(location.hash.slice(1), true);
</script>
