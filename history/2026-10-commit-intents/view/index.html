e with the shared preset instead of Dependabot", "intent": "Dependency updates should arrive without manual merging, but only after a waiting time against supply-chain attacks. Major updates still need a person.", "decisions": ["Renovate with the owner's preset, over Dependabot with a cooldown", "a minimum release age of 3 days with internalChecksFilter strict, so a branch appears only after the wait", "automerge for non-major updates, majors as a pull request to merge by hand"], "trigger": "\"Merge dependabot nach drei Tagen deps (supply chain attack retention)\" … \"Moooment, hatten wir nicht auf renovate umgestellt?\" … \"Ja. Passen den preset an, dass ein automerge mit drei Tage grace period läuft. Manuell zu mergender PR nur bei major version update\"", "kind": "chore", "confidence": "evidenced", "relations": [], "groups": [{"repo": "docs", "message": "chore: Renovate with the shared preset instead of Dependabot\n\n## Intent\n\nDependency updates should arrive without manual merging, but only after a waiting time against supply-chain attacks. Major updates still need a person.\n\n## Key changes\n\n- renovate.json extends github>mrsimpson/renovate-config.\n- dependabot.yml is gone, and the workflow comments name Renovate.\n\n## Dependencies and side effects\n\n- The same change in apps (5ab90ae), lernapps.github.io (60c9dfc), tooling (6cb0e0d), app-templates (5b17e90).\n- The waiting time and the automerge live in the owner's preset github>mrsimpson/renovate-config.", "reason": "One commit per repo.", "sources": [{"sha": "c6389ee", "subject": "chore: Renovate with the shared preset instead of Dependabot", "date": "2026-10-08T06:37:01+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "chore: Renovate with the shared preset instead of Dependabot\n\n## Intent\n\nDependency updates should arrive without manual merging, but only after a waiting time against supply-chain attacks. Major updates still need a person.\n\n## Key changes\n\n- re oups": [{"repo": "app-templates", "message": "feat(quiz): confetti from 80% right, fireworks for all right\n\n## Intent\n\nFinishing a quiz well should feel like a success. Learners who answer at least 80% right see confetti; those who get everything right see fireworks, as in the Textcheck app.\n\n## Key changes\n\n- The quiz engine starts confetti on the result when at least 80% of the answers are right, and fireworks when all are right.\n- The quiz stylesheet draws both animations; they stay hidden when the system asks for reduced motion.", "reason": "The only commit of this request.", "sources": [{"sha": "c0c742e", "subject": "feat(quiz): confetti from 80% right, fireworks for all right", "date": "2026-10-20T13:58:08+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i233", "session": "session_01HcuHSMzx1gCxKHfsyeGSsz", "from": "2026-10-14T22:27:42.120575Z", "to": "2026-10-14T23:09:04+00:00", "repos": ["apps"], "commit": "feat(entries): list the electricity explainer", "intent": "Test, in a second full creator run with the same prompt and model after the creator checkpoints, whether the tooling carries a physics explainer for the younger grades from /apps/build/ to the catalog; list the resulting app in the catalog.", "decisions": ["an explainer for Klasse 5 and 6 that can grow to higher grades, in German and English", "eight topics in three chapters, including a graphical circuit editor as a component", "the live address on lernapps.net, not the redirecting github.io address"], "trigger": "In the parent session: \"I created lernapps/elektrizitaet. Launch an new session with a sonnet 5.5 agent. Provide a prompt the create an electricity focused curriculum. Start with the younger grades.\" … \"Merged. Starte eine neue Session, selber prompt und Modell\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i091", "note": "the second run after the creator checkpoints of tooling#67"}], "groups": [{"repo": "apps", "message": "feat(entries): list the electricity explainer\n\n## Intent\n\nList the electricity explainer in the catalog, as the last step of a second full creator run that tests the explainer archetype on a physics topic for the younger grades, from /apps/build/ to the catalog. The app is live.\n\n## Key changes\n\n- A catalog entry for Elektrizität: Physik for Klasse 5 and 6, at https://lernapps.net/elektrizitaet/, in German and English.\n- Eight topics link the pages: simple circuit, conductors and insulators, switches and circuit symbols, series and parallel circuits, the circuit editor, effects of electric current, safe handling.\n- Fitness: no account, no install, no storage, no third parties.", "reason": "The only commit of the electricity listing pull request.", "sources": [{"sha": "843638c", "subject": "Eintrag: Elektrizität", "date": "2026-10-14T23:09:04+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 7, "sourceCount": 1, "misplaced": []}, {"id": "i234", "session": "session_01J3foVhoLHS2DURBzQ6fpmM", "from": "2026-10-20T04:33:11.494523Z", "to": "2026-10-20T06:12:51+00:00", "repos": ["lernapps.github.io"], "commit": "feat(home): a solution-first story; new pages for features and about", "intent": "The home page speaks to neither parents nor teachers. It opens with a problem that is the platform's, not theirs, and reaches the solution only in its third section. It should start with the promise and tell one short story, with the passion of parents and teachers who build apps as its thread. Features and the founder's view belong on pages of their own, so the home page stays short.", "decisions": ["\"Lern-Apps ohne Haken.\" as the promise, over \"Digitale Bildung. Ohne Hürden.\", which says neither what nor which hurdles", "apps are neither a school book nor wild growth: a solid foundation (the archetypes) for makers' own ideas", "the platform brings the frame, method and tools; makers bring the content with passion; AI is not the only focus", "\"Ein solides Fundament für Macher\" over \"Leidenschaft trifft auf festen Rahmen\", which sounds like a conflict", "answer \"Why another platform?\" with \"diese gehört keiner Firma\", over \"gehört niemandem allein\", which is not yet true", "the teacher card speaks of a covering lesson, over \"the lesson starts soon\", which implies teachers do not plan", "the parents' card teases the AI tutor of the explainer apps, the only archetype that has one", "no \"Gebaut von\" on the app cards and the founder named once, so it does not read as a one-man show; the early stage said in small print", "\"Kein Abo, keine Werbung. Auch später nicht.\" with a link to why it works, over \"Wenn die Plattform trägt …\", which read as a business model to come", "the founder's long text on the ecosystem problem moves to /about/; the home page keeps two short paragraphs", "technical transparency is a feature for developers, a part of the features page, over a page of its own", "test each draft with simulated personas (teacher, parent, developer)"], "trigger": "\"Ich bekanntes Feedback, dass die Startseite weder Eltern noch Lehrer anspricht. Sie adressiert … zwar ein Problem, … Ist aber nicht lösungsorientiert. Das möchte ich gerne ändern und damit auch die story beziehungsweise die Elemente und den Aufbau der Landing Page\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i244", "note": "the role prompts and the problem quotes leave the home page"}], "groups": [{"repo": "lernapps.github.io", "message": "feat(home): a solution-first story; new pages for features and about\n\n## Intent\n\nThe home page spoke to neither parents nor teachers. It opened with a problem that is the platform's, not theirs, and reached the solution only in its third section. It should start with the promise and tell one short story, with the passion of parents and teachers who build apps as its thread. Features and the founder's view belong on pages of their own.\n\n## Key changes\n\n- Home page: \"Lern-Apps ohne Haken.\" with four badges; four apps from the catalogue; what teachers (a covering lesson) and parents (practise tonight, with the AI tutor of the explainer apps) get; \"Ein solides Fundament für Macher\"; \"Noch eine Plattform?\" answered with \"diese gehört keiner Firma\"; how to join; a short word from the founder.\n- The persona tabs, the problem quotes and the box \"Frag deinen KI-Assistenten\" leave the home page, and with them its script and stylesheet.\n- /features/: the principles, what the apps can do (the three foundations, curriculum, feedback, deep links, AI tutor, accessibility), and technical transparency for developers: why it works without money, how an app gets into the catalogue, stack, ownership and licence.\n- /about/: the founder's long text (digital education has an ecosystem problem, not a device problem) and the answer for sceptics, moved from the home page.\n- All three pages in English too; README and llms.txt name the new pages.\n\n## Dependencies and side effects\n\n- The home page has no script any more.\n- The app cards no longer say who built them, so the home page names the founder once.", "reason": "The first commit of the branch, the result of this conversation; the licence line after it answers the next message.", "sources": [{"sha": "ec471f2", "subject": "feat: home page tells a solution-first story; new features and about pages", "date": "2026-10-20T06:12:51+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 19, "sourceCount": 1, "misplaced": []}, {"id": "i235", "session": "session_01J3foVhoLHS2DURBzQ6fpmM", "from": "2026-10-20T06:20:46.477779Z", "to": "2026-10-20T06:21:06+00:00", "repos": ["lernapps.github.io"], "commit": "feat(features): recommend MIT or Apache 2.0 for code, CC BY 4.0 for content", "intent": "The features page only said that a maker's app stays under the maker's licence. Makers should know which licences the platform recommends, so others can build on their apps and their names stay attached.", "decisions": ["recommend MIT or Apache 2.0 for code and CC BY 4.0 for content, over prescribing a licence", "keep the Mathe-Karte as the first example app; it was only referenced everywhere before", "the English text waits for a native speaker"], "trigger": "\"1. als EIN beispiel bzw. das prominentestes ist sie schon ok. … 3. wir empfehlen MIT oder Apache 2 für Code, CC-BY für Inhalte …\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i234", "note": "answers the open questions on the new pages"}], "groups": [{"repo": "lernapps.github.io", "message": "feat(features): recommend MIT or Apache 2.0 for code, CC BY 4.0 for content\n\n## Intent\n\nThe features page only said that a maker's app stays under the maker's licence. Makers should know which licences the platform recommends, so others can build on their apps and their names stay attached.\n\n## Key changes\n\n- Under \"Eigentum und Lizenz\", in German and English: open licences are recommended, MIT or Apache 2.0 for the code and CC BY 4.0 for the content, so others can develop the app further and the maker's name stays with it.", "reason": "The only commit of this request.", "sources": [{"sha": "ed73725", "subject": "feat(features): recommend MIT or Apache 2.0 for code, CC BY 4.0 for content", "date": "2026-10-20T06:21:06+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i236", "session": "session_01J3foVhoLHS2DURBzQ6fpmM", "from": "2026-10-20T06:32:18.737362Z", "to": "2026-10-20T06:41:29+00:00", "repos": ["apps", "lernapps.github.io"], "commit": "feat(nav): a header for people: find an app, build one, tooling, features, take part", "intent": "The shared header followed the platform's structure, not the people who come to lernapps.net. It should lead to finding an app, building one, the tooling, what makes lernapps different, and how to take part. Listing an app is a step of building one, not a goal of its own. The listing check now exists, so app pages should no longer say it is being built.", "decisions": ["\"App eintragen\" leaves the header and becomes a section of \"App bauen\" in the apps repo; /apps/enter/ stays", "\"So ist es gedacht\" becomes \"Features\" with three parts: for users, for developers, and what makes the platform unique (GitHub as a free backbone)", "\"Mitmachen\" leads to a page with one block per persona and the prompts for their AI assistants, over CONTRIBUTING.md", "keep \"Tooling\" in the header", "attach the apps repo and change it in the same step"], "trigger": "\"ja, binde das an. Zur Navigation: App finden, App bauen (App eintragen weg, das als Abschnitt in App bauen …), So ist es gedacht => in 'Features' umgebennen. … Mitmachen => Mehrere Personas, inkl. der Prompts für deren Agenten, die wir heute schon haben\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i234", "note": "builds on the new home page and features page"}, {"type": "continues", "intent": "i244", "note": "the role prompts move to the new page \"Mitmachen\""}], "groups": [{"repo": "lernapps.github.io", "message": "feat(nav): a header for people: find an app, build one, tooling, features, take part\n\n## Intent\n\nThe shared header followed the platform's structure, not the people who come to lernapps.net. It should lead to finding an app, building one, the tooling, what makes lernapps different, and how to take part.\n\n## Key changes\n\n- The header reads: Apps finden, App bauen, Tooling, Features, Mitmachen.\n- \"App eintragen\" leaves the header: listing is a section of \"App bauen\" (/apps/build/#eintragen). /apps/enter/ stays and is linked from there.\n- \"So ist es gedacht\" (/docs/) becomes \"Features\" (/features/). The docs move to the footer and are linked from the features page.\n- /features/ has three parts: for users (what the apps can do), for developers (foundations or your own stack, made for your AI assistant, how an app gets into the catalogue, ownership and licence), and the platform (GitHub as a free backbone, no server and no data, readable for AI assistants, planned in the open, the principles). The home page links the new anchors.\n- \"Mitmachen\" leads to /join/: teachers, parents, learners, makers and contributors, each with what they can do, where to go and a prompt for their AI assistant to copy. The prompts come from the old home page, plus a new one for contributors, which links CONTRIBUTING.md.\n- README and llms.txt name the pages.\n\n## Dependencies and side effects\n\n- Other sites get the new header when their pin of @lernapps/site moves (Renovate).\n- The anchor #eintragen comes with the change in the apps repo (e58bbf3).", "reason": "Follow each other directly on one branch: the new header and the pages it links to (/features/ in three parts, /join/).", "sources": [{"sha": "c84266e", "subject": "feat(nav): Apps finden, App bauen, Tooling, Features, Mitmachen", "date": "2026-10-20T06:37:08+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "ea2ed8f", "subject": "feat: features page in three parts, new page \"Mitmachen\" with a prompt per persona", "date": "2026-10-20T06:37:08+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "feat(build): listing is a section of \"App bauen\"; app pages name the listing check\n\n## Intent\n\nThe shared header drops \"App eintragen\": listing becomes a step of building an app. And the listing check exists now, so the app pages should no longer say it is being built.\n\n## Key changes\n\n- /apps/build/ has a line under its lead, \"Du hast schon eine App? Direkt zum Eintragen\", that jumps to its last section, now \"Wie es weitergeht: die App eintragen\" with the anchor #eintragen. /apps/enter/ stays and is linked from there.\n- An app page whose entry is not marked as checked says that an automatic check compares it with the app at listing, instead of \"Eine automatische Prüfung bauen wir gerade\".\n\n## Dependencies and side effects\n\n- The new header comes with the next update of @lernapps/site (lernapps.github.io c84266e, ea2ed8f); /join/ links /apps/build/#eintragen.", "reason": "The apps side of the new header; the first commit of its branch.", "sources": [{"sha": "e58bbf3", "subject": "feat: listing is a section of \"App bauen\"; the fitness note names the check", "date": "2026-10-20T06:41:29+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 3, "misplaced": []}, {"id": "i237", "session": "session_01J3foVhoLHS2DURBzQ6fpmM", "from": "2026-10-20T06:43:00.718442Z", "to": "2026-10-20T07:01:54+00:00", "repos": ["apps", "lernapps.github.io"], "commit": "feat(home): honest about quality, a way out for non-makers, no single authority", "intent": "Simulated teachers, parents and developers read the new pages a second time. They asked who vouches for the content, stumbled over the AI tutor and over the half of the home page meant for makers, and asked who decides on listing. The pages should be honest that a person, not the platform, stands behind each app; let readers report mistakes in the content; and tie listing to rules, not to one person's judgement.", "decisions": ["say honestly that each app comes from a person and the platform's help is no guarantee of quality; reviews of apps are left for later", "add \"Fehler im Inhalt\" as a feedback option on every app page", "the AI tutor moves to the features of the explainer archetype, optional, over a promise on the home page", "keep the makers' half of the home page; a link to the catalogue at the break lets others leave", "plain words on the home page, moderate jargon only on the features page", "listing is checked against the rules as exclusion criteria; the operator no longer appears as the one who decides", "thanks is explained as the prepared email it is today; a click-only API comes later", "dead links of listed apps become an issue in the apps repo (#57), not a change now"], "trigger": "\"1. Sei ehrlich: jede App kommt von einem Menschen. Dieser wurde unterstützt bei der Erstellung, aber Garant für Qualität ist das nicht. Wir sollten auf jeden fall ein 'Fehler im Inhalt' aufnehmen. … 2. nimm den KI-Tutor raus, pack ihn zu den features des archetyps explainer …\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i234", "note": "the second persona round changes the new home page and features page"}], "groups": [{"repo": "lernapps.github.io", "message": "feat(home): honest about quality, a way out for non-makers, no single authority\n\n## Intent\n\nParents and teachers asked who vouches for the content and stumbled over the AI tutor and over the half of the home page meant for makers. Developers asked who decides on listing. The pages should be honest that a person stands behind each app, let readers report mistakes, and tie listing to rules instead of one person.\n\n## Key changes\n\n- Every app comes from a person; the platform helps to build it, but that is no guarantee. Mistakes in the content are reported on the app's page. This is said under the example apps and on /features/ as \"Von Menschen gemacht\".\n- The AI tutor leaves the parents' card and the users' list; it is a feature of the explainer archetype, optional, and the app works without AI.\n- After \"Was du davon hast\", a line tells everyone who does not build apps that they need not read on, with a link to the catalogue.\n- The cost point says in plain words why it stays free; the technical detail stays on /features/.\n- /features/: anyone can submit an app; it is checked against the rules for every app, which are exclusion criteria. The operator no longer appears as the one who decides. The thank-you is a prepared email that lernapps.net passes on.\n\n## Dependencies and side effects\n\n- The option \"Fehler im Inhalt\" on the app pages is in the apps repo (b24d521).", "reason": "The only website commit of this request; the privacy paragraph after it answers the next message.", "sources": [{"sha": "aaed045", "subject": "feat: honest about quality, a way out for non-makers, no single authority", "date": "2026-10-20T06:59:08+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "feat(app-page): \"Fehler im Inhalt\" as a feedback option on every app page\n\n## Intent\n\nEvery app comes from a person; lernapps.net helps to build it but does not vouch for its content. Teachers, parents and learners who spot a mistake in the content need a way to report it.\n\n## Key changes\n\n- Every app page offers \"Fehler im Inhalt\" as a fifth feedback option. Like the others, it opens a prepared email.\n\n## Dependencies and side effects\n\n- The website says that mistakes are reported on the app's page (lernapps.github.io aaed045).", "reason": "The apps side of this request: the feedback option the website now points to.", "sources": [{"sha": "b24d521", "subject": "feat: \"Fehler im Inhalt\" as a feedback option on every app page", "date": "2026-10-20T07:01:54+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i238", "why": "Implements point 1 of this request (\"Fehler im Inhalt\"); it was committed only after the next message, which asked for the privacy paragraph."}]}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i238", "session": "session_01J3foVhoLHS2DURBzQ6fpmM", "from": "2026-10-20T06:59:37.327746Z", "to": "2026-10-20T07:02:48+00:00", "repos": ["lernapps.github.io"], "commit": "feat(home): privacy as a feature; clearer words for teachers and parents", "intent": "Simulated teachers wanted something to pass on to their head or data protection officer and did not find the privacy notice, since the new home page linked it only in the footer. Privacy is not a duty here but a feature, and the home page should say so and link the notice. The words for teachers and parents should state plainly that no data about their pupils or child is collected.", "decisions": ["a short paragraph that links the existing privacy notice, over a separate page for schools", "present privacy as a feature, not as an obligation", "keep the makers and their passion as prominent as they are", "\"keinerlei Daten … gesammelt\" and \"Niemand weiß, wer die App gerade nutzt\", lightly smoothed and with lower-case du"], "trigger": "\"Für Schulen: … Wir haben doch https://lernapps.net/privacy/ . Hat sie das nicht gefunden? Vielleicht ein kleiner Absatz, der darauf verweist. Datenschutz ist keine Pflicht, sondern ein Feature …\" and \"Formulierungen: …und es entstehen keine Daten deiner Schülerinnen und Schüler. => …und es werden keinerlei Daten Deiner Schülerinnen und Schüler gesammelt …\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i237", "note": "answers the rest of the second persona round"}], "groups": [{"repo": "lernapps.github.io", "message": "feat(home): privacy as a feature; clearer words for teachers and parents\n\n## Intent\n\nTeachers want something to pass on to their head or data protection officer, but the new home page linked the privacy notice only in the footer. Privacy is a feature here, and the home page should say so. The words for teachers and parents should state plainly that no data about their pupils or child is collected.\n\n## Key changes\n\n- Under \"Was du davon hast\", a box \"Datenschutz ist bei uns ein Feature\" links the privacy notice to pass on to the school. On /features/ the platform point is \"Datenschutz als Feature\" and links it too.\n- Teachers: \"es werden keinerlei Daten deiner Schülerinnen und Schüler gesammelt\".\n- Parents: \"Niemand weiß, wer die App gerade nutzt. Die Privatsphäre deines Kindes bleibt geschützt.\"", "reason": "The only commit of this request; it holds both the privacy paragraph and the new wording.", "sources": [{"sha": "e72138e", "subject": "feat: privacy as a feature on the home page; clearer words for teachers and parents", "date": "2026-10-20T07:02:48+00:00", "pr": null, "plan": false, "moved": [{"kind": "dropped", "from": "i239", "why": "The commit serves the privacy paragraph asked for here and the wording asked for a minute later in i239; i239 has no other commit."}]}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i240", "session": "session_01J3foVhoLHS2DURBzQ6fpmM", "from": "2026-10-20T07:10:26.586181Z", "to": "2026-10-20T07:15:19+00:00", "repos": ["apps", "lernapps.github.io"], "commit": "feat(home, app-page): truer promises, a checked app, and feedback straight to the maker", "intent": "The third persona round found a badge that promised more than the privacy notice says, parents looking for their child's grade, teachers asking what happens to apps if lernapps.net ends, and developers asking whether keeping the rules is enough and how long listing takes. The pages should promise only what is true. The app page should say that the app was checked, be clear about who is responsible for privacy on an app hosted by its maker, and let feedback reach the maker directly.", "decisions": ["the catalogue page says the app was checked, but an app on its maker's site is an external site whose privacy lernapps.net cannot take responsibility for; people with concerns can ask the maker to host it on lernapps.net", "an app that keeps the rules is listed, over a decision by the operator", "promise that listing a finished app takes a few hours", "feedback can go straight to the maker as an issue on GitHub, offered on every app page", "\"Eingaben bleiben auf dem Gerät\" over \"Nichts verlässt das Gerät\", since GitHub Pages sees the IP address"], "trigger": "\"Zu meinen Entscheidungen: 1. Die Katalogseite sollte sagen: Die App wurde geprüft. Aber es ist technisch eine externe Seite. Da können wir keine Verantwortung für den Datenschutz übernehmen. … 2. Ja 3. wenige Stunden 4. Issue erstellen können wir ruhig schon direkt in das Feeback auf jeder Seite aufnehmen (apps feature)\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i238", "note": "acts on the third persona round"}], "groups": [{"repo": "apps", "message": "feat(app-page): say the app was checked, mark external sites, and offer an issue to the maker\n\n## Intent\n\nTeachers asked who stands behind the privacy of an app that lives at its maker's own address. Developers asked for feedback that reaches them directly. The app page should say that the app was checked, be clear about who is responsible on an external site, and let feedback go straight to the maker.\n\n## Key changes\n\n- The fitness note says: \"Die App wurde geprüft: Bei der Aufnahme hat eine automatische Prüfung diese Angaben mit der App verglichen.\"\n- An app outside lernapps.net gets a second note: it is on an external site (the host is named), lernapps.net cannot take responsibility for privacy there, and whoever has concerns can ask the maker to host the app on lernapps.net, with a link to the maker.\n- For an app whose source is on GitHub, the feedback offers \"Du hast ein GitHub-Konto? Dann schreib es direkt an <maker>: Issue anlegen\". It opens a new issue in the app's repository with the title and the app's address filled in.\n\n## Dependencies and side effects\n\n- The website explains both ways of feedback and the scope of the privacy notice (lernapps.github.io 3333e36).", "reason": "The apps side of this request.", "sources": [{"sha": "45e8c7b", "subject": "feat: the app page says the app was checked, marks external sites, and offers an issue to the creator", "date": "2026-10-20T07:14:04+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "lernapps.github.io", "message": "feat(home): truer badges, the grade in one click, a listing promise and the scope of the privacy notice\n\n## Intent\n\nA badge promised more than the privacy notice says. Parents looked for their child's grade, teachers asked what happens to apps if lernapps.net ends, and developers asked whether keeping the rules is enough and how long listing takes. The pages should promise only what is true and answer these questions.\n\n## Key changes\n\n- Hero badges: \"Eingaben bleiben auf dem Gerät\" instead of \"Nichts verlässt das Gerät\", since GitHub Pages sees the IP address, as the privacy notice says; and \"Auch auf dem Handy\".\n- Under the examples: links by grade (3 to 13) and by subject into the catalogue's filter, and \"Die Apps liegen bei ihren Machern, nicht bei uns. Gäbe es lernapps.net nicht mehr, liefen sie weiter.\"\n- /features/: \"Erfüllt die App die Regeln, wird sie aufgenommen\", and listing a finished app takes a few hours in all; /join/ says so too. A new block \"Rückmeldungen kommen bei dir an\": email through lernapps.net today, and an issue in the maker's repository straight from the app page.\n- Privacy notice, scope: apps that their makers publish at their own address are external sites. They are checked when listed, but their makers are responsible for privacy there; the catalogue page says where an app lives.\n\n## Dependencies and side effects\n\n- The issue link on the app page is in the apps repo (45e8c7b).\n- The privacy notice is a legal text and needs a human read.", "reason": "The website side of this request.", "sources": [{"sha": "3333e36", "subject": "feat: truer badges, links into the filtered catalog, a listing promise, and the scope of the privacy notice", "date": "2026-10-20T07:15:19+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 2, "misplaced": []}, {"id": "i241", "session": "session_01J3foVhoLHS2DURBzQ6fpmM", "from": "2026-10-20T07:19:18.644384Z", "to": "2026-10-20T07:32:50+00:00", "repos": ["apps"], "commit": "fix(app-page): drop the external-site note; name beimir.net as the founder's domain", "intent": "In the fourth persona round, the note that lernapps.net takes no responsibility for privacy on an external site read like a stop sign right under the green checks. The feedback addresses on beimir.net looked private, even like phishing. The app page should not raise doubts it cannot settle, and should say whose domain the addresses are on.", "decisions": ["remove the external-site note entirely; whoever has the question asks it, and the privacy notice still answers it", "hosting every listed app under lernapps.net becomes an issue (#58), not a change now", "keep the addresses on beimir.net for now and say that it is the founder's domain, over setting up mail for lernapps.net"], "trigger": "\"1. ganz raus. wer die frage hat, stellt sie eben 2. ein issue dafür aufmachen 3. erst mal nicht, Hinweis dass das die Domain des Gründers ist\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i240", "note": "takes back the external-site note added there"}], "groups": [{"repo": "apps", "message": "fix(app-page): drop the external-site note; name beimir.net as the founder's domain\n\n## Intent\n\nThe note that lernapps.net takes no responsibility for privacy on an external site read like a stop sign right under the checked fitness note. The thanks and feedback addresses on beimir.net looked private, even like phishing. The app page should not raise doubts it cannot settle, and should say whose domain the addresses are on.\n\n## Key changes\n\n- The external-site note is gone. The privacy notice of lernapps.net still says that apps at their makers' own addresses are external sites.\n- Under the thanks and feedback addresses, a note says that beimir.net is the founder's domain.", "reason": "The only commit of this request.", "sources": [{"sha": "02352ca", "subject": "fix: drop the external-site note; name beimir.net as the founder's domain", "date": "2026-10-20T07:32:50+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 1, "misplaced": []}, {"id": "i242", "session": "session_01J3foVhoLHS2DURBzQ6fpmM", "from": "2026-10-20T08:12:53.118181Z", "to": "2026-10-20T09:03:48+00:00", "repos": ["docs"], "commit": "docs(biz42): the home page product describes the new story and its pages", "intent": "Before the new home page is merged, no link or description may be left pointing at the old one. The organisation docs still describe the home page as the old story (problem, four portraits, principles, why free, sceptics). They should describe the new one, so people and AI assistants who read the docs get a true picture.", "decisions": ["no redirects for the old anchors; attach the tooling repo and search it instead, which found no links to them", "rewrite the one paragraph in chapter 10 as a small pull request of its own", "leave pinning the npx command to a version aside"], "trigger": "\"Bevor Du die Startseite mergest: Wir haben derzeit noch unter 'wie es funktioniert' und anderen Orten Links, die wir nun verlieren würden. Wo würden diese neu hin passen?\" … \"ja, mach das, dann merge requests\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i234", "note": "brings the docs in line with the new home page"}], "groups": [{"repo": "docs", "message": "docs(biz42): the home page product describes the new story and its pages\n\n## Intent\n\nThe home page now tells its story solution first and moves the details to Features, Mitmachen and Über uns. Chapter 10 still described the old page (problem, four portraits, principles, why free, sceptics), so people and AI assistants reading the docs got a wrong picture.\n\n## Key changes\n\n- The home page product says: the home page promises learning apps with no strings attached, shows apps from the catalogue, says what teachers and parents get, and then speaks to makers. Features, Mitmachen and Über uns hold the details.\n\n## Dependencies and side effects\n\n- Describes the home page of lernapps.github.io from ec471f2 on.", "reason": "The only commit of this request.", "sources": [{"sha": "2737384", "subject": "docs(biz42): the home page product describes the new story and its three pages", "date": "2026-10-20T09:03:48+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 4, "sourceCount": 1, "misplaced": []}, {"id": "i243", "session": "session_01J3foVhoLHS2DURBzQ6fpmM", "from": "2026-10-20T09:32:22.373574Z", "to": "2026-10-20T09:36:03+00:00", "repos": ["apps", "lernapps.github.io"], "commit": "feat(home, find): drop the quick filters; the catalogue invites people to build what is missing", "intent": "The quick filters by grade and subject under the example apps got in the way more than they helped; the catalogue has its own filter. Where the catalogue has nothing that fits, it should invite people to build the app themselves. The makers' section should end on why the foundation helps: ideas become quick and easy to build.", "decisions": ["remove the quick filters from the home page, over keeping a second way into the catalogue's filter", "the invitation to build sits under the catalogue's results and is always visible, so it also shows when nothing fits", "merge in the order website, apps, docs"], "trigger": "\"Der Block mit den Schnellfiltern unter den Apps auf der Homepage stört mehr als er bringt. Wir sollten aber im Apps-Katalog unten oder wenn wir nichts finden ein 'Nichts gefunden? Hilf Dir selbst und bau eine App. Mit unserem Tooling ist es ganz einfach' einfügen …\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i240", "note": "removes the links into the filtered catalogue added there"}], "groups": [{"repo": "lernapps.github.io", "message": "feat(home): drop the quick filters; the foundation makes ideas quick to build\n\n## Intent\n\nThe links by grade and subject under the example apps got in the way more than they helped; the catalogue has its own filter. The makers' section should end on why the foundation helps.\n\n## Key changes\n\n- The quick filters under the examples are gone.\n- \"Ein solides Fundament für Macher\" ends with \"So wird es einfach und schnell, eigene Ideen umzusetzen.\"\n\n## Dependencies and side effects\n\n- The catalogue now invites people who find nothing to build an app (apps 0a784a7).", "reason": "The website side of this request.", "sources": [{"sha": "459eff1", "subject": "feat: drop the quick filters on the home page; the foundation makes ideas quick to build", "date": "2026-10-20T09:32:46+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "feat(find): \"Nichts gefunden? Hilf dir selbst und bau eine App\"\n\n## Intent\n\nWhere the catalogue has nothing that fits, it should invite people to build the app themselves, since the tooling makes that easy. It takes the place of the quick filters that the home page dropped.\n\n## Key changes\n\n- Under the catalogue's results, always visible and so also when nothing fits: \"Nichts gefunden? Hilf dir selbst und bau eine App. Mit unserem Tooling ist es ganz einfach.\", with a button to /apps/build/.\n\n## Dependencies and side effects\n\n- The home page drops its quick filters in the same step (lernapps.github.io 459eff1).", "reason": "The apps side of this request.", "sources": [{"sha": "0a784a7", "subject": "feat(find): \"Nichts gefunden? Hilf dir selbst und bau eine App\"", "date": "2026-10-20T09:36:03+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 2, "misplaced": []}, {"id": "i244", "session": "session_01N5rW7AbW91nP3BK1KJnD7g", "from": "2026-10-18T22:46:26.595577Z", "to": "2026-10-18T23:03:21+00:00", "repos": ["lernapps.github.io"], "commit": "feat(home): a prompt per role that lets an AI assistant explain lernapps.net", "intent": "People who land on the home page should be able to ask their own AI assistant what lernapps.net offers someone in their role. A ready prompt per role in the solution section lets them do that in one copy. The answers must convey safety: apps listed in the catalogue meet the same requirements even when they are hosted by their makers, not on lernapps.net.", "decisions": ["try each prompt with a fresh subagent before building it in, over writing them blind", "prompts ask about the platform and what it offers the role, with a link to the catalogue, over details of subject, grade or single apps", "the prompt box is always open under each role in the solution section, over a collapsed box", "the copy button is added by JavaScript; without it the prompt stays readable", "the student prompt offers to build a small app together when the catalogue has nothing, over only pointing to the catalogue", "ask about apps \"that are not on lernapps.net itself but with their makers\", over \"on other servers\", which assistants read as content loaded after a click"], "trigger": "\"Ich möchte gerne für die einzelnen Rollen auf der Startseite im Lösungsabschnitt pro Route einen prompt einfügen, den interessierte an ihren Agenten werfen können, um sich lernapps. Net mit dem nutzen für ihre Rolle erklären zu lassen. Mach mal Vorschläge, probiere sie mit einem subagenten aus …\"", "kind": "feature", "confidence": "evidenced", "relations": [], "groups": [{"repo": "lernapps.github.io", "message": "feat(home): a prompt per role that lets an AI assistant explain lernapps.net\n\n## Intent\n\nPeople who land on the home page should be able to ask their own AI assistant what lernapps.net offers someone in their role. A ready prompt per role lets them do that in one copy. The answers must convey safety: listed apps meet the same requirements even when they are hosted by their makers, not on lernapps.net.\n\n## Key changes\n\n- Each role in the solution section (teacher, parent, maker, learner) has an open box \"Frag deinen KI-Assistenten\" with a prompt to copy, in German and English.\n- Each prompt points the assistant to llms.txt and the catalogue at /apps/, and asks how apps are checked and whether the same requirements apply to apps that are not on lernapps.net itself but with their makers.\n- The maker's prompt asks what they get back when someone uses their app; the learner's prompt offers to build a small app together when the catalogue has nothing on the topic.\n- A copy button is added by JavaScript; without it the prompt stays readable.\n\n## Dependencies and side effects\n\n- The prompts were tried with fresh assistants per role; the last wording change was not retested.", "reason": "Two commits that follow each other directly on one branch: the prompt boxes, and their wording on externally hosted apps after the retest.", "sources": [{"sha": "4ebe8c6", "subject": "feat: prompt per role to let an AI assistant explain lernapps.net", "date": "2026-10-18T23:02:33+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "e548c2c", "subject": "feat: ask whether externally hosted apps meet the same requirements", "date": "2026-10-18T23:03:21+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i245", "session": "session_01N5rW7AbW91nP3BK1KJnD7g", "from": "2026-10-18T23:05:21.486791Z", "to": "2026-10-18T23:07:02+00:00", "repos": ["docs", "lernapps.github.io"], "commit": "docs: stop promoting the Mathe-Karte; point to the app catalogue", "intent": "The Mathe-Karte is one app among others and should no longer be promoted on its own, nor split into sub-apps that assistants then report as several apps. The home page and the platform documents should point to the app catalogue instead.", "decisions": ["attach the docs repo and change it too, over leaving the Mathe-Karte in the platform documents", "point to the app catalogue where the Mathe-Karte was the example", "leave recorded user answers in the business evidence unchanged, over rewriting them", "leave the page /mathe-karte/ and its own repo untouched"], "trigger": "\"Binde alle beiden Reis ein und nimm die Mathe Karte aus docs  raus. Verweise ggf. Auf den App Katalog\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i244", "note": "the assistant tests named the Mathe-Karte as the highlighted app and split it into parts"}], "groups": [{"repo": "docs", "message": "docs: take the Mathe-Karte out of the platform documents\n\n## Intent\n\nThe Mathe-Karte is one app among others. The platform documents should not single it out; where they need an example of the first apps, they point to the app catalogue.\n\n## Key changes\n\n- The MVP design names \"the first apps in the app catalogue\", linked to lernapps.net/apps/, instead of the Mathe-Karte.\n- The scan, the owners chapter and the development plan say that Ralf D. Müller builds apps, without naming the Mathe-Karte.\n- The README no longer uses the Mathe-Karte as its example of a repo's own document.\n\n## Dependencies and side effects\n\n- The home page drops the Mathe-Karte in the same step (lernapps.github.io f3fc04f).\n- The recorded user answer in the business evidence still names the Mathe-Karte on purpose.", "reason": "The only commit of this request in docs.", "sources": [{"sha": "1c52c32", "subject": "docs: take the Mathe-Karte out of the platform documents", "date": "2026-10-18T23:06:40+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "lernapps.github.io", "message": "feat(home): no longer promote the Mathe-Karte; the catalogue is the way to apps\n\n## Intent\n\nThe Mathe-Karte is one app among others. The home page should not promote it on its own; the app catalogue is the way to apps.\n\n## Key changes\n\n- The \"Ausprobieren: Mathe-Karte\" lines for teachers and learners are gone; \"Apps finden\" still leads to the catalogue.\n- llms.txt no longer lists the Mathe-Karte; its apps section points only to the catalogue.\n- The README no longer mentions the Mathe-Karte.\n\n## Dependencies and side effects\n\n- The platform documents drop it in the same step (docs 1c52c32).", "reason": "The only commit of this request in the home page; the llms.txt sections after it serve another request.", "sources": [{"sha": "f3fc04f", "subject": "feat: no longer promote the Mathe-Karte on the home page", "date": "2026-10-18T23:07:02+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i246", "session": "session_01N5rW7AbW91nP3BK1KJnD7g", "from": "2026-10-18T23:07:06.591820Z", "to": "2026-10-18T23:07:26+00:00", "repos": ["lernapps.github.io"], "commit": "feat(llms): explain safety and thanks in llms.txt", "intent": "Assistants that answer the new role prompts found nothing on how thanks reach an app's makers, and read the safety of listed apps only indirectly. lernapps.net wants to convey safety. llms.txt should say plainly how listed apps are checked, that apps hosted by their makers meet the same requirements, and how a thank-you works.", "decisions": ["put safety and thanks into llms.txt, over adding more detail to the prompts", "say openly that lernapps.net is no certification body and no replacement for a school's approval", "thanks is a deliberate click whose sum alone is stored, over reading it as donations"], "trigger": "\"Ergänze Dank und Sicherheit in der llms.txt\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i244", "note": "the assistant tests of the role prompts found no answer on thanks and only an indirect one on safety"}], "groups": [{"repo": "lernapps.github.io", "message": "feat(llms): explain safety and thanks in llms.txt\n\n## Intent\n\nAssistants that answer the role prompts of the home page need a plain source on safety and on thanks. They should be able to say how listed apps are checked, that apps hosted by their makers meet the same requirements, and what a maker gets back when someone uses their app.\n\n## Key changes\n\n- A section \"Sicherheit\": every listed app meets the same requirements, also when it is not on lernapps.net but with its makers. It names the rules (in the browser, no sign-in, no own server, no cookies, no tracking, no ads, other servers only after a click), the automatic check of the running app, the review by an AI agent and the operator's decision. lernapps.net is no certification body and no replacement for a school's approval. Links to the rules and the privacy page.\n- A section \"Danke\": a thank-you is a deliberate click, only the sum is stored, and the makers learn of it. Assistants that recommend an app should mention that people can say thanks.", "reason": "The only commit of this request; it follows the Mathe-Karte commit directly but serves another request, so they stay apart.", "sources": [{"sha": "9fa66d8", "subject": "feat: llms.txt explains safety and thanks", "date": "2026-10-18T23:07:26+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i247", "session": "session_01N5rW7AbW91nP3BK1KJnD7g", "from": "2026-10-18T23:10:38.577567Z", "to": "2026-10-18T23:10:57+00:00", "repos": ["lernapps.github.io"], "commit": "feat(home): shorter role prompts; the details live in llms.txt", "intent": "The role prompts still spelled out how apps are checked and whether externally hosted apps meet the same requirements. That is too much detail for a prompt to copy. Now that llms.txt answers it, the prompts should only ask what the platform is, what it offers the role and how it keeps things safe.", "decisions": ["the prompt asks how the platform keeps things safe and leaves the answer to llms.txt, over naming the check and external hosting in the prompt"], "trigger": "\"Erkläre mir auch, wie lernapps.net Apps prüft und ob für Apps, die nicht auf lernapps.net selbst liegen, sondern bei ihren Entwicklern, dieselben Anforderungen gelten. Das ist zu detailliert in den prompts.\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i244", "note": "shortens the prompts built there"}, {"type": "continues", "intent": "i246", "note": "the details moved into the llms.txt sections written there"}], "groups": [{"repo": "lernapps.github.io", "message": "feat(home): shorter role prompts; the details live in llms.txt\n\n## Intent\n\nThe role prompts spelled out how apps are checked and whether externally hosted apps meet the same requirements. That is too much for a prompt to copy, and llms.txt now answers it. The prompts should only ask what the platform is, what it offers the role and how it keeps things safe.\n\n## Key changes\n\n- The teacher, parent and learner prompts ask what lernapps.net is, what it offers them and how it keeps things safe, in German and English.\n- The maker's prompt asks what the platform offers makers and what they get back when someone uses their app.\n\n## Dependencies and side effects\n\n- The answer on safety now depends on the section \"Sicherheit\" of llms.txt (9fa66d8), which is live only after the merge.", "reason": "The only commit of this request; the commits before it on the branch serve other requests.", "sources": [{"sha": "ade1bc9", "subject": "feat: shorter prompts, details live in llms.txt", "date": "2026-10-18T23:10:57+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i248", "session": "session_01N5rW7AbW91nP3BK1KJnD7g", "from": "2026-10-18T23:12:26.330479Z", "to": "2026-10-18T23:15:41+00:00", "repos": ["lernapps.github.io"], "commit": "fix(home): role prompts ask the assistant to look at the catalogue", "intent": "After the merge, the role prompts were tested live. Assistants read \"I find suitable apps myself in the catalogue\" as \"do not look\". They skipped the catalogue and named apps from older pages instead. The prompts should ask them to look at the catalogue, still without app details in the prompt.", "decisions": ["merge both pull requests first and test the live pages, since the answers depend on the live llms.txt", "\"have a look at the catalogue\" over \"I find apps myself\", which assistants took as a ban", "retest with a cache buster on the lernapps.net addresses, so assistants see the current pages"], "trigger": "\"Mehr alles. Teste danach und stehe ggf nach\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i247", "note": "fixes the wording of the shortened prompts"}], "groups": [{"repo": "lernapps.github.io", "message": "fix(home): role prompts ask the assistant to look at the catalogue\n\n## Intent\n\nIn the live test, assistants read \"I find suitable apps myself in the catalogue\" as \"do not look\". They skipped the catalogue and named apps from older pages instead. The prompts should ask them to look at the catalogue.\n\n## Key changes\n\n- The teacher, parent and learner prompts say \"Wirf auch einen Blick in den Katalog\" (\"Also have a look at the catalogue\"), with its address, in German and English.", "reason": "The only commit of this request, on a new branch after the merge.", "sources": [{"sha": "7f3017e", "subject": "fix: prompts ask the assistant to look at the catalogue", "date": "2026-10-18T23:15:41+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i249", "session": "session_01PAMVQYdbC7ZYsnSPDygv7G", "from": "2026-10-16T14:49:52.569697Z", "to": "2026-10-16T14:57:08+00:00", "repos": ["app-templates"], "commit": "feat(explainer): make exercises, solutions and sections recognisable", "intent": "In the explainer's rendering, exercises do not read as exercises with solutions, and sections are hard to tell apart. Learners should see at a glance where a task starts, where its solution is and where a new section begins, on a phone and on a desktop, with and without JavaScript.", "decisions": ["a card with a visible label \"Übung\" around every exercise, also without JavaScript", "the solution green and marked, the hint neutral and dashed, so both are told apart at a glance", "keep the double label (heading and card) for now, over showing the task number in the card's header", "commit to a branch, without opening a pull request"], "trigger": "\"Das Rendering des explainer templates ist nicht gut. Die Übungen sind nicht einfach als solche mit Lösungen erkennbar, Abschnitte nicht klar identifizierbar. Guck Dir das mal aus Sicht von Usability an\"", "kind": "feature", "confidence": "evidenced", "relations": [], "groups": [{"repo": "app-templates", "message": "feat(explainer): make exercises, solutions and sections recognisable\n\n## Intent\n\nExercises did not read as exercises with solutions, and sections were hard to tell apart. Learners should see at a glance where a task starts, where its solution is and where a new section begins, on a phone and on a desktop, with and without JavaScript.\n\n## Key changes\n\n- Every exercise sits in a card with a visible label (\"Übung\", in English \"Exercise\"), also without JavaScript.\n- The solution is a green, marked box; the hint stays neutral and dashed.\n- Each section starts with a rule and more space, and its heading is larger. Subsections get an accent bar.\n- The task text of a live exercise wraps inside its frame instead of running over the border.\n- Worked tasks are separated from each other.\n\n## Dependencies and side effects\n\n- The review rules and the browser tests do not know the new label yet.", "reason": "The only commit of this request.", "sources": [{"sha": "9c45ab2", "subject": "Explainer: make exercises, solutions and sections recognisable", "date": "2026-10-16T14:57:08+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i250", "session": "session_01PZvFpZ59tTrQh3iysDaMmN", "from": "2026-10-15T08:32:17.598302Z", "to": "2026-10-15T20:10:18+00:00", "repos": ["apps"], "commit": "feat(entries): Elektrizität for grades 7 and 8 and the topics of its new pages", "intent": "The first increment of a published app, built in its own session from the increment template: the Elektrizität app grows to the next grades. Its catalog entry must follow, since a removed page broke a topic link and the new pages are not listed yet.", "decisions": ["update the still open listing pull request of the first version instead of opening a second one", "replace the removed topic of the build editor with the six new pages"], "trigger": "\"Dann würde ich gerne noch eine Erweiterung der bestehenden App in einer neuen Session anfordern.\" … \"alles gemergt\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i097", "note": "the first increment run on the plan per piece of work"}, {"type": "continues", "intent": "i233", "note": "updates the catalog entry of the first version"}], "groups": [{"repo": "apps", "message": "feat(entries): Elektrizität for grades 7 and 8 and the topics of its new pages\n\n## Intent\n\nThe Elektrizität app grew to grades 7 and 8. Its catalog entry still named grades 5 and 6 and a topic page that no longer exists, so the listing check failed.\n\n## Key changes\n\n- Grades 5 to 8, a new summary and new keywords.\n- The topic of the removed build editor is gone; its tasks now sit on the pages about switches and circuits.\n- Six new topics: current, voltage, resistance, Ohm's law, and series and parallel circuits with meters.\n- The entry passes `lernapps check --entry` against the published app.", "reason": "One commit on the branch of the listing pull request apps#26.", "sources": [{"sha": "bd214cb", "subject": "Eintrag: Elektrizität, Klasse 7 und 8 und Themen der neuen Seiten", "date": "2026-10-15T20:10:18+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 24, "sourceCount": 1, "misplaced": []}, {"id": "i251", "session": "session_01QZ2KR44jgwHH2VtmpR1r7x", "from": "2026-10-18T08:22:18.064033Z", "to": "2026-10-18T10:14:38+00:00", "repos": ["apps"], "commit": "feat(entries): list the Kniffel-Trainer", "intent": "Test the compact guidance in a first interactive spike: a separate session, served the unpublished guidance by the orchestrating session, builds a small app with the creator from the build prompt to the listing, so we can see which instructions it follows and which it ignores. List the resulting app, a Yahtzee trainer for chances, in the catalog.", "decisions": ["a game in three modes: explain mode with coach and tree, game with joker, plain game with high scores", "the probability tree teaches how the values come about", "in German and English", "in the creator's repo on his GitHub Pages", "the creator named Oliver"], "trigger": "In the parent session: \"Mein Vorschlag: Wir könnten das einmal radikal umformulieren und dann hier erst mal interaktiv eine einzelne kleine App bauen. dann observieren wir, ob das in der Session mit mir als Creator gut funktioniert hat oder welche Instruktionen ignoriert wurden\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i132", "note": "the first spike of the compact guidance"}], "groups": [{"repo": "apps", "message": "feat(entries): list the Kniffel-Trainer\n\n## Intent\n\nList the Kniffel-Trainer in the catalog, as the last step of the first interactive spike of the compact guidance, in which a separate session builds an app with the creator from the build prompt to the listing.\n\n## Key changes\n\n- A catalog entry for the Kniffel-Trainer (Yahtzee Trainer): Mathematik for grades 7 and 8, at https://mrsimpson.github.io/kniffel-trainer/, in German and English.\n- Learners play Yahtzee and work out chances as fractions and percentages.\n- Three topics: explain mode with coach and tree, game with joker, plain game with high scores.\n- Fitness: no account, no install, storage on the device, no third parties.\n- The creator is Oliver, linked to his GitHub profile.", "reason": "The listing commit and the fix of its creator name follow each other directly on the listing branch; one entry, one commit.", "sources": [{"sha": "3e62061", "subject": "feat: add Kniffel-Trainer", "date": "2026-10-18T10:11:03+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "606fd67", "subject": "fix: creator name", "date": "2026-10-18T10:14:38+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i252", "why": "Corrects the creator name of the same entry; i252 has no commits left."}]}]}], "messages": 22, "sourceCount": 2, "misplaced": []}, {"id": "i253", "session": "session_01TWaqtQxxoFKpPiDyVgx79d", "from": "2026-10-20T21:09:19.344363Z", "to": "2026-10-20T21:40:05+00:00", "repos": ["docs"], "commit": "docs: lernapps.net serves a copy of every listed app (KD-21)", "intent": "\"The app stays with its creator, at their own address\" does not work together with data protection (apps#58): a teacher or parent who hosts the app becomes the provider schools must answer to. lernapps.net should serve a copy of every listed app under one privacy notice, already in the first version, while the creator stays the author. The platform model must show what this changes and why it helps creators.", "decisions": ["separate authorship (creator: licence, repo, address) from delivery (lernapps.net: copy, privacy notice, checks)", "a licence that allows the copy is a condition for listing", "the copies come in the first draft, before the first referral wave, over later", "record it as KD-21 and a new riskiest assumption a-creators-accept-copy", "the creators' value proposition: list in minutes without answering to schools for data protection yourself", "a fitness signal: the app accesses only its own data", "E5 stays unchanged, since it describes the world without lernapps.net"], "trigger": "\"Wir haben festgestellt, dass die Idee mit „der Autor bleibt Owner und hustet die App da, wo er sie Husten will zusammen mit Datenaxhutz nicht funktioniert.\" … \"Wir würden das jetzt in einer ersten Version auch. Auen will, nicht erst later. Ein Check accessed only own data wäre sinnvoll\"", "kind": "docs", "confidence": "evidenced", "relations": [], "groups": [{"repo": "docs", "message": "docs: lernapps.net serves a copy of every listed app (KD-21)\n\n## Intent\n\n\"The app stays its creator's, at their own address\" does not hold together with data protection (lernapps/apps#58): whoever hosts the app is the provider schools must answer to. lernapps.net serves a copy of every listed app instead, already in the first draft. The creator stays the author and keeps licence, repository and address.\n\n## Key changes\n\n- pdt42: the infrastructure (D1), the frontend-only asset and the data protection moat (E3), \"List an app\" and its channels (D5), with \"accesses only its own data\" in the fitness signal, all three experiences (D7), and the first draft (D8) with the new riskiest assumption a-creators-accept-copy.\n- The creators' value proposition: list in minutes without answering to schools for data protection yourself.\n- biz42: hosting moves into scope, the risks name lernapps.net as provider, and a new capability cap-hosting is required by obj-first-apps.\n- vision.md: \"The creator stays the author\".\n- The plan records KD-21.\n\n## Dependencies and side effects\n\n- The check own-data-only follows in tooling (8356d57); the copies themselves in apps (880b129) and tooling (7dbcb8a).", "reason": "One commit for one request.", "sources": [{"sha": "5c447b4", "subject": "docs: lernapps.net serves a copy of every listed app (KD-21)", "date": "2026-10-20T21:40:05+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 4, "sourceCount": 1, "misplaced": []}, {"id": "i254", "session": "session_01TWaqtQxxoFKpPiDyVgx79d", "from": "2026-10-20T21:44:18.335924Z", "to": "2026-10-20T21:58:51+00:00", "repos": ["tooling"], "commit": "feat: listing rule own-data-only, an app touches only its own data in the browser", "intent": "Once every listed app is served from lernapps.net, all apps share one origin with each other and the platform. An app must therefore touch only its own data in the browser, or it could read or destroy another app's or the platform's data.", "decisions": ["the rule applies to every listed app, with severity error", "the prefix is lernapps:<id>: with the catalog id", "plant another app's and the platform's data before the page loads and record every access by name, including IndexedDB and the Cache API", "caches now count as stored data", "what happens after the first click goes into the review rubric"], "trigger": "\"Own data a only gilt immer. Error. Ja, Präfix ist die App\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i253", "note": "the check named in the fitness signal of KD-21"}], "groups": [{"repo": "tooling", "message": "feat: listing rule own-data-only, an app touches only its own data in the browser\n\n## Intent\n\nlernapps.net serves a copy of every listed app (lernapps/docs KD-21, lernapps/apps#58), so all apps share one origin with each other and the platform. An app must touch only its own data, or it could read or destroy another's.\n\n## Key changes\n\n- An app names every localStorage and sessionStorage key, IndexedDB database and cache with lernapps:<id>:, where <id> is its catalog id, and touches nothing else. Severity error, scope listing.\n- Before a page loads, the visit puts another app's data into the browser and records every access by name: storage, IndexedDB and the Cache API. Caches now count as stored data.\n- New check own-data-only with unit tests and a fixture.\n- The platform rules, the review rubric, storage-through-wrapper and createStorage say the same; arc42 has the decision dec-own-data-only.\n\n## Dependencies and side effects\n\n- mathe-karte fails the rule: it uses keys without the prefix.", "reason": "One commit for one request.", "sources": [{"sha": "8356d57", "subject": "feat: listing rule own-data-only, an app touches only its own data in the browser", "date": "2026-10-20T21:58:51+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i255", "session": "session_01TWaqtQxxoFKpPiDyVgx79d", "from": "2026-10-20T21:59:35.975430Z", "to": "2026-10-21T06:48:27+00:00", "repos": ["apps", "tooling"], "commit": "feat: serve a copy of every listed app at lernapps.net/<id>/", "intent": "Build the copies that KD-21 decided: when a listing pull request is merged, or an app is updated, lernapps.net should build and serve a checked copy of the app, our own apps included, at a short address that teachers already know.", "decisions": ["the path lernapps.net/<id>/ on the root site, over /apps/<id>/app/ with app three times in the address", "our own apps go the same way, without exception", "build from the commit pinned in the entry, in a container without secrets; only jobs without app code get a token", "push the copy into the root site's gh-pages, with a GitHub App of the organisation, over a personal token or polling", "site-deploy keeps the copies listed in copies.txt", "updates by pull request; auto-merge only when nothing but versions of existing npm dependencies changed", "the catalog links a copy only when it is live at the entry's commit", "mathe-karte as the test of an unfit entry; licences fixed afterwards as the test of an update", "write the plan first, with the workflows server's epcc process"], "trigger": "\"Dann können wir nun die eigentliche Action zum kopieren beim merge des listing PRs machen. Wir wollen wir es denn technisch umsetzen?\" … \"Ich fände es nur konsistent, dann auch unsere apps dort hin zu bauen und zu piblizieren\" … \"Automatisches Merge eines Updates soll nur dann möglich sein, wenn ausschließlich bestehende npm-dependencies … auf eine neue Version geändert wurden.\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i253", "note": "implements the copies decided in KD-21"}], "groups": [{"repo": "tooling", "message": "feat: site-deploy keeps the copies of listed apps; decision dec-copies-served\n\n## Intent\n\nlernapps.net serves a copy of every listed app at lernapps.net/<id>/ (lernapps/docs KD-21, lernapps/apps#58). The apps repo pushes the copies into the root site's gh-pages, so the deploy of the home page must not delete them.\n\n## Key changes\n\n- site-deploy leaves the directories listed in copies.txt (\"<id> <commit>\" per line) and the file itself alone, as it does pr-preview/.\n- arc42: dec-copies-served supersedes dec-app-own-hosting; chapters 3, 5 and 7 follow.\n- The skills, the README, the GitHub page and the plan template say an app is published at the creator's address and served as a copy once listed.\n\n## Dependencies and side effects\n\n- lernapps.github.io pins this tooling (490860c) before the apps change (880b129) is merged.", "reason": "The only tooling commit of this request.", "sources": [{"sha": "7dbcb8a", "subject": "feat: site-deploy keeps the copies of listed apps; decision dec-copies-served", "date": "2026-10-21T06:37:40+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "feat: serve a copy of every listed app at lernapps.net/<id>/\n\n## Intent\n\nlernapps.net serves a copy of every listed app, our own included (lernapps/docs KD-21, #58). The copy is built and published when a listing is merged and when an app is updated, at the short address lernapps.net/<id>/.\n\n## Key changes\n\n- Entry format: source (a GitHub repo) and commit (a full id) are required; the seven entries are pinned to the head of their main. Reserved ids: no path of the home page and no other repo of the organisation.\n- publish.yml: on a push to main that changes entries, it builds each app at its commit in a container without secrets, checks it, pushes the copy into <id>/ of the root site's gh-pages with the organisation's GitHub App, keeps copies.txt, checks the copy where it is served and builds the catalog again.\n- The catalog links an app's copy only when copies.txt lists it at the entry's commit; otherwise it links the entry's url.\n- update.yml opens a daily pull request update/<id> for apps whose main moved. It is merged automatically only when nothing but versions of existing npm dependencies changed; otherwise it is labelled review.\n- /review reviews the entry's commit by default.\n- The texts say the licence must allow the copy and the creator stays the author.\n- The plan (.vibe/development-plan-feat-serve-copies.md) records the decisions KD-01 to KD-12, the steps, the GitHub App setup, the rollout and the findings while coding.\n\n## Dependencies and side effects\n\n- Merge only after tooling's site-deploy keeps the copies (7dbcb8a) and lernapps.github.io pins it (490860c), or the next home page deploy deletes the copies.\n- Needs the GitHub App in the environment publish, \"Allow auto-merge\" and a ruleset that requires the listing check.", "reason": "The plan commits and the feature follow each other directly on feat/serve-copies; the plan commits join the feature by rule.", "sources": [{"sha": "2bffd52", "subject": "docs(plan): serve a copy of every listed app at lernapps.net/<id>/", "date": "2026-10-21T06:05:05+00:00", "pr": null, "plan": true, "moved": []}, {"sha": "379e15d", "subject": "docs(plan): the four steps from an entry to its copy", "date": "2026-10-21T06:06:48+00:00", "pr": null, "plan": true, "moved": []}, {"sha": "1f5772f", "subject": "docs(plan): GitHub App, mathe-karte as test, licences as update test, auto-merge only for dependency bumps", "date": "2026-10-21T06:20:58+00:00", "pr": null, "plan": true, "moved": []}, {"sha": "5ed1c8b", "subject": "docs(plan): implementation strategy per repo and rollout", "date": "2026-10-21T06:31:32+00:00", "pr": null, "plan": true, "moved": []}, {"sha": "880b129", "subject": "feat: serve a copy of every listed app at lernapps.net/<id>/", "date": "2026-10-21T06:47:41+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "bba443b", "subject": "docs(plan): findings while coding, merge order", "date": "2026-10-21T06:48:27+00:00", "pr": null, "plan": true, "moved": []}]}], "messages": 13, "sourceCount": 7, "misplaced": []}, {"id": "i256", "session": "session_01TWaqtQxxoFKpPiDyVgx79d", "from": "2026-10-21T06:50:27.128555Z", "to": "2026-10-21T07:06:36+00:00", "repos": ["lernapps.github.io"], "commit": "chore(deps): pin lernapps/tooling d31a42a: site-deploy keeps the copies of listed apps", "intent": "Roll out the copies in the right order: the root site must use the tooling whose deploy keeps the copies before the apps repo starts pushing them, or the next deploy of the home page would delete them.", "decisions": ["merge tooling first, then pin it in lernapps.github.io, then merge apps", "the pre-push hook names the same tooling commit as the workflows"], "trigger": "\"ja, merge und überwache das Ganze\"", "kind": "chore", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i255", "note": "the rollout step between the tooling and the apps merge"}], "groups": [{"repo": "lernapps.github.io", "message": "chore(deps): pin lernapps/tooling d31a42a: site-deploy keeps the copies of listed apps\n\n## Intent\n\nThe root site must use the tooling whose deploy keeps the copies of listed apps before the apps repo starts publishing them. Otherwise the next deploy of the home page deletes them.\n\n## Key changes\n\n- The workflows and the pre-push hook pin lernapps/tooling d31a42a (lernapps/tooling#127): the deploy of the home page leaves the copies in copies.txt alone.\n\n## Dependencies and side effects\n\n- Needs tooling 7dbcb8a; allows the merge of apps 880b129.", "reason": "Both move the same tooling pin and follow each other directly.", "sources": [{"sha": "490860c", "subject": "chore(deps): pin lernapps/tooling d31a42a: site-deploy keeps the copies of listed apps", "date": "2026-10-21T07:06:27+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "09d77c0", "subject": "chore(deps): TOOLING_REF of the pre-push hook to the same tooling commit", "date": "2026-10-21T07:06:36+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 2, "misplaced": []}, {"id": "i257", "session": "session_01TWaqtQxxoFKpPiDyVgx79d", "from": "2026-10-21T07:08:39.459445Z", "to": "2026-10-21T08:59:17+00:00", "repos": ["apps", "tooling"], "commit": "feat: serve the copies of listed apps at lernapps.net/apps/start/<id>/", "intent": "The first rollout put the copies of listed apps into the root site at lernapps.net/<id>/. A repo of the organisation with the same name keeps that path even with its own Pages switched off, so the copy answered 404. Those repos also need their own Pages for the previews of their pull requests. The copies need an address that cannot collide with any repo.", "decisions": ["a reserved sub-path lernapps.net/apps/start/<id>/, over renaming the organisation's app repos to app-<id>", "the same path for every app, over an exception that skips the copy for apps of the organisation", "previews stay in each app repo's own Pages, over moving them into the root site with credentials in every app repo", "the copies live in the app overview's own gh-pages and are pushed with its own token, over the GitHub App writing into the root site", "site-deploy takes a list of paths to keep, over reading copies.txt of the root site"], "trigger": "\"ich würde lieber einen reservierten Sub-Pfad für das deployte artefakt nutzen, also bspw. lernapps.net/apps/start/<id>\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i256", "note": "moves the copies of the first rollout from lernapps.net/<id>/ to lernapps.net/apps/start/<id>/"}], "groups": [{"repo": "tooling", "message": "feat: copies of listed apps at lernapps.net/apps/start/<id>/; site-deploy input keep\n\n## Intent\n\nThe copies of listed apps sat in the root site at lernapps.net/<id>/. A repo of the organisation keeps that path even with its own Pages switched off, so the copy answered 404, and those repos need their Pages for the previews of their pull requests. The copies need an address that no repo can take.\n\n## Key changes\n\n- site-deploy takes an input keep: the paths a deploy leaves alone besides pr-preview/. It no longer reads copies.txt of the root site.\n- The architecture decision on served copies names the new address lernapps.net/apps/start/<id>/ and records why the root-site address was turned down.\n- System context, deployment view, skills, README and the GitHub page use the new address.\n\n## Dependencies and side effects\n\n- lernapps/apps 5631bbd publishes the copies to the new address.", "reason": "The one tooling commit of this change.", "sources": [{"sha": "bcceae6", "subject": "feat: copies of listed apps at lernapps.net/apps/start/<id>/; site-deploy input keep", "date": "2026-10-21T08:42:35+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "feat: copies of listed apps at lernapps.net/apps/start/<id>/\n\n## Intent\n\nA repo of the organisation keeps its path lernapps.net/<id>/ even with its Pages off, so the copies in the root site were not served. Those repos also need their own Pages for previews. The copies need a path of their own that no repo can collide with.\n\n## Key changes\n\n- The publish workflow pushes each copy into start/<id>/ of this repo's own gh-pages with its own token, and retries when gh-pages moved. It no longer needs a GitHub App.\n- Run by hand without an id, it rebuilds every copy.\n- The catalog reads start/copies.txt and links lernapps.net/apps/start/<id>/.\n- The reserved ids are now the catalog's own top-level paths (start, en, build and so on).\n- The plan records the decision (KD-13); the texts name the new address.\n- The tooling is pinned to the commit with site-deploy's input keep, and the catalog's deploy keeps start/, so it no longer deletes the copies. The same tooling brings the listing rule own-data-only, so the listing comment counts 9 rules.\n\n## Dependencies and side effects\n\n- lernapps/tooling bcceae6 lets site-deploy keep the start/ path.\n- The copies already written to the root site are removed by hand.", "reason": "The move of the copies and the tooling pin that lets the catalog's deploy keep start/ follow each other directly on the branch of apps#67.", "sources": [{"sha": "5631bbd", "subject": "feat: copies of listed apps at lernapps.net/apps/start/<id>/", "date": "2026-10-21T08:45:36+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "d0bf51e", "subject": "chore(deps): pin lernapps/tooling 4b5d868; pages.yml keeps start/", "date": "2026-10-21T08:59:17+00:00", "pr": null, "plan": false, "moved": [{"kind": "dropped", "from": "i258", "why": "The tooling pin with keep: start/ completes the move of the copies; the outage of the organisation's apps in i258 was fixed without a commit, so i258 has no commits left."}]}]}], "messages": 6, "sourceCount": 3, "misplaced": []}, {"id": "i259", "session": "session_01TWaqtQxxoFKpPiDyVgx79d", "from": "2026-10-21T09:25:46.677407Z", "to": "2026-10-21T10:00:29+00:00", "repos": ["apps"], "commit": "fix: the listing comment shows the result of the latest run", "intent": "The first real update of a listed app (elektrizitaet, apps#68) passed its listing check on a re-run, but the comment on the pull request still showed the failure of the first run. A reviewer must see the result of the latest run.", "decisions": ["pick the newest artifact of the run and download it by id, over downloading by name, which takes the first", "link the same artifact as the full report", "record in the plan that an update pull request can open before the creator's deploy has finished, over fixing that now"], "trigger": "\"https://github.com/lernapps/apps/pull/68 beinhaltet kein Update, dass die Prüfung nun ok wäre, der Kommentar ist alt\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i257", "note": "the first update of a listed app through the new path showed the flaw"}], "groups": [{"repo": "apps", "message": "fix: the listing comment of a re-run shows the re-run's result\n\n## Intent\n\nA re-run of the listing check keeps the run's id and adds a second report. The comment took the first one, so after a passing re-run it still showed the old failure (apps#68). A reviewer must see the latest result.\n\n## Key changes\n\n- The comment workflow picks the newest report of the run and links that one as the full report.\n- The plan records what the first update showed: the update pull request opened while the creator's deploy was still running, so the first check saw the old app.\n\n## Dependencies and side effects\n\n- apps ea038f5 fixes where the downloaded report lands.", "reason": "The one commit of apps#69.", "sources": [{"sha": "d26d743", "subject": "fix: the listing comment of a re-run shows the re-run's result", "date": "2026-10-21T09:53:36+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "fix: the listing comment finds the report it downloaded by id\n\n## Intent\n\nAfter the previous fix, the comment found no report and said the check did not finish. A report downloaded by id lands in a subfolder named after it, unless the download merges it into the target folder.\n\n## Key changes\n\n- The download puts the report straight into the folder the comment reads.\n\n## Dependencies and side effects\n\n- Completes apps d26d743.", "reason": "A follow-up merged as its own pull request after apps#69.", "sources": [{"sha": "ea038f5", "subject": "fix: the listing comment finds the report it downloaded by id", "date": "2026-10-21T10:00:29+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 4, "sourceCount": 2, "misplaced": []}, {"id": "i260", "session": "session_01TWaqtQxxoFKpPiDyVgx79d", "from": "2026-10-21T11:29:59.711058Z", "to": "2026-10-21T12:53:31+00:00", "repos": ["apps"], "commit": "fix(publish): catch up on every copy that differs from what is served", "intent": "After six update pull requests were merged in a row, four copies on lernapps.net/apps/start/ stayed
