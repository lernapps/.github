 phase. Once the user confirms, we should not have more than three turns.\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i036", "note": "replaces one scenario"}], "groups": [{"repo": "tooling", "message": "docs(arc42): count the creator's turns after the confirmed plan, not decisions\n\n## Intent\n\nCounting the creator's decisions is a poor measure: many turns before the plan can mean good assistance. Once the creator confirms the plan, the assistant should work on its own.\n\n## Key changes\n\n- qs-few-turns-after-plan replaces qs-few-decisions: at most 3 creator turns from the confirmed plan to the listing pull request.\n- The retrospective section of the plan records those turns and is the source of the number.", "reason": "One commit for one request.", "sources": [{"sha": "d77a131", "subject": "docs(arc42): count the creator's turns after the confirmed plan, not decisions", "date": "2026-10-08T18:02:29+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i041", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-08T18:05:10.721Z", "to": "2026-10-08T18:05:37+00:00", "repos": ["tooling"], "commit": "docs(plan): archetypes explainer, interactive, quiz; the pre-push hook counts its failures", "intent": "The archetypes need their final names. The quiz should be a deep scaffold where the creator supplies only questions and options. Failed pre-push runs should be counted without relying on the agent.", "decisions": ["explainer, interactive and quiz, named after what the content does", "quiz as a deep scaffold with engine, question types, feedback, scoring, accessibility, i18n and a no-JS fallback built in, over a placeholder", "the pre-push hook counts its failures in the plan's front matter, over the agent reporting them"], "trigger": "\"Agree on the archetypes. And we should build a solid quiz architecture with very high depth as scaffold so that basically only the questions and options need to be supplied by the implementer. WRT pre push fails: We could increment the pre push fails as part of the hook itself (e. G. In the frontmatter of the plan file we create).\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i039", "note": "settles the names"}], "groups": [{"repo": "tooling", "message": "docs(plan): archetypes explainer, interactive, quiz; the pre-push hook counts its failures\n\n## Intent\n\nThe archetypes need their final names. The quiz should be a deep scaffold where the creator supplies only questions and options. Failed pre-push runs should be counted without relying on the agent.\n\n## Key changes\n\n- KD-02 names the three archetypes; quiz becomes a deep scaffold where only questions and options are supplied, as typed data that is checked.\n- KD-07: the pre-push hook increments a counter in the plan's front matter on each failure; chapter 10 names it as a source for fewer iterations.", "reason": "One commit for one request.", "sources": [{"sha": "1bb8a7e", "subject": "docs(plan): archetypes explainer, interactive, quiz; the pre-push hook counts its failures", "date": "2026-10-08T18:05:37+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i042", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-08T18:07:07.648Z", "to": "2026-10-08T18:15:04+00:00", "repos": ["tooling"], "commit": "docs(arc42): complete the architecture of the tooling for agentic app creation", "intent": "With goals and archetypes settled, complete the architecture so it can be reviewed as a whole. Failed pre-push runs should stay below 5 at the 90th percentile.", "decisions": ["one generic rule with scope (listing, site, archetype) and severity (error, warning, hint) plus an enforcement level, over five separate rule terms", "rules move down a promotion path from review to check, skill rule or plan step", "one package @lernapps/tooling; templates in a separate repo; listing validation in apps", "three decisions left as proposals: explainer rendering, quiz question types, order of building", "p90 of failed pre-push runs below 5"], "trigger": "\"I’d be happy with p90 < 5 failures. We can complete the architecture now, no?\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i041", "note": "the remaining chapters"}], "groups": [{"repo": "tooling", "message": "docs(arc42): complete the architecture of the tooling for agentic app creation\n\n## Intent\n\nWith goals and archetypes settled, complete the architecture so it can be reviewed as a whole. Failed pre-push runs should stay below 5 at the 90th percentile.\n\n## Key changes\n\n- Chapters 2 to 9, 11 and 12: constraints, context, solution strategy, building blocks, runtime scenarios, deployment, concepts (rule model, promotion path, plan file, messages for agents, validation report), 21 decisions, risks and glossary.\n- Chapter 1 shows the five-step journey of a creator: clarify, set up, build, validate, list.\n- The scenario for failed pre-push runs uses p90 below 5.", "reason": "One commit for one request.", "sources": [{"sha": "855a5fd", "subject": "docs(arc42): complete the architecture of the tooling for agentic app creation", "date": "2026-10-08T18:15:04+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i043", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-08T19:15:01.435Z", "to": "2026-10-08T19:17:22+00:00", "repos": ["tooling"], "commit": "docs(arc42): no single app, no progress, no foreign ids in the architecture", "intent": "The architecture should describe the system on its own and stay true over time. The Mathe-Karte is one implementation of an archetype, maybe not even a good one, so it is not named. Progress wording and ids of other documents go stale. Only direct cross-references, such as goals derived from the platform design, use deep links.", "decisions": ["no app named in the architecture, over the Mathe-Karte as the reference of the explainer archetype", "decisions phrased as timeless statements, over \"for now\" and \"later\"", "the order of building moves to the plan", "deep links to the rendered platform design only for direct cross-references, over its element ids"], "trigger": "\"Mathe Karte must not be referenced in the architecture. It’s just one implementation of the archetype. And it may not even be perfect. Also, the architecture document must not describe progress nor quote ids of other documents.\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i042", "note": "cleans up the completed architecture"}], "groups": [{"repo": "tooling", "message": "docs(arc42): no single app, no progress, no foreign ids in the architecture\n\n## Intent\n\nThe architecture should describe the system on its own and stay true over time. The Mathe-Karte is one implementation of an archetype, maybe not even a good one, so it is not named. Progress wording and ids of other documents go stale. Only direct cross-references, such as goals derived from the platform design, use deep links.\n\n## Key changes\n\n- The Mathe-Karte and its author no longer appear; the explainer archetype is described by what it is.\n- Progress wording, plan and issue ids and platform-design ids are gone; direct cross-references are deep links to rendered pages.\n- Decisions without progress: the owner runs the review, the tooling sends nothing, every report is bound to a commit.", "reason": "One commit for one request; the plan commit after it serves the next request (i044).", "sources": [{"sha": "53271cf", "subject": "docs(arc42): no single app, no progress, no foreign ids in the architecture", "date": "2026-10-08T19:17:22+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i044", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-08T19:17:34.891Z", "to": "2026-10-09T03:57:45+00:00", "repos": ["tooling"], "commit": "docs(arc42): rework after the review of the whole architecture", "intent": "Get the architecture ready for the Code phase. The tooling should first be built with the same strict setup it later gives apps. A review from chapter 1 down found gaps: app discovery and listing were missing as a goal, the rule catalog had no clear place or runtime, archetype details and building-block details sat in the wrong places, and checks must be the same in the git hook and in CI, with end-to-end tests run by the creator before push.", "decisions": ["the tooling's own build as the first step of the Code phase", "rules live in their artifacts with stable ids; the rule catalog is a concept, over a central catalog compiled into the artifacts", "one command `lernapps check` with --pre-commit and --pre-push; hook and CI run the same checks", "Playwright end-to-end tests before push, over no browser before push, so CI has less to do", "a YAML report, over JSON", "an environment for lernapps agents and the creator's agent harness as deployment units, over the owner's machine", "cross-cutting concepts only for what spans blocks: plain language, terse output, logging", "archetype details only in the plan"], "trigger": "\"About Dec build order: the very first step should be the proper build itself\" … \"Architecture review, from chapter 1 down. We’re missing the goal to work towards app descovery. “Listing” is not part anywhere now. That’s a flaw. …\" … \"The ci and the pre-commit should actually be identical wrt checks.\" … \"we could provide the cli with a parameter that runs the heavy tests only pre push\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i042", "note": "rework after review"}], "groups": [{"repo": "tooling", "message": "docs(plan): the tooling's own build comes first\n\n## Intent\n\nThe tooling should be built first with the same conventions it gives apps, before anything is built on it.\n\n## Key changes\n\n- The first step of the Code phase is the package @lernapps/tooling with strict TypeScript, vite-plus, git hooks, a check workflow in CI and the CLI lernapps as an empty shell.\n- The rest of the order stays proposed in the plan, not in the architecture.", "reason": "The plan commit for the build order, kept apart from the architecture review it precedes.", "sources": [{"sha": "b13ca2d", "subject": "docs(plan): the tooling's own build comes first", "date": "2026-10-08T19:17:45+00:00", "pr": null, "plan": true, "moved": [{"kind": "moved", "from": "i043", "why": "Plan commit for the build-order message that opens this intent; it does not join 53271cf, which stays in i043."}]}]}, {"repo": "tooling", "message": "docs(arc42): rework after the review of the whole architecture\n\n## Intent\n\nGet the architecture ready for the Code phase. The tooling should first be built with the same strict setup it later gives apps. A review from chapter 1 down found gaps: app discovery and listing were missing as a goal, the rule catalog had no clear place or runtime, archetype details and building-block details sat in the wrong places, and checks must be the same in the git hook and in CI, with end-to-end tests run by the creator before push.\n\n## Key changes\n\n- Discovery is a quality goal and listing a step of the strategy, which follows the creator's journey and no longer repeats the goals.\n- Rules live in their artifacts with stable ids; the rule catalog is a cross-cutting concept.\n- One check command with --pre-commit and --pre-push; hooks and CI identical; Playwright end-to-end tests before push; YAML report.\n- The environment for lernapps agents and the creator's agent harness are deployment units.\n- Cross-cutting concepts are plain language, terse output, logging and traceability, stable contracts.\n- Archetypes only as a variation point; the repo is called app-templates.", "reason": "The rework and the plan commit that joins it by the plan rule, directly one after the other.", "sources": [{"sha": "e592806", "subject": "docs(arc42): rework after the owner's review", "date": "2026-10-09T03:57:36+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "62d8922", "subject": "docs(plan): app-templates where the plan names the repo today", "date": "2026-10-09T03:57:45+00:00", "pr": null, "plan": true, "moved": []}]}], "messages": 4, "sourceCount": 3, "misplaced": []}, {"id": "i045", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-09T03:59:57.565Z", "to": "2026-10-09T08:32:56+03:00", "repos": ["tooling"], "commit": "feat(tooling): package @lernapps/tooling with the CLI lernapps, vite-plus, hooks and check in CI", "intent": "Start the Code phase. Each step of the build order becomes an issue linked in the plan and is built by a fresh agent on its own branch: test-first from the consumer's contract, end to end, and with commit bodies in a fixed format. The first steps are the tooling's own build, the process guidance and the rule ids.", "decisions": ["one issue per step under a tracking issue, linked in the plan", "a fresh agent, branch and pull request per issue", "tests from the consumer's contract, end to end on real fixtures, over unit tests of internals", "commit bodies with Intent, Key decisions and Side effects", "the repo root is the package @lernapps/tooling, built into dist/ on install; CI runs exactly what the hooks run", "vite-plus pinned to 1.0.0, since 1.1.0 is younger than the minimum release age", "a short AGENTS.md with a word budget and a plan template with a versioned front matter schema", "a rule is declared once in a skill's rule block; implementations carry only the id and a link; ids are unique per kind"], "trigger": "\"Im fine with both archetype proposals and the build order. The build order is actually the plan phase of our own epcc. As this will be a long tasks, create issues for all steps that need robbe performed and link them in the plan file\" … \"Yes, let’s merge #7 and start each issue with a new agent and a new branch. Whenever we can, we should build it test driven, with an e2e perspective.\" … \"each commit shall have the following body: ## Intent ## Key decisions ## Side effects (if any)\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i044", "note": "the Code phase of the same plan"}], "groups": [{"repo": "tooling", "message": "docs(plan): plan phase done; every step of the Code phase is an issue\n\n## Intent\n\nThe build order is the Plan phase of the tooling's own EPCC. Every step should be an issue, so the long Code phase can be tracked.\n\n## Key changes\n\n- The archetype proposals and the build order are accepted.\n- Tracking issue #9 with the steps #10 to #21 and lernapps/apps#3, linked in the Code and Commit phases.", "reason": "The last plan commit of the architecture branch; it serves this request and lies on another branch than the steps.", "sources": [{"sha": "5861750", "subject": "docs(plan): plan phase done; every step of the Code phase is an issue", "date": "2026-10-09T04:01:56+00:00", "pr": null, "plan": true, "moved": [{"kind": "moved", "from": "i044", "why": "Serves this intent's request to create the step issues and link them in the plan; as a plan commit it does not join e592806 in i044."}]}]}, {"repo": "tooling", "message": "feat(tooling): package @lernapps/tooling with the CLI lernapps, vite-plus, hooks and check in CI\n\n## Intent\n\nThe tooling is built with the conventions it gives apps before anything is built on it (#10): one package installed from git, strict TypeScript, vite-plus as the toolchain, git hooks that enforce, and CI that runs exactly what the hooks run.\n\n## Key changes\n\n- The repo root is the package @lernapps/tooling; the CLI lernapps is built into dist/ on install, since Node does not strip types under node_modules.\n- lernapps check: --pre-commit runs format, lint and type check, --pre-push runs tests and the package build; no flag or both flags run both.\n- vite-plus hooks: pre-commit formats the staged files and runs the fast part; pre-push runs the rest. The new workflow check.yml runs both parts.\n- Strict tsconfig, lint forbids any, a test forbids JavaScript sources; the review summary script is migrated to TypeScript.\n- End-to-end tests on a fresh clone: a planted type error, lint error or failing test turns hooks and CI red; an install from git provides lernapps.\n- The org preset groups vite-plus with its Vite core, which an npm override installs.\n- README and plan (KD-21) describe the package, the hooks, the test approach and the commit format.\n\n## Dependencies and side effects\n\n- npm ci now also builds dist/ and sets the hooks path in the clone.\n- Every repo that uses the org preset gets one grouped update for vite-plus and its core.", "reason": "Step 1 (#10), three commits of one agent directly one after the other on its branch.", "sources": [{"sha": "3b285e4", "subject": "feat(tooling): package @lernapps/tooling with the CLI lernapps, vite-plus, hooks and check in CI", "date": "2026-10-09T04:23:31+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "8391ac4", "subject": "chore(renovate): move vite-plus and its Vite core together", "date": "2026-10-09T04:23:45+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "8d7c55f", "subject": "docs: describe the package, the CLI and the hooks; record KD-21", "date": "2026-10-09T04:23:48+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "feat(guidance): AGENTS.md, the plan template, its front matter schema and the skill lernapps-app\n\n## Intent\n\nAny assistant should follow the EPCC workflow from plain text (#14): keep a plan, follow its phases, stop at the creator's checkpoints and load the skills.\n\n## Key changes\n\n- AGENTS.md (at most 350 words, loaded in every turn) makes the assistant keep .vibe/plan.md from the template, work only in the phase the front matter names, stop at the checkpoints (confirm the plan, publish, list), never bypass a hook and fill in the retrospective.\n- The plan template has Explore, Plan, Code and Commit with comments that guide the assistant; Explore fetches the published entry schema instead of repeating its fields; the retrospective has fixed headings.\n- The front matter has a versioned JSON Schema: archetype, phase and prePushFailures; from phase plan on, archetype is required; unknown keys are rejected.\n- The skill lernapps-app holds the workflow and the general rules; the package exports the guidance files.\n- Contract tests read the real files as a consumer does, with a filled plan and four broken fixtures.\n- The tests drop inherited GIT_* variables, so a run from a worktree's pre-push hook no longer acts on the repo being pushed.", "reason": "Step 5 (#14, pull request #27): contract tests, the guidance, its docs and a test fix, directly one after the other on one branch.", "sources": [{"sha": "e80cc95", "subject": "test(guidance): the contract of the plan file, AGENTS.md and the guidance exports", "date": "2026-10-09T05:12:53+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i047", "why": "Step 5, built by an agent started for this request; it landed after the next message."}]}, {"sha": "0763f89", "subject": "feat(guidance): AGENTS.md, the plan template, its front matter schema and the skill lernapps-app", "date": "2026-10-09T05:13:15+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i047", "why": "Step 5, built by an agent started for this request; it landed after the next message."}]}, {"sha": "5c7e644", "subject": "docs: describe the guidance exports and the plan file's contract", "date": "2026-10-09T05:13:18+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i047", "why": "Step 5, built by an agent started for this request; it landed after the next message."}]}, {"sha": "7589a1d", "subject": "fix(test): keep the hook's git variables out of the tests' temporary repos", "date": "2026-10-09T05:16:03+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i047", "why": "Fix of the step-5 tests, on the same branch."}]}]}, {"repo": "tooling", "message": "feat(rules): rule ids, the id test, the first listing and site rules, the rule page\n\n## Intent\n\nThe rules live in their artifacts; they should still form one catalog (#11): one way to declare or implement a rule id per artifact kind, a test that fails on duplicates or missing links, the first rules, and a page that lists them.\n\n## Key changes\n\n- A rule is declared once by a rule block (id, scope, severity, enforcement) under the heading that explains it, in a skill or in the review rubric.\n- Lint rules and checks carry only the id and the link to the rule's entry on the rule page; ids are unique per kind.\n- The id test runs in lernapps check; the build renders the rule page at /tooling/rules/.\n- The first rules of scope listing and site.\n- The plan marks steps 2 and 5 as completed, with the deviations agreed in step 2.", "reason": "Step 2 (#11, pull request #28) and the plan commit that joins it by the plan rule.", "sources": [{"sha": "a4a293f", "subject": "feat(rules): rule ids, the id test, the first listing and site rules, the rule page (#28)", "date": "2026-10-09T08:28:28+03:00", "pr": 28, "plan": false, "moved": [{"kind": "moved", "from": "i047", "why": "Step 2, built by an agent started for this request; it landed after the next message."}]}, {"sha": "77b36be", "subject": "docs(plan): mark steps 2 and 5 as completed (#29)", "date": "2026-10-09T08:32:56+03:00", "pr": 29, "plan": true, "moved": [{"kind": "moved", "from": "i047", "why": "Plan commit that marks steps 2 and 5 done; joins a4a293f."}]}]}], "messages": 3, "sourceCount": 10, "misplaced": []}, {"id": "i046", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-09T04:50:18.569Z", "to": "2026-10-09T04:52:56+00:00", "repos": ["tooling"], "commit": "fix(check): npm run check builds nothing; the Pages job becomes `site`", "intent": "In tooling, `npm run check` should check the code and nothing else: a build inside a check was unexpected. The Pages job that builds and checks the docs site should be named after what it does, apart from the code check.", "decisions": ["check builds nothing; check:site runs the site check after the build", "the Pages job check becomes site", "the site actions get an input check-script with default check, so other sites stay unchanged", "the workflows use the site actions from the checkout, so a pull request that changes an action exercises it"], "trigger": "\"We shall rename the pages check. What does it actually do? Check running a build is unexpected. Keep this separate.\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i045", "note": "step 1's check script"}], "groups": [{"repo": "tooling", "message": "fix(check): npm run check builds nothing; the Pages job becomes `site`\n\n## Intent\n\nIn tooling, `npm run check` should check the code and nothing else: a build inside a check was unexpected. The Pages job that builds and checks the docs site should be named after what it does, apart from the code check.\n\n## Key changes\n\n- Scripts: check runs lernapps check; check:site runs lernapps-check on the built docs; build stays the docs build.\n- pages.yml: job check becomes site; deploy needs site.\n- site-check and site-preview take check-script (default check).\n- Tests: npm run check on a fresh clone leaves no _site/; build and check:site are green.\n\n## Dependencies and side effects\n\n- The required status check is now satisfied by check.yml only; the docs site job reports as site.", "reason": "One commit for one request.", "sources": [{"sha": "6e4b95a", "subject": "fix(check): npm run check builds nothing; the Pages job becomes `site`", "date": "2026-10-09T04:52:56+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i047", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-09T05:00:27.902Z", "to": "2026-10-09T05:05:55+00:00", "repos": ["apps", "docs", "lernapps.github.io", "tooling"], "commit": "ci(pages): name the job that builds and checks the site `site`", "intent": "Every site repo should give the job that builds and checks its site the same name as tooling does: `site`. `check` stays the name of the code check.", "decisions": ["rename only the job; steps and pinned actions stay", "merge each rename pull request once its CI is green", "tick step 1 and fix the README in a small pull request of its own"], "trigger": "\"Yes, rename the site jobs in all repos. Merge all PRs\"", "kind": "chore", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i046", "note": "the same job name in every site repo"}], "groups": [{"repo": "apps", "message": "ci(pages): name the job that builds and checks the site `site`\n\n## Intent\n\nEvery site repo should give the job that builds and checks its site the same name as tooling does: `site`. `check` stays the name of the code check.\n\n## Key changes\n\n- Only the job name changes: check becomes site, and deploy needs site; steps, pinned site actions and npm scripts stay.\n\n## Dependencies and side effects\n\n- Same rename in apps (202a5e9), lernapps.github.io (4aa9c64) and docs (a79ea59); the tooling README follows (3e067bf).\n- A branch protection rule or ruleset that requires the status check check must require site instead.", "reason": "One commit per repo.", "sources": [{"sha": "202a5e9", "subject": "ci(pages): name the job that builds and checks the site `site`", "date": "2026-10-09T05:03:04+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "lernapps.github.io", "message": "ci(pages): name the job that builds and checks the site `site`\n\n## Intent\n\nEvery site repo should give the job that builds and checks its site the same name as tooling does: `site`. `check` stays the name of the code check.\n\n## Key changes\n\n- Only the job name changes: check becomes site, and deploy needs site; steps, pinned site actions and npm scripts stay.\n\n## Dependencies and side effects\n\n- Same rename in apps (202a5e9), lernapps.github.io (4aa9c64) and docs (a79ea59); the tooling README follows (3e067bf).\n- A branch protection rule or ruleset that requires the status check check must require site instead.", "reason": "One commit per repo.", "sources": [{"sha": "4aa9c64", "subject": "ci(pages): name the job that builds and checks the site `site`", "date": "2026-10-09T05:03:05+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "docs", "message": "ci(pages): name the job that builds and checks the site `site`\n\n## Intent\n\nEvery site repo should give the job that builds and checks its site the same name as tooling does: `site`. `check` stays the name of the code check.\n\n## Key changes\n\n- Only the job name changes: check becomes site, and deploy needs site; steps, pinned site actions and npm scripts stay.\n\n## Dependencies and side effects\n\n- Same rename in apps (202a5e9), lernapps.github.io (4aa9c64) and docs (a79ea59); the tooling README follows (3e067bf).\n- A branch protection rule or ruleset that requires the status check check must require site instead.", "reason": "One commit per repo.", "sources": [{"sha": "a79ea59", "subject": "ci(pages): name the job that builds and checks the site `site`", "date": "2026-10-09T05:03:05+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "docs(plan): step 1 done; the site job is `site` in the README\n\n## Intent\n\nEvery site repo should give the job that builds and checks its site the same name as tooling does: `site`. `check` stays the name of the code check.\n\n## Key changes\n\n- The plan moves step 1 to Completed, with what changed in review: npm run check builds nothing, the docs site has its own job site, the site actions take check-script.\n- The README names the site repos' jobs site, deploy and preview; the example pages.yml uses site.\n\n## Dependencies and side effects\n\n- Same rename in apps (202a5e9), lernapps.github.io (4aa9c64) and docs (a79ea59); the tooling README follows (3e067bf).", "reason": "The follow-up in tooling, its own pull request.", "sources": [{"sha": "3e067bf", "subject": "docs(plan): step 1 done; the site job is `site` in the README", "date": "2026-10-09T05:05:55+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 4, "misplaced": []}, {"id": "i048", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-09T05:48:30.823Z", "to": "2026-10-09T11:47:00+03:00", "repos": ["tooling"], "commit": "refactor(rules): unique ids per artifact kind, a rule list by id, an agent review instead of cross-checks", "intent": "One rule may stand in a skill to prevent a problem and in a lint rule or check to catch it, under the same id. The id test from step 2 forbade that and cross-checked skills, checks, lint rules and rubric, which needs extra metadata in every artifact. Ids only need to be unique within one deployment unit; whether the artifacts of one id agree is a question for an agent's review, not for a program. The rendered rule page must also be all English.", "decisions": ["ids unique per artifact kind (skills, checks, lint rules, rubric), over one central register that cross-checks them", "drop `enforcement` from the rule block; where a rule acts follows from which artifacts carry its id", "an agent reads all rules grouped by id and only reports drift, gaps and overlaps, instead of a test that blocks", "the CLI decides nothing from rule metadata", "navigation and footer stay German, since they come from the shared site frame of lernapps.net"], "trigger": "\"The id uniqueness and some tooling to list the rules is fine, but I think we don't need additional decision logic about how to run it.\" … \"the same rule may be intentionally included preventive in a skill and validated via linter or cli\" … \"It needs to be unique only in the same deployment unit (e. G. Skills, cli) … have an agent review it.\" … \"Make the small adjustments\" … \"The rendered view has partial German texts (“steht in”). Make sure it's all English.\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i047", "note": "reworks the rule ids and id test of step 2 (#28)"}], "groups": [{"repo": "tooling", "message": "refactor(rules): unique ids per artifact kind, a rule list by id, an agent review instead of cross-checks\n\n## Intent\n\nLet one rule stand in a skill to prevent a problem and in a lint rule or check to catch it, under the same id. The id test forbade this and cross-checked the artifacts, which needs metadata in every artifact. Ids only need to be unique within one deployment unit; whether the artifacts of one id agree is left to an agent's review. The rendered rule page must be all English.\n\n## Key changes\n\n- Ids are unique within each kind of artifact: skills, checks, lint rules and rubric. The checks that every check is declared in a skill, that a declared rule is implemented, and that a rule has only one enforcement are gone. Every message of a check or lint rule still links to its rule.\n- The rule block keeps only `id`, `scope` and `severity`; `enforcement` is gone.\n- `npm run rules` prints every rule grouped by id as YAML, with what each artifact says about it. The rule page shows the same grouping instead of an enforcement column.\n- A new skill, rules-review, has an agent read that list and report wording that drifted, missing skills or checks, rules that could move to a linter, and duplicate ids. It changes nothing.\n- The start page and the rule page of the tooling site are English, labels included.\n- The architecture (rule catalog, the decision on rules in artifacts, glossary, the drift risk, runtime view) and the plan (KD-22) say the same.", "reason": "The squash merge of #30 is one commit on main: the rules rework, the English rule page and the prose fix the architecture review asked for. The commit after it serves another request.", "sources": [{"sha": "51e4c5f", "subject": "refactor(rules): unique ids per artifact kind, rule list by id, agent review instead of cross-checks (#30)", "date": "2026-10-09T11:47:00+03:00", "pr": 30, "plan": false, "moved": []}]}], "messages": 6, "sourceCount": 1, "misplaced": []}, {"id": "i048b", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-09T08:40:12.099Z", "to": "2026-10-09T18:01:09+03:00", "repos": ["app-templates", "tooling"], "commit": "feat: check CLI, shared preset, review procedure and the quiz archetype (plan steps 3, 4, 6, 8)", "intent": "Work through the open issues of the plan for agentic app creation, each by its own agent and branch: the check command, the shared preset with its lint rules and hooks, the review procedure, and the generator with the first archetype. The rule catalog is expected to grow with them: every new check or lint rule gets a rule id, and the same id goes into a skill where an assistant can prevent the problem.", "decisions": ["the check CLI runs whatever exists and decides nothing from rule metadata, over choosing checks by scope or severity", "pages of the built app are visited once without a click, with requests to other hosts recorded and blocked, so the same input gives the same report", "the preset is one line in vite.config.ts that apps never edit, over configuration in each app", "git hooks are scripts in the package installed by the vite-plus dispatcher, so a changed hook reaches every app with a version bump", "the review runs as a prompt for a fresh agent outside CI; CI tests a recorded verdict and calls no model", "the quiz as a deep scaffold: the app holds only its question bank, the engine lives in a package", "the generator copies templates at a commit pinned in the tooling, over following main, so one tooling version always makes the same app", "merge the app-templates pull request first, then move the pin in tooling", "the tests clean up their temporary folders after the disk filled up"], "trigger": "\"Now continue with the other open issues. I'd expect we get more entries in the rules as we create the cli or linter config\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i045", "note": "implements the plan steps that were created as issues there"}, {"type": "continues", "intent": "i048", "note": "new checks and lint rules follow the per-kind rule ids"}], "groups": [{"repo": "tooling", "message": "feat(check): lernapps check runs the checks of the built app and reports in YAML\n\n## Intent\n\nStep 3 of the plan (#12): one check command for hooks, CI and the listing validation. It runs the toolchain steps of a repo and the checks of the built app, also on a built folder or a URL without the repo, checks a catalog entry against its app, and gives one report that people and assistants can act on.\n\n## Key changes\n\n- `lernapps check --pre-commit` runs format, lint and types; `--pre-push` runs unit tests, build, the checks of the built app, a licence check of the dependencies and the Playwright tests. The CLI runs every check whose input exists and decides nothing from rule metadata.\n- Each page reachable from the start page is visited once in Chromium without a click. Requests to other hosts are recorded and blocked, so no check depends on another server.\n- New checks, each with its rule id: no-request-before-click, no-tracking, readable-without-javascript, usable-at-360px, accessible (axe-core), links-resolve, dependency-licence, site-check, entry-links-resolve and entry-fitness-matches. Failed toolchain steps are findings of checks-pass. Skill sections carry the ids where an assistant can prevent the problem; the catalog grows from 20 to 26 rules.\n- A passing run prints one line; otherwise a YAML report with a published JSON Schema. A failed pre-push adds one to prePushFailures in the plan file.\n- The Playwright fixture is served on 127.0.0.1, since localhost resolves to ::1 on the CI runner.\n- The plan marks step 3 done and lists the gaps it left: no in-place suppressions, fitness only before a click, no fetching of external links, licences only in the repo, `--site` given by hand.\n\n## Dependencies and side effects\n\n- yaml and @lernapps/site become dependencies; playwright and axe-core are new.", "reason": "The squash merge of #31 (check CLI) and the plan commit #32 that marks step 3 done follow each other directly on main; the plan commit joins it by rule.", "sources": [{"sha": "b70552b", "subject": "feat(check): lernapps check runs the checks of the built app and reports in YAML (#31)", "date": "2026-10-09T12:30:07+03:00", "pr": 31, "plan": false, "moved": [{"kind": "split", "from": "i048", "why": "The time cut held two unrelated requests: the rules rework and continuing the open issues; this commit serves the second."}]}, {"sha": "3872c21", "subject": "docs(plan): mark step 3 as completed (#32)", "date": "2026-10-09T12:34:49+03:00", "pr": 32, "plan": true, "moved": [{"kind": "split", "from": "i048", "why": "The time cut held two unrelated requests; this plan commit serves continuing the open issues."}]}]}, {"repo": "tooling", "message": "feat(preset): the shared preset, its lint plugin and the git hooks every app extends\n\n## Intent\n\nStep 4 of the plan (#13): what every app imports and never edits. An app that only extends the preset gets every lint rule and both git hooks without configuration of its own, so a rule or hook changed in the package reaches every app with the next version.\n\n## Key changes\n\n- `lernapps()` from @lernapps/tooling/preset is the whole vite-plus configuration: lint with the plugin and each rule's severity, no `any`, type-aware checks, format, unit tests, staged files. An app needs one line in vite.config.ts, a tsconfig.json that extends the package's, and a prepare script.\n- The package brings a Playwright setup (desktop and 360 px), a storage wrapper under the app's prefix, a translator for message files and helpers for assistive technology.\n- The hooks are scripts in the package, installed by the vite-plus dispatcher: pre-commit runs `lernapps check --pre-commit`, pre-push `lernapps check --pre-push`.\n- An Oxlint plugin with one file per rule; every message links to its rule. New rules: storage-through-wrapper, suppression-reason, keep-the-preset and strict-typescript; no-request-before-click and learner-text-german also get lint rules. `any` uses Oxlint's own rule.\n- A fixture app installed from git proves it end to end: a lint error stops the commit, a request to another host stops the push and counts a failure, a clean commit and push pass.\n- The architecture names how the hooks and lint rules are built.\n\n## Dependencies and side effects\n\n- New package exports (preset, tsconfig, playwright, storage, i18n, a11y, lint); vite-plus becomes a peer dependency.", "reason": "The squash merge of #34 (step 4) is one feature of its own; the review procedure after it is a different step, so they stay apart.", "sources": [{"sha": "fc46436", "subject": "feat(preset): the shared preset, its lint plugin and the git hooks every app extends (#34)", "date": "2026-10-09T13:17:36+03:00", "pr": 34, "plan": false, "moved": [{"kind": "split", "from": "i048", "why": "The time cut held two unrelated requests; this commit serves continuing the open issues."}]}]}, {"repo": "tooling", "message": "feat(review): review procedure with prompt, rubric per archetype and verdict schema\n\n## Intent\n\nStep 8 of the plan (#17), the judgment part of the listing validation: an agent in a fresh context reviews an app that asks to be listed, starting from the check report, and writes a verdict bound to the reviewed commit. Every finding names a rule id or proposes a new rule.\n\n## Key changes\n\n- review/prompt.md is the prompt for a fresh agent: clone the app at the commit, build it, run lernapps check, read the report, rules, plan, rubric, bundle and history, judge, write and check verdict.yaml.\n- The rubric has one file for all apps and one per archetype; every item needs its rubric block.\n- New rules with rubric item and skill section: no-learner-data-in-texts, correct-content-support (hint) and one per archetype: topic-has-exercises, start-page-explains, quiz-feedback-explains.\n- The verdict is YAML with a published JSON Schema; it fails exactly when a finding is an error. `npm run verdict` checks a verdict against the schema and the rule catalog.\n- CI calls no model: a verdict recorded by a fresh agent for a fixture app with a planted ad must fail it on no-ads.\n- The architecture gets the review block, the verdict interface, the listing scenario, a decision and a glossary term.", "reason": "The squash merge of #33 (step 8) is one feature; it stays apart from the preset before it and the test cleanup after it.", "sources": [{"sha": "5451782", "subject": "feat(review): review procedure with prompt, rubric per archetype and verdict schema (#33)", "date": "2026-10-09T13:36:54+03:00", "pr": 33, "plan": false, "moved": [{"kind": "split", "from": "i048", "why": "The time cut held two unrelated requests; this commit serves continuing the open issues."}]}]}, {"repo": "tooling", "message": "feat(quiz): lernapps create and the quiz archetype\n\n## Intent\n\nStep 6 of the plan (#15), the first archetype as a deep scaffold: `lernapps create --archetype quiz` plus a question bank gives an app that passes `lernapps check` without further code. The creator's assistant writes only questions and options.\n\n## Key changes\n\n- `lernapps create` copies the archetype's folder from lernapps/app-templates at a commit pinned in package.json, or from a local clone for the tests. It writes AGENTS.md, the plan, a Pages workflow that runs the check, an issue form for content errors, LICENSE and renovate.json. It refuses an unknown archetype and a folder that is not empty.\n- The quiz engine lives in the package: a build step validates src/quiz.json and renders every question into the page, so it reads as a worksheet with an answer key without JavaScript. In the browser it shows one question at a time in a seeded order, with deep links, feedback, score and solutions.\n- The question bank has a published JSON Schema plus checks the schema cannot express; every problem names the question.\n- Generic Playwright tests for any bank give every quiz app tests of its own content.\n- The skill lernapps-quiz has eight rules for the archetype.\n- The pin points at the head of the app-templates branch with the quiz template, until that pull request is merged.\n\n## Dependencies and side effects\n\n- Needs the quiz template in app-templates (78cea92, app-templates#2).\n- CI checks out app-templates at the pinned commit for the generator's tests.", "reason": "The first two commits of the #36 branch follow each other directly: the generator with the quiz archetype, and the pin that points it at the template it was written for.", "sources": [{"sha": "daf6569", "subject": "feat(quiz): lernapps create and the quiz archetype", "date": "2026-10-09T10:41:02+00:00", "pr": null, "plan": false, "moved": [{"kind": "split", "from": "i048", "why": "The time cut held two unrelated requests; this commit serves continuing the open issues."}]}, {"sha": "db0d98e", "subject": "chore(quiz): pin app-templates to the quiz template", "date": "2026-10-09T14:06:31+00:00", "pr": null, "plan": false, "moved": [{"kind": "split", "from": "i048", "why": "The time cut held two unrelated requests; this commit serves continuing the open issues."}]}]}, {"repo": "tooling", "message": "test: remove temporary test folders; mark plan steps 4 and 8 done\n\n## Intent\n\nEvery end-to-end run left fresh clones with node_modules in /tmp. With several agents testing at once, they filled the disk and blocked pushes. The plan must also show steps 4 and 8 as merged.\n\n## Key changes\n\n- Temporary folders live under one root per test file, created on first use and removed after its tests. A full check now leaves no folder behind.\n- The plan marks the shared preset (step 4) and the review procedure (step 8) as done.", "reason": "The squash merge of #35 is one commit on main: the test cleanup that the full disk made necessary, and the plan ticks for steps 4 and 8.", "sources": [{"sha": "be03169", "subject": "Remove test temp directories; mark plan steps 4 and 8 done (#35)", "date": "2026-10-09T17:10:29+03:00", "pr": 35, "plan": false, "moved": [{"kind": "split", "from": "i048", "why": "The time cut held two unrelated requests; this commit serves continuing the open issues."}]}]}, {"repo": "tooling", "message": "test(quiz): the generator test uses the shared temporary folders\n\n## Intent\n\nThe test support now removes every temporary folder of a test file. The generator test should use it instead of keeping its own list.\n\n## Key changes\n\n- Every folder of the generator test, the fresh clone included, comes from tempDir; only the browser and server are closed by the test itself.", "reason": "Follows a merge of main on the #36 branch, so it cannot join the commits before it; the arc42 commit after it is a separate change.", "sources": [{"sha": "d6a364b", "subject": "test(quiz): temporary folders under the shared root of the test file", "date": "2026-10-09T14:12:20+00:00", "pr": null, "plan": false, "moved": [{"kind": "split", "from": "i048", "why": "The time cut held two unrelated requests; this commit serves continuing the open issues."}]}]}, {"repo": "tooling", "message": "docs(arc42): the preset interface says what an archetype adds\n\n## Intent\n\nThe architecture review asks a block and its prose to change together. The interface of the archetype presets changed without saying what an archetype adds.\n\n## Key changes\n\n- One sentence: each archetype adds a preset, a runtime and end-to-end tests, with the quiz as the example.", "reason": "A doc fix the architecture review asked for; unrelated to the test change before it.", "sources": [{"sha": "df68f42", "subject": "docs(arc42): the preset interface explains what an archetype adds", "date": "2026-10-09T14:21:26+00:00", "pr": null, "plan": false, "moved": [{"kind": "split", "from": "i048", "why": "The time cut held two unrelated requests; this commit serves continuing the open issues."}]}]}, {"repo": "app-templates", "message": "feat(quiz): the template of the quiz archetype\n\n## Intent\n\nStep 6 of the plan needs a folder for `lernapps create --archetype quiz` to copy: a working quiz that passes `lernapps check`, in which the app supplies only its question bank.\n\n## Key changes\n\n- Only thin files: vite.config.ts uses the quiz preset of @lernapps/tooling, main.ts starts the engine, the end-to-end test runs the package's generic tests on the app's bank, and index.html holds the marker where the build renders the questions.\n- An example bank in German with one question of each of the six types, so the creator's assistant sees every type.\n- @lernapps/tooling is pinned to a commit with a lockfile, so `npm ci` works in the folder and in a generated app.\n- A workflow checks every template folder with `lernapps check`; the README describes the repo as the templates of the archetypes.\n\n## Dependencies and side effects\n\n- The generator and engine are in tooling (daf6569, db0d98e on the branch of tooling#36).", "reason": "The squash merge of app-templates#2 is one commit, the template side of step 6.", "sources": [{"sha": "78cea92", "subject": "feat(quiz): the template of the quiz archetype (#2)", "date": "2026-10-09T18:01:09+03:00", "pr": 2, "plan": false, "moved": [{"kind": "dropped", "from": "i050", "why": "The quiz template of step 6, merged in the order agreed earlier; i050 only asked how archetypes work and has no commits left."}]}]}], "messages": 6, "sourceCount": 10, "misplaced": []}, {"id": "i049", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-09T14:22:15.096Z", "to": "2026-10-09T17:44:52+03:00", "repos": ["tooling"], "commit": "fix: archetype rules are hints; the test cleanup gets two minutes", "intent": "An app that misses the archetype rules still runs and harms nobody, so such a finding should guide and be reported, not fail the review. Pushes were also slow and failing: the cleanup of the test folders from the previous change timed out on a busy machine and blocked them.", "decisions": ["the three archetype rules become hints instead of errors", "keep pinning a template commit instead of following main, so one tooling version always makes the same app", "give the cleanup hook two minutes instead of the 10 s default"], "trigger": "\"1. I'd lean into hint, as they are still executable apps, though probably not ideal. How are those rules enforced? 2. I'm fine with it, but why do we pin the commit, not ref main?\" … \"The agent seems to have problems to complete the push. Is that a permissions thing?\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i048b", "note": "changes the severity of the archetype rules from the review procedure and fixes the timeout of the test cleanup"}], "groups": [{"repo": "tooling", "message": "fix: archetype rules are hints; the test cleanup gets two minutes\n\n## Intent\n\ntopic-has-exercises, start-page-explains and quiz-feedback-explains judge how well an app teaches. An app that misses them still runs and harms nobody, so a finding should not fail the review. Pushes also failed: removing a test clone's node_modules took longer than the 10 s hook timeout when several test runs shared the machine.\n\n## Key changes\n\n- The three archetype rules have severity hint. The building agent still aims for them and the reviewer still reports them, but they no longer fail a verdict.\n- The hook that removes the temporary test folders may take two minutes.", "reason": "The squash merge of #37 is one commit on main.", "sources": [{"sha": "d3cc3cf", "subject": "Make the archetype rules hints; give the temp cleanup hook two minutes (#37)", "date": "2026-10-09T17:44:52+03:00", "pr": 37, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 1, "misplaced": []}, {"id": "i051", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-09T15:05:32.288Z", "to": "2026-10-09T18:03:08+00:00", "repos": ["app-templates", "tooling"], "commit": "feat(quiz): a knowledge quiz whose runtime is a package in app-templates", "intent": "Quizzes are mostly about things to know, so the example with fraction questions misses the point: every option needs compact background knowledge and every question further reading, and the schema must reflect this. The quiz UI should also be a package from the templates repo that apps depend on, so a new feature like a timer reaches every app by bumping a dependency, without regenerating it.", "decisions": ["the root of app-templates becomes the package @lernapps/app-templates, installed from git at a commit, over one repo per archetype runtime or publishing to npm", "the tooling stays a development dependency and never depends on the runtime", "background knowledge (`info`) on every option replaces per-option feedback, which could contradict it", "texts in own words with Wikipedia only as further-reading links, because copied text would bind the quiz to CC BY-SA", "the schema stays v1, since it was never published", "a natural-wonders example from German Wikipedia, every link and fact checked against its article"], "trigger": "\"The example with math questions is really poor. Quizzes are usually about things to know with some compact background knowledge for each option and further reading links. The schema should reflect this. We might provide a quiz about natural wonders with source German Wikipedia\" … \"UIs for these deep scaffolded templates should scaffold in such a way, that the … components are referenced with package (in the template repository, not in tooling). This way, we can introduce new features like timers without re-generating the app, but only bumping a dependency\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i048b", "note": "reworks the quiz format and moves the engine of step 6 out of tooling"}], "groups": [{"repo": "app-templates", "message": "feat(quiz): the quiz runtime as the package @lernapps/app-templates, a knowledge quiz\n\n## Intent\n\nApps should depend on their archetype's runtime as a package, so a new feature such as a timer reaches an app with a dependency bump. And quizzes are mostly about things to know: every option needs short background knowledge, every question further reading.\n\n## Key changes\n\n- The repo root is the package @lernapps/app-templates, installed from git at a commit, since npm cannot install a subfolder. It exports the quiz engine, the Vite build step, the stylesheet, the generic Playwright tests and the schema, which now names the runtime package.\n- @lernapps/tooling and Playwright are optional peer dependencies, so installing the runtime needs nothing else from GitHub.\n- The template uses the runtime of its own commit and composes it with the shared preset: `lernapps({ plugins: [quiz()] })`.\n- Options have `text`, `correct`, `info` and an optional `link`; questions have an `explanation` and at least one link; the quiz may list `sources`. Per-option feedback is gone.\n- After an answer, and in the answer key without JavaScript, the page shows every option's background with the right option and the learner's choice marked, then the explanation and the links.\n- The example bank \"Naturwunder der Welt\" has eight questions of all six types, written in own words from the German Wikipedia articles it links.\n- The unit tests of the scoring move here with the code.\n\n## Dependencies and side effects\n\n- The tooling removes its copy of the runtime and points the generator at this package (9e0982f and the commits after it on the branch of tooling#36).\n- The template has no lockfile; the app's first install writes it.", "reason": "The two commits of the app-templates#4 branch follow each other directly; the second only corrects the schema's description that the first moved.", "sources": [{"sha": "bcaf577", "subject": "feat(quiz): the quiz runtime as the package @lernapps/app-templates, a knowledge quiz", "date": "2026-10-09T15:21:41+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "3a83657", "subject": "docs(quiz): the schema names the runtime package", "date": "2026-10-09T15:29:39+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "refactor(quiz): the quiz runtime moves to @lernapps/app-templates, a knowledge quiz\n\n## Intent\n\nAn archetype's runtime should be a package the app depends on, in lernapps/app-templates, so a new feature reaches an app with a dependency bump; the tooling stays a development dependency. The quiz becomes a quiz about things to know.\n\n## Key changes\n\n- Engine, build step, stylesheet, generic tests, schema and scoring tests leave the tooling. The tooling never depends on the runtime.\n- The generator points the app's @lernapps/app-templates at the commit it copied the template from, and lists the archetypes it knows with the pin.\n- The schema keeps its URL on the tooling's docs site; the docs build takes it from app-templates at the pinned commit.\n- The skill lernapps-quiz describes the new bank with the natural-wonders example; new rules quiz-further-reading and quiz-own-words (both warnings).\n- The architecture records the decision dec-runtime-package.\n- The generator test checks background, marks, explanation and links after each answer and in the answer key.\n\n## Dependencies and side effects\n\n- Needs the runtime package in app-templates (bcaf577, 3a83657, app-templates#4); the pin moves to the head of that branch.", "reason": "Follows a merge of main on the #36 branch; the commits after it are separate fixes, so it stays alone.", "sources": [{"sha": "9e0982f", "subject": "refactor(quiz): the quiz runtime moves to @lernapps/app-templates, a knowledge quiz", "date": "2026-10-09T15:30:02+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "fix(preset): Playwright serves the app on a free port\n\n## Intent\n\nTwo apps checked at the same time, as in the tooling's own parallel tests, both served on port 4317, and the second run failed.\n\n## Key changes\n\n- The shared Playwright configuration takes a free port when it loads and passes it to its workers; a port set from outside is used as it is.", "reason": "A fix of the shared Playwright setup, unrelated to the move before it.", "sources": [{"sha": "f5b46dd", "subject": "fix(preset): Playwright serves the app on a free port", "date": "2026-10-09T15:41:40+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "test(quiz): browser tests of the generated quiz get a minute\n\n## Intent\n\nA full run of the eight questions took longer than the five-second default on a busy machine.\n\n## Key changes\n\n- One timeout of 60 s for the browser tests of the generated quiz.", "reason": "A test timeout for the longer knowledge quiz; separate from the port fix before it.", "sources": [{"sha": "2544384", "subject": "test(quiz): browser tests of the generated quiz get a minute", "date": "2026-10-09T15:47:31+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "chore(templates): pin app-templates to the merge commit of #4\n\n## Intent\n\nThe generator must copy the template from a commit on main of app-templates, not from a branch head.\n\n## Key changes\n\n- The pin moves to the merge commit of app-templates#4; its files equal the branch head the tests ran against.\n\n## Dependencies and side effects\n\n- Points at the merge of bcaf577 and 3a83657 in app-templates.", "reason": "The pin moves after app-templates#4 is merged, a step of its own.", "sources": [{"sha": "8182538", "subject": "chore(templates): pin app-templates to the merge commit of #4", "date": "2026-10-09T18:03:08+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 6, "misplaced": []}, {"id": "i052", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-09T18:09:51.551Z", "to": "2026-10-09T19:31:28+00:00", "repos": ["tooling"], "commit": "feat(actions): the app check action runs the same check as the hooks", "intent": "Take the next step of the plan: an app's CI as a safety net for pushes without hooks (step 7, #16). As much as possible must be tested deterministically in the local git hooks, and CI must run exactly the same, so a mistake gives the same message in both places.", "decisions": ["the action runs the hooks' command without a flag and adds only the environment, over a CI-only check", "new apps check with app-check and deploy exactly the bundle they checked; site-check stays for the docs sites, over two slightly different checks", "every check run writes its report to one place, so CI uploads it without a CI-only switch", "the generator's tests fetch app-templates at the pin locally instead of being skipped, so a push checks as much as CI", "pages are found without query and fragment, so a random seed link does not change the report"], "trigger": "\"Goldie up with the next step in the plan\" … \"It's crucial that we test as much as possible deterministically local in git hooks and then the same in CI.\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i048b", "note": "step 7 of the plan, built on the check CLI and the generator"}], "groups": [{"repo": "tooling", "message": "fix(check): a link that only changes the query is the same page\n\n## Intent\n\nThe hook and CI must give the same report for the same app. The quiz links to itself with a random seed (\"start again\"), and the check followed that link as a new page, so the report named a random page and changed from run to run.\n\n## Key changes\n\n- Pages are found without query and fragment, since a static host serves the same file for any query. Links are still checked with their query.\n- A fixture app links to itself with a random seed; the test expects one finding on index.html and the same report twice.", "reason": "A bug fix in the check, found while comparing hook and CI; it stands on its own.", "sources": [{"sha": "5ca6146", "subject": "fix(check): a link that only changes the query is the same page", "date": "2026-10-09T19:09:20+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "test(create): the generator's tests fetch app-templates at the pin instead of being skipped\n\n## Intent\n\nCI should run what the hooks run, nothing more. The generator's tests ran in CI, which checked out app-templates, but were skipped in a local push, so a push checked less than CI.\n\n## Key changes\n\n- Without a local clone named, the tests fetch app-templates once at the pinned commit into a cache and use it. Offline and without the cache, they fail with a message that says what to do.\n- CI no longer checks out app-templates; it runs the hooks' command and nothing else.\n\n## Dependencies and side effects\n\n- The tooling's tests need the network once per pinned commit.", "reason": "Closes a gap between push and CI in the tooling's own tests; separate from the action itself.", "sources": [{"sha": "3bab1a0", "subject": "test(create): the generator's tests fetch app-templates at the pin instead of being skipped", "date": "2026-10-09T19:09:36+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "feat(actions): the app check action, the same check as the hooks\n\n## Intent\n\nStep 7 of the plan (#16): an app's CI is a safety net that checks exactly what the hooks check. A mistake the hooks catch fails CI the same way, with the same message, and the report is kept.\n\n## Key changes\n\n- actions/app-check installs the app and runs `lernapps check`, the hooks' command without a flag. Around it there is only the environment: checkout, Node, npm ci and the cached Playwright browser.\n- Every check in a repo writes its report to one place, so the action uploads it, passing or not.\n- The generated Pages workflow uses app-check and deploys the bundle it checked; site-check stays for the docs sites.\n- Tests run the action's check step and the hooks on fixture apps and compare them, ignoring colours and frame style of the linter's output. A workflow runs the real action on a passing and a failing fixture, kept in a folder that is not hidden.\n- README, architecture (dec-app-check-action, dec-one-check-command), skill and plan say the same.\n\n## Dependencies and side effects\n\n- A generated app no longer runs its build script in CI.", "reason": "The action and the two CI fixes it needed follow each other directly on the branch of #38.", "sources": [{"sha": "f0be071", "subject": "feat(actions): the app check action, the same check as the hooks", "date": "2026-10-09T19:09:41+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "ca9051b", "subject": "ci(app-check): the fixture apps in a folder that is not hidden", "date": "2026-10-09T19:15:42+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "cb470e7", "subject": "test(app-check): compare the lint message without colours and frame style", "date": "2026-10-09T19:31:28+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i053", "why": "A test fix on the branch of #38 (step 7) that serves the app check action."}]}]}], "messages": 2, "sourceCount": 5, "misplaced": []}, {"id": "i053", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-09T19:25:45.526Z", "to": "2026-10-09T20:10:00+00:00", "repos": ["apps"], "commit": "feat(listing): validate listing pull requests and comment the report", "intent": "Go on with the next step of the plan, the listing validation of the catalog (step 9, apps#3), as part of closing the full circle with the quiz archetype before validating and tuning it. A listing pull request must be checked against the deployed app, and the creator's assistant must get one comment it can act on.", "decisions": ["close the circle with the quiz first (listing validation, creator entry point, a first full run, evals) and only then build the other archetypes", "a real repo lernapps/naturwunder-quiz for the first full run, left empty so the run starts from nothing", "the listing command is the same locally and in CI, run against a fixture app served on 127.0.0.1", "the comment workflow runs from main and renders the report as data, so a pull request's code never posts it", "fitness.checked may be true only while the check passes"], "trigger": "\"Continue. When done, check the plan for the next task.\" … \"We want to provide a full circle and then validate and tune\" … \"I created empty lernapps/naturwunder-quiz\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i048b", "note": "step 9 of the plan, built on the check CLI and its --entry option"}], "groups": [{"repo": "apps", "message": "feat(listing): validate listing pull requests and comment the report\n\n## Intent\n\nStep 9 of the plan (apps#3): a pull request that adds or changes a catalog entry is checked against the deployed app. The creator's assistant gets one comment per pull request that names each finding and its fix, and can run the same check locally.\n\n## Key changes\n\n- `npm run listing -- entries/<id>.yaml` runs `lernapps check --entry` of @lernapps/tooling for each entry, adds the catalog's rule that fitness.checked may be true only while the check passes, writes the reports and prints the results comment.\n- CI runs the same command read-only and without secrets. A second workflow runs from main, renders the comment from the reports as data and keeps one comment per pull request up to date, also once the check passes.\n- llms.txt points assistants to the command and the comment; the tests run in the Pages workflow.\n- End-to-end tests run the command on fixture entries against a fixture app on 127.0.0.1: a broken topic link fails with the fix, the fixed entry passes, a wrong storage value and checked: true on a failing check fail, an unreachable app fails, and a hostile report renders as plain text.\n\n## Dependencies and side effects\n\n- @lernapps/tooling becomes a development dependency, pinned to a commit of its main.", "reason": "The test-first commit and the feature it tests follow each other directly on the branch of apps#3; together one feature.", "sources": [{"sha": "8f1cd1c", "subject": "test(listing): a listing pull request as the creator's assistant meets it", "date": "2026-10-09T20:10:00+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "c8dab99", "subject": "feat(listing): validate listing pull requests and comment the report", "date": "2026-10-09T20:10:00+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 3, "sourceCount": 2, "misplaced": []}, {"id": "i054", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-10T19:00:38.970Z", "to": "2026-10-11T06:04:47+00:00", "repos": ["docs", "tooling"], "commit": "docs: publishing actions, distribution, scaffolding with npx from git, llms.txt", "intent": "Follow up on a merge that came too quickly. The site check had no building block and no clear purpose; the deployment view repeated the building blocks instead of describing distribution; the skill assumed an npm package and a globally installed CLI that agents cannot count on, and did not say how to scaffold; and the skill repeated the workflow of the plan template, which invites drift. Agents should also find their way through llms.txt files that point to the skill and the basic paths.", "decisions": ["scaffold with `npx --yes github:lernapps/tooling#main create`, since no npm package can be published now; npm publishing stays the better option for later", "#main is acceptable for scaffolding, because the generator pins templates, runtime and tooling itself", "the generated app pins the tooling commit npx ran from, not the template's older commit", "the plan template is the one source of the workflow; the skill and AGENTS.md only point to it", "chapter 7 describes distribution and updates and links the building blocks instead of describing them again"], "trigger": "\"I merged it, but that was too quick and we should follow up before proceeding - the part with the site check is not understandable … the deployment repeats the building blocks … there is no such package on npmjs … the skill repeats the workflow … it might be good to provide LLM.txt in the root docs and the /tooling\" … \"I can't create a new npm package for now (no cli access). Thus, we should explain how to scaffold in the skill\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i052", "note": "shortens the decision dec-app-check-action and fixes the tooling commit new apps depend on"}, {"type": "revises", "intent": "i048b", "note": "the skill and AGENTS.md stop repeating the workflow; the generator runs through npx"}], "groups": [{"repo": "tooling", "message": "docs: publishing actions block, distribution in chapter 7, scaffolding with npx from git\n\n## Intent\n\nThe site actions had no building block and no clear purpose, the deployment view repeated the building blocks, and the skill assumed a CLI installed globally from npm that agents cannot count on. The skill also repeated the plan template's workflow. Agents should be able to scaffold an app reliably and find their way from llms.txt.\n\n## Key changes\n\n- New apps are created with `npx --yes github:lernapps/tooling#main create --archetype <archetype>`. The app depends on the tooling commit npx installed, and its Pages workflow uses the actions of that commit; before, it took an older commit without the app check action.\n- A test creates the app with npx from a local clone, so this path keeps working.\n- The plan template names the create command and the next steps and is the one source of the workflow; AGENTS.md and the skill point to it.\n- The architecture gets a building block for the publishing actions, a shorter dec-app-check-action, and a chapter 7 about which part arrives where, at which commit, and how updates come.\n- lernapps.net/tooling/llms.txt lists commands, guidance, skills, rules, schemas, the review procedure and the archetypes; the README follows.\n\n## Dependencies and side effects\n\n- The docs site gets its own llms.txt in the same round (6ecfeb7 in docs).", "reason": "The one commit of tooling#44 for these review points; the commits after it serve the next request.", "sources": [{"sha": "66a04cc", "subject": "docs: publishing actions block, chapter 7 on distribution, scaffolding with npx from git", "date": "2026-10-11T06:04:47+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "docs", "message": "feat(site): llms.txt for AI assistants: build, list and check an app\n\n## Intent\n\nAssistants should navigate the platform themselves: what lernapps.net is, and where to go to build, list or check an app.\n\n## Key changes\n\n- A new llms.txt says what lernapps.net is and, per path, links what an assistant needs: the plan template, the skill, AGENTS.md, the scaffolding command, the rule catalog, the entry schema and the listing guide.\n- The build publishes it and the index page links it.\n\n## Dependencies and side effects\n\n- The tooling's llms.txt and the scaffolding command come with 66a04cc in tooling.", "reason": "The first commit of docs#17; the commit after it reworks the file for the next request.", "sources": [{"sha": "6ecfeb7", "subject": "feat(site): llms.txt for AI assistants: build, list and check an app", "date": "2026-10-11T05:59:20+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i055", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-11T06:32:01.881Z", "to": "2026-10-11T07:14:32+00:00", "repos": ["tooling"], "commit": "feat(app-publish): publish an app to its repo's GitHub Pages, checking the setup", "intent": "Each app lives at its developer's own hosting; lernapps.net only links to it. As a simple default, lernapps provides an action that deploys to GitHub Pages, deployed to the developer's GitHub Actions. Since review environments should follow, the action must make sure a gh-pages branch exists and Pages is set up properly, or explain what is wrong. The assistant must watch that action after a merge to main.", "decisions": ["decision dec-app-own-hosting: apps live at the developer's hosting, over deploying them through the apps repo", "a building block \"App publish\" for apps, with the site actions of lernapps.net kept apart so the app path reads on its own", "the developer's GitHub Actions is the deployment node of app check and app publish", "the action configures Pages itself when its token may, else fails with what is wrong, the clicks and why", "the checks live in a script tested against a fake GitHub API; the action is a thin wrapper", "after the deploy, wait until the address serves this commit's bundle"], "trigger": "\"we should have the developer's GitHub actions as deployment unit and make clear that the building block for the site publish (i would probably name it app publish) is deployed to it. The arch decision is that each app lives at the developers hosting, we provide an action to deploy to gh pages as simple default … the action should verify that there's a gh-pages branch and that it's configured properly … And the agend should be instructed to watch the action after merge to main\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i054", "note": "replaces the publishing actions block and dec-app-check-action with App publish and dec-app-own-hosting"}], "groups": [{"repo": "tooling", "message": "feat(app-publish): publish an app to its repo's GitHub Pages, checking the setup\n\n## Intent\n\nEach app lives at its developer's own hosting, and lernapps.net only links to it. The simple default is an action that deploys to the app repo's GitHub Pages. Later review environments need a gh-pages branch that Pages serves, so the action must ensure that setup or explain what is wrong.\n\n## Key changes\n\n- actions/app-publish wraps a script. Before the deploy it checks that gh-pages exists and that Pages serves it from its root; it sets this through the API when the token may, else it fails with what is wrong, the clicks in Settings, why, and the rule link. After the deploy it waits until the address serves this commit and prints it.\n- The generated Pages workflow uses app-publish instead of site-deploy; the skill lernapps-app gets the rule pages-from-gh-pages.\n- Tests run the script against a fake GitHub API and Pages; a workflow runs the check against this repo's real API.\n- The architecture records dec-app-own-hosting, replaces the publishing actions block with \"App publish\", and makes the developer's GitHub Actions the deployment node.\n- The plan template says: push a branch, merge after the checkpoint, watch the publish run, confirm the address.", "reason": "The app publish action is one feature; the arc42 fix after it answers the architecture review, so it stays apart.", "sources": [{"sha": "165315e", "subject": "feat(app-publish): publish an app to its repo's GitHub Pages, checking the setup", "date": "2026-10-11T06:46:03+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "docs(arc42): blocks change with their prose; site actions out of scope\n\n## Intent\n\nThe architecture review asks every block and the prose that explains it to change together. After the move to npx and App publish, several blocks no longer matched their prose.\n\n## Key changes\n\n- The generator's technology names npx from GitHub; the app check and app publish blocks name their paths; the new-app scenario names the npx scaffold and the publish step.\n- The site actions are marked as outside the app tooling.", "reason": "Answers the warnings of the architecture review on the same pull request; kept apart from the feature.", "sources": [{"sha": "62f8d49", "subject": "docs(arc42): blocks change with their prose; site actions out of scope", "date": "2026-10-11T07:00:38+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "docs(arc42): a small block for the site actions; deployment nodes match their prose\n\n## Intent\n\nThe architecture review still warned: the actions that build and publish the lernapps.net sites belonged to no building block, and some deployment nodes did not match their prose.\n\n## Key changes\n\n- A small block for the site actions (site check, site deploy, site preview), used by the lernapps.net sites and not by apps, instead of leaving them out of scope.\n- The creator's machine also hosts the runtime of app-templates; the agents' environment also runs the generator for evals.", "reason": "A later answer to the same review; it follows a commit of another intent, so it is its own commit.", "sources": [{"sha": "b0264b4", "subject": "docs(arc42): a small block for the site actions; deployment nodes match their prose", "date": "2026-10-11T07:14:32+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i056", "why": "Fixes the architecture review warnings that App publish caused on tooling#44, not the llms.txt request."}]}]}], "messages": 1, "sourceCount": 3, "misplaced": []}, {"id": "i056", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-11T07:02:46.472Z", "to": "2026-10-11T07:10:27+00:00", "repos": ["apps", "docs", "lernapps.github.io", "tooling"], "commit": "docs(llms): a network of llms.txt files that link each other", "intent": "Assistants should find their way from any llms.txt. The docs file should explain how to navigate the docs, including the biz42 and pdt42 CLIs; the root file should give the vision and overview; the tooling file should cover building. Every file links the others, and the root and tooling files lead straight to the skill as a quick path.", "decisions": ["four files with one job each: root (vision and paths), docs (navigation and model queries), tooling (building), apps (listing)", "each file keeps its language, so the root stays German", "the apps file only gains cross-links, so it merges cleanly with the paused listing branch", "the CLI commands in the docs file are run in a fresh clone before they are written down"], "trigger": "\"The docs llm.txt should explain how to navigate the docs (including the biz42 and the Pdt42 cli). It should also link the root llm.txt exposing the vision and overall write and the tooling llm.txt for building. All of the others should cross reference too. From root and from tooling, the skill should be directly referenced as quick path\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i054", "note": "extends the first llms.txt files into a linked network"}], "groups": [{"repo": "lernapps.github.io", "message": "feat(llms): the root of the llms.txt network: vision, paths, quick path, links\n\n## Intent\n\nlernapps.net/llms.txt is where an assistant starts. It should give the vision and overview and lead straight to building an app.\n\n## Key changes\n\n- The file says what lernapps.net is and why, and gives three paths: find, build and list an app.\n- A quick path links the skill lernapps-app, installed with `npx skills add lernapps/tooling`, and the plan template. The skill holds the rules; the plan template holds the workflow.\n- One line each links the llms.txt of docs, tooling and apps. The app list stays.\n\n## Dependencies and side effects\n\n- The ot
