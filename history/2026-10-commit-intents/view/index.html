en anderen Typen ist Lesbarkeit bei nojs ein Ziel, da sie sehr textlastig sind\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i110", "note": "moves the interactive architecture to a generic one with extensions"}], "groups": [{"repo": "app-templates", "message": "docs: one architecture for every archetype, generic at the repo root with an extension per archetype\n\n## Intent\n\nThe quiz and the explainer have the same quality goals as interactive apps, so they follow the same architecture. They stay archetypes of their own and extend the generic architecture, as interactive apps do. Being text-heavy, they must also be readable without JavaScript.\n\n## Key changes\n\n- The generic architecture of every lernapps app lives in docs/arc42/: the frame (static description, page trees, 404 page, build checks, shell, end-to-end tests, tooling helpers) with its optional parts (tutor handoff, task numbers, exercise contract, settings, loading indicator) and an abstract archetype part.\n- quiz/, explainer/ and interactive/ each get an extension with only the blocks, interfaces, decisions, risks and terms their archetype adds.\n- Readable without JavaScript is a quality goal of the quiz and the explainer.\n- Each combination of the generic part and one extension validates without errors or warnings.\n- The root README points to both parts and says which sub-block does what in each archetype; docs/ is on the pre-push hook's root-only list.", "reason": "The only commit of this request.", "sources": [{"sha": "61e411f", "subject": "docs: one architecture for every archetype, generic at the repo root with an extension per archetype", "date": "2026-10-16T21:21:09+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 4, "sourceCount": 1, "misplaced": []}, {"id": "i112", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-16T21:27:24.136Z", "to": "2026-10-16T21:54:53+00:00", "repos": ["app-templates"], "commit": "docs(arc42): strict architecture for every archetype, gated in pre-commit and CI", "intent": "Take the validator's findings seriously: every combination of the generic architecture and an extension must pass without errors, warnings or hints, and a commit must fail when it does not. Input to an app is more than keys and mouse. Paths should be maintained statically and relative; template blocks belong to the app and have no path here.", "decisions": ["a typed, extensible input for step(state, input), over keys as input", "strict: 0 errors, 0 warnings, 0 hints, fixing the model over silencing findings", "static relative paths from the repo root, over paths with placeholders", "template blocks without a path, each with an ignore and its reason", "arc42 validate --strict in the pre-commit hook and a CI job, with @doctc/arc42 pinned"], "trigger": "\"Es wird auch interaktiver als mit Maus geben. Die Pfade sollten wir dich aber pflegen können (Platzhalter). Bin dir hinter Ernst! Pre commit —strict!\" … \"Wieso brauchen wir Pfade mit Platzhaltern? Die Ketten Ordner haben statisch Platz, mit relativen Pfaden.\" … \"Wir können die Template Pfade weg lassen und mit ignore begründen\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i111", "note": "makes the generic architecture and its extensions strict"}], "groups": [{"repo": "app-templates", "message": "docs(arc42): strict architecture for every archetype, gated in pre-commit and CI\n\n## Intent\n\nEvery combination of the generic architecture and an extension must pass the validator without errors, warnings or hints, and a commit must fail when it does not. Input to an app is more than keys and mouse. Paths should be static and relative; template blocks belong to the app.\n\n## Key changes\n\n- The core's step(state, input) takes a typed, extensible input, which replaces keys as input. That the runtime still passes only keys is recorded as a risk.\n- The model is restructured for 0 errors, 0 warnings and 0 hints per combination: generic roots for runtime and tooling, and each extension defines its own archetype runtime with its parts and the creator's parts.\n- Runtime blocks carry static paths from the repo root. Template blocks and the untracked tooling carry no path, each with a documented ignore.\n- A script validates the generic part plus one extension per archetype with arc42 validate --strict. The pre-commit hook runs it for staged arc42 files, and a CI job architecture runs it on every change.\n- @doctc/arc42 0.36.1 is pinned as a devDependency.\n\n## Dependencies and side effects\n\n- arc42 cannot resolve paths into node_modules or extend a workspace; the script merges an extension's chapters into the generic ones to work around this.", "reason": "The only commit of this request.", "sources": [{"sha": "77e9789", "subject": "docs(arc42): strict architecture for every archetype, gated in pre-commit and CI", "date": "2026-10-16T21:54:53+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 4, "sourceCount": 1, "misplaced": []}, {"id": "i113", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-16T22:02:35.115Z", "to": "2026-10-16T22:03:23+00:00", "repos": ["app-templates"], "commit": "docs(arc42): the explainer keeps a fixed size per component, its figure an implementation detail", "intent": "Dropping the size limit applies to interactive apps only. The explainer should keep a fixed size per component, because text-heavy pages must load fast; the actual figure of 20 kB is an implementation detail and does not belong in the architecture.", "decisions": ["a fixed size per explainer component, over dropping the limit for every archetype", "the architecture names no figure; the build check holds it", "the generic frame limits no app's size, while an archetype may limit its own parts"], "trigger": "\"In exoplanet [Explainer] soll das bei einer fixen Größe bleiben. 20kb sind ein Implementierungsdetail\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i110", "note": "narrows \"no size limit\" to the interactive archetype"}], "groups": [{"repo": "app-templates", "message": "docs(arc42): the explainer keeps a fixed size per component, its figure an implementation detail\n\n## Intent\n\nDropping the size limit applies to interactive apps only. Text-heavy explainer pages must load fast, so each component keeps a fixed size. The figure itself is an implementation detail of the build check.\n\n## Key changes\n\n- A new explainer decision sets a fixed size per component, without naming the figure.\n- The generic frame limits no app's size; an archetype may limit its own parts.\n- Only the size budget of the interactive runtime stays recorded as technical debt.\n- The evidence file records the decision.", "reason": "The only commit of this request.", "sources": [{"sha": "29c9b65", "subject": "docs(arc42): the explainer keeps a fixed size per component, its figure an implementation detail", "date": "2026-10-16T22:03:23+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i114", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-16T22:03:54.849Z", "to": "2026-10-16T22:30:09+00:00", "repos": ["app-templates", "tooling"], "commit": "feat(skills): lernapps-interactive, the principles of an interactive app", "intent": "Provide the skill with the development principles of an interactive app, including low stimulation, before the archetype exists in the tooling. The skills are the interface the creator's agent uses, so the architecture should name them as one building block: the parent folder of every skill. Concrete recipes for kinds of apps are too specific for the skill. The tooling's arc42 cannot express paths into installed dependencies, which should be reported upstream.", "decisions": ["general principles only, over recipes for real-time games, round-based games and text work with three examples", "low stimulation as advice with reasons, not a rule", "an honest list of what is not built yet, so no agent relies on it", "the skills folder as one building block with the interface if-skills, over one block per skill", "readable without JavaScript gets high priority in the quiz and the explainer", "report the path limit of arc42 upstream (docToolchain/arc42-language#128)"], "trigger": "\"Das ist für den mehr der Pfade kannst du aufmachen\" … \"Den soll für Prinzipien der Entwicklung kannst (inkl. Reizarmut) kannst du schon mal bereit stellen und skills als übergeordneten Ordner für das building skills interface aufnehmen\" … \"Passt\" … \"Rezepte für Echtzeitspiel, Rundenspiel und Textarbeit, mit deinen drei Beispielen. Das ist zu konkret. Das kann weg\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i106", "note": "low stimulation as advice in the skill, as decided"}, {"type": "continues", "intent": "i112", "note": "the skills block in the strict architecture"}], "groups": [{"repo": "tooling", "message": "feat(skills): lernapps-interactive, the principles of an interactive app\n\n## Intent\n\nProvide the development principles of an interactive app, including low stimulation, before the archetype exists in the tooling. The skill stays general: concrete recipes for kinds of apps are too specific.\n\n## Key changes\n\n- A new skill lernapps-interactive: when to choose an interactive app over an explainer or a quiz.\n- The principles of its code: a pure deterministic core under a runtime that owns state and clock, typed inputs, components that only show the state, data apart, playthroughs as proof, small storage, no request before a click, accessibility by default with declared limits, and the app's arc42 part kept current.\n- Low stimulation as advice with reasons: no flashing, calm motion, sound off by default.\n- A list of what is not built yet.\n- Three rule ids for what the runtime's build already checks and names in its messages: interactive-app-valid, interactive-core-contract, interactive-playthroughs-pass.\n- llms.txt lists the skill.\n\n## Dependencies and side effects\n\n- The generic architecture of app-templates names the skills as a building block (9bcda8e, same intent).", "reason": "The skill of tooling#90; the next commit on its branch answers a later message (i115).", "sources": [{"sha": "7a90053", "subject": "feat(skills): lernapps-interactive, the principles of an interactive app", "date": "2026-10-16T22:16:29+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "docs(arc42): the skills as a building block, low stimulation as their advice\n\n## Intent\n\nThe skills are the interface the creator's agent uses. The architecture should name them as one building block, the parent folder of every skill, and say which concept they carry. Readable without JavaScript matters most in the text-heavy quiz and explainer.\n\n## Key changes\n\n- The skills are the block bb-skills, provider of if-skills: committed in each app under .agents/skills, installed and replaced by lernapps update, sourced from the tooling's skills folder.\n- The concept of low stimulation is back, implemented by the skills. The risk of a missing interactive skill points to tooling#90 and ends with its merge. No recipes in the skill.\n- Readable without JavaScript is a high-priority goal of the quiz and the explainer.\n- The validation script moves an extension's marked ignore directives to the top of the combined chapter.\n\n## Dependencies and side effects\n\n- The skill itself comes with tooling#90 (7a90053, same intent).", "reason": "The last commit of app-templates#34; it follows 29c9b65 of another intent.", "sources": [{"sha": "9bcda8e", "subject": "docs(arc42): the skills as a building block, low stimulation as their advice", "date": "2026-10-16T22:30:09+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i115", "why": "Adds the skills building block and the high priority of no-JS readability asked for in i114 (\"skills als übergeordneten Ordner … aufnehmen\", \"Passt\")."}]}]}], "messages": 4, "sourceCount": 2, "misplaced": []}, {"id": "i115", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-16T22:20:27.746Z", "to": "2026-10-16T22:45:10+00:00", "repos": ["app-templates", "apps", "tooling"], "commit": "feat(interactive): typed inputs, time steps, libraries, declared limits and a storage quota", "intent": "With the architecture settled, build the content of the interactive archetype that does not wait for the tooling: input beyond keys, playthroughs that replay time, no size limit, libraries an app may bundle, declared accessibility limits in the catalog entry and a storage quota per app. The architecture is the agent's concern: it keeps it current and validated, with no checkpoint for the creator.", "decisions": ["no architecture checkpoint with the creator; the agent updates the architecture and arc42 validates it, over a user-facing checkpoint", "typed inputs { kind: key } or { kind: action }, extensible, over keys only", "time steps of n ticks in playthroughs, at build and in the browser through a test clock", "no size limit for an interactive app's own code", "bare imports of the app's dependencies allowed in interactive components; URL imports, network APIs, eval and v-html stay forbidden", "an optional limits field in the entry turns accessible and usable-at-360px into warnings", "a storage quota of 100 kB per app, save returns false beyond it"], "trigger": "\"Wie weit ist der Agent? Können wir schon mal mit dem eigentlichen Inhalt des archetypes weiter machen? Ich bin zuversichtlich, dass die grundlegende Architektur nun passt\" … \"Ich weiß nicht, on wir eine. Checkpoints Architektur brauchen. Solange wir die Architektur anpassen und dann auch validieren, reicht das. Das muss nicht user facing sein\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i107", "note": "extends the interactive runtime"}, {"type": "continues", "intent": "i106", "note": "builds the limits field and the storage quota decided there"}], "groups": [{"repo": "tooling", "message": "docs(skills): the agent keeps the interactive app's architecture current, no creator checkpoint\n\n## Intent\n\nThe architecture is the agent's concern. As long as it is updated and validated, the creator needs no checkpoint for it.\n\n## Key changes\n\n- The skill lernapps-interactive says the agent updates the app's architecture with every change and validates it, without a checkpoint with the creator.", "reason": "A skill change on the branch of tooling#90, after the skill commit of i114.", "sources": [{"sha": "d2a8a9c", "subject": "docs(skills): the agent keeps the interactive app's architecture current, no creator checkpoint", "date": "2026-10-16T22:24:07+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "feat(check,storage): warnings for declared limits; storage quota of 100 kB\n\n## Intent\n\nWCAG 2.1 AA and 360 px are rules of the platform; an app may deviate where its idea needs it and says so in its catalog entry. All apps share the origin's localStorage, so no app may take more than a small share.\n\n## Key changes\n\n- When the entry passed to lernapps check --entry has the field limits, the findings of accessible and usable-at-360px are warnings; without it they stay errors. The site checks are unchanged.\n- save of the storage wrapper refuses and returns false when the app's values would take more than 100 kB (2 bytes per UTF-16 code unit of keys and values). The old value stays, and the app keeps working as with blocked storage.\n- Skill texts, rule descriptions and the concepts of the architecture say so.\n\n## Dependencies and side effects\n\n- The field limits comes with lernapps/apps#35 (ac4eb1e, same intent). The warnings take effect in the catalog once lernapps/apps pins this tooling version.", "reason": "tooling#93 on its own branch.", "sources": [{"sha": "898b51c", "subject": "feat(check,storage): warnings for declared limits; storage quota of 100 kB", "date": "2026-10-16T22:30:00+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "feat(entry): add optional limits field, shown on the app's page\n\n## Intent\n\nAn app follows WCAG 2.1 AA and works at 360 px by default, but may deviate where its idea needs it. It must say so where creators and teachers look: in its catalog entry.\n\n## Key changes\n\n- The entry has an optional field limits, in plain German: what the app does not offer.\n- The app's page shows it in the fitness panel as \"Das bietet die App nicht: …\".\n- Existing entries stay valid.\n- The test renders the fitness macro with nunjucks, now a direct dev dependency.\n\n## Dependencies and side effects\n\n- lernapps check reads the field to report those rules as warnings (898b51c, same intent).", "reason": "lernapps/apps#35, the only apps commit.", "sources": [{"sha": "ac4eb1e", "subject": "feat(entry): add optional limits field, shown on the app's page", "date": "2026-10-16T22:24:13+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "feat(interactive): typed inputs, time steps in playthroughs, no size limit\n\n## Intent\n\nInteractive apps need input beyond keys, and their timing must be replayable, so that a playthrough proves what a timed game does. Their size should not be limited.\n\n## Key changes\n\n- step(state, input) takes a typed input: a key, or an action with a name and an optional value, extensible by new kinds. The root component emits such inputs.\n- A playthrough step has keys (short form) or inputs, then ticks. The build calls tick n times; the browser player steps the runtime's tick through a test clock.\n- The template's playthrough lets a letter go late and uses the button's action \"again\".\n- The build no longer limits the size of an app's own code.", "reason": "The first runtime commit, on its own branch beside app-templates#34.", "sources": [{"sha": "3910114", "subject": "feat(interactive): typed inputs, time steps in playthroughs, no size limit", "date": "2026-10-16T22:37:18+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "feat(interactive): components may import the libraries in the app's dependencies\n\n## Intent\n\nAn interactive app may use libraries, for example for a canvas game, as long as they are bundled. The architecture must follow the runtime's changes.\n\n## Key changes\n\n- The interactive scope of the component rules accepts bare imports of the packages in the app's dependencies, which the build bundles. URL imports, network APIs, eval, innerHTML and v-html stay forbidden; the explainer's scope is unchanged.\n- The architecture follows: typed inputs, time steps and the tests' clock, no size budget, and a decision for libraries. The risks of keys-only input, time not replayed, the size budget and the missing skill are gone.", "reason": "Follows a merge, not the commit before it.", "sources": [{"sha": "450a006", "subject": "feat(interactive): components may import the libraries in the app's dependencies", "date": "2026-10-16T22:45:10+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 5, "misplaced": []}, {"id": "i116", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-17T05:53:33.725Z", "to": "2026-10-17T07:52:27+00:00", "repos": ["app-templates", "tooling"], "commit": "feat: the archetype interactive, with the architecture copied into the app and checked by arc42", "intent": "Build step 2 of the interactive archetype: lernapps create makes an interactive app whose architecture comes from app-templates and is checked before every commit and in the full check. To copy the generic architecture and the interactive extension mechanically, the template blocks must carry their real path in app-templates, which the tooling strips to the app's path, instead of an ignore without a path. A fresh app must pass lernapps check before anything is added to git.", "decisions": ["create and update copy the generic part and the extension into the app as a reference that update replaces; the app's own part lives beside it", "runtime paths become ignores in the app with the reason \"installed package\" (arc42-language#128); template paths lose their prefix", "template blocks carry their path with the template prefix in app-templates, over the ignore introduced just before", "quiz and explainer apps get no architecture and no check", "@doctc/arc42 only in interactive apps' devDependencies, over a dependency of the tooling that every quiz app would carry (165 MB)", "arc42 diff --staged --strict before a commit and validate --strict in the full check, over a full validation on every commit", "the full check validates on a temporary copy of the git index with untracked files added as intent to add, over asking the creator to run git add first"], "trigger": "\"Das passt\" (to the proposal for how the architecture gets into an interactive app)", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i112", "note": "template blocks get their path back instead of an ignore"}], "groups": [{"repo": "app-templates", "message": "docs(arc42): template blocks carry their path with the template prefix\n\n## Intent\n\nThe tooling will copy the generic architecture and the interactive extension into an interactive app and rewrite their paths mechanically. For that, the template blocks need their real path in this repo, which the tooling strips to the app's path.\n\n## Key changes\n\n- The blocks and interfaces of the template folders name their path in this repo (interactive/src/core, quiz/src/quiz.json, explainer/src/app.yaml) instead of an ignore; the paths exist here and validate.\n- The templates' entries, type declarations and the explainer's example chapter are left out of the coverage. The interactive template's own ignore file, which an app gets, also leaves out src/main.ts.\n- The explainer's optional parts, which the template does not contain, keep their ignore with a reason that says so.\n- Every combination still validates without a finding.\n\n## Dependencies and side effects\n\n- lernapps/tooling c6e8015 (same intent) pins this commit and copies the chapters into interactive apps.", "reason": "The only commit of app-templates#43.", "sources": [{"sha": "0d6eece", "subject": "docs(arc42): template blocks carry their path with the template prefix", "date": "2026-10-17T06:00:19+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "feat: the archetype interactive, its architecture copied into the app and checked by arc42\n\n## Intent\n\nCreators should get an interactive app from lernapps create, as they do a quiz or an explainer. Its architecture should come from app-templates and stay current: update replaces the copied part, and arc42 stops a commit whose code the architecture does not explain.\n\n## Key changes\n\n- lernapps create --archetype interactive makes an app on which npm install and npx lernapps check pass. The tooling pins app-templates at the commit with the interactive template.\n- An interactive app gets docs/arc42/ with the generic part and the interactive extension combined into twelve chapters. Runtime paths become ignores with the reason \"installed package\" (docToolchain/arc42-language#128); template paths lose their prefix.\n- The app's own architecture goes between the markers <!-- app: begin … --> and <!-- app: end … -->. Update replaces everything else, keeps these sections as they are, and writes nothing when a section with content would lose its place.\n- Quiz and explainer apps get no architecture and no arc42. Only interactive apps get @doctc/arc42, TypeScript and vue-tsc as devDependencies, because arc42 is 165 MB.\n- Before a commit that touches the architecture, .arc42ignore or src/, the hook runs arc42 diff --staged --strict (validate before the first commit). The full check runs arc42 validate --strict.\n- The component rules (no network, no HTML injection, imports, browser globals) also apply to interactive apps. The rule vue-component-imports accepts the template's own imports in an interactive app.\n- The skill lernapps-interactive describes the runtime as built: typed inputs, ticks, libraries, no size limit, the storage quota, declared limits and the architecture with its app sections and check. New rule and rubric item interactive-architecture-current.\n- The plan records steps 1 and 2 as done; the next step is the first full run with a pilot app.\n\n## Dependencies and side effects\n\n- Needs lernapps/app-templates 0d6eece (template blocks carry their path, same intent) and 2baaf45 (the empty app sections).\n- A fresh app fails lernapps check until its files are added to git; 66f57a6 (same intent) fixes that.", "reason": "The only commit of tooling#96; the next commit of this intent, 66f57a6, follows a merge.", "sources": [{"sha": "c6e8015", "subject": "feat: the archetype interactive, its architecture copied with app sections and gated by arc42", "date": "2026-10-17T06:58:48+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i118", "why": "It is step 2 of the interactive archetype, which this intent's request started; the time cut put it after the next message because the agent finished later."}]}]}, {"repo": "tooling", "message": "fix(check): validate the architecture of the working tree, untracked files included\n\n## Intent\n\nA freshly created interactive app failed lernapps check with E011 for every implementation path. arc42 resolves paths only from the files git tracks (docToolchain/arc42-language#128), and nothing is in git after git init. The entry-point e2e test of lernapps/apps (PR #42) failed for this reason. Outside a repository, arc42 took docs/arc42 as the root and failed the same way. A creator should not have to run git add before the check.\n\n## Key changes\n\n- The full check runs arc42 validate --strict on a temporary copy of the git index, with every untracked, not ignored file of the app added as intent to add. The real index stays as it is, and no file content goes into git.\n- Outside a repository, the check passes --root ., so arc42 lists the files of the app's folder.\n- The pre-commit step still reads the staged state, because that is what the commit contains. Its fix text says to stage the files that belong to the commit; the full check no longer says \"git add new files first\". The skill lernapps-interactive says the same.\n- The interactive e2e test checks the fresh app with nothing in git and that the index stays empty.\n\n## Dependencies and side effects\n\n- Fixes c6e8015 (same intent). lernapps/apps PR #42 passes again once this is on main.", "reason": "A separate fix after the merge of tooling#97; its parent is a merge commit.", "sources": [{"sha": "66f57a6", "subject": "fix(check): validate the architecture of the working tree, untracked files included", "date": "2026-10-17T07:52:27+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i118", "why": "It fixes a regression of c6e8015 (a fresh interactive app failed the check), so it serves the same request."}]}]}], "messages": 1, "sourceCount": 3, "misplaced": []}, {"id": "i117", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-17T06:05:50.108Z", "to": "2026-10-17T06:47:11+00:00", "repos": ["app-templates", "apps"], "commit": "docs: build freely or with Lovable and bolt.new; app sections in the interactive architecture", "intent": "Creators may want tools such as Lovable or bolt.new, which choose their own framework and styling, and the platform should stay open to them. The interactive archetype keeps Vue, and the open way is documented instead. An interactive app also needs a place for its own architecture inside the copied chapters, because arc42 checks a block, its parent and its diagram within one file.", "decisions": ["Vue stays in the interactive archetype; building freely or with Lovable and bolt.new is described on the build page, over a framework-agnostic archetype or a raw skill-only setup", "the app's own architecture between markers in the copied chapters, which lernapps update keeps, over separate app files that arc42 cannot validate strictly"], "trigger": "\"ich glaube, wir sollten Framework Agnostic bleiben. Es ist ein sehr guter Anwendungsfall, das Creator Tools, Loveable oder Bolt.New nutzen möchten\" … \"Lass vue im archetyp. Wir lösen das mit Dokumentation. Unter Bauen beschreiben wir einen kleinen Absatz, wie man Freestyle oder mit lovable/bolt baut. Das mit den Markierungen in unserem template give ich eine gute Idee\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i106", "note": "keeps Vue in the archetype but opens the platform to other tools through documentation"}, {"type": "continues", "intent": "i116", "note": "the app's place in the copied architecture of step 2"}], "groups": [{"repo": "apps", "message": "docs(build): building freely, by hand, with another framework or with Lovable or bolt.new\n\n## Intent\n\nCreators may want tools such as Lovable or bolt.new, which choose their own framework and styling. The platform stays open to them: the archetypes keep their stack, and the build page explains the free way.\n\n## Key changes\n\n- The page \"App bauen\" gets a short paragraph, in German and English, on building an app freely: by hand, with another framework, or with Lovable or bolt.new.\n\n## Dependencies and side effects\n\n- The interactive archetype keeps Vue; its architecture gets sections for the app's own part (2baaf45, same intent).", "reason": "The only apps commit of this request.", "sources": [{"sha": "91212ba", "subject": "docs(build): building freely, by hand, with another framework or with Lovable or bolt.new", "date": "2026-10-17T06:46:58+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "docs(arc42): empty app sections in the interactive extension\n\n## Intent\n\nAn interactive app needs a place for its own architecture. arc42 checks a block within its parent's section and in a diagram of the same chapter-5 file, so separate app files cannot validate strictly.\n\n## Key changes\n\n- An interactive app gets the generic part and the interactive extension as a copy, which lernapps update replaces. Its own architecture goes between the markers <!-- app: begin … --> and <!-- app: end … -->, which update keeps.\n- The extension has named, empty sections inside the core, the UI and the data, and one at the end of every interactive chapter.\n- Empty, they change nothing: every combination still validates without a finding.\n\n## Dependencies and side effects\n\n- The tooling's step 2 copies these chapters into interactive apps.\n- The commit also adds package-lock.json files to the three templates.", "reason": "The only app-templates commit of this request.", "sources": [{"sha": "2baaf45", "subject": "docs(arc42): empty app sections in the interactive extension", "date": "2026-10-17T06:47:11+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 3, "sourceCount": 2, "misplaced": []}, {"id": "i118", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-17T06:51:10.765Z", "to": "2026-10-17T07:21:29+00:00", "repos": ["apps", "tooling"], "commit": "refactor(skills): split lernapps-app into a short index and rule files", "intent": "The skill lernapps-app loaded all 35 rules at once and mixed rules for every app with rules that only make sense with the lernapps plan and tooling. Tools such as Lovable or bolt.new need the platform rules alone. Split the skill into small modules, as the Agent Skills specification intends, so an agent or a tool reads only what it needs.", "decisions": ["one skill with a references/ folder and links in SKILL.md, over two separate skills or two sections in one file", "the platform rules in a file that reads on its own, without plan, preset or hooks", "every rule keeps id, text, scope and severity byte for byte; only its file changes", "the build page's paragraph on building freely links the platform rules, not the whole skill"], "trigger": "\"Haben wir nicht schon eine Trennung für Prozess und rules in unterschiedliche skills?\" … \"Mach einen skill mit einem unterordner und links im markdown. Da sollten wir gut modularisieren, das ist ohnehin extrem fett derzeit. Die agentskills spefizikatiin sieht das ohnehin vor\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i117", "note": "gives the free builders of the build page the platform rules alone"}], "groups": [{"repo": "tooling", "message": "refactor(skills): split lernapps-app into a short SKILL.md and rule files\n\n## Intent\n\nThe skill lernapps-app loaded all 35 rules at once. It mixed rules for every app with rules that only make sense with the lernapps plan and tooling, and a tool such as Lovable or bolt.new needs the platform rules alone. Split the skill as the Agent Skills specification intends (progressive disclosure), so an agent reads only what it needs.\n\n## Key changes\n\n- SKILL.md says what an app is and where the workflow is, and links four rule files in references/, each with one line on when to read it.\n- The four files: platform rules (every app however it is built, plus the catalog entry), workflow rules, tooling rules and archetype rules.\n- The platform rules read on their own, for a tool without the lernapps tooling.\n- Every rule keeps its id, heading, text, scope and severity byte for byte; only its file changes. The rule page and its anchors stay as they were.\n- The new files are exported. Tests check that a skill links and exports each of its files, and that `lernapps update` copies a skill's subfolders.\n\n## Dependencies and side effects\n\n- lernapps/apps 8ffc0e4 (same intent) links the platform rules from the build page.", "reason": "The only tooling commit of this request.", "sources": [{"sha": "29be331", "subject": "refactor(skills): split lernapps-app into a short SKILL.md and rule files", "date": "2026-10-17T07:14:30+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "docs(build): give free builders the platform rules of lernapps-app\n\n## Intent\n\n\"Lieber frei bauen?\" told users of Lovable or bolt.new to give their tool the whole skill lernapps-app, which also holds the plan workflow and the tooling rules. A free builder needs only the rules that hold for every app.\n\n## Key changes\n\n- The paragraph, in German and English, links the skill's platform rules (references/platform-rules.md) instead of the whole skill.\n\n## Dependencies and side effects\n\n- Needs lernapps/tooling 29be331 (same intent), which creates the file; the link test fails until it is on main.", "reason": "The only apps commit of this request.", "sources": [{"sha": "8ffc0e4", "subject": "docs(build): give free builders the platform rules of lernapps-app", "date": "2026-10-17T07:21:29+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i119", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-17T08:45:22.526Z", "to": "2026-10-17T08:59:21+00:00", "repos": ["apps", "tooling"], "commit": "feat(rules): rules of the plan workflow and the tooling apply only to apps built with the tooling", "intent": "The catalog takes apps however they are built, but ten rules presuppose the lernapps plan or tooling and applied at listing to every app. A freely built app would fail for a missing plan file. Hold such an app to the platform rules alone, and judge the plan and tooling rules only for apps built with the tooling.", "decisions": ["a new scope tooling for the ten rules, over keeping them in scope listing", "the marker is @lernapps/tooling in the app's package.json, which every generated app already has, over a new marker", "the review agent gets only the rules in scope for the app", "ids, texts and severities stay as they were"], "trigger": "\"Ja. sonnet 5.5\" (yes to an own scope for the ten rules that presuppose the plan or the tooling)", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i118", "note": "separates the platform rules from the rules of the workflow and tooling"}], "groups": [{"repo": "tooling", "message": "feat(rules): give the rules of the plan workflow and the tooling the scope tooling\n\n## Intent\n\nThe catalog takes apps however they are built. Ten rules presuppose the plan workflow or the tooling's checks, yet had scope listing and applied to every app, so a freely built app would fail for a missing plan file. Hold such an app to the listing rules alone.\n\n## Key changes\n\n- plan-file, explore-before-code, stop-at-checkpoints, few-turns-after-plan, retrospective-filled, app-content-guide, app-content-matches, checks-pass, fix-from-message and suppression-reason move from scope listing to the new scope tooling.\n- They apply to an app built with the tooling, at listing too. The marker is the one every generated app already has: @lernapps/tooling in the package.json's dependencies or devDependencies.\n- `npm run rules -- --app <dir>` lists the rules in scope for one app. The review judges those alone; the rubric judges plan-file for an app built with the tooling that has no plan.\n- Ids, texts and severities stay as they were.\n\n## Dependencies and side effects\n\n- lernapps/apps c48de7a (same intent) gives the review agent only the rules in scope.", "reason": "The only tooling commit of this request.", "sources": [{"sha": "c6e40d2", "subject": "feat(rules): give the rules of the plan workflow and the tooling the scope tooling", "date": "2026-10-17T08:51:33+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "feat(review): give the review agent only the rules in scope for the app\n\n## Intent\n\nA freely built app should not be judged by plan-file, retrospective-filled or the other rules of the plan workflow.\n\n## Key changes\n\n- The review's rules.yaml comes from `npm run --silent rules -- --app <app>` of lernapps/tooling: the listing rules, the rules of scope tooling only when the app's package.json lists @lernapps/tooling, and the rules of its plan's archetype.\n\n## Dependencies and side effects\n\n- Needs lernapps/tooling c6e40d2 (same intent) on main.", "reason": "The only apps commit of this request.", "sources": [{"sha": "c48de7a", "subject": "feat(review): give the review agent only the rules in scope for the app", "date": "2026-10-17T08:59:21+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i120", "why": "The apps half of the scope tooling: the review agent judges only the rules in scope. It landed after the next message, which started the pilot run."}]}]}], "messages": 1, "sourceCount": 2, "misplaced": []}, {"id": "i121", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-17T18:12:08.378Z", "to": "2026-10-17T18:30:14+00:00", "repos": ["apps", "tooling"], "commit": "feat(rules): platform rule app-checkable for apps that cannot be checked", "intent": "Since the scope tooling, checks-pass applies only to apps built with the tooling. When the catalog cannot open or check an app, it still filed the finding under checks-pass, so a freely built app failed under a rule that does not apply to it. Such an app should still fail, but under a platform rule with a fitting name.", "decisions": ["a new listing rule app-checkable with severity error, over keeping the finding under checks-pass", "checks-pass keeps the toolchain's own checks in a repo", "an entry that lernapps check cannot read names entry-from-schema"], "trigger": "\"Ich verstehe nicht, was Du zuletzt geändert hast\" … \"Das fände ich eine sinnvolle Erweiterung.\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i119", "note": "closes the gap the scope tooling left for unchecked apps"}], "groups": [{"repo": "tooling", "message": "feat(rules): add platform rule app-checkable for apps that cannot be checked\n\n## Intent\n\n`lernapps check` on a built app or a URL filed \"no browser can start\" under checks-pass, which now has scope tooling and no longer applies to freely built apps. An app that cannot be opened or checked should fail under a platform rule.\n\n## Key changes\n\n- New listing rule app-checkable: \"The published app can be opened and checked\".\n- Findings that the check could not run on a built app or a URL now name app-checkable.\n- checks-pass keeps the toolchain's own checks in a repo, including a browser that cannot start there.\n\n## Dependencies and side effects\n\n- lernapps/apps fe8c6cb (same intent) files such findings of the listing under app-checkable.", "reason": "The only tooling commit of this request.", "sources": [{"sha": "9b1edd7", "subject": "feat(rules): add platform rule app-checkable for apps that cannot be checked", "date": "2026-10-17T18:21:15+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "fix(listing): file unchecked apps under app-checkable, not checks-pass\n\n## Intent\n\nWhen `lernapps check` stops, the listing validation and the review input wrote a finding of checks-pass, a tooling rule that no longer applies to freely built apps.\n\n## Key changes\n\n- Such findings name the platform rule app-checkable.\n- An entry that `lernapps check` cannot read is the entry's own problem and names entry-from-schema.\n\n## Dependencies and side effects\n\n- Needs lernapps/tooling 9b1edd7 (same intent) for the rule.", "reason": "The only apps commit of this request.", "sources": [{"sha": "fe8c6cb", "subject": "fix(listing): file unchecked apps under app-checkable, not checks-pass", "date": "2026-10-17T18:30:14+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 4, "sourceCount": 2, "misplaced": []}, {"id": "i122", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-17T18:38:42.815Z", "to": "2026-10-17T19:13:50+00:00", "repos": ["apps", "tooling"], "commit": "feat(guidance): make the GitHub side transparent from the start", "intent": "The first full creator run lost most time on GitHub: work became the default branch, Pages was off at the first deploy, GraphQL was blocked in the cloud, a rename cost access, the review read a stale branch, and the listing path through a fork stayed untested. The tooling works deeply with GitHub. Creators should learn early what that means without having to know GitHub, and agents should set it up at the start and know what to do when a GitHub call fails.", "decisions": ["explain GitHub Pages in Explore and offer a plain explanation of GitHub, plus a docs page under build, over leaving it implicit", "set up main, gh-pages and work at the start of Explore, over doing it in lernapps create or in the Commit phase", "a compact skill lernapps-github for when the direct way fails, over spreading the alternatives over the templates", "publish deploys even when Pages is off and fails only after the deploy, over stopping before it", "the review reads the head of main and names the ref it read, over the default branch", "GitHub handling becomes part of the evals"], "trigger": "\"Wir arbeiten tief integriert mit Github in unserem Tooling. das müssen wir transparent machen und auch in den Prozess integrieren\" … \"Der Agent kann im Scaffolding angewiesern werden, direkt als erstes einen main branch anzulegen\" … \"Die Alternativen zum gh cli sollten wir in einen Skill packen (wie man mit Github interagiert, wenn es mal nicht direkt klappt – ganz kompakt)\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i023", "note": "removes the GitHub friction found in the Typonaut run"}], "groups": [{"repo": "tooling", "message": "fix(publish): deploy even when Pages is off, fail only after the deploy\n\n## Intent\n\nWhen Pages was off or misconfigured, the publish action stopped before the deploy. After the creator's click Pages served the old state, and the integration may not start a rerun (403), so the agent pushed a dummy change to trigger one. The creator's click should show the newest state at once.\n\n## Key changes\n\n- A Pages setup the token may not fix is a warning before the deploy; the check after the deploy fails until the creator makes the click. The message says that no new run is needed.\n- The advice to set the default branch uses REST (`gh api -X PATCH repos/<o>/<r> -f default_branch=main`), since GraphQL may be blocked where the assistant runs.\n\n## Dependencies and side effects\n\n- `publish.ts before` exits 0 on a wrong Pages setup; its tests expect the warning and the failure of `after`.\n- Part of making the GitHub side transparent, with 9cf04cd and lernapps/apps ba3d7e7 (same intent).", "reason": "Kept apart from the guidance commit that follows it: a code fix of the publish action, not guidance.", "sources": [{"sha": "dcf5561", "subject": "fix(publish): deploy even when Pages is off, fail only after the deploy", "date": "2026-10-17T18:51:42+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "feat(guidance): make the GitHub side transparent from the start\n\n## Intent\n\nThe first full creator run lost most time on GitHub: work became the default branch, Pages was off at the first deploy, GraphQL was blocked, a rename cost access, and an early message was taken as a yes. The tooling works deeply with GitHub. Creators should know what that means without having to know GitHub, and agents should set it up right at the start.\n\n## Key changes\n\n- In Explore the agent tells the creator where the app lives (own repo, GitHub Pages, public, free) and offers to explain GitHub in plain words. A new docs page, https://lernapps.net/tooling/github/, explains it for humans.\n- The agent fixes the repo name, pushes main alone so it becomes the default branch, then creates gh-pages and work and sets the Pages source, before anything else is pushed. The Commit phase only verifies and brings work into main by fast-forward.\n- New compact skill lernapps-github: tool order (gh over REST, then MCP, then curl), GraphQL may be blocked, \"403 by integration\" means a click for the creator and never a dummy push, REST checks, and the listing pull request from a fork.\n- stop-at-checkpoints: a message sent before the checkpoint question is not a yes.\n- lernapps-interactive: how to handle the frame and a full-screen game (overlay, way out, focus, keys that scroll the page).\n\n## Dependencies and side effects\n\n- A new guidance test checks the branch setup in Explore and that the template has no GraphQL `gh repo` commands.\n- AGENTS.md is at its word limit, so it does not reference the new skill.\n- dcf5561 changes the publish action; lernapps/apps ba3d7e7 links the new page and writes out the fork path (same intent).", "reason": "The guidance part of the request, kept apart from the publish fix.", "sources": [{"sha": "9cf04cd", "subject": "feat(guidance): make the GitHub side transparent from the start", "date": "2026-10-17T18:51:47+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "docs: explain GitHub to creators, the fork path, and review the head of main\n\n## Intent\n\nIn the first creator run the review read a stale work, the default branch, and failed the plan. The listing path did not say to use a fork, so the way real creators must take stayed untested. Creators also need a plain word that the app lives on GitHub and that they need not know it.\n\n## Key changes\n\n- `/review` without a commit reads the head of main (else HEAD), says which ref it read, and warns when the default branch is not main.\n- llms.txt writes out the fork path and points to the new tooling skill lernapps-github.\n- The build page links the tooling's page \"GitHub, explained\".\n\n## Dependencies and side effects\n\n- The review comment's closing line changed; the golden comment follows.\n- Needs lernapps/tooling 9cf04cd (same intent) for the linked page and skill.", "reason": "The only apps commit of this request.", "sources": [{"sha": "ba3d7e7", "subject": "docs: explain GitHub to creators, the fork path, and review the head of main", "date": "2026-10-17T19:13:50+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i123", "why": "The catalog side of making GitHub transparent (review reads main, fork path, link to the GitHub page); it landed after the next message."}]}]}], "messages": 2, "sourceCount": 3, "misplaced": []}, {"id": "i123", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-17T18:53:25.842Z", "to": "2026-10-17T19:05:04+00:00", "repos": ["tooling"], "commit": "fix(check): judge the commit's arc42 diff instead of failing on every hint", "intent": "In the first creator run the first commit of a fresh interactive app failed on hints that are no errors, and the agent then set ARC42_CONSISTENT in advance, which bypasses the gate like --no-verify. The architecture gate should block only real inconsistencies and new code no block claims, so that agents have no reason to bypass it.", "decisions": ["the tooling judges arc42's findings itself, over waiting for arc42 to change", "review hints become warnings; consistency findings and unclaimed new code still fail", "ARC42_CONSISTENT accepts only consistency findings, never new code", "fix it although the creator did not ask for it, since it is a real defect"], "trigger": "Finding of the Typonaut evaluation: the first commit failed on hints about files listed in .arc42ignore, and the agent then set ARC42_CONSISTENT in advance three times.", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i121", "note": "a finding of the Typonaut evaluation started there"}], "groups": [{"repo": "tooling", "message": "fix(check): judge the commit's arc42 diff instead of failing on every hint\n\n## Intent\n\nA fresh interactive app's first commit after the plan ran `arc42 diff --staged --strict`, which fails on every hint. arc42 diff does not read .arc42ignore, so src/main.ts and src/env.d.ts counted as not covered, and it hints \"review architecture element\" at every file under an interface's path. The agent then accepted with ARC42_CONSISTENT and went on to set it in advance, which bypasses the gate. The gate should block only what is really wrong.\n\n## Key changes\n\n- lernapps check runs `arc42 diff --staged --format json` and judges the findings itself.\n- Consistency findings and new code that no block claims fail; .arc42ignore applies as validate applies it.\n- Review hints are a warning in the report.\n- ARC42_CONSISTENT accepts only consistency findings, which stay in the report as a warning; it never accepts new code.\n- The skills say that setting it without a finding shown is a bypass like --no-verify.\n\n## Dependencies and side effects\n\n- A new e2e test replays the case from the first creator run.", "reason": "One commit for one fix.", "sources": [{"sha": "d3d1c84", "subject": "fix(check): judge the commit's arc42 diff instead of failing on every hint", "date": "2026-10-17T19:05:04+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i124", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-17T20:09:02.492Z", "to": "2026-10-17T20:14:05+00:00", "repos": ["tooling"], "commit": "fix(rules): tooling rules never block a listing", "intent": "The catalog takes apps built in completely different ways, so only the platform rules should block a listing. In the first creator run the review failed the app with an error for one unticked plan box, although the work of the phase was done. Rules of the workflow and the tooling should be advice at listing, while the app's own repo still enforces them.", "decisions": ["only listing rules block a listing; tooling rules are warnings there, also for apps built with the tooling", "hooks and checks in the app's repo enforce as before", "an unticked plan box is no finding of retrospective-filled; a really skipped phase stays a finding, as a warning", "drop the restriction that a listing or tooling rule is never a warning", "restart the stopped work fresh on the current main"], "trigger": "\"Dass der Plan nicht eingehalten wurde liegt wohl an einem fehlenden Kästchen. Sollte behandelt werden, aber ein verhindernder Error ist es auch wieder nicht\" … \"Die bisherige Regel zu Scope und Regeln ist blödsin. Wir würden ja auch komplett anders gebaute Apps akzeptieren.\" … \"1 und 2\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i119", "note": "the rules of scope tooling no longer block at listing"}], "groups": [{"repo": "tooling", "message": "fix(rules): tooling rules never block a listing\n\n## Intent\n\nThe catalog takes apps built in completely different ways, so only the listing rules may block a listing. One unticked plan box should not stop an entry whose phases were done.\n\n## Key changes\n\n- A rule of scope tooling (plan-file, retrospective-filled, checks-pass, …) is advice at listing: the rule list gives `atListing: warning` for each one declared an error.\n- The review reports its findings as warnings, and the verdict check refuses a tooling finding of severity error, so the outcome never fails on tooling findings alone.\n- An unticked plan box is no finding of retrospective-filled; a really skipped phase stays a finding of explore-before-code or stop-at-checkpoints, as a warning.\n- The declared severity still holds in the app's repo: skills, hooks and checks enforce as before. The listing validation checks the bundle or URL without the repo and runs no tooling check.\n- The restriction that a listing or tooling rule is never a warning is gone from the rule tooling, chapter 8 and the rule page.", "reason": "One commit for one request.", "sources": [{"sha": "126e186", "subject": "fix(rules): tooling rules never block a listing", "date": "2026-10-17T20:14:05+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 1, "misplaced": []}, {"id": "i125", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-17T20:18:30.551Z", "to": "2026-10-17T20:25:42+00:00", "repos": ["tooling"], "commit": "docs(evals): inventory, expectations and a proposed infrastructure for the evals", "intent": "The evals are the last open step of the plan. Before building them, know what an agent reads from the first prompt to the listing and what we expect of it. Then decide how a run is built: simple enough that the orchestrating session starts it with a sub-agent or a new session and a chosen model, and good enough to draw conclusions from.", "decisions": ["start the evals without waiting for open merges", "the tooling's own messages count as instructions and belong to the inventory", "our own repos' skills, biz42/pdt42 and .github are not evaluated", "an ADR after Nygard with a three-point Pugh matrix against scripts plus result files as the baseline", "propose scripts and result files laid out so Harbor can take over later, over a framework or own containers now"], "trigger": "\"Aber auch ohne den Mergen können wir zu Evals übergehen, nicht? … Erstelle erst mal ein Inventar von Prompts, skills und Instruktionen in den Docs, die wir evaluieren wollen und dann Aspekte, die wir bei einem Agenten erwarten.\" … \"Ob es sich lohnt, dafür ein Framework einzusetzen, es zu containerisieren oder einfach ein Shell-Sktipt zu nutzen … Lass einen ADR schreiben, nach nygard, three Point Pugh matrix\"", "kind": "docs", "confidence": "evidenced", "relations": [], "groups": [{"repo": "tooling", "message": "docs(evals): inventory, expectations and a proposed infrastructure for the evals\n\n## Intent\n\nThe evals are the last open step of the plan. Before building them, know what an agent reads from the first prompt to the listing, what we expect of it, and how a run is built. A run must be simple enough that the orchestrating session starts it with a sub-agent or a new session and a chosen model, and its results must allow conclusions.\n\n## Key changes\n\n- Step 10 of the plan lists what the evals cover: the entry prompts, the llms.txt files and docs, AGENTS.md and the templates, all skills, the tooling's messages, and the review agent's prompt and rubric. Our own repos' skills and .github are left out on purpose.\n- It lists what we expect of the creator's agent (A1–A34) and of the review agent, each with where the evidence is: transcript, plan file, git and GitHub, or checks and review.\n- An ADR in chapter 9 (proposed) compares scripts with result files, Claude Code's plugin eval, Inspect, Harbor, promptfoo and an own container in a Pugh matrix. It proposes scripts and result files in a layout Harbor can take over later, and refines \"Evals by hand with three assistants\" without changing it.\n- The plan points to the ADR from step 10.", "reason": "The plan commit with the inventory joins the ADR that follows it directly on the same branch (plan rule next).", "sources": [{"sha": "702bddc", "subject": "docs(plan): inventory and expected behaviour for the evals (step 10)", "date": "2026-10-17T20:16:04+00:00", "pr": null, "plan": true, "moved": [{"kind": "moved", "from": "i124", "why": "The inventory and expectations asked for in the last message before this intent; it opens the eval work that the ADR continues and joins it by the plan rule."}]}, {"sha": "58644be", "subject": "docs(arc42): propose how the eval runs are built (ADR with Pugh matrix)", "date": "2026-10-17T20:25:42+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 2, "misplaced": []}, {"id": "i126", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-17T20:53:26.623Z", "to": "2026-10-17T20:57:12+00:00", "repos": ["tooling"], "commit": "docs(arc42): eval method: assistant configurations, scenarios with start states, attribution", "intent": "We do not test models but models inside assistants, and the prompts work as a chain, so the effect of one prompt alone can hardly be measured. The eval method should say what one configuration is, how scenarios run prompts in sequence in one session, and how a result is traced back to a part of the guidance.", "decisions": ["the assistant, its version, the model and settings count as one configuration, compared only with itself; no attempt to factor out the model", "scenarios run the creator's turns in sequence in one session, from a fresh start or from a prepared state", "the creator's answers come from a persona, not a fixed script", "attribution through traces in the transcript; counter-tests that change one part of the guidance only on suspicion"], "trigger": "\"Ich frage mich vor allem, wie wir damit konzeptionell umgehen, dass wir nicht llms sondern llms in harnesses testen müssen. … Würden wir daher besser Szenarien aufbauen und die Promis in Sequenz validieren (in einer Session, aufeinander aufbauend)?\" … \"Klingt für mich nachvollziehbar\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i125", "note": "adds the method to the proposed eval infrastructure"}], "groups": [{"repo": "tooling", "message": "docs(arc42): eval method: assistant configurations, scenarios with start states, attribution\n\n## Intent\n\nWe test models inside assistants, not models alone, and the guidance works as a chain, so a single prompt's effect cannot be measured on its own. The eval method should say what is compared, how a scenario runs, and how a result points to a part of the guidance.\n\n## Key changes\n\n- What is tested is an assistant configuration: the harness, its version, the model and its settings. Comparisons are between guidance commits within one configuration, never across, like browsers in a test matrix.\n- Scenarios run the creator's turns in sequence in one session. Each has a start state: fresh from the real first prompt, or a prepared state (plan confirmed; app built with a failing check; app published, not yet listed; a first version for an increment), kept as a git bundle.\n- A persona answers by topic and checkpoint instead of a fixed sequence, since the agent's questions vary between runs.\n- A failed expectation names its inventory item and how it failed, read from the transcript: not read, misread, or read and not followed.\n- Later, only for a suspected item: a counterfactual run with that item changed or removed.\n- The plan's step 10 records the method.", "reason": "One commit for one request; the ADR that follows it is a separate request.", "sources": [{"sha": "e0d14c8", "subject": "docs(arc42): eval method: assistant configurations, scenarios with start states, attribution", "date": "2026-10-17T20:57:12+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 1, "misplaced": []}, {"id": "i127", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-17T20:58:07.340Z", "to": "2026-10-17T20:58:40+00:00", "repos": ["tooling"], "commit": "docs(adr): eval infrastructure as its own ADR file, short form in chapter 9", "intent": "The full eval ADR with its Pugh matrix is too long inline in chapter 9. Keep it as its own linked file, and keep chapter 9 as short as its other decisions.", "decisions": ["a separate ADR file after Nygard, linked, over the full text inline", "chapter 9 keeps a short form with context, decision, consequences and the decision block", "the link points absolutely to main, since the docs' architecture page holds only docs/arc42/"], "trigger": "\"Als separate Datei, verlinkt. Inline ist das zu viel\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i125", "note": "moves the proposed ADR into its own file"}], "groups": [{"repo": "tooling", "message": "docs(adr): eval infrastructure as its own ADR file, short form in chapter 9\n\n## Intent\n\nThe full ADR on the eval infrastructure, with its Pugh matrix, is too long inline in chapter 9. Chapter 9 should stay as short as its other decisions.\n\n## Key changes\n\n- The ADR lives in docs/adr/eval-runs-from-files.md, structured after Nygard: status, context (with the Pugh matrix), decision, consequences.\n- Chapter 9 keeps a short form with context, decision and consequences, the decision block and a link to the file.\n- The plan links the file at both places.\n\n## Dependencies and side effects\n\n- The link from chapter 9 points to main, since the docs' architecture page holds only docs/arc42/; it works after the merge.", "reason": "One commit for one request.", "sources": [{"sha": "77580ba", "subject": "docs(adr): eval infrastructure as its own ADR file, short form in chapter 9", "date": "2026-10-17T20:58:40+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i128", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-17T20:59:27.235Z", "to": "2026-10-17T23:02:07+00:00", "repos": ["tooling"], "commit": "docs(adr): accept Harbor for the eval runs", "intent": "Decide the eval infrastructure. Harbor brings a documented method for long agent runs with a simulated creator, so we need not build run control, persona, repetition and rescoring ourselves. Prove in a spike and a first real run that it works in the cloud container before accepting it.", "decisions": ["Harbor over scripts and result files, because its method and documentation already exist", "a spike without a model first, then one real run, before accepting", "single-step tasks with a persona, over multi-step tasks whose creator messages are fixed", "prepared states baked into the images", "a wrapper with a scrubbed environment; the key reaches the container as EVALS_ANTHROPIC_API_KEY, since the platform filters ANTHROPIC_* variables", "a local patch for the subscription token of the ACP adapter", "at least three trials per configuration; a verifier at the end plus a transcript script", "the review topic is closed; only the evals remain"], "trigger": "\"Den Review-Aspekt betrachte ich mit den genannten Änderungen als abgeschlossen. Wir kümmern uns nur noch um Evals\" … \"D sieht für mich dahingehend attraktiv aus, weil sich schon jemand über die Methodik Gedanken gemacht hat und es Doku gibt\" … \"Mach erst mal den Spike\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i125", "note": "decides for Harbor instead of the proposed scripts and result files"}], "groups": [{"repo": "tooling", "message": "docs(adr): accept Harbor for the eval runs\n\n## Intent\n\nDecide how the eval runs are built. Harbor brings a documented method for long agent runs with a simulated creator, so run control, persona, repetition and rescoring need not be built by us. A spike and a first real run had to show that it works in the cloud container.\n\n## Key changes\n\n- The ADR is renamed to eval-runs-with-harbor and decided for Harbor (option D). It records the spike and the first real run of 2026-10-17: Harbor 0.24.0 runs in the cloud container with a simulated creator.\n- The Pugh matrix is revised and keeps the scores before the spike.\n- Decided: single-step tasks with a persona, prepared states baked into the images, a wrapper with a scrubbed environment, a local patch for the ACP token, at least three trials per configuration, a verifier at the end plus a transcript script.\n- It refines \"Evals by hand with three assistants\". Chapters 5, 7, 9 and the plan point to it.", "reason": "One commit for one decision.", "sources": [{"sha": "0374dee", "subject": "docs(adr): accept Harbor for the eval runs", "date": "2026-10-17T23:02:07+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 14, "sourceCount": 1, "misplaced": []}, {"id": "i129", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-17T23:13:48.365Z", "to": "2026-10-18T05:16:29+00:00", "repos": ["tooling"], "commit": "feat(evals): the lernapps evals as Harbor tasks", "intent": "With Harbor accepted, build the evals and run them: one fresh scenario per archetype, scored per expectation, so a matrix of Haiku, Sonnet and Opus shows how well agents follow the guidance. A score must measure the agent, not the scenario or the scoring script.", "decisions": ["single-step tasks that stop at the publish checkpoint, with a German teacher persona per archetype", "a separate verifier on the collected app plus a transcript score, over Harbor's own numbers", "the agent's own tokens from its session log, since Harbor's numbers for an ACP target are not the target's", "the simulated creator is Haiku in every run, so runs stay comparable", "the summary never mixes configurations", "stop every run once the usage limit is reached", "the retrospective counts as n/a when a run stops before the listing checkpoint"], "trigger": "\"Wir kümmern uns nur noch um Evals\" … \"wie weit ist der Eval-Agent?\" … \"sind wir sicher, dass es keine auth-probleme gibt?\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i128", "note": "builds the eval tasks on the accepted Harbor ADR"}], "groups": [{"repo": "tooling", "message": "feat(evals): the lernapps evals as Harbor tasks\n\n## Intent\n\nRun the evals with Harbor: one fresh scenario per archetype, scored per expectation, so runs of Haiku, Sonnet and Opus show how well an agent follows the guidance. A score must measure the agent, not the scenario or the scoring script.\n\n## Key changes\n\n- Three single-step tasks with a fresh start (quiz-fresh, explainer-fresh, interactive-fresh). The creator's first message is the build prompt exactly as lernapps.net/apps/build/ renders it. A simulated creator plays a German teacher persona per archetype and stops only at the real publish question.\n- The image is the creator's machine: Node 22, git and Chromium for `lernapps check`, an empty /app.\n- A separate verifier scores the collected app: plan and front matter against the schema, archetype, phase, ticked boxes, retrospective (n/a when the run stops before the listing checkpoint), \"Ich kann\", content guide, app created, `lernapps check` after `npm ci`, committed and clean, prePushFailures.\n- A transcript score counts creator turns after the plan, questions per turn, approvals after a question, how the guidance was read, reads outside the guidance, installs before the plan, hook bypasses and the agent's own tokens. Only real bypasses count: --no-verify, HUSKY=0, SKIP_HOOKS and setting or unsetting core.hooksPath.\n- A summary aggregates jobs per task and configuration, never mixes configurations, and skips jobs marked excluded.txt. expectations.json maps each dimension to its expectation.\n- evals/harbor/: setup.sh installs Harbor 0.24.0 outside the repo and applies two patches (the subscription token for the ACP adapter; the acpx config outside the workspace, which made `lernapps create` refuse /app). harbor.sh runs Harbor with a scrubbed environment; run.sh runs one job per task and model.\n- Tests cover the transcript score, the verifier's plan parsing and the summary.\n\n## Dependencies and side effects\n\n- The proxy's CA certificate and the generated task files are gitignored.", "reason": "The eval tasks and the fixes the first matrix showed follow each other directly on feat/evals-harbor before its pull request was merged; one feature.", "sources": [{"sha": "24c33a6", "subject": "feat(evals): the lernapps evals as Harbor tasks", "date": "2026-10-17T23:35:11+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "7638597", "subject": "fix(evals): the retrospective is n/a when a run stops before the listing checkpoint", "date": "2026-10-18T00:15:24+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "596220b", "subject": "fix(evals): the persona stops only at the real publish checkpoint", "date": "2026-10-18T01:46:35+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "3647e0e", "subject": "fix(evals): no false hook bypasses and early installs in the transcript score", "date": "2026-10-18T03:46:39+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "47765c8", "subject": "feat(evals): the summary skips jobs marked excluded.txt", "date": "2026-10-18T05:16:29+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 5, "misplaced": []}, {"id": "i130", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-18T06:13:37.924Z", "to": "2026-10-18T08:14:35+00:00", "repos": ["tooling"], "commit": "feat(evals): a results page of the first eval runs", "intent": "Show the results of the first night of eval runs, and how we got there, in an appealing way in the tooling docs, so they can be read without the job folders. Put how to run an eval where a reader finds it first, and get the eval branch merged into tooling.", "decisions": ["a static page from aggregates per task and model only, over publishing the job data", "a heatmap of the dimensions, minutes per run, stat tiles and today's cost baseline", "the page names the next step: a compact guidance for agents", "how to run an eval: short at the top, in detail at the end", "merge straight into tooling", "give slow tests a longer timeout instead of retrying pushes under load"], "trigger": "\"Ich bin gespannt auf die Auswertung. Bereiten sie bitte auch grafisch ansprechend vor, ich möchte sie und das Vorgehen seit gestern Nacht unter tooling in die Docs ausdehnen\" … \"es sollte nur das \\\"How to eval\\\" von unten nach ganz vorne, kompakt und dann ausführlich am Ende der Seite. merge das direkt in Tooling\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i129", "note": "publishes the results of the first matrix"}], "groups": [{"repo": "tooling", "message": "feat(evals): a results page of the first eval runs at /tooling/evals/\n\n## Intent\n\nShow the results of the first eval runs, and how they came about, in the tooling docs, so they can be read without the job folders. A reader should find first how to run an eval.\n\n## Key changes\n\n- evals/report.ts reads the job directories and writes site/evals/data.json (aggregates per task and model only) and the generated parts of the page.\n- The page shows a heatmap of the dimensions, minutes per run, stat tiles and today's cost baseline.\n- It explains how the evals came about, their limits and the next step: a compact guidance for agents.\n- How to run an eval stands short at the top and in detail at the end.\n- Linked from the start page and llms.txt, copied by the build.", "reason": "The results page and the move of its how-to follow each other directly on feat/evals-harbor; one page.", "sources": [{"sha": "c4961ee", "subject": "feat(evals): a results page of the first eval runs at /tooling/evals/", "date": "2026-10-18T06:24:35+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "50db4b4", "subject": "docs(evals): how to run an eval, short at the top and in detail at the end", "date": "2026-10-18T07:32:25+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i131", "why": "Moves the how-to of the results page to the top, as asked for this page."}]}]}, {"repo": "tooling", "message": "test: the create test with two CLI runs gets a 20 s timeout\n\n## Intent\n\nThe eval branch could not be pushed or merged: each run of the CLI takes about 2 s, and two of them crossed the default 5 s on a busy runner (the toolchain job of #105, and locally under load).\n\n## Key changes\n\n- The create test that runs the CLI twice gets a 20 s timeout.", "reason": "Not adjacent to the page commits (a merge of main and the plan commit lie between).", "sources": [{"sha": "9a930cf", "subject": "test: the create test with two CLI runs gets a 20 s timeout", "date": "2026-10-18T08:00:19+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i132", "why": "A test timeout that blocked the push and merge of the eval branch (#105)."}]}]}, {"repo": "tooling", "message": "test(check): give the no-browser check the slow timeout\n\n## Intent\n\nThe pre-push run of the eval branch failed twice on the no-browser check. It spawns the CLI, which waits for Playwright to give up on a browser: about 4.4 s alone, over the default 5 s while the whole suite runs.\n\n## Key changes\n\n- The no-browser check takes the slow timeout, like the other process-spawning tests of the file.", "reason": "On another branch than the other commits of this intent.", "sources": [{"sha": "79da606", "subject": "test(check): give the no-browser check the slow timeout", "date": "2026-10-18T08:14:35+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i133", "why": "The second test timeout that failed the pre-push run of the eval branch; i133 has no commits left."}]}]}], "messages": 2, "sourceCount": 4, "misplaced": []}, {"id": "i131", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-18T06:25:50.954Z", "to": "2026-10-18T07:32:38+00:00", "repos": ["tooling"], "commit": "docs(plan): evals measure following the process", "intent": "When an agent follows the guidance and the creator knows the subject, the app is good. So the evals should measure how well the agent follows the process, not the quality of the content, and the next step is to make the guidance cheaper for agents.", "decisions": ["measure how well the agent follows the process, over scoring content quality", "no review agent on the built apps for now", "next: a compact guidance for agents, compared in quality and cost"], "trigger": "\"wenn sich der agent an die Anleitungen gehalten hat, können wir davon ausgehen, dass die apps dann gut sind, wenn der Creator eine hohe Domänenexpertise hat. daher fokussieren wir uns auf das Befolgen des Vorgehens\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i129", "note": "sets the focus of the evals after the first matrix"}], "groups": [{"repo": "tooling", "message": "docs(plan): evals focus on following the process; first results and next step\n\n## Intent\n\nAn app the agent built by the guidance is good when its creator knows the subject. The evals should therefore measure how well the agent follows the process, not the quality of the content.\n\n## Key changes\n\n- Step 10 of the plan records the focus: the evals measure how the agent follows the process; content quality is not scored.\n- It links the first results (33 runs, three archetypes with Haiku, Sonnet and Opus 5.5) at lernapps.net/tooling/evals/.\n- Next: optimise the guidance for agents (compact, bullets, less boilerplate) and compare quality and cost.", "reason": "A plan commit alone: the test fix it would join by the plan rule serves the merge of the eval branch (i130).", "sources": [{"sha": "e01eb33", "subject": "docs(plan): evals focus on following the process; first results and next step", "date": "2026-10-18T07:32:38+00:00", "pr": null, "plan": true, "moved": [{"kind": "plan-rule", "from": "i132", "why": "Records the focus asked for here. Its joinsWith commit 9a930cf (a test timeout) serves the merge of the eval branch and is in i130, so it stays its own commit."}]}]}], "messages": 5, "sourceCount": 1, "misplaced": []}, {"id": "i132", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-18T07:37:27.573Z", "to": "2026-10-18T08:04:17+00:00", "repos": ["tooling"], "commit": "docs(guidance): compact guidance for agents (experiment)", "intent": "The guidance is long and written for people; an agent carries about 30,000 tokens of it through every turn. Try a radically compact variant written for agents, with the same rules and steps, and test it interactively with one small app before anything changes on main.", "decisions": ["a separate branch exp/compact-guidance; main stays untouched", "headings of one to three words, bullets, no prose; SKILL.md as an index of references loaded on demand", "every rule, task, checkpoint and marker that hooks and checks read stays exactly as it is", "short hard rules where the evals found weaknesses", "all URLs, commands and the generator's ref point to the branch in one commit that is reverted before a merge", "a first prompt that holds all must-read URLs, since agents did not follow links found in fetched files"], "trigger": "\"Ich würde da gerne mal einen recht radikalen alternativen Ansatz probieren * minimale Fülltexte * Strukturierung über sehr kompakte Überschriften * Aufzählungen * Dekomposition … Wir könnten das einmal radikal umformulieren und dann hier erst mal interaktiv eine einzelne kleine App bauen.\" … \"Wenn wir das testen, funktioniert es wahrscheinlich nicht einfach, da die URLs, die sich der Agent abruft ebenso wie das CLI nur den Main-Stand enthalten.\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i131", "note": "the next step named after the first eval results"}], "groups": [{"repo": "tooling", "message": "docs(guidance): compact guidance for agents (experiment)\n\n## Intent\n\nThe creator guidance is long and written for people, and an agent carries it through every turn. Try a radically shorter variant written for agents, with every rule and step kept, and test it before main changes.\n\n## Key changes\n\n- Headings of one to three words, bullets, no prose, no reasons for humans, no repetition.\n- SKILL.md files are an index of links to references/ loaded on demand; llms.txt lists the must-read files first.\n- Every rule (77, same ids, scopes and severities), task, checkpoint and command stays.\n- Hard rules where the evals found weaknesses: tick every box, competencies as Ich-kann-Sätze, the content guide grepped for placeholders, no create before the yes, at most two
