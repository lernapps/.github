norganischer Chemie erstellen, um den anderen archtypen zu validieren\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i251", "note": "the second spike of the compact guidance, for the explainer"}], "groups": [{"repo": "apps", "message": "feat(entries): list Anorganische Chemie – Einstieg\n\n## Intent\n\nList the chemistry explainer in the catalog, as the last step of the second spike of the compact guidance, which validates the explainer archetype.\n\n## Key changes\n\n- A catalog entry for Anorganische Chemie – Einstieg (Inorganic chemistry – first steps): Chemie for grades 7 and 8, at https://lernapps.net/anorganische-chemie/, in German and English.\n- Eleven topics in four chapters: substances, particles, the periodic table with its main groups and an interactive table to explore the elements, and reactions with symbols, formulas and equations.\n- Fitness: no account, no install, no storage, no third parties.\n- The creator is Oliver (@mrsimpson).", "reason": "The only commit of the listing.", "sources": [{"sha": "588b158", "subject": "Add anorganische-chemie", "date": "2026-10-18T21:43:03+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 35, "sourceCount": 1, "misplaced": []}, {"id": "i009", "session": "session_012bS5UkRAwujWC2ZrHNgCDE", "from": "2026-10-20T14:55:55.443922Z", "to": "2026-10-20T15:09:06+00:00", "repos": ["lernapps.github.io"], "commit": "feat: prepare a usage counter for the platform sites, never for the apps", "intent": "Find out whether the apps are used at all. The platform's own pages (home, catalog, docs, tooling) should count their visits with GoatCounter, while the apps stay entirely free of tracking. Prepare everything now, so the counter only needs its account code to go live.", "decisions": ["a small own counter script served from lernapps.net, over GoatCounter's count.js from its server", "keep the counter out of the shared site frame, because apps use the frame too; each platform site adds it in its own layout", "lernapps-check fails any site outside the platform sites that carries the counter", "send only the page's path and marked link clicks: no query, title, referrer or screen size, no cookies or localStorage", "count nothing with Global Privacy Control or Do Not Track, or in a preview", "off until the endpoint is filled in; the privacy notice shows its section only then"], "trigger": "\"Ich möchte goatcounter.com einbauen. Spricht da irgendetwas dagegen?\" … \"Das betrifft auch nur die Plattform Seiten, nicht die einzelnen Apps!\" … \"unbedingt den generellen Fame ausklammern, so dass die Apps ausgenommen bleiben\"", "kind": "feature", "confidence": "evidenced", "relations": [], "groups": [{"repo": "lernapps.github.io", "message": "feat: prepare a usage counter for the platform sites, never for the apps\n\n## Intent\n\nFind out whether the apps are used at all. The platform's own pages count their visits; the apps stay entirely free of tracking. Everything is prepared, so the counter only needs its GoatCounter code to go live.\n\n## Key changes\n\n- The home site serves a small own counter script as /lernapps-count.js. It sends the path of the page, and clicks on links marked data-la-count as events, to GoatCounter. It sends no query, title, referrer or screen size, and uses no cookies or localStorage.\n- It counts nothing with Global Privacy Control or Do Not Track, in a pull request preview, or while the endpoint is empty. The endpoint is set in one place.\n- The counter is not part of the shared site frame, because apps use the frame too. The home site adds it to all its own pages; /apps/, /docs/ and /tooling/ add the same tag in their own layouts.\n- lernapps-check fails any site outside the four platform sites that carries the counter.\n- The privacy notice has a section on the counter in German and English. It appears once the counter is on. \"Nichts wird gesammelt\" now reads \"Die Apps sammeln nichts\".\n\n## Dependencies and side effects\n\n- The catalog, tooling and docs add the counter in their own repos (apps ee5555a, tooling e2a59eb, docs 8ccaaa4).", "reason": "The second commit moves the counter of the first out of the site frame, as asked before the first was made; they follow each other directly on feat/usage-counter.", "sources": [{"sha": "6a62044", "subject": "feat: prepare a usage counter for the platform sites, never for the apps", "date": "2026-10-20T15:05:39+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "d6f84ac", "subject": "refactor: keep the usage counter out of the shared site frame", "date": "2026-10-20T15:09:06+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 5, "sourceCount": 2, "misplaced": []}, {"id": "i010", "session": "session_012bS5UkRAwujWC2ZrHNgCDE", "from": "2026-10-20T15:58:12.896696Z", "to": "2026-10-20T16:12:48+00:00", "repos": [".github", "apps", "docs", "tooling"], "commit": "feat: count the visits of the catalog, docs and tooling sites", "intent": "The counter prepared on the home site only counts there. The other platform sites (catalog, docs, tooling) must load it too, and the platform's own rules, which forbid requests to other servers on every page, must name it as the one exception. The rules for apps stay as they are.", "decisions": ["each site adds the script in its own layout or build step after lernapps-frame, over the shared frame", "the catalog counts \"open app\" clicks as the event app/<id>, so app use shows without touching the app", "never in a preview", "the page rules (con-page-rules, ORGANIZATION.md) name the counter as the one exception for the platform sites; the app rules (no-tracking, no-request-before-click, the rubric) stay unchanged"], "trigger": "\"Ich nehme an, dass wir in der Konsequenz auch einzelne Regelungen beim Review anpassen müssen, um genau dieses Skript beziehungsweise diesen URL Zugriff zu ermöglichen\" … \"Du darfst alle lernapps/* repos anhängen\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i009", "note": "the platform sites load the counter prepared there"}], "groups": [{"repo": "apps", "message": "feat: count the catalog's pages and \"open app\" clicks, never the apps\n\n## Intent\n\nSee whether the apps are used at all, without counting anything inside an app. The catalog is a platform site and counts its visits and how often an app is opened from it.\n\n## Key changes\n\n- The catalog's own layout loads the platform's usage counter (/lernapps-count.js, served by lernapps.github.io), not the shared laHead, and never in a preview.\n- The \"open app\" link counts as the event app/<id>.\n- Nothing happens until the counter is turned on in lernapps.github.io.\n\n## Dependencies and side effects\n\n- Needs the counter script of lernapps.github.io (6a62044). The tooling (e2a59eb) and docs (8ccaaa4) sites load it the same way; ORGANIZATION.md in .github (502dbfe) names the exception.", "reason": "The only commit of this request in the catalog.", "sources": [{"sha": "ee5555a", "subject": "feat: count the catalog's pages and \"open app\" clicks, never the apps", "date": "2026-10-20T16:03:23+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "feat: count the tooling site's pages; the counter is the one exception to the page rules\n\n## Intent\n\nThe tooling site is a platform site and counts its visits. The architecture forbids requests to other servers on every page, so it must name the counter as the one exception; the rules for apps stay as they are.\n\n## Key changes\n\n- The build adds the platform's usage counter (/lernapps-count.js) to the site's pages after lernapps-frame, never in a preview. It is not part of the site frame, so an app never carries it.\n- The page rules (con-page-rules) and their evidence name the counter as the one exception for the platform's own sites.\n- The app rules (no-tracking, no-request-before-click, the rubric) are unchanged.\n\n## Dependencies and side effects\n\n- Needs the counter script of lernapps.github.io (6a62044). The catalog (apps ee5555a) and docs (8ccaaa4) load it too; ORGANIZATION.md in .github (502dbfe) names the same exception.", "reason": "The only commit of this request in the tooling.", "sources": [{"sha": "e2a59eb", "subject": "feat: count the tooling site's pages; the counter is the one exception to the page rules", "date": "2026-10-20T16:04:58+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "docs", "message": "feat: count the docs site's pages with the platform's usage counter\n\n## Intent\n\nThe docs site is a platform site and counts its visits, like the home, catalog and tooling sites.\n\n## Key changes\n\n- The build adds the platform's usage counter (/lernapps-count.js, served by lernapps.github.io) to the site's pages after lernapps-frame, never in a preview. It is not part of the site frame, so an app never carries it.\n\n## Dependencies and side effects\n\n- Needs the counter script of lernapps.github.io (6a62044). The catalog (apps ee5555a) and tooling (e2a59eb) load it the same way.", "reason": "The only commit of this request in docs.", "sources": [{"sha": "8ccaaa4", "subject": "feat: count the docs site's pages with the platform's usage counter", "date": "2026-10-20T16:12:44+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i011", "why": "Adds the counter to the docs site, part of rolling it out to all platform repos; made after the next message by time only."}]}]}, {"repo": ".github", "message": "docs: name the platform sites' usage counter as the one exception to the page rules\n\n## Intent\n\nThe organisation's rules say no page sends requests to other servers before a click. The platform sites now count their visits, so the rules must name that one exception, and say that apps are never counted.\n\n## Key changes\n\n- ORGANIZATION.md: the platform's own sites (home, catalog, docs, tooling) count their visits as totals with the usage counter, only to see whether the apps are used. It is not part of the site frame, and nothing is counted inside an app.\n\n## Dependencies and side effects\n\n- The same exception is in the tooling's page rules (e2a59eb); the counter itself is in lernapps.github.io (6a62044).", "reason": "The only commit of this request in .github.", "sources": [{"sha": "502dbfe", "subject": "docs: name the platform sites' usage counter as the one exception to the page rules", "date": "2026-10-20T16:12:48+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i011", "why": "Names the counter as the exception in the organisation's rules, part of the same rollout."}]}]}], "messages": 2, "sourceCount": 4, "misplaced": []}, {"id": "i011", "session": "session_012bS5UkRAwujWC2ZrHNgCDE", "from": "2026-10-20T16:06:19.769493Z", "to": "2026-10-20T16:14:32+00:00", "repos": ["lernapps.github.io"], "commit": "feat: count where visitors come from, and turn the usage counter on", "intent": "Know where visitors come from (a search engine, Moodle, a school website, LinkedIn) without collecting personal data, and switch the counter on with the GoatCounter account.", "decisions": ["send only the origin of the referring website, over the full address that may hold names in its query", "send no referrer for moves within lernapps.net, so nothing reveals an app", "browser, operating system, language and country are fine as totals; screen size is left out, since reading it on the device would need consent", "single page views stay off, over a session id that would build a path of each person", "turning the counter on is its own commit, to be merged only once the data processing agreement is in place"], "trigger": "\"Woher die Besucher kommen wüsste ich manch schon gerne\" … \"Der Code für goatcounter ist lernapps\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i009", "note": "the counter now sends the referring origin, which it left out before"}], "groups": [{"repo": "lernapps.github.io", "message": "feat: count where visitors come from, as the origin of the other website only\n\n## Intent\n\nKnow where visitors come from, such as a search engine, Moodle, a school website or LinkedIn, without collecting personal data. A full referring address can hold names in its query, so only the website itself may be sent.\n\n## Key changes\n\n- The counter sends the origin of the referring website: no path, no query. A visit from within lernapps.net sends no referrer, so nothing is revealed about an app.\n- The privacy notice says so and names browser, operating system, language and country among what GoatCounter derives from the request. Screen size is still not sent.", "reason": "Kept apart from turning the counter on: that commit must wait for the data processing agreement.", "sources": [{"sha": "4299ba6", "subject": "feat: count where visitors come from, as the origin of the other website only", "date": "2026-10-20T16:14:31+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "lernapps.github.io", "message": "feat: turn the usage counter on (lernapps.goatcounter.com)\n\n## Intent\n\nStart counting the visits of the platform sites with the GoatCounter account.\n\n## Key changes\n\n- The counter's endpoint is lernapps.goatcounter.com.\n- The privacy notice now shows its section on the counter, with the updated date.\n\n## Dependencies and side effects\n\n- Merge only once the data processing agreement with GoatCounter is in place. The catalog, docs and tooling sites start counting with it.", "reason": "Turning the counter on stays its own commit, to be merged only once the data processing agreement is in place.", "sources": [{"sha": "16b7111", "subject": "feat: turn the usage counter on (lernapps.goatcounter.com)", "date": "2026-10-20T16:14:32+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 3, "sourceCount": 2, "misplaced": []}, {"id": "i012", "session": "session_012bS5UkRAwujWC2ZrHNgCDE", "from": "2026-10-20T19:59:53.578839Z", "to": "2026-10-20T20:19:44+00:00", "repos": ["docs"], "commit": "docs: the apps can be used without any tracking; the platform counts visits only", "intent": "The vision promised that only explicit clicks are counted. With the usage counter, the platform's own pages also count visits. The principle must say so honestly, and say that the apps can still be used entirely without tracking.", "decisions": ["state the counter in the vision itself, over leaving the principle as it was", "change the same rule in the platform design (D5, D8) and the measures (biz42 ch. 7), so all texts agree"], "trigger": "\"Pad die Vision am: Apps sind komplett ohne Tracking nutzbar. In der Plattform zählen wir nur Besucher um zu wissen, ob es irgendjemand nutzt\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i010", "note": "the counter rolled out there contradicted the vision"}], "groups": [{"repo": "docs", "message": "docs: the apps can be used without any tracking; the platform counts visits only\n\n## Intent\n\nThe vision said that only explicit clicks are counted. The platform's own pages now also count visits, so the principle must say so honestly, and that the apps can still be used entirely without tracking.\n\n## Key changes\n\n- The principle \"No hidden data collection\" now says: the apps can be used entirely without tracking; the platform's own pages count visits as totals, only to know whether anyone uses it; no cookies, no profiles.\n- The same rule in the platform design (D5, D8) and in the measures (biz42 ch. 7) says the same.\n\n## Dependencies and side effects\n\n- Matches the usage counter of lernapps.github.io and the page rules of the tooling and .github.", "reason": "One commit for one request.", "sources": [{"sha": "220c35d", "subject": "docs: the apps can be used without any tracking; the platform counts visits only", "date": "2026-10-20T20:19:44+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 3, "sourceCount": 1, "misplaced": []}, {"id": "i013", "session": "session_012kBBV1ZnN6J6YriMcLk1bq", "from": "2026-10-20T13:59:14.732031Z", "to": "2026-10-20T21:28:19+00:00", "repos": ["app-templates"], "commit": "refactor: the questions and the shared parts move to runtime/shared", "intent": "The quiz should show images and other content blocks of the explainer. If the quiz then took blocks from the explainer while the explainer takes its questions from the quiz, the two archetypes would depend on each other. A neutral shared library has to come first, and a test must keep the archetypes from importing each other again.", "decisions": ["a shared library that knows no archetype, over the explainer borrowing from the quiz or the other way round", "first move the code with behaviour unchanged, then build the feature on it", "a test enforces the import direction: no archetype imports another, shared imports none", "public paths stay as thin re-exports for apps already generated (later dropped in i014)", "also clean up interactive's imports from the explainer, over leaving them as a listed exception", "split load.ts and components.ts along what is general and what is the explainer's, passing the explainer's messages in as describe"], "trigger": "\"Ich hätte gerne mehr Blocktypen im Quiz: Es soll auch Bilder geben. Dabei fiel mir auf: Ist ein Quiz nicht nur eine Auswahl von Blocktypen des Explainers …\" … \"ich frage mich, ob wir das so refractorn sollten, dass es für die Elemente eine gemeinsame lib gibt. Wenn sie mal das Quiz aus den explainer bedient und mal de explainer aus dem Quiz, ist das mehr als ein smell.\" … \"Altlasten aufräumen! Wir wollen eine saubere Architektur.\"", "kind": "rework", "confidence": "evidenced", "relations": [], "groups": [{"repo": "app-templates", "message": "refactor: the questions move to runtime/shared/questions\n\n## Intent\n\nThe quiz should show content blocks of the explainer. Today the explainer takes its exercises from the quiz; if the quiz then took blocks from the explainer, the two archetypes would depend on each other. Both should build on a neutral library instead.\n\n## Key changes\n\n- runtime/shared/questions holds the six question types: types and checker, schema, validation, rendering, the engine (startQuestion), the end-to-end helpers and the texts.\n- The quiz keeps only its bank, page, order and score. The explainer imports nothing from the quiz.\n- New package paths: @lernapps/app-templates/questions, /questions/engine, /questions/e2e, the question schema and its messages. The old public paths re-export what they exported; the quiz's schema carries the same question definitions, and a script keeps them equal.\n- A new architecture test fails on an import between archetypes, an import of an archetype from runtime/shared, a public path without a file, and a built path without an entry of the build. The existing imports of interactive from the explainer are listed as known exceptions.\n- Behaviour is unchanged; the architecture documents and a decision record the new building block.\n\n## Dependencies and side effects\n\n- The question texts moved out of quiz/messages/*.json; code that imports those files directly sees only the quiz page's texts.", "reason": "Kept apart from the next commit: each is a separate step of the refactoring, with all tests green after each.", "sources": [{"sha": "e68242d", "subject": "refactor: the questions move to runtime/shared/questions", "date": "2026-10-20T21:19:38+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "refactor: interactive no longer imports the explainer\n\n## Intent\n\nThe interactive archetype still imported loading, Markdown and the component checks from the explainer, the same kind of coupling as before. No archetype should import another, without exceptions.\n\n## Key changes\n\n- What both archetypes use alike moves to runtime/shared: reading YAML with line positions and reporting problems with file, line and path; schema errors as problems; the checks of the texts; restricted Markdown and formulas; the checks of the code of Vue components (no network, no code from strings, imports, browser globals).\n- The messages that only fit the explainer's blocks stay in the explainer and are passed in as describe. The explainer keeps its own scope and exercise contract for components.\n- One HTML escape function instead of six copies.\n- The architecture test has no exceptions left. Comments in the explainer say \"the question types\" where they mean the shared questions.", "reason": "Kept apart: a second refactoring step that removes the last exceptions of the architecture test.", "sources": [{"sha": "88e74b4", "subject": "refactor: interactive no longer imports the explainer", "date": "2026-10-20T21:28:19+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 5, "sourceCount": 2, "misplaced": []}, {"id": "i014", "session": "session_012kBBV1ZnN6J6YriMcLk1bq", "from": "2026-10-21T04:24:44.087627Z", "to": "2026-10-21T04:44:29+00:00", "repos": ["app-templates"], "commit": "refactor: no compatibility paths, own styles for questions, one language table, smaller modules", "intent": "Nothing of the runtime is published and the existing quiz and explainers may be adapted, so no old path needs to stay alive. Clean up the remaining smells for a clean architecture before the quiz feature is built on it.", "decisions": ["no backward compatibility: remove the re-exports and old package paths", "the quiz schema refers to the question schema, over a copy kept equal by a script", "schema ids are urns, over the address of a site that does not exist; the schemas are not published", "the question markup gets its own question-* classes and stylesheet, over quiz-* classes restyled by the explainer", "one table of languages and locales types every text registry", "split the large explainer modules along their seams, and the architecture test also fails on an import cycle", "check the CSS change against screenshots before and after"], "trigger": "\"Wir brauchen gar keine abwärtskompatibilität. Das Quiz, das schon publiziert ist (Naturwunder-quiz) und die explainer darfst Du hier anhängen und anpassen. Mach es vor allem sauber. Die Schemata publizieren wir nicht\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i013", "note": "removes the compatibility paths and smells left after the shared library"}], "groups": [{"repo": "app-templates", "message": "refactor: no compatibility paths; the schemas refer to each other\n\n## Intent\n\nNothing of the runtime is published, so no old path needs to stay alive. The quiz's schema should not carry a copy of the question definitions.\n\n## Key changes\n\n- The quiz's re-exports of the questions and the package exports quiz/question and */messages/*.json are gone; the questions are imported from runtime/shared/questions.\n- The quiz's schema refers to the question schema, as the explainer's does. The sync script and its test are gone.\n- The schemas have urn ids (urn:lernapps:schema:<name>.v1) instead of the address of a site that does not exist. Error messages name the schema file in the app's node_modules; the READMEs link the files in the repo.\n- The question tests are renamed and import the shared questions.", "reason": "Kept apart: each of the four commits removes a different smell.", "sources": [{"sha": "337d846", "subject": "refactor: no compatibility paths; the schemas refer to each other", "date": "2026-10-21T04:28:45+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "refactor: the questions have their own stylesheet and class names\n\n## Intent\n\nA question is not the quiz's, yet it rendered quiz-* classes, and the explainer restyled them in about 25 rules of its own.\n\n## Key changes\n\n- The question markup uses question, question-option, question-feedback and so on.\n- Its look is in runtime/shared/questions/questions.css, which the quiz and the explainer import. They set its colours as --question-* custom properties.\n- The quiz's stylesheet keeps only its page: languages, start form, progress, result, solutions and celebration.\n- The explainer's \"Neue Aufgabe\" button of a generated exercise has a class of its own.\n- Screenshots before and after (quiz and explainer, desktop and 360 px) are pixel-identical.", "reason": "Kept apart: own smell (styles of the questions).", "sources": [{"sha": "95167b5", "subject": "refactor: the questions have their own stylesheet and class names", "date": "2026-10-21T04:37:30+00:00", "pr": null, "plan": false, "moved": [{"kind": "dropped", "from": "i015", "why": "Part of the clean-up asked for in this intent, planned before the question about interactive's CSS; i015 has no commits left."}]}]}, {"repo": "app-templates", "message": "refactor: one table of the languages and their locales\n\n## Intent\n\nThe languages were listed four times, with three tables of locales and different fallbacks. Adding a language must be complete or not at all.\n\n## Key changes\n\n- shared/languages.ts holds LANGUAGES, Language, localeOf and textsIn.\n- The registries of the runtime's own texts (questions, quiz, explainer, interactive) are typed by it, and the validators take their list of languages from it.", "reason": "Kept apart: own smell (language lists).", "sources": [{"sha": "51c498f", "subject": "refactor: one table of the languages and their locales", "date": "2026-10-21T04:38:42+00:00", "pr": null, "plan": false, "moved": [{"kind": "dropped", "from": "i015", "why": "Part of the same clean-up (smell 4 of the list); i015 has no commits left."}]}]}, {"repo": "app-templates", "message": "refactor: the large modules of the explainer split along their seams\n\n## Intent\n\nThree explainer modules of 800 to 1100 lines each mixed several concerns, which makes them hard to read and change.\n\n## Key changes\n\n- load.ts becomes the site's check, schema.ts (validators and the explainer's words for schema errors) and check-page.ts (what the schema cannot say about a page).\n- generated.ts becomes generated/: types, comparator, values, texts, question and soundness, each importing only what comes before it.\n- components.ts becomes components/: read, props and exercise. The checks of a component's code are shared and generic.\n- The architecture test also fails on a cycle of imports in the runtime. It found one between render.ts and tutor.ts; the shared type now lives in content.ts.\n- The architecture documents name the new paths; the component rules are a building block of the shared runtime.", "reason": "Kept apart: own smell (large modules).", "sources": [{"sha": "ccd7c67", "subject": "refactor: the large modules of the explainer split along their seams", "date": "2026-10-21T04:44:29+00:00", "pr": null, "plan": false, "moved": [{"kind": "dropped", "from": "i015", "why": "Part of the same clean-up (smell 3 of the list); i015 has no commits left."}]}]}], "messages": 1, "sourceCount": 4, "misplaced": []}, {"id": "i016", "session": "session_012kBBV1ZnN6J6YriMcLk1bq", "from": "2026-10-21T05:11:06.037164Z", "to": "2026-10-21T06:02:54+00:00", "repos": ["app-templates"], "commit": "refactor: one frame for every page of the three archetypes", "intent": "Each archetype brought its own CSS for the same page frame: three copies of reset, body, language switch, footer and colours, which had already drifted apart (interactive had no dark mode). The frame should exist once, as the questions already do.", "decisions": ["one shared page.css with one --page-* palette, over three archetype palettes", "interactive follows the dark scheme like the others, and its template's component uses the page's colours", "header and footer are rendered once in shared/pages.ts", "the quiz page takes the width and line height of the others"], "trigger": "\"Moment, warum gibt es überhaupt beim interaktiven Typen, CSS?\" … \"Das ist akzeptabel\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i014", "note": "the same clean-up, applied to the page frame"}], "groups": [{"repo": "app-templates", "message": "refactor: one frame for every page of the three archetypes\n\n## Intent\n\nThe quiz, the explainer and the interactive archetype each had their own CSS for the same page frame. The copies had drifted apart: interactive had no dark mode. The frame should exist once.\n\n## Key changes\n\n- runtime/shared/page.css holds the palette (one set of --page-* colours, light and dark), the reset, [hidden], the body, links, the focus ring, the header with the language switch and the footer. The archetypes' stylesheets keep only their own page.\n- The --quiz-*, --explainer-* and --interactive-* palettes and their mapping to --question-* are gone; the questions use the page's colours.\n- Header and footer are rendered once, with the classes page-header, page-languages and page-footer.\n- The interactive archetype follows the dark scheme; its template's component uses the page's colours. --page-max-width replaces --interactive-max-width.\n- The quiz page is a little wider (44 rem), has the line height of the others and no rule above its footer.\n\n## Dependencies and side effects\n\n- Apps built on the interactive template with fixed light colours in their components must switch to the --page-* colours.", "reason": "One commit for one request.", "sources": [{"sha": "fd073e2", "subject": "refactor: one frame for every page of the three archetypes", "date": "2026-10-21T06:02:54+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 1, "misplaced": []}, {"id": "i017", "session": "session_012kBBV1ZnN6J6YriMcLk1bq", "from": "2026-10-21T06:08:00.699714Z", "to": "2026-10-21T06:54:06+00:00", "repos": ["app-templates"], "commit": "feat: a question shows content: material, with the blocks both archetypes share", "intent": "A quiz question should be able to show an image and other content, as the explainer's pages do. The shared runtime now allows this without the quiz depending on the explainer.", "decisions": ["the explainer's self-contained blocks (text, formula, figure, labelled figure, table, quote, code) move to runtime/shared/blocks, over copying them into the quiz", "section, definition, generated and timeline are left out, since they need page structure, a glossary or data files", "three schema layers: text, blocks, question with material", "one text check for the explainer's YAML and the quiz's JSON", "the quiz's browser engine loads none of it, and a test fails when a page module imports build-only code", "a fixture with every block, two languages and real images, with its own CI job"], "trigger": "\"nein, wir bauen jetzt das Anzeige-Feature für Inhalt (Bilder) in der Frage mit den neuen Blocks. Danach publizierst Du template und tooling.\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i013", "note": "the feature the shared library was built for"}], "groups": [{"repo": "app-templates", "message": "feat: a question shows content: material, with the blocks both archetypes share\n\n## Intent\n\nLet a quiz question show an image and other content, as the explainer's pages do, without the quiz depending on the explainer.\n\n## Key changes\n\n- A question has an optional material, shown between its text and its answers: text, a formula, a figure (a bundled image or drawn from numbers), a labelled figure, a table, a quote or code.\n- These are the explainer's blocks, now in runtime/shared/blocks and used by both archetypes, with their schema (blocks.v1 over text.v1), checks, rendering, styles and texts. The schemas of the question, the quiz and the explainer refer to them.\n- The checks cover what a schema cannot say: a figure is drawn or an image, an image exists, every text is complete in each language, a table's rows are as long as its header. One text check serves the explainer's YAML and the quiz's JSON.\n- The quiz plugin checks the images of src/images/, ships and serves them, and each language's page finds them. The explainer's exercises can show material too.\n- The explainer's block classes are block-*; its page is pixel-identical to before.\n- The quiz's browser engine stays at 14 kB; a test fails when a page's modules import what only the build uses.\n- An error in a block names that block's own problem.\n- A new fixture (German and English, every block, two images) with a CI job and end-to-end tests. The question-page fixture uses the new paths and is formatted.\n\n## Dependencies and side effects\n\n- The tooling follows in lernapps/tooling (f32d90d), and the templates pin it afterwards (1e37d56).", "reason": "The format fix of the question-page fixture, changed by the feature, follows it directly on the branch of the pull request.", "sources": [{"sha": "d156c59", "subject": "feat: a question shows content: material, with the blocks both archetypes share", "date": "2026-10-21T06:36:35+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "5181397", "subject": "fix: format the question-page fixture's end-to-end test", "date": "2026-10-21T06:54:06+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i018", "why": "Fixes the formatting that failed CI on the feature's pull request; it serves the feature, not the publishing."}]}]}], "messages": 4, "sourceCount": 2, "misplaced": []}, {"id": "i018", "session": "session_012kBBV1ZnN6J6YriMcLk1bq", "from": "2026-10-21T06:51:08.053945Z", "to": "2026-10-21T07:18:37+00:00", "repos": ["app-templates", "tooling"], "commit": "chore: the tooling follows the shared runtime, and each pins the other", "intent": "Publish the new templates and make the tooling use them. The tooling referred to the old class names and published app schemas, and its skills did not know about material, so it has to follow the runtime before the pins move.", "decisions": ["merge app-templates first, then move the tooling's pin to the merge, then pin the tooling in the templates", "the schemas of a quiz and an explainer are no longer published, over copying them into the tooling site", "merge each pull request only after its CI is green"], "trigger": "\"du kannst tooling anhängen, die PRs eröffnen, nach erfolgreicher CI mergen und den Prozess überwachen\"", "kind": "chore", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i017", "note": "publishes the feature and the refactoring"}], "groups": [{"repo": "tooling", "message": "feat: follow the shared runtime of the templates and pin it\n\n## Intent\n\nThe templates now share questions, blocks and a page frame, and a question can show material. The tooling must follow: it referred to the old class names and to published app schemas, and its skills did not know material.\n\n## Key changes\n\n- The visit check treats .question-reveal and .question-actions as the parts only JavaScript shows (they were .quiz-*); its fixtures use the new class.\n- The schemas of a quiz and an explainer are no longer published: the build does not copy them, the site page and llms.txt do not list them, and the skills name the file in the app.\n- The skills say a quiz adds images to src/images/ and a question shows content with material (figure, labelled figure, table, formula, text, quote, code), with the rules for an image. --page-max-width replaces --interactive-max-width.\n- The architecture describes the quiz and the explainer the same way.\n- The pin of app-templates moves from 5df0763 to c016140, the merge of lernapps/app-templates#59.\n\n## Dependencies and side effects\n\n- Needs app-templates with the material feature (d156c59). The templates then pin this tooling (1e37d56).", "reason": "The pin of app-templates follows the adaptations directly on the same branch, which named it as its next commit.", "sources": [{"sha": "f32d90d", "subject": "Follow the runtime: question classes, page frame, quiz images, no published app schemas", "date": "2026-10-21T06:53:38+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "3bdec78", "subject": "Pin app-templates to the commit with the shared questions, blocks and page frame", "date": "2026-10-21T06:57:09+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "chore: pin the tooling to the commit that follows the runtime\n\n## Intent\n\nThe templates should be checked by the tooling that knows their new question classes, page frame and material.\n\n## Key changes\n\n- The templates' pin of the tooling moves from d3cc3cf and 9b9a34c to 1e4ba59 (lernapps/tooling#129): the dev dependency of the three templates and of the question-page fixture, the reusable workflow of the change scope, and the classifier of the pre-push hook.\n- lernapps check --pre-push passes in the three templates with the new tooling.\n\n## Dependencies and side effects\n\n- Follows the tooling commit of this intent (f32d90d).", "reason": "The last pin, on a new branch from main after both merges.", "sources": [{"sha": "1e37d56", "subject": "chore: pin the tooling to the commit that follows the runtime", "date": "2026-10-21T07:18:37+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 3, "misplaced": []}, {"id": "i019", "session": "session_012kBBV1ZnN6J6YriMcLk1bq", "from": "2026-10-21T07:35:59.980017Z", "to": "2026-10-21T08:13:39+00:00", "repos": ["app-templates"], "commit": "feat(quiz): Naturwunder-Quiz shows an image from Wikipedia at every question", "intent": "Questions can now carry images, so the Naturwunder-Quiz should show one at every question, taken from the Wikipedia article behind the answer. Every image names its source, its licence and its author, as with all other sources, and must not give away the answer.", "decisions": ["an image at every question, over a single title image on the start page", "a pilot question first to settle the format of the attribution, over doing all eight at once", "source is the Commons URL and the author ends the caption (\"Foto: Name.\"), over a source as plain text without a link or a new author field in the runtime", "no image for weltnaturerbe, over an image that marks one option as right or wrong", "one image of the first article for questions with several articles, over a second image that reveals the order or the countries", "only freely licensed images from Wikimedia Commons, stored in the repo, over linking images from other servers", "the image folder excluded from the architecture check with a reason, over a building block of its own or widening the question bank's block"], "trigger": "\"bei jeder Frage, quelle wie immer nennen und rendern. Starte eine neue Sessions dafür und steuere sie (der Agent der subsession soll Dich fragen, wenn er fragen hat).\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i018", "note": "uses the material blocks with images that app-templates#59 and the tooling pin made available"}], "groups": [{"repo": "app-templates", "message": "feat(quiz): Naturwunder-Quiz zeigt Bilder aus Wikipedia\n\n## Intent\n\nQuestions can now carry images, so the Naturwunder-Quiz should show one at every question, taken from the Wikipedia article behind the answer. Every image names its source, its licence and its author, and must not give the answer away.\n\n## Key changes\n\n- Seven of the eight questions show an image from Wikimedia Commons between the question and the answers. Each image comes from the article of the answer and is freely licensed.\n- The source is the Commons page as a link, the licence is shown below the image, and the caption ends with the author (\"Foto: Name.\"). The caption says what to look at, without the answer.\n- weltnaturerbe has no image, because any photo of one option would mark it as right or wrong. Questions with several articles show one image of the first article.\n- The images are stored in the quiz's image folder, at most 960 px wide.\n- The question bank is formatted as the quiz's own check wants, and the architecture check leaves the image folder to the question bank.", "reason": "The pilot image, the images of the other questions and the fix for the format and architecture checks follow each other directly on the branch of app-templates#61 and form one change.", "sources": [{"sha": "a4487d1", "subject": "feat(quiz): Pilotbild für grand-canyon aus Wikimedia Commons", "date": "2026-10-21T07:41:21+00:00", "pr": null, "plan": false, "moved": [{"kind": "dropped", "from": "i027", "why": "i027 is the session that this request started; its prompt came from here, so the request and its commits belong to this intent. i027 has no commits left."}]}, {"sha": "ea0737f", "subject": "feat(quiz): Naturwunder-Quiz zeigt Bilder aus Wikipedia", "date": "2026-10-21T08:05:59+00:00", "pr": null, "plan": false, "moved": [{"kind": "dropped", "from": "i028", "why": "The images of the other questions serve this request; the question in i028 about the tooling dependency led to no commit, so i028 has no commits left."}]}, {"sha": "5f46f30", "subject": "fix(quiz): format the bank as quiz/ wants, leave the image folder to the bank in the architecture check", "date": "2026-10-21T08:13:39+00:00", "pr": null, "plan": false, "moved": [{"kind": "dropped", "from": "i028", "why": "Fixes the format and architecture checks of the image pull request; i028 has no commits left."}]}]}], "messages": 2, "sourceCount": 3, "misplaced": []}, {"id": "i020", "session": "session_014MdJ7q9jkqHH8U2vvwK25y", "from": "2026-10-18T12:24:51.118958Z", "to": "2026-10-18T12:29:39+00:00", "repos": ["app-templates"], "commit": "feat(explainer): neutral practice text, worked tasks off with JavaScript, formulas in quiz texts", "intent": "The chemistry explainer hit three limits of the template that an app cannot change: the practice sentence speaks of \"immer neuen Zahlen\" where elements or substances vary, three worked tasks appear after each solved task although JavaScript makes new tasks, and formulas in quiz texts show as raw characters. The template should fix them for every explainer.", "decisions": ["a neutral default sentence and an optional `practice` per exercise, over only rewording the default", "worked tasks hidden with JavaScript by default, `workedTasks: always` to show them", "`$…$` in quiz-type texts renders as MathML at build and is checked like every formula"], "trigger": "\"Kummer Dich um issue 45\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i008", "note": "the issue came from the chemistry explainer"}], "groups": [{"repo": "app-templates", "message": "feat(explainer): neutral practice text, worked tasks off with JavaScript, formulas in quiz texts\n\n## Intent\n\nThe chemistry explainer hit three limits of the template that an app cannot change. The practice sentence said \"immer neuen Zahlen\" where elements or substances vary. Three worked tasks appeared after each solved task, although with JavaScript a learner gets as many new tasks as they like. Formulas in quiz texts showed as raw characters.\n\n## Key changes\n\n- The sentence above the live task is the exercise's optional `practice`, else the neutral \"Übe selbst, mit immer neuen Aufgaben:\".\n- The worked tasks show only without JavaScript, unless the exercise sets `workedTasks: always`.\n- In the texts of quiz-type exercises `$…$` is a formula, rendered as MathML at build and checked like every formula.\n- Schema, building blocks and runtime view describe the new fields; tests cover the formulas.\n\n## Dependencies and side effects\n\n- Closes lernapps/app-templates#45.", "reason": "One commit for one issue.", "sources": [{"sha": "e158769", "subject": "feat(explainer): neutral practice text, worked tasks off with JavaScript, formulas in quiz texts", "date": "2026-10-18T12:29:39+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i021", "session": "session_014W1XVCSQtEeUx5bjQrZyh3", "from": "2026-10-20T13:57:51.593802Z", "to": "2026-10-20T20:41:06+00:00", "repos": ["app-templates"], "commit": "feat(quiz): the learner chooses the number of questions at the start", "intent": "A learner should be able to answer only part of a quiz (issue #11), without the creator having to configure it. A shared link must still give everyone the same questions in the same order.", "decisions": ["the learner picks the count in a form at the start, over a questionCount setting in the question bank", "seed and count both go into the address (?seed=…&n=…), so a link reproduces the run without the form", "\"Noch einmal\" restarts at once with a new seed and the same count, over asking for the count again", "the restart stays a link styled as a button, over a <button> element", "the earlier questionCount commit and the merge of main are squashed into one commit"], "trigger": "\"Guck Dir mal die Issues für das Quiz an und wenn sie eindeutig sind: Lösen\" … \"Ich dachte eher daran, dass man beim Start des Quiz die Anzahl der Fragen selbst auswählen kann. Natürlich nicht mehr als Fragen da sind. Aber das geht ohne Konfiguration\"", "kind": "feature", "confidence": "evidenced", "relations": [], "groups": [{"repo": "app-templates", "message": "feat(quiz): the learner chooses the number of questions at the start\n\n## Intent\n\nLet a learner answer only part of a quiz (#11) without any configuration by the creator. A shared link must still give everyone the same questions in the same order.\n\n## Key changes\n\n- Before the first question, a form asks how many questions to answer: from 1 to all, all by default.\n- The seed and the chosen count are in the address (?seed=…&n=…). A link with them opens the same questions in the same order and skips the form; so do a link to a single question and a quiz of one question.\n- Questions outside the run are removed with their solutions; progress and score count only the questions asked. Without JavaScript, the page still shows all questions.\n- At the end, \"Noch einmal\" (en \"Again\") starts at once with a new seed and the same count. It is a link that looks like a button.\n- The question bank needs no new setting. New texts in German and English, an end-to-end test for the form, README and runtime view updated.", "reason": "One commit for one request; the preview workflow after it serves another request (i022).", "sources": [{"sha": "a590fc2", "subject": "feat(quiz): the learner chooses the number of questions at the start", "date": "2026-10-20T20:41:06+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 9, "sourceCount": 1, "misplaced": []}, {"id": "i022", "session": "session_014W1XVCSQtEeUx5bjQrZyh3", "from": "2026-10-20T20:42:10.224556Z", "to": "2026-10-20T20:42:37+00:00", "repos": ["app-templates"], "commit": "ci: preview the templates on every pull request", "intent": "A change to the templates could only be checked by CI, not seen. Every pull request of app-templates should get a preview of the built quiz, explainer and interactive template, the way the apps already have one, so a change can be validated by looking at it.", "decisions": ["take the finished but never merged workflow from feat/pr-preview, over writing a new one", "publish with the app preview action of the tooling at lernapps.net/app-templates/pr-preview/pr-<number>/, like the apps", "create gh-pages as an empty branch without history", "the workflow joins the quiz pull request, so the preview runs for it at once", "build the preview into preview/, since npm ci already builds the runtime into dist/"], "trigger": "\"Ci grün, aber bei den Template gibt es kein Review environment mit deployment von Beispielen, wie es bei denjenigen Apps ist. So kann ich das nicht validieren\" … \"Price build failed\"", "kind": "chore", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i021", "note": "the preview makes the quiz change of that pull request visible"}], "groups": [{"repo": "app-templates", "message": "ci: preview the templates on every pull request\n\n## Intent\n\nMake a change to the templates visible, not only checked. Every pull request gets a preview of the built templates, the way the apps already have one.\n\n## Key changes\n\n- A preview workflow builds the quiz, the explainer and the interactive template as apps, with a page that links them.\n- The app preview action of lernapps/tooling publishes them on gh-pages at https://lernapps.net/app-templates/pr-preview/pr-<number>/ and links the preview in a comment on the pull request. Closing or merging removes it.\n- The preview is built into preview/, because npm ci already builds the runtime package into dist/.\n\n## Dependencies and side effects\n\n- Needs the branch gh-pages and GitHub Pages serving it from its root.", "reason": "The workflow and the fix of its first failed build follow each other directly on the branch of the pull request.", "sources": [{"sha": "6a2d39b", "subject": "ci: preview the templates on every pull request", "date": "2026-10-20T20:41:06+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i021", "why": "Adds the preview environment asked for after the quiz change was done; it serves this request, not the question count."}]}, {"sha": "8f02e10", "subject": "ci: build the preview into preview/, dist/ is the runtime's", "date": "2026-10-20T20:42:37+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 2, "misplaced": []}, {"id": "i023", "session": "session_01537VuyMcBpBAyDCg9zEBgc", "from": "2026-10-17T08:53:34.376634Z", "to": "2026-10-17T16:43:37+00:00", "repos": ["apps"], "commit": "feat(entries): list Typonaut, a touch-typing game", "intent": "Test in a first full run whether the tooling carries an interactive app from the build prompt to the catalog: a separate session with Sonnet 5.5 knows only the public guidance and skills, and the creator answers there. List the resulting app, a playful touch-typing course for children, in the catalog.", "decisions": ["the pilot session knows only the skills and the public llms.txt, not our repos", "the app in the creator's own repo on his GitHub Pages, over a repo under lernapps", "the creator named Oliver, not the GitHub handle the agent had assumed", "limits stated openly: no screen reader, not for phones"], "trigger": "In the parent session: \"Ja. sonnet 5.5\" … \"https://github.com/mrsimpson/tipp-huhn\" … \"Eigentlich sollte die andere Sessions nichts über unsere Repos wissen. Nur über die skills\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i116", "note": "the first full creator run of the interactive archetype"}], "groups": [{"repo": "apps", "message": "feat(entries): list Typonaut, a touch-typing game\n\n## Intent\n\nList Typonaut in the catalog, as the last step of the first full creator run of the interactive archetype: a session that knows only the public guidance and skills builds an app from the build prompt to the listing.\n\n## Key changes\n\n- A catalog entry for Typonaut: Informatik for grades 3 to 13, at https://mrsimpson.github.io/typonaut/, in German and English.\n- Words fly across the screen and turn into stardust when typed; chapter by chapter new keys join, from the home row to the whole keyboard.\n- Two topics: German with a German keyboard (QWERTZ) and English with an English keyboard (QWERTY).\n- Limits stated openly: not usable with a screen reader and not meant for phones.\n- Fitness: no account, no install, storage on the device, no third parties.\n- The creator is Oliver, linked to his GitHub profile.", "reason": "The listing commit and the fix of its creator name follow each other directly on the listing branch; one entry, one commit.", "sources": [{"sha": "2b69b46", "subject": "Add Typonaut", "date": "2026-10-17T16:30:54+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "cf7c490", "subject": "Typonaut: creator is Oliver", "date": "2026-10-17T16:43:37+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i024", "why": "Corrects the creator name of the same entry; i024 has no commits left."}]}]}], "messages": 20, "sourceCount": 2, "misplaced": []}, {"id": "i025", "session": "session_016y86BfYPY91T17rZ598DJ9", "from": "2026-10-18T20:54:32.308804Z", "to": "2026-10-18T21:01:15+00:00", "repos": ["tooling"], "commit": "fix: .nojekyll for published apps; rules-review stays out of apps", "intent": "Work off the open issues that are clear bugs. Pages did not serve files whose names start with an underscore, so components did not start (#107). And `npx skills add lernapps/tooling` installed the maintainers' skill rules-review into apps (#85).", "decisions": ["one commit per issue", "#107 and #85 now; the other issues stay open for later", "leave the third-party skill arc42-language as it is, since a change would break its hash"], "trigger": "\"Lass uns issues abarbeiten\" … \"Mach die beiden 107 und 85 , jeweils einzelne commits. Brauchen wir den Rest noch?\"", "kind": "fix", "confidence": "evidenced", "relations": [], "groups": [{"repo": "tooling", "message": "fix(publish): write .nojekyll into the bundle so Pages serves files starting with _\n\n## Intent\n\nPages ran published apps through Jekyll, which drops files whose names start with an underscore, so components did not start (#107).\n\n## Key changes\n\n- The publish step writes an empty .nojekyll into the bundle, next to the marker file.\n\n## Dependencies and side effects\n\n- Closes #107.", "reason": "One commit per issue, as asked.", "sources": [{"sha": "a09dd3a", "subject": "fix(publish): write .nojekyll into the bundle so Pages serves files starting with _", "date": "2026-10-18T21:00:58+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "fix(skills): mark rules-review as internal so npx skills add skips it\n\n## Intent\n\n`npx skills add lernapps/tooling` installed the maintainers' skill rules-review into apps (#85).\n\n## Key changes\n\n- rules-review is marked `metadata.internal`; the skills CLI lists such skills only when INSTALL_INTERNAL_SKILLS is set.\n\n## Dependencies and side effects\n\n- Closes #85.", "reason": "One commit per issue, as asked.", "sources": [{"sha": "003ab58", "subject": "fix(skills): mark rules-review as internal so npx skills add skips it", "date": "2026-10-18T21:01:15+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i026", "session": "session_016y86BfYPY91T17rZ598DJ9", "from": "2026-10-18T21:36:45.548790Z", "to": "2026-10-18T21:47:12+00:00", "repos": ["tooling"], "commit": "test: the planted app's Playwright config launches the installed Chromium", "intent": "The branch with the two issue fixes could not be pushed: the pre-push run failed in the sandbox, because one test's own Playwright config ignored the installed Chromium that lernapps check already falls back to. Fix the test instead of bypassing the hook.", "decisions": ["fix the test in a third commit, over pushing with --no-verify", "reuse the existing fallback (LERNAPPS_CHROMIUM) instead of installing a browser"], "trigger": "\"Gibt es da nicht eine Notiz, wie man mit dem Test umgeht? Das hatten wir schon mal\" … \"Dritter commit\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i025", "note": "gets the issue fixes through the pre-push run"}], "groups": [{"repo": "tooling", "message": "test: the planted app's Playwright config launches the installed Chromium of lernapps check\n\n## Intent\n\nWhere Playwright's own Chromium is missing, lernapps check starts an installed one and passes it in LERNAPPS_CHROMIUM. The plain Playwright config of the check-repo test ignored it and failed in a sandbox, which blocked the pre-push run.\n\n## Key changes\n\n- The test's config launches the browser from LERNAPPS_CHROMIUM when it is set.", "reason": "Its own commit, as asked.", "sources": [{"sha": "0ef18cb", "subject": "test: the planted app's Playwright config launches the installed Chromium of lernapps check", "date": "2026-10-18T21:47:12+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 3, "sourceCount": 1, "misplaced": []}, {"id": "i029", "session": "session_017bKoC91qafWGoXttujq2Zf", "from": "2026-10-21T08:23:45.065573Z", "to": "2026-10-21T09:11:54+00:00", "repos": ["app-templates"], "commit": "fix(quiz): keep the quiz light despite its images", "intent": "The seven new images made the quiz page about 33 times as large as before, and the browser fetched every image at once, even those of questions the learner has not reached. The page must stay light on a phone. The image pull request also stayed red, because the CI copied its test images into a nested folder once the quiz had an image folder of its own.", "decisions": ["images at 800 px and lower quality, over keeping them at 960 px", "images stay in the app's source image folder as the runtime expects, over moving them to assets or public", "lazy loading in the runtime as a pull request of its own, over mixing it into the image pull request", "loading=lazy and decoding=async only, over also setting width and height, which needs the image sizes at build time", "fix the copy command of the CI job, over moving the images or changing the runtime or the fixture"], "trigger": "\"Wie werden denn die Bilder gebundelt? Sollten Sie eigentlich in SRC oder in Asset landen?\" … \"Ich mache mir ein wenig Gedanken bezüglich der bundle soze\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i019", "note": "makes the images of the Naturwunder-Quiz smaller and lets the browser load them only when needed"}], "groups": [{"repo": "app-templates", "message": "fix(quiz): images at 800 px; the quiz-material job copies its images into an existing folder\n\n## Intent\n\nThe seven images made the quiz page about 33 times as large as its script and styles, and the page must stay light on a phone. The CI job quiz-material also failed once the quiz had an image folder of its own, because it copied its test images into a nested folder.\n\n## Key changes\n\n- Every image is at most 800 px wide and more strongly compressed: about 450 kB in all instead of 737 kB.\n- The job quiz-material creates the image folder and copies the content of the fixture's image folder into it, whether the folder exists or not.\n\n## Dependencies and side effects\n\n- app-templates 1583231 lets the browser load each image only when it is needed.", "reason": "The last commit of app-templates#61; the commit before it belongs to the image request, so it stays alone.", "sources": [{"sha": "51ae9b0", "subject": "fix(quiz): images at 800 px, quiz-material job copies the fixture images into an existing src/images", "date": "2026-10-21T09:11:54+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "feat: load figure images lazily\n\n## Intent\n\nThe browser fetched the images of every question at once, even those the learner has not reached yet. A quiz with an image at every question should load only what is shown.\n\n## Key changes\n\n- Images of questions and explainer pages carry loading=lazy and decoding=async.\n\n## Dependencies and side effects\n\n- app-templates 51ae9b0 makes the images of the Naturwunder-Quiz smaller.", "reason": "A runtime change on a branch of its own.", "sources": [{"sha": "1583231", "subject": "feat: load figure images lazily", "date": "2026-10-21T09:10:31+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i019", "why": "Lazy loading answers the worry about the size of the quiz raised here; the steering session only passed the decision on."}]}]}], "messages": 5, "sourceCount": 2, "misplaced": []}, {"id": "i030", "session": "session_019MvsLyLtPrSxkqLvyNPTzk", "from": "2026-10-08T05:25:38.988324Z", "to": "2026-10-08T05:28:34+00:00", "repos": [".github"], "commit": "docs: app overview instead of map, Oliver as sole owner", "intent": "lernapps/.github still names the map and two owners, because the earlier session could not reach this repo. It should match the docs: the app overview replaces the map, and Oliver Jägle is the sole owner.", "decisions": ["take the content from the docs branch and the apps repo, over reapplying the old patch", "also fix CONTRIBUTING.md, the issue chooser and the org profile, so no link points to the map once it is archived", "work on a branch and merge together with apps#1 and docs#12"], "trigger": "\"In einen der Session https://claude.ai/code/session_01EyV1HdhPctE65bCEgVHtuE wolltest Du ein paar Änderungen an diesem Repo machen und das klappte nicht. Kannst Du sie in dieser session patchen?\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i220", "note": "the governance change that could not be made from the other session"}], "groups": [{"repo": ".github", "message": "docs: app overview instead of map, Oliver as sole owner\n\n## Intent\n\nlernapps/.github still names the map and two owners, because the earlier session could not reach this repo. It should match the docs: the app overview replaces the map, and Oliver Jägle is the sole owner.\n\n## Key changes\n\n- ORGANIZATION.md: apps (lernapps.net/apps/) replaces map in the repo table, in how to reach us, in the rules across repos and in the license table; map is being retired; docs holds biz42 and pdt42.\n- GOVERNANCE.md: one owner, accountable for the platform; Ralf is the author of the Mathe-Karte and does not take part in the platform, as in biz42 chapter 8.\n- CONTRIBUTING.md, the issue chooser and the org profile send people who list an app to lernapps.net/apps/eintragen/ instead of issues in map.", "reason": "One commit for one request.", "sources": [{"sha": "01f2aef", "subject": "docs: app overview instead of map, Oliver as sole owner", "date": "2026-10-08T05:28:34+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i031", "session": "session_019MvsLyLtPrSxkqLvyNPTzk", "from": "2026-10-08T07:19:36.325260Z", "to": "2026-10-08T07:41:39+00:00", "repos": [".github", "app-templates", "apps", "docs", "lernapps.github.io", "tooling"], "commit": "feat: shared site frame, site actions and Renovate preset for all lernapps.net sites", "intent": "After the merges, the organisation should be consistent. No traces of edugo should remain, and only relevant issues should stay open. The story of the platform design should make clear what each repo is for, so that a person or an agent finds their way at once. Sites deployed separately should behave and look the same: shared design tokens and a shared header come as an npm package from the home page repo, referenced by git and kept current by Renovate.", "decisions": ["the package @lernapps/site in lernapps.github.io, installed from git, over publishing it to npm", "shared site actions (check, deploy, preview) in tooling with unchanged job names, so required checks stay valid", "an org Renovate preset in tooling that updates own building blocks as soon as they are green", "inject header and footer into the built HTML of the docs, over rebuilding the biz42 and pdt42 apps", "the edugo clean-up of the Mathe-Karte as a pull request for its author, without the shared frame there", "app-template drops the manifest lernapps.json; an app is listed with one entry in lernapps/apps"], "trigger": "\"Damit das alles auf einem konsistenten Stand ist, füge dieser Session alle nicht-archivierten repositories der lernapps Organisation hinzu … 1. überprüfe, dass alle Referenzen auf die frühere edugo Anwendung verschwunden sind. 2. prüfe alle issue an allen repos … 3. die Story aus dem Plattform Design der docs muss erkennbar sein … 4. … gemeinsame Design-tokens per nom Paket … Ebenso eine gemeinsame Header Navigation.\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i030", "note": "the .github branch gets the story on top"}], "groups": [{"repo": "tooling", "message": "feat: site actions for check, deploy and preview, and the org's Renovate preset\n\n## Intent\n\nAfter the merges, the organisation should be consistent. No traces of edugo should remain, and only relevant issues should stay open. The story of the platform design should make clear what each repo is for, so that a person or an agent finds their way at once. Sites deployed separately should behave and look the same: shared design tokens and a shared header come as an npm package from the home page repo, referenced by git and kept current by Renovate.\n\n## Key changes\n\n- actions/site-check, site-deploy and site-preview hold the build, check, deploy and preview of every site, taken from the identical workflows of lernapps.github.io, apps and docs.\n- default.json is the Renovate preset of every repo; it extends the owner's config, and our own building blocks (@lernapps/site, these actions) follow main without release age and merge when green.\n\n## Dependencies and side effects\n\n- Same request: tooling (3a97735), lernapps.github.io (7f0df23, 888090c, c058c94, 1789f9b), apps (bc971c4, 6d5f8ce), docs (6941e78), app-templates (afaa590), .github (40c8ac7).", "reason": "One commit in tooling.", "sources": [{"sha": "3a97735", "subject": "feat: site actions for check, deploy and preview, and the org's Renovate preset", "date": "2026-10-08T07:34:00+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "lernapps.github.io", "message": "feat: shared chrome of all lernapps.net sites, used by the home page\n\n## Intent\n\nAfter the merges, the organisation should be consistent. No traces of edugo should remain, and only relevant issues should stay open. The story of the platform design should make clear what each repo is for, so that a person or an agent finds their way at once. Sites deployed separately should behave and look the same: shared design tokens and a shared header come as an npm package from the home page repo, referenced by git and kept current by Renovate.\n\n## Key changes\n\n- chrome/ is the npm package @lernapps/site: design tokens, header with the common navigation, footer with privacy notice and imprint, skip link and preview banner.\n- An Eleventy plugin for Eleventy sites, and a command that puts the same frame into built HTML (for the docs).\n- lernapps-check, the deploy check of every site, merged from the check scripts of the home page and apps.\n- The home page, the legal pages and the 404 page use it; the workflows call the shared site actions in tooling.\n\n## Dependencies and side effects\n\n- Same request: tooling (3a97735), lernapps.github.io (7f0df23, 888090c, c058c94, 1789f9b), apps (bc971c4, 6d5f8ce), docs (6941e78), app-templates (afaa590), .github (40c8ac7).", "reason": "The package and its first use, one commit.", "sources": [{"sha": "7f0df23", "subject": "feat: shared chrome of all lernapps.net sites, used by the home page", "date": "2026-10-08T07:34:32+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "lernapps.github.io", "message": "chore: Renovate preset of the org (lernapps/tooling)\n\n## Intent\n\nAfter the merges, the organisation should be consistent. No traces of edugo should remain, and only relevant issues should stay open. The story of the platform design should make clear what each repo is for, so that a person or an agent finds their way at once. Sites deployed separately should behave and look the same: shared design tokens and a shared header come as an npm package from the home page repo, referenced by git and kept current by Renovate.\n\n## Key changes\n\n- renovate.json extends github>lernapps/tooling.\n\n## Dependencies and side effects\n\n- Same request: tooling (3a97735), lernapps.github.io (7f0df23, 888090c, c058c94, 1789f9b), apps (bc971c4, 6d5f8ce), docs (6941e78), app-templates (afaa590), .github (40c8ac7).", "reason": "The switch to the org preset, kept apart from the package.", "sources": [{"sha": "888090c", "subject": "chore: Renovate preset of the org (lernapps/tooling)", "date": "2026-10-08T07:34:40+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "lernapps.github.io", "message": "fix(chrome): noindex in previews of built HTML; the check skips inline scripts\n\n## Intent\n\nAfter the merges, the organisation should be consistent. No traces of edugo should remain, and only relevant issues should stay open. The story of the platform design should make clear what each repo is for, so that a person or an agent finds their way at once. Sites deployed separately should behave and look the same: shared design tokens and a shared header come as an npm package from the home page repo, referenced by git and kept current by Renovate.\n\n## Key changes\n\n- The command for built HTML also puts noindex into previews.\n- lernapps-check ignores markup-like strings inside inline scripts when it looks for links.\n\n## Dependencies and side effects\n\n- Same request: tooling (3a97735), lernapps.github.io (7f0df23, 888090c, c058c94, 1789f9b), apps (bc971c4, 6d5f8ce), docs (6941e78), app-templates (afaa590), .github (40c8ac7).", "reason": "Two fixes of the package found while adopting it in docs, directly one after the other.", "sources": [{"sha": "c058c94", "subject": "fix(chrome): inject noindex into previews of built HTML", "date": "2026-10-08T07:36:07+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "1789f9b", "subject": "fix(chrome): lernapps-check skips inline scripts when looking for links", "date": "2026-10-08T07:37:03+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "feat: shared chrome and site actions in the app overview\n\n## Intent\n\nAfter the merges, the organisation should be consistent. No traces of edugo should remain, and only relevant issues oling repo and reference it in the plan for the code phase.\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i034", "note": "the architecture of the tooling"}], "groups": [{"repo": "tooling", "message": "ci: publish the architecture at lernapps.net/tooling/ with a review preview per pull request\n\n## Intent\n\nThe architecture is hard to read as isolated Markdown. Publish it as a site, with a preview per pull request and the arc42 diff in a comment, as docs does for the platform design and biz42. The open points of this site are recorded for the Code phase.\n\n## Key changes\n\n- scripts/build.sh validates and builds docs/arc42 with the arc42 web app under a short start page and the shared site frame.\n- pages.yml publishes main to gh-pages, served at lernapps.net/tooling/.\n- pr-preview.yml adds a preview per pull request with the architecture diff since the merge base, and one comment that lists the changes.\n- The plan links issue #6: no shared header on the diff page, own actions not exercised by this repo's workflows, /tooling/ missing from the site frame's list of sites.", "reason": "The plan commit joins its parent by the plan rule; it records the open points of this same site.", "sources": [{"sha": "b88b17e", "subject": "ci: publish the architecture at lernapps.net/tooling/ with a review preview per pull request", "date": "2026-10-08T14:53:16+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "72787d4", "subject": "docs(plan): open points of the documentation site in the Code phase (#6)", "date": "2026-10-08T14:56:55+00:00", "pr": 6, "plan": true, "moved": []}]}], "messages": 5, "sourceCount": 2, "misplaced": []}, {"id": "i036", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-08T14:56:35.633Z", "to": "2026-10-08T17:39:01+00:00", "repos": ["tooling"], "commit": "docs(arc42): quality goals grounded in the platform design, metrics with their source", "intent": "The quality goals of the tooling should rest on the platform design. Other agents cannot be measured directly, so every scenario needs a number from a source that can actually be observed.", "decisions": ["seven goals, each traced to a part of the platform design", "simplicity for the creator and cost for the assistant as separate goals, over one goal", "a retrospective section in the plan file as a cheap source of numbers", "agent feedback after a session deferred to an issue (#8), over an API now"], "trigger": "\"OK, let’s discuss the actual quality goals and quality scenarios. They should be grounded in the pdt.\" … \"1. keep them separate. One addresses simplicity, the other cost. 2. I like the retrospective section. … 3. yes. Create an issue which we defer for now.\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i034", "note": "replaces the first quality goals"}], "groups": [{"repo": "tooling", "message": "docs(arc42): quality goals grounded in the platform design, metrics with their source\n\n## Intent\n\nThe quality goals of the tooling should rest on the platform design. Other agents cannot be measured directly, so every scenario needs a number from a source that can actually be observed.\n\n## Key changes\n\n- Chapter 10 has seven goals, each quoting the part of the platform design it rests on, and thirteen scenarios.\n- A new section says how the scenarios are measured: evals, listing reports, the plan's retrospective, conversations with creators.\n- The plan records KD-16 and KD-17 (retrospective in the plan file); agent feedback is deferred to #8.", "reason": "One commit for one request.", "sources": [{"sha": "b9b987c", "subject": "docs(arc42): quality goals grounded in the platform design, metrics with their source", "date": "2026-10-08T17:39:01+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 4, "sourceCount": 1, "misplaced": []}, {"id": "i037", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-08T17:41:59.546Z", "to": "2026-10-08T17:42:23+00:00", "repos": ["tooling"], "commit": "docs(arc42): listing targets and eval assistants", "intent": "The listing scenario and the evals need concrete targets and named assistants.", "decisions": ["half of the listing pull requests pass on the first run, 7 of 8 on the second after a comment with the deterministic check results", "evals by hand with Claude Code, Codex and Gemini CLI on their latest models, over an automated eval pipeline"], "trigger": "\"I’d say that half of PRs schools pass in the first run. Then, after a review comment writing the deterministic check results,, 7/8 should pass on second run. We want to evaluate Gemini, codex and Claude code (manually, as you suggested), wit the latest models.\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i036", "note": "targets for its scenarios"}], "groups": [{"repo": "tooling", "message": "docs(arc42): listing targets and eval assistants\n\n## Intent\n\nThe listing scenario and the evals need concrete targets and named assistants.\n\n## Key changes\n\n- qs-first-listings: half of the listing pull requests pass validation on the first run, 7 of 8 on the second after a comment with the check results.\n- The \"other assistant\" scenario requires Claude Code, Codex and Gemini CLI to pass, run by hand on their latest models.\n- The plan records the results comment (KD-10) and that there is no automated eval pipeline (KD-14).", "reason": "One commit for one request.", "sources": [{"sha": "0c59705", "subject": "docs(arc42): listing targets and eval assistants set by the owner", "date": "2026-10-08T17:42:23+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i038", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-08T17:44:43.386Z", "to": "2026-10-08T17:45:00+00:00", "repos": ["tooling"], "commit": "docs(arc42): the Mathe-Karte inspires the content archetype; its compliance is out of scope", "intent": "The Mathe-Karte should serve as inspiration for one archetype, but whether it complies with the tooling is out of scope.", "decisions": ["the Mathe-Karte only as inspiration, over planning its adoption of the shared checks"], "trigger": "\"We can ignore mathekarte compliance for now, but use it as inspiration for one archetype.\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i036", "note": "answers an open point of the quality goals"}], "groups": [{"repo": "tooling", "message": "docs(arc42): the Mathe-Karte inspires the content archetype; its compliance is out of scope\n\n## Intent\n\nThe Mathe-Karte should serve as inspiration for one archetype, but whether it complies with the tooling is out of scope.\n\n## Key changes\n\n- Chapter 1 and the evidence file say that the Mathe-Karte's compliance is out of scope and that it inspires the content archetype.", "reason": "One commit for one request.", "sources": [{"sha": "8745a4d", "subject": "docs(arc42): the Mathe-Karte inspires the content archetype; its compliance is out of scope", "date": "2026-10-08T17:45:00+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i039", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-08T17:54:41.524Z", "to": "2026-10-08T17:55:13+00:00", "repos": ["tooling"], "commit": "docs(plan): archetypes named by character, quiz as a skeleton, TypeScript everywhere", "intent": "Archetypes should be named after their character, not their use, and all code should be strictly typed. A quiz is listed as a further archetype without building it yet.", "decisions": ["names by character, over names by use such as \"lesson\"", "TypeScript everywhere and strictly enforced, over plain JavaScript with type checking", "quiz as a skeleton that is not implemented yet"], "trigger": "\"Id name the archetypes as per their character, not their use. … We should use typescript everywhere and strictly enforce it. We could list “quiz” as other archetype skeleton which we don’t implement yet\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i038", "note": "the archetype inspired by the Mathe-Karte"}], "groups": [{"repo": "tooling", "message": "docs(plan): archetypes named by character, quiz as a skeleton, TypeScript everywhere\n\n## Intent\n\nArchetypes should be named after their character, not their use, and all code should be strictly typed. A quiz is listed as a further archetype without building it yet.\n\n## Key changes\n\n- KD-02: a content-heavy and an interactive archetype first; quiz as a third, listed as a skeleton; names still open.\n- KD-06: TypeScript everywhere, strict, no JavaScript sources, type check in the pre-commit hook and in CI.\n- Chapter 1 and the evidence file follow.", "reason": "One commit for one request.", "sources": [{"sha": "e8010cf", "subject": "docs(plan): archetypes named by character, quiz as a skeleton, TypeScript everywhere", "date": "2026-10-08T17:55:13+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i040", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-08T18:02:16.087Z", "to": "2026-10-08T18:02:29+00:00", "repos": ["tooling"], "commit": "docs(arc42): count the creator's turns after the confirmed plan, not decisions", "intent": "Counting the creator's decisions is a poor measure: many turns before the plan can mean good assistance. Once the creator confirms the plan, the assistant should work on its own.", "decisions": ["at most 3 creator turns after the confirmed plan, over at most 4 decisions", "turns before the plan are not measured", "the plan's retrospective records these turns"], "trigger": "\"I think this at most questions is not a good key figure. Sometimes, multi turns is actually a measurement for good assistance. I’d actually count the interactions after the plan
