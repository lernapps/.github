 request tests an explainer app with a component against this pin.", "reason": "A commit of tooling#69 with its own thought, the pin of the type-check fix; kept apart from the guidance before it and the generator change after it.", "sources": [{"sha": "9b885fa", "subject": "fix(explainer): pin app-templates whose app type check reads only src/", "date": "2026-10-14T23:10:54+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i094", "why": "Pins the type-check fix that the question about node_modules in this intent led to."}]}]}, {"repo": "tooling", "message": "fix(create): keep the installed skills, and create only from the confirmed plan\n\n## Intent\n\nThe second explainer run never read the plan template in full and created the app right after a plan was confirmed. Without a plan file, create silently wrote one in the phase code, which hid that Explore and Plan were skipped. And the new first task of Explore, installing the skills, made create refuse the folder. Let create keep the installed skills, and create only from a confirmed plan.\n\n## Key changes\n\n- create accepts exactly what installing the tooling's skills writes: the lock file and each locked skill's folder or link. It keeps them, writes the content guide beside them and ignores them in git, like node_modules; the app's own content guide stays committed.\n- Without a plan, create refuses and says to start one from the plan template, downloaded complete and unchanged; with a plan still in Explore or Plan it says the creator must confirm it first; with another archetype than asked it names both.\n- The explainer's end-to-end test adds a valid component and runs the commit's part of the check, which failed on the previous app-templates pin.\n\n## Dependencies and side effects\n\n- Same intent: app-templates#20, whose type-check fix this pull request pins.", "reason": "A commit of tooling#69 with its own thought, the generator; kept apart from the pin.", "sources": [{"sha": "071146b", "subject": "fix(create): keep the installed skills, and create only from the confirmed plan", "date": "2026-10-14T23:11:10+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i094", "why": "The generator part of the read-in-full finding in i092: create keeps installed skills and refuses without a confirmed plan."}]}]}, {"repo": "app-templates", "message": "fix(explainer): the app's type check reads src/ only, and the client reaches no Node code\n\n## Intent\n\nIn an explainer app with a component, vue-tsc checked every .ts file of the app and, through vite.config.ts and e2e/, the runtime's build and test code in node_modules. That is Node code, which the app's browser types cannot check: 19 errors for an app whose own code had none. Check only the app's own code.\n\n## Key changes\n\n- The template's tsconfig includes src/ only, so vue-tsc checks the app's own code and components with the tooling's settings.\n- vite.config.ts, playwright.config.ts and e2e/ stay checked by vp check, which reports only the app's own files.\n- The component types the client reached through a Node module now live in a plain content module, so nothing src/ reaches needs Node.\n- The quiz is unchanged: it has no components, so vue-tsc does not run there.\n\n## Dependencies and side effects\n\n- Same intent: tooling#69 pins this commit, and its guidance and generator changes.", "reason": "The only commit of app-templates#20.", "sources": [{"sha": "98cfbc4", "subject": "fix(explainer): the app's type check reads src/ only, and the client reaches no Node code", "date": "2026-10-14T23:01:19+00:00", "pr": null, "plan": false, "moved": [{"kind": "dropped", "from": "i093", "why": "Answers this intent's question whether the check should include node_modules. i093 has no commits left; its other finding, the labelled figure, is fixed in i094."}]}]}], "messages": 3, "sourceCount": 5, "misplaced": []}, {"id": "i094", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T23:01:41.032Z", "to": "2026-10-14T23:11:30+00:00", "repos": ["app-templates"], "commit": "fix(explainer): a labelled figure of an SVG with only a viewBox has a size", "intent": "Find out whether the template or the session was at fault when labelled figures of the session's own SVG diagrams failed the template's test without JavaScript, and fix it where it belongs.", "decisions": ["reproduce first, then fix in the template if it is a template bug, or else fail the build early or add a skill hint", "the build marks an SVG without width and height, and its wrapper fills the width as a plain figure does"], "trigger": "\"Gucke dir den Fortgang der Session an. Gibt es da neue Erkenntnisse?\" … \"Lass mal prüfen\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i076", "note": "labelled-figure came with step 2 of the runtime"}], "groups": [{"repo": "app-templates", "message": "fix(explainer): a labelled figure of an SVG with only a viewBox has a size\n\n## Intent\n\nIn the second explainer run, the session's own SVG circuit diagrams in labelled figures failed the template's test without JavaScript on every page, and the session worked around it with numbers drawn into the image. Check whether the template or the session is at fault; it was the template.\n\n## Key changes\n\n- The image of a labelled figure sits in an inline-block wrapper as wide as its content, so the markers' percentages match. An SVG without width and height has no width of its own, and Chromium drew it at zero width, invisible.\n- The build now marks such an SVG, and its wrapper fills the width as a plain figure's image does.\n- The fixture with every block has such an SVG in a labelled figure.", "reason": "The only commit of app-templates#21.", "sources": [{"sha": "0f9a009", "subject": "fix(explainer): a labelled figure of an SVG with only a viewBox has a size", "date": "2026-10-14T23:11:30+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i095", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T23:20:23.971Z", "to": "2026-10-14T23:47:14+00:00", "repos": ["app-templates", "apps", "tooling"], "commit": "fix: lessons from the second explainer run: published address, content guide in the review, credits and links by language", "intent": "Learn from the second explainer run: take the published address from the deploy job, let the review read the content guide, and let credits and link addresses differ by language.", "decisions": ["take the address the deploy job prints and follow redirects, never a derived github.io address", "the review input carries the content guide, and the review prompt reads it before the rubric", "a credit's source is a text like any other (a URL stays one string); a link's address may be one https address or a map by language", "points 4 and 5 now, point 3 after"], "trigger": "\"Die andere Session ist jetzt fertig. Was können wir daraus lernen?\" … \"Ja, 4 und 5 jetzt, 3 danach\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i090", "note": "the rubric item app-content-matches could not work without the guide in the review input"}, {"type": "revises", "intent": "i081", "note": "language maps extended to credits and link addresses"}], "groups": [{"repo": "tooling", "message": "docs(guidance): take the published address from the deploy job; the review reads the content guide\n\n## Intent\n\nThe second explainer run waited for an answer from the repo's github.io address, which only redirects to lernapps.net. And its review could not compare the content guide with the content, because the guide was not in the review input. Take the address from the deploy job, and let the review read the guide.\n\n## Key changes\n\n- The plan template says to take the address the deploy job printed, never a derived one, not to wait on it, since the job already did, and to follow redirects.\n- The review prompt reads the content guide from the prepared input before the rubric, which compares it with the content.\n\n## Dependencies and side effects\n\n- Works with lernapps/apps#27, which puts the guide into the review input; either can be merged first.\n- Same intent: app-templates#22 and tooling#71 give credits and link addresses per language.", "reason": "The only commit of tooling#70.", "sources": [{"sha": "83c6081", "subject": "docs(guidance): take the published address from the deploy job; the review reads the content guide", "date": "2026-10-14T23:25:01+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "docs(skills): a credit's source and a link's url by language\n\n## Intent\n\napp-templates now lets a credit's source and a link's address differ by language. Tell the assistant in the skills, and say that page addresses, not link addresses, are the same in every language.\n\n## Key changes\n\n- lernapps-explainer: credit.source takes a language map like any text, a URL stays one string; page addresses, numbers, formulas and drawn figures are the same in every language.\n- lernapps-quiz: a link's url is one address for every language or a map by language.\n\n## Dependencies and side effects\n\n- Describes the schemas of app-templates#22 in this intent.", "reason": "Both commits of tooling#71: the skill lines for one schema change, and a one-word clarification of them.", "sources": [{"sha": "5506327", "subject": "docs(skills): a credit's source and a link's url by language", "date": "2026-10-14T23:39:17+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "464b78f", "subject": "docs(explainer): page addresses, not link addresses, are the same in every language", "date": "2026-10-14T23:47:14+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "fix(review): put the app's content guide into the review input\n\n## Intent\n\nThe review agent compares the content guide with the content (rubric item app-content-matches). But the review input held only the bundle, the plan, package.json and the lock file, so in the review of the electricity listing the agent could not read the guide. Put the guide into the review input.\n\n## Key changes\n\n- The review input carries .agents/skills/app-content/SKILL.md, and the workflow's prompt names it.\n- The review test fails without the change and passes with it.\n\n## Dependencies and side effects\n\n- Works with tooling#70, whose review prompt reads the guide; either can be merged first.", "reason": "The only commit of apps#27.", "sources": [{"sha": "d60cad3", "subject": "fix(review): put the app's content guide into the review input", "date": "2026-10-14T23:26:49+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "feat(schemas): a credit's source and a link's address by language\n\n## Intent\n\nIn the bilingual electricity app, a figure's credit had one text for every page and a link one address, so English pages credited in German and linked the German Wikipedia. Let both differ by language.\n\n## Key changes\n\n- credit.source is a text like any other: a string while German is the only language, else a map with every declared language. A source that is only a URL stays one string, shown as a link.\n- A link's url, shared by the quiz and the explainer's exercises, is one https address or a map of https addresses by language, complete like a text's map. German-only quizzes and plain addresses stay valid.\n- Each language's page renders its own credit and address at build, so the page without JavaScript has them.\n- A bad address says it must be an https address.\n\n## Dependencies and side effects\n\n- The tooling skills describe this in tooling#71 of this intent.", "reason": "The only commit of app-templates#22.", "sources": [{"sha": "c421aba", "subject": "feat(schemas): a credit's source and a link's address by language", "date": "2026-10-14T23:36:19+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 5, "misplaced": []}, {"id": "i096", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-15T04:44:31.020Z", "to": "2026-10-15T04:48:47+00:00", "repos": ["tooling"], "commit": "chore(deps): pin app-templates 522d66c", "intent": "The fixes for labelled figures and for credits and link addresses by language should reach new and updated apps now, not only with the next scheduled Renovate update. The app that needed a workaround for the type check can then drop it.", "decisions": ["move the pin by hand instead of waiting about three hours for Renovate", "the app's own session removes its workaround, told through a message to that session"], "trigger": "\"Sag dem Agenten in der anderen Session, dass es eine neue Version gibt. Dann kann er es ja raus machen\" … \"Ja, mach das gleich.\"", "kind": "chore", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i095", "note": "brings the template fixes of that round to apps"}], "groups": [{"repo": "tooling", "message": "chore(deps): pin app-templates 522d66c\n\n## Intent\n\nThe sized labelled figure of an SVG with only a viewBox (app-templates#21) and a credit's source and a link's address by language (app-templates#22) should reach new and updated apps now, ahead of the scheduled Renovate update.\n\n## Key changes\n\n- The pinned app-templates commit moves to 522d66c.", "reason": "The one commit of tooling#72.", "sources": [{"sha": "7541c40", "subject": "chore(deps): pin app-templates 522d66c", "date": "2026-10-15T04:48:47+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 1, "misplaced": []}, {"id": "i097", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-15T05:37:53.818Z", "to": "2026-10-15T06:16:24+00:00", "repos": ["apps", "tooling"], "commit": "feat(guidance): a plan per piece of work, with an increment template", "intent": "Extending a published app needs nearly every step of the first version except its initial decisions, and the plan is what instructs the agent. But the agent was only pointed to one shared plan, and in a published app it found the finished plan of the first version. Every increment needs a plan of its own.", "decisions": ["plans in .vibe/plans/<NN>-<short name>.md, the highest number is the current one, older ones stay as record", "two templates: plan-template.md for the first version, increment-template.md for every later change, on the first version's decisions", "AGENTS.md only says when to start which plan; the branch to push comes from the plan", "an older app's .vibe/plan.md counts as plan 01, and `lernapps update` moves it", "the app's own `lernapps update` names the command for the latest version instead of fetching it"], "trigger": "\"Dann würde ich gerne noch eine Erweiterung der bestehenden App in einer neuen Session anfordern. Mir ist aufgefallen, dass dafür wahrscheinlich alle Schritte bis auf die Initialen How-To Entscheidungen auch anstehen. Die instruieren wir über den Plan, aber bisher wird der Agent nur auf einen gemeinsamen Plan hingewiesen. Es sollte aber einen Plan pro increment geben\" … \"Ja. Mach mal die zwei Vorlagen und passe die instructions, wann man sie verwendet kurz in der agents.md an\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i054", "note": "the plan template is no longer the one plan of an app"}], "groups": [{"repo": "tooling", "message": "feat(guidance): a plan per piece of work, with an increment template\n\n## Intent\n\nAn agent asked to extend a published app found only the finished plan of the first version. Extending an app needs nearly every step of the first version except its initial decisions, so every piece of work needs its own plan.\n\n## Key changes\n\n- Each piece of work has its own plan in .vibe/plans/<NN>-<short name>.md; the highest number is the current plan, the others are its record.\n- A new increment template carries every later change on the first version's decisions: Explore with the content guide and the research checkpoint, Plan with slices, Code on a branch increment/<NN>-<short name> after updating the tooling, Commit with a pull request, the publish checkpoint and, when the entry changes, the listing checkpoint.\n- plan-template.md is the first version's plan, kept as plan 01. AGENTS.md says when to start which plan and leaves the branch to push to the plan.\n- The pre-push hook counts failures in the current plan, the content-guide check reads its phase, and the review reads all plans.\n- `create` needs exactly one plan, numbered 01, in the phase code. `update` moves an older app's .vibe/plan.md to plan 01; until then it counts as plan 01 and the first increment is 02.\n- Run as the app's own tooling, `update` only knows the pins the app has; it now names the command for the latest version.\n- The skill, the rubric, README, llms.txt, glossary and front matter schema follow; tests cover both templates and the legacy plan.\n\n## Dependencies and side effects\n\n- The catalog's review input copies every plan, and its entry point test starts the plan first (2500733, 2160098 in apps).", "reason": "The three commits of tooling#73 follow each other directly: the templates, the code that reads the current plan, and a fix of the numbering in older apps.", "sources": [{"sha": "976046b", "subject": "feat(guidance): a plan per piece of work, with an increment template", "date": "2026-10-15T05:41:04+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "93e4bb1", "subject": "feat: every consumer reads and writes the current plan", "date": "2026-10-15T05:49:25+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "1bca221", "subject": "docs(guidance): in an older app, .vibe/plan.md is plan 01 and the first increment is 02", "date": "2026-10-15T06:16:24+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "feat(review): the review input copies every plan in .vibe/plans/\n\n## Intent\n\nAn app now keeps one plan per piece of work. The review must see all of them, not only a single plan file.\n\n## Key changes\n\n- The review input copies every plan in .vibe/plans/, regular files only, and an older app's .vibe/plan.md; the prompt names the highest number as the current plan.\n\n## Dependencies and side effects\n\n- Follows the plan per piece of work in tooling (976046b, 93e4bb1, 1bca221).", "reason": "The review input change; the test fix after it is a separate concern.", "sources": [{"sha": "2500733", "subject": "feat(review): the review input copies every plan in .vibe/plans/", "date": "2026-10-15T05:55:12+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "test(entry-point): start the plan before the command creates the app\n\n## Intent\n\n`lernapps create` now creates an app only from a confirmed plan, so the entry point test failed by calling it without one.\n\n## Key changes\n\n- The test starts the plan as the plan template of the same tooling says: in its place, with the archetype set and in the phase code.\n\n## Dependencies and side effects\n\n- Follows the plan per piece of work in tooling (976046b, 93e4bb1, 1bca221).", "reason": "A test fix for the stricter create; one commit.", "sources": [{"sha": "2160098", "subject": "test(entry-point): start the plan before the command creates the app", "date": "2026-10-15T06:07:41+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 5, "misplaced": []}, {"id": "i098", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-15T08:31:38.119Z", "to": "2026-10-15T09:45:05+00:00", "repos": ["tooling"], "commit": "feat(app): preview a pull request in the real app before it is published", "intent": "An increment ends with a pull request, and the creator should be able to try the change in the real app before it goes online. The app's workflow only checked a pull request and published nothing to look at. The comment must explain to people who are not technical that the preview is a temporary copy for their own review.", "decisions": ["the checked bundle goes below pr-preview/pr-<number>/ of the app's own Pages, updated on every push and removed when the pull request closes", "no preview for forks or for plan-only and docs-only changes; preview pages are marked noindex", "one comment in plain German, kept up to date, that says what the preview is, who sees it and when it goes away", "the publish checkpoint of the increment template shows the preview link", "`lernapps update` does not rewrite an existing app's workflow, since apps may have changed it"], "trigger": "\"wäre cool, wenn das inkrement mit einem PR abgeschlossen wird, weil ja danach die CI eine Review-Umgebung erzeugen sollte, nicht?\" … \"ja, mit verständlichem Review-Kommentar, der auch nicht-teckis erklärt, dass das ein temporäres Artefakt für ihr menschliches Review ist\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i097", "note": "the increment's pull request gets a preview"}, {"type": "continues", "intent": "i055", "note": "uses the gh-pages setup App publish keeps for review environments"}], "groups": [{"repo": "tooling", "message": "feat(app): preview a pull request in the real app before it is published\n\n## Intent\n\nAn increment ends with a pull request, and the creator should try the change in the real app before it goes online. The app's workflow only checked a pull request. Someone who is not technical must understand that the preview is a temporary copy for their own review.\n\n## Key changes\n\n- A new job preview in the app's workflow uses a new app preview action. On a pull request from the app's own repo, after the check passed, the checked bundle goes to gh-pages below pr-preview/pr-<number>/, marked noindex, updated on every push and removed when the pull request closes.\n- One comment in German tells the creator what the preview is, where it is, that learners do not see it, and that only the merge publishes; it says so when the preview is gone.\n- Plan-only and docs-only changes get no preview.\n- The increment template's publish checkpoint shows the creator the preview link.\n- Tests run the comment logic against a fake GitHub API; the architecture names the action.\n\n## Dependencies and side effects\n\n- Existing apps must copy the preview job into their workflow by hand; `lernapps update` does not rewrite it.", "reason": "The one commit of tooling#74.", "sources": [{"sha": "fd575b6", "subject": "feat(app): preview a pull request in the real app before it is published", "date": "2026-10-15T09:45:05+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 5, "sourceCount": 1, "misplaced": []}, {"id": "i099", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-15T10:02:21.788Z", "to": "2026-10-15T16:47:48+00:00", "repos": ["app-templates"], "commit": "feat(explainer): solutions after the answer, reasons for wrong answers, folded captions, redirects", "intent": "The first increment showed problems that the content cannot fix, only the template: solutions were visible before an answer, a wrong answer only said \"not right\" without a reason, a component's long text stayed under the exercise and gave the solution away, and a removed page left a dead address and broke the catalog's topic link.", "decisions": ["with JavaScript the solution shows only after an answer or on request; pages stay complete without JavaScript", "a wrong answer says why, as specific as the content allows, with fallbacks down to a line to look again", "a component's no-JavaScript text can fold into a details element; an exercise component may not keep it", "redirects in app.yaml for old addresses, validated at build"], "trigger": "\"Die app templates Anpassung is klar zu machen.\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i250", "note": "fixes template problems found in the first increment run"}], "groups": [{"repo": "app-templates", "message": "feat(explainer): solutions after the answer, reasons for wrong answers, folded captions, redirects\n\n## Intent\n\nThe first increment of an explainer app showed problems only the template can fix: the solution was visible before an answer, a wrong answer gave no reason, a component's long text gave the solution away, and a removed page left a dead address that broke the catalog's topic link.\n\n## Key changes\n\n- An exercise shows its solution only once it is answered: a wrong answer keeps the controls open and offers \"Lösung zeigen\"; the right answer or that button shows the solution. Generated exercises show their worked tasks once solved. Pages stay complete without JavaScript.\n- A wrong answer says why: the message of a typical mistake, the info of each wrong option chosen, else a hint, else a line to look again. The quiz adds the mistake or hint to its feedback, and a component's answer may carry a reason.\n- A component can fold its no-JavaScript text into a details element once it runs; an exercise component may not keep it, since it gives the solution.\n- Redirects in app.yaml keep old addresses working with a small page per old address and language, validated at build.", "reason": "One commit for the template changes asked for.", "sources": [{"sha": "75aa8c0", "subject": "feat(explainer): solutions after the answer, reasons for wrong answers, folded captions, redirects", "date": "2026-10-15T16:47:48+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 1, "misplaced": []}, {"id": "i100", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-15T18:14:48.977Z", "to": "2026-10-15T18:19:49+00:00", "repos": ["app-templates"], "commit": "feat: a 404 page leads unknown addresses to the app's start page, in place of redirects", "intent": "Redirects for moved pages are not needed yet (YAGNI): an app may drop a page and its address on purpose. A learner who follows an old or wrong address should still not end on a dead page, so every unknown address of an app should lead back to the app's start page.", "decisions": ["one generic 404 page with a link and an automatic move to the app's start page, over redirects declared in app.yaml", "the 404 page finds the app's root at run time, so it works under /<repo>/ and in a pull request preview, over a fixed path", "the explainer and the quiz both write the page, over the explainer only"], "trigger": "\"Im aktuellen PR 24 sollte der Redirect raus. Yagni. Es ist in Ordnung und bewusst, dass Pfade wegfallen. Dann generisch 404 und Redirect zum Home der App beantworten.\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i099", "note": "takes the redirects of app-templates#24 out again"}], "groups": [{"repo": "app-templates", "message": "feat: a 404 page leads unknown addresses to the app's start page, in place of redirects\n\n## Intent\n\nRedirects for moved pages are not needed yet: an app may drop a page and its address on purpose. A learner who follows an old or wrong address should still not end on a dead page. Every unknown address of an app should lead back to the app's start page.\n\n## Key changes\n\n- The redirects in app.yaml are gone again: no schema entry, no validation, no redirect pages, no handling in the dev server.\n- The explainer and the quiz write a 404.html at the root of the bundle. GitHub Pages serves it for every missing path.\n- The page says in short German that the page does not exist (any more), links to the start page and is not indexed.\n- A small script finds the app's root: the nearest folder upwards that has its own 404.html. So the page also works under /<repo>/ and in a preview below pr-preview/pr-<n>/. It then moves on to that start page.\n\n## Dependencies and side effects\n\n- Changes app-templates#24 (i099) before it is merged.", "reason": "The only commit of this request.", "sources": [{"sha": "0d9205c", "subject": "feat: 404.html leads unknown addresses to the app's start page, in place of redirects", "date": "2026-10-15T18:19:49+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 1, "misplaced": []}, {"id": "i101", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-15T18:21:45.930Z", "to": "2026-10-15T19:21:01+00:00", "repos": ["tooling"], "commit": "feat(guidance): exercises check what the task asks for; a sketch before building; apps keep their skills", "intent": "The retrospective of the Elektrizität increment found exercises that rejected correct answers, because they compared with one model solution instead of the property the task text asks for. The guidance must teach this on a meta level, valid for any subject, not with physics-specific rules. The creator spent most turns on an editor that the plan showed only in words. The Lehrplan should only orient grade and order, not be forced. And an app must keep its skills across sessions, which git-ignored skills prevent.", "decisions": ["check the property the task text asks for, written as a subject-neutral rule with examples from several subjects, over physics-specific instructions", "the reason for a wrong answer comes from its own small function and answered { correct, reason }, while a component's check stays true or false", "a sketch (image or steps) of every new component at the plan checkpoint, over a description in words", "the Lehrplan as orientation for grade and order, a citation welcome but not required, over a required citation", "apps commit the lernapps-* skills and lernapps update replaces them, over git-ignoring them; the app's own skills stay and take precedence", "test the skills step as a function in milliseconds, over a 60 s timeout for two CLI runs"], "trigger": "\"Wir sollten auf einer Meta-Ebene instruieren, wie bspw. Erfolg in Übungen geprüft werden kann … Der Lehrplan dient eigentlich nur als Orientierung … Gitignore verhindert, dass die App sich die Skills anpasst und uber mehrere Sessions konsistent arbeitet\" … \"Ok, verstanden. Das mit den teilweise ersetzten Skills und dem Lehrplan passt auch\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i099", "note": "the guidance side of the increment's retrospective; describes what app-templates#24 added"}], "groups": [{"repo": "tooling", "message": "feat(skills): check the property the task asks for, and say why an answer is wrong\n\n## Intent\n\nExercises rejected correct answers, because they compared with one model solution instead of the property the task text asks for. The skills must teach this on a meta level, for any subject. They must also describe how a wrong answer gets its reason.\n\n## Key changes\n\n- Exercise patterns: check the property the task asks for, never equality with one model solution. Examples come from several subjects.\n- Before writing an exercise, note the answers the text allows, the typical wrong ones and the feedback for each. If a type cannot accept every correct answer, choose another type or change the text.\n- Components are tested with equivalent right answers and typical wrong ones.\n- The explainer skill gives the rules of src/components/ up front. It explains solutions after the answer, the order of reasons (info, mistakes, hint), how a component reports a reason, that nojs: \"caption\" is not for exercises, and that a page may be removed thanks to the 404 page.\n- The quiz skill asks for an info at every wrong option, mistakes for numbers, a hint, and a type that accepts every allowed answer.\n\n## Dependencies and side effects\n\n- Describes the runtime of app-templates#24 (i099, i100).", "reason": "The first commit of tooling#75: how exercises check success. It stays apart from the plan templates and the update step, which are other topics.", "sources": [{"sha": "d49736a", "subject": "feat(skills): check the property the task asks for, and say why an answer is wrong", "date": "2026-10-15T18:31:30+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "feat(guidance): sketch every interaction before building it; the Lehrplan as orientation\n\n## Intent\n\nThe creator should see every new interaction before it is built, not only read about it. The Lehrplan should only orient which content fits which grade and in which order; it should not block the work.\n\n## Key changes\n\n- At the checkpoint \"confirm the plan and the content method\", the plan and increment templates ask for a sketch of every new component and interactive exercise: an image of what learners see, or the steps and what they see after each. Words alone are not enough.\n- Content research: the Lehrplan decides grade and order. A citation is welcome, not required; a missing Lehrplan is no reason to stop or ask again. A Lehrplan in use is downloaded and read, not summarised by a fetch tool.\n- Content growth and the content guide's skeleton follow this.\n- In an app the skills are in its repo; the templates install them only when they are missing, and the update step says it replaces the lernapps-* skills.", "reason": "Its own topic in tooling#75: the plan checkpoint and the Lehrplan.", "sources": [{"sha": "d760217", "subject": "feat(guidance): sketch every interaction before building it; the Lehrplan as orientation", "date": "2026-10-15T18:31:41+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "feat(update): apps commit their skills; lernapps update replaces the lernapps-* ones\n\n## Intent\n\nAn app must keep its skills across sessions. Skills ignored by git are missing in every new checkout, and the app cannot add its own rules next to them.\n\n## Key changes\n\n- lernapps create no longer ignores the installed skills; an app commits them, their links and skills-lock.json.\n- lernapps update replaces the app's lernapps-* skills with those of the tooling it runs from, in the layout of npx skills add, and keeps skills-lock.json in step. It removes a lernapps-* skill the tooling no longer has and the old ignore lines, and says what it did.\n- app-content and every other skill of the app stay untouched.\n- AGENTS.md: the app's own skills take precedence; never edit a lernapps-* skill; app-specific rules go into the app's own skills.\n- The skills step is tested as a function on a temporary folder, in milliseconds and with the default timeout; an existing CLI run checks that update installs the skills.\n\n## Dependencies and side effects\n\n- README, the generator's building block and llms.txt describe the new behaviour.", "reason": "The update step and the fixes of its test, one after the other on the branch of tooling#75; the timeout of 97bdf5d is replaced by 5944cb8.", "sources": [{"sha": "f1625e6", "subject": "feat(update): apps commit their skills; lernapps update replaces the lernapps-* ones", "date": "2026-10-15T18:31:52+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "bde99bd", "subject": "test(update): compare with the lernapps-* skills only, as update copies them", "date": "2026-10-15T18:39:53+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "97bdf5d", "subject": "test(update): give the skills test the time of two CLI runs", "date": "2026-10-15T18:55:47+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "5944cb8", "subject": "test(update): test the skills step as a function, in milliseconds", "date": "2026-10-15T18:58:36+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "test(create): no automatic git maintenance in the commit before .git is removed\n\n## Intent\n\nA create test failed on CI now and then: it removes a test app's .git right after a commit, while newer git still writes into it.\n\n## Key changes\n\n- The test turns off git's automatic maintenance for that commit. Git 2.47 and later run it in the background after a commit, which caused ENOTEMPTY on CI (git 2.55).", "reason": "A test fix for a failure on the CI of tooling#75 that the change did not cause; kept apart.", "sources": [{"sha": "6b1c9da", "subject": "test(create): no automatic git maintenance in the commit before .git is removed", "date": "2026-10-15T19:21:01+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 7, "misplaced": []}, {"id": "i101b", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-15T16:28:43.227Z", "to": "2026-10-15T19:06:10+00:00", "repos": ["tooling"], "commit": "fix(hooks,check): git hooks survive an update; the check uses an installed Chromium", "intent": "The retrospective of the Elektrizität increment found two faults in the tooling's own tools. The pre-commit hook once let a type error pass that the full check found later. lernapps check downloaded Chromium although one was installed and the environment forbids downloads.", "decisions": ["hooks in node_modules/.cache/lernapps/hooks, where npm does not touch them, over a folder inside the tooling's package", "a missing hook makes the commit fail, over git skipping it silently", "the newest installed Chromium with a one-line note, download only when none starts, over always downloading Playwright's own build"], "trigger": "Finding of the increment retrospective: \"Der Pre-Commit-Hook ließ einmal einen Typfehler im Test durch … `lernapps check` lädt Chromium nach, obwohl einer installiert ist\"; started with \"Die app templates Anpassung is klar zu machen.\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i099", "note": "fixes two tool findings of the same retrospective"}], "groups": [{"repo": "tooling", "message": "fix(hooks): keep the git hooks when npm replaces the tooling's package\n\n## Intent\n\nCommits with type errors passed now and then. The git hooks were gone: they lived in a folder inside the tooling's package, which npm replaces whenever the tooling moves to another commit. Git skipped the missing hooks without a word until the next npm install put them back.\n\n## Key changes\n\n- lernapps hooks installs the hooks in node_modules/.cache/lernapps/hooks, each a line that runs the package's hook, and moves an app from the old folder.\n- A missing hook makes the commit fail instead of passing silently.\n- lernapps update installs the hooks again after its npm install.\n- The time of the pre-commit hook does not change.\n\n## Dependencies and side effects\n\n- The copies of the shared quiz app in the tests install the hooks in a later commit of this pull request.", "reason": "The hook fix of tooling#76; b0ec04b, a different fix, follows it directly, so e210597 cannot join it.", "sources": [{"sha": "013891e", "subject": "fix(hooks): keep the git hooks when npm replaces the tooling's package", "date": "2026-10-15T18:41:08+00:00", "pr": null, "plan": false, "moved": [{"kind": "split", "from": "i101", "why": "The time cut held two unrelated requests: the guidance of tooling#75 and the tool fixes of tooling#76; this commit serves the second."}]}]}, {"repo": "tooling", "message": "fix(check): use an installed Chromium where Playwright's own is missing\n\n## Intent\n\nlernapps check downloaded Chromium although one was installed and the environment forbids downloads. The app's Playwright needs a newer build than the preinstalled one.\n\n## Key changes\n\n- When Playwright's own Chromium is missing and downloads are turned off, the check starts the newest Chromium in the browser folder and says so in one line. The end-to-end tests use the same one through the Playwright preset.\n- Only when none starts does it download Playwright's own, also with one line.\n- The end-to-end tests no longer run playwright install before every run.\n- CI sets no such variable and downloads as before.", "reason": "The browser fix of tooling#76, a topic of its own.", "sources": [{"sha": "b0ec04b", "subject": "fix(check): use an installed Chromium where Playwright's own is missing", "date": "2026-10-15T18:41:20+00:00", "pr": null, "plan": false, "moved": [{"kind": "split", "from": "i101", "why": "The time cut held two unrelated requests; this commit serves the tool fixes of tooling#76."}]}]}, {"repo": "tooling", "message": "test: install the hooks in the copies of the shared quiz app\n\n## Intent\n\nThe hooks now live in the app's node_modules/.cache/. A copy of the shared quiz app links node_modules and so has no hooks.\n\n## Key changes\n\n- The test fixture installs the hooks in each copy, as npm install does.\n\n## Dependencies and side effects\n\n- Completes the hook fix earlier in tooling#76.", "reason": "Follows the browser fix, not the hook fix it completes, so it stays its own commit.", "sources": [{"sha": "e210597", "subject": "test: install the hooks in the copies of the shared quiz app", "date": "2026-10-15T19:06:10+00:00", "pr": null, "plan": false, "moved": [{"kind": "split", "from": "i101", "why": "The time cut held two unrelated requests; this commit serves the tool fixes of tooling#76."}]}]}], "messages": 1, "sourceCount": 3, "misplaced": []}, {"id": "i102", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-15T20:15:05.545Z", "to": "2026-10-15T20:54:41+00:00", "repos": ["apps", "tooling"], "commit": "perf(hooks): type-check once before a commit; main green again after the merges", "intent": "Close the round of fixes from the increment retrospective without waiting for a person: merge in the agreed order once CI is green, bring app-templates#24 to the apps, and repair whatever turns main red. The pre-commit hook type-checks twice, which costs seconds on every commit; it must stay as fast as possible.", "decisions": ["the staged step only formats and the check after it lints and type-checks once, at the price of no automatic lint fixes on commit, over two type checks", "the error message of a failed check says to run vp check --fix", "fix a slow test by moving its logic into a function the test calls directly, over raising its timeout", "merge each pull request only with green CI, and check main once more after several merges in a row"], "trigger": "\"Entferne das doppelte Prüfen pre-commit / Diese Dinge und die Ursache für den fehlschlagenden Test auf mein darfst Du selbst merken / Mergen\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i101", "note": "merges tooling#75 and #76 and finishes the round"}, {"type": "continues", "intent": "i097", "note": "repairs an apps test of the plan-per-increment change (apps#29)"}], "groups": [{"repo": "tooling", "message": "chore(deps): pin app-templates e54c743\n\n## Intent\n\nNew and updated apps should get app-templates#24, which is merged.\n\n## Key changes\n\n- Apps get solutions after the answer, reasons for wrong answers (hint, number mistakes, a component's reason), folded nojs captions and a 404 page that leads to the app's start page.\n\n## Dependencies and side effects\n\n- tooling#75 (i101) describes these features and is merged after this pin.", "reason": "Its own pull request (tooling#78), on a branch of its own.", "sources": [{"sha": "fd0ab2b", "subject": "chore(deps): pin app-templates e54c743", "date": "2026-10-15T20:15:52+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "perf(hooks): type-check once before a commit\n\n## Intent\n\nThe pre-commit hook type-checked the app twice, which cost seconds on every commit. Git hooks must stay as fast as possible.\n\n## Key changes\n\n- The step for the staged files only formats them. The check that follows lints and type-checks the whole app once.\n- Lint issues are no longer fixed automatically on commit. The message of a failed check says to run vp check --fix.\n- The tooling's own hook does the same.\n- Measured on one file: 2.1 s before, 1.0 s after for this step.", "reason": "Its own pull request (tooling#79), on a branch of its own.", "sources": [{"sha": "bafc3c7", "subject": "perf(hooks): type-check once before a commit", "date": "2026-10-15T20:31:04+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "test: count a failed pre-push in the plan without running the CLI\n\n## Intent\n\nAfter three merges in a row main was red: a test ran the CLI twice and took 5.1 s against the limit of 5 s.\n\n## Key changes\n\n- Counting a failed pre-push in the plan is its own function, which the test calls directly, in milliseconds. The timeout stays as it is.\n- The end-to-end test of the failing app still covers that a failed pre-push counts at all.", "reason": "Its own pull request (tooling#80), branched from main after the merges.", "sources": [{"sha": "bfe0d11", "subject": "test: count a failed pre-push in the plan without running the CLI", "date": "2026-10-15T20:54:41+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "fix(test): read the plan path from the template although it holds a placeholder with a space\n\n## Intent\n\nmain of apps was red, and so was the check of every pull request there, including a listing pull request. The plan template now keeps the first plan at .vibe/plans/01-<short name>.md, and the test's pattern stopped at the space in the placeholder.\n\n## Key changes\n\n- The pattern reads up to the end of the path. Against the current template it finds .vibe/plans/01-first-version.md.\n\n## Dependencies and side effects\n\n- Unblocks open listing pull requests once their check runs again.", "reason": "The only apps commit of this round (apps#30).", "sources": [{"sha": "a909557", "subject": "fix(test): read the plan path from the template although it holds a placeholder with a space", "date": "2026-10-15T20:14:09+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i101", "why": "The fix of the failing test on main, which this intent's message allows to merge; it is not part of the guidance of tooling#75."}]}]}], "messages": 1, "sourceCount": 4, "misplaced": []}, {"id": "i103", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-16T04:54:44.694Z", "to": "2026-10-16T04:57:07+00:00", "repos": ["app-templates", "tooling"], "commit": "feat: the build checks each exercise's examples against its real check", "intent": "A check that rejects a correct answer should fail before anyone sees the preview, not when a person tries the app. Examples of accepted and rejected answers are test cases only, never shown to learners; the build runs them through the same check as the page. Existing apps must keep building, so the app that lacks examples gets them in its own session before the tooling moves to the new version.", "decisions": ["examples are build-only test cases, not rendered or shipped, over rules shown to learners", "mistakes and the info of wrong options count as rejected examples, so only the accepted ones must be written", "a mistake is matched directly: the chosen option, a value within the task's tolerance, or an expression over a generated exercise's variables, with hint and a general sentence as fallback; no model interprets the answer", "examples required only for exercises with their own component, optional for every other type, so existing apps do not break", "the Elektrizität app adds its examples in its running session before the version bump, over warnings first"], "trigger": "\"Also wären die Regeln nur Testfälle, nicht user facing? Bei den mistakes: wie kann der Agent wählen, welcher mistake gemacht wurde? Direct Match mit einer pre-computed Funktion? Mit fallback, falls nichts matcht?\" … \"Schick das an die laufende Session mit Hinweis auf den Version-bimp\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i101", "note": "the build side of checking what the task asks for"}, {"type": "continues", "intent": "i099", "note": "builds on the mistakes and hints of app-templates#24"}], "groups": [{"repo": "app-templates", "message": "feat: the build checks each exercise's examples against its real check\n\n## Intent\n\nA check that rejects a correct answer should fail at build, before anyone sees the preview. The person who writes an exercise should first ask which other answers its text allows, and the build should test those answers mechanically. Learners never see these test cases.\n\n## Key changes\n\n- An exercise may carry examples: { accepted, rejected }: the other correct answers its text allows, and typical wrong ones.\n- The build runs each example through the check the page uses: the quiz's checker for its question types, in the quiz and the explainer alike; a generated exercise's comparator for every seed it tests; an exercise component's check.\n- It fails on an accepted example the check rejects, or a rejected one it accepts. Messages say what to change.\n- mistakes and the info of wrong options count as rejected examples.\n- An exercise component's block must give at least one accepted and one rejected example, as its check is the app's own code. For every other type examples are optional.\n- Nothing of the examples is rendered or shipped.\n\n## Dependencies and side effects\n\n- The tooling pins this version and its skills explain examples in a later commit (same intent).\n- An app with exercise components but no examples fails to build after that pin.", "reason": "The only commit of app-templates#25.", "sources": [{"sha": "c7d68d2", "subject": "Check each exercise's examples against its real check at build", "date": "2026-10-15T20:50:33+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i102", "why": "The build test with examples, agreed in i100/i101 and built by an agent while i102 ran; its pin is this intent's commit."}]}]}, {"repo": "tooling", "message": "chore(deps): pin app-templates 1f9b585, with build-checked examples\n\n## Intent\n\nNew and updated apps should get the build check of examples, and the assistant should know how to write them.\n\n## Key changes\n\n- Apps get app-templates#25: every exercise may carry examples { accepted, rejected }, which the build runs through the real check; an exercise component's block needs at least one of each.\n- The skills for exercise patterns, the explainer and the quiz say how to write examples, and that a point is the decimal mark in number answers.\n\n## Dependencies and side effects\n\n- Pins app-templates#25 (c7d68d2, same intent). The Elektrizität app gets its examples in its own session before it updates.", "reason": "The pin and the skill sentences of this feature, one commit.", "sources": [{"sha": "a79ec1c", "subject": "chore(deps): pin app-templates 1f9b585, with build-checked examples", "date": "2026-10-16T04:57:07+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 2, "misplaced": []}, {"id": "i104", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-16T05:05:28.690Z", "to": "2026-10-16T06:04:03+00:00", "repos": ["app-templates"], "commit": "feat(explainer): a KI tutor the learner brings can guide through every page", "intent": "A KI assistant should be able to guide a learner through an explainer's topic with the exercises of its pages, including the custom components. The tutor is one the learner brings, as with the Mathe-Karte, so the app still sends nothing anywhere. A chat assistant that fetches a page runs no JavaScript, so it must find the very task the learner sees in static files, named by a task number that both can say.", "decisions": ["a tutor the learner brings (A), as the Mathe-Karte does, over a tutor built into the app that would read the learner's input", "static tutor files per page, computed at build, over a JavaScript &tutor view that a fetching chat assistant cannot run", "the task number is the seed, visible and in the address, also for exercise components", "exercise components describe their tasks (describe and about), and the no-JS text comes from describe, over a hand-written nojs text that can drift from the component", "provider-neutral and extensible, with Claude preset: copy the prompt plus one link per assistant", "three stacked pull requests, over one large one"], "trigger": "\"ein Feature des explainer soll werden, dass ein KI-Assistent den Schüler anhand der Beispiele in der Seite durch das Thema führen kann. Dafür muss er auch die custom components verstehen kann.\" … \"Definitiv A. So macht es auch die Mathe-Karte.\" … \"Anbieterneutral + Claude, erweiterbar.\" … \"Das war der Inhalt. Leg los\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i103", "note": "uses the mistakes, hints and solutions as tutor material; examples stay out"}], "groups": [{"repo": "app-templates", "message": "feat(explainer): task numbers for seeded exercises; exercise components describe their tasks\n\n## Intent\n\nA learner should be able to name a task to a tutor, and the tutor should open the very same task. A tutor can only explain an exercise component if the component says in words what its task is.\n\n## Key changes\n\n- Every seeded exercise shows \"Aufgabe Nr. <n>\", its seed, also in the worked tasks without JavaScript. \"Neue Aufgabe\" moves to the next number and writes it into the address; ?seed=<n>#<id> opens task n.\n- Exercise components get their task number from the explainer as the prop seed. The number and \"Neue Aufgabe\" sit above the component, which mounts afresh for a new task. A block may name its anchor with a new optional id.\n- An exercise component's logic exports describe, the task and its solution as a learner reads them, and about: what the learner does, the answer's format, what counts as right and the typical mistakes.\n- The build requires both, checks describe for every task number in every language, and writes the no-JS text from the task of number 1 with its solution folded. An exercise component no longer needs its own nojs text.\n\n## Dependencies and side effects\n\n- Apps with exercise components break until they add seed, describe and about.\n- The tutor files and the tutor prompt build on this in the next two commits; the numbering is changed to distinct tasks in i105.", "reason": "app-templates#26 on its own; #27 and #28 are separate pull requests, and the follow-up 46b6b1d branches from this commit.", "sources": [{"sha": "6fd3f2e", "subject": "feat(explainer): task numbers for seeded exercises; exercise components describe their tasks", "date": "2026-10-16T05:49:25+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "feat(explainer): tutor files per page, a tutor part in llms.txt, and \"Zurück zum Tutor\"\n\n## Intent\n\nA chat assistant that fetches an address runs no JavaScript, so it can only work from static files. It must see each exercise with its solution and typical mistakes, and the very task behind each number, so that it can guide without giving the answer away.\n\n## Key changes\n\n- Next to every page the build writes a tutor file: the page's sections and every exercise with its id, type, task, answer format, solution, explanation, hint and typical mistakes. For a seeded exercise it lists the tasks by number, each with its solution, mistakes and link; for an exercise component its about and describe. Examples stay out.\n- llms.txt gets \"Hinweise für einen KI-Tutor\": generic rules from the runtime (link concrete tasks with von=tutor, ask for the task number, never reveal a solution before the learner answers, the app reports nothing back), the app's own rules from tutor.rules in app.yaml, and a link to each page's tutor file.\n- The build checks every link and anchor of llms.txt and the tutor files.\n- A page opened with von=tutor shows \"Zurück zum Tutor\". It closes the tab; where the browser keeps it open, a line says to go back to the chat.", "reason": "app-templates#27 on its own.", "sources": [{"sha": "3f29931", "subject": "feat(explainer): tutor files per page, a tutor part in llms.txt, and \"Zurück zum Tutor\"", "date": "2026-10-16T05:55:45+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "feat(explainer): a tutor prompt, and \"Mit einem KI-Tutor lernen\" on the start page\n\n## Intent\n\nA learner should start a tutor with one click, with the assistant of their choice. Nothing should load before that click.\n\n## Key changes\n\n- The build writes a ready tutor prompt at the root of each language tree, adapted from the Mathe-Karte and generic: the tutor's role and approach, the app's pages as a checklist with links to each page and its tutor file, the rules for the app's links, the app's own rules and how to start. llms.txt links it.\n- The start page gets \"Mit einem KI-Tutor lernen\": a button copies the prompt, and one plain link per assistant opens it. Claude is preset; tutor.providers in app.yaml adds others or none.\n- When the prompt would make the address longer than 8000 characters, the link carries a short prompt that points to the tutor file, and the page copies the whole prompt as well.\n- Without JavaScript the links still open the assistant, and the tutor file is there to copy from.", "reason": "app-templates#28 on its own.", "sources": [{"sha": "ccfd348", "subject": "feat(explainer): a tutor prompt, and \"Mit einem KI-Tutor lernen\" on the start page", "date": "2026-10-16T06:04:03+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 5, "sourceCount": 3, "misplaced": []}, {"id": "i105", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-16T06:14:09.443Z", "to": "2026-10-16T06:36:39+00:00", "repos": ["app-templates", "tooling"], "commit": "feat(explainer): number only distinct tasks, up to 67", "intent": "Each task number a learner names must stand for a real, different task that the tutor file lists. Drawing from a fixed 20 seeds would repeat tasks after a few, and a million random seeds cannot all appear in a tutor file. Then the tutor support should reach new and updated apps.", "decisions": ["number only distinct tasks, up to 67, over a fixed count of seeds (20 or 50)", "an exercise with fewer distinct tasks is a note in the build output, not an error", "a number above N wraps around into 1 to N", "merge #26, #27 and #28 in order, each rebased on main"], "trigger": "\"Vorher war es eine Milion? Wie?\" … \"Ja, zweiter Weg mit Obergrenze 67, dann mergen\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i104", "note": "replaces the task numbers 1 to 20 with distinct tasks"}], "groups": [{"repo": "app-templates", "message": "feat(explainer): number only distinct tasks, up to 67\n\n## Intent\n\nEach task number a learner names should stand for a real, different task that the tutor file lists. With 20 fixed seeds, two numbers could show the same task.\n\n## Key changes\n\n- The build walks the seeds 1, 2, 3, … through an exercise's generator, for generated exercises and exercise components alike. It keeps each seed whose task differs from every earlier one, up to 67. These are \"Aufgabe Nr. 1\" to \"Aufgabe Nr. N\".\n- The number is the one identifier the learner, the tutor and the address share. ?seed=<n>#<id> carries the task number, and the page draws the task from a seed table the build ships with the exercise.\n- A number above N wraps around. \"Neue Aufgabe\" moves from n to n + 1, and from N back to 1.\n- The worked tasks without JavaScript are numbers 1 to 3.\n- An exercise with fewer than 67 distinct tasks is noted in the build output, not a problem.\n\n## Dependencies and side effects\n\n- The tooling pins this version with the tutor support in the next commit of this intent.", "reason": "The only app-templates commit of this request.", "sources": [{"sha": "46b6b1d", "subject": "feat(explainer): number only distinct tasks, up to 67", "date": "2026-10-16T06:26:37+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "chore(deps): pin app-templates 3b20249, with tutor support\n\n## Intent\n\nNew and updated apps should get the tutor support, and the assistant should know what an exercise component must now provide.\n\n## Key changes\n\n- Apps get app-templates#26 to #28: numbered distinct tasks (at most 67) with the number in the address, exercise components with seed, describe and about, tutor files per page, tutor notes in llms.txt, a tutor prompt with a start-page entry, and von=tutor.\n- The explainer and exercise-pattern skills say what a component provides and where tutor rules and providers go.\n\n## Dependencies and side effects\n\n- Pins the commits of i104 and 46b6b1d of this intent.\n- The Elektrizität app adds seed, describe and about in its running increment.", "reason": "The pin and the skill sentences, one commit.", "sources": [{"sha": "839eb56", "subject": "chore(deps): pin app-templates 3b20249, with tutor support", "date": "2026-10-16T06:36:39+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i106", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-16T18:00:07.552Z", "to": "2026-10-16T19:18:01+00:00", "repos": [".github", "tooling"], "commit": "docs(plan): step 11 done; the interactive archetype decided; WCAG and 360 px as platform rules", "intent": "Close the explainer step with the lessons of the first full run, and take on the interactive archetype before the evals. Apps such as a typing trainer played like a shooting game, a Kniffel trainer that teaches probability, or a text in which learners mark mistakes are free in their architecture, so a shared, minimal architecture frame should guide the very free agent early. Accessibility has its limits in such apps: WCAG and 360 px bind the platform, while a single app may deviate and say so.", "decisions": ["one archetype interactive with recipes in the skill, over one archetype per kind of app", "Vue with TypeScript prescribed, free in decomposition, data, logic and rendering, over allowing any framework", "an arc42 architecture only for interactive apps, in English and minimal, checked only by what arc42 itself can do (arc42 diff in pre-commit), over checking the code against responsibilities", "a minimal shell without settings dialog, reduced motion, sound or pause (feature creep)", "localStorage through the existing wrapper as the component for small storage, with a quota per app, over IndexedDB (YAGNI, a second wrapper only when an app needs it)", "WCAG 2.1 AA and 360 px are rules of the platform (frame, catalog, overview pages); apps may deviate and say so in an optional limits field", "no flashing as advice in the skill (low stimulation), not a duty"], "trigger": "\"Räum auf. Danach; Ich würde gerne den interaktiven Archetyp zuerst angehen. Lass uns erst mal überlegen\" … \"Barrierefreiheit hat ihre Grenzen … eine gemeinsame Architektur … basierend auf @doctc/arc42\" … \"Weniger Bewegung ist schon Feature creep. Minimal!\" … \"Yagni. Erst mal nur Localstorage. Kontingent festlegen.\" … \"Keine Blitze ist auch keine Pflicht, reizarmheit sollte per skill empfohlen werden. Leg los\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i075", "note": "the next archetype sketch after the explainer sketch, on the same plan"}], "groups": [{"repo": "tooling", "message": "docs(plan): step 11 done; the interactive archetype decided; WCAG and 360 px as platform rules\n\n## Intent\n\nClose the explainer step with the lessons of the first full run, and take on the interactive archetype before the evals. Interactive apps are free in their architecture, so a shared, minimal architecture frame should guide the agent early. Accessibility has limits in such apps: WCAG and 360 px bind the platform, while a single app may deviate and say so.\n\n## Key changes\n\n- The plan marks step 11 done with the lessons of the Elektrizität run, records the tutor as brought forward against Q5, and puts the interactive archetype (12) before the evals (10).\n- The plan holds the decided sketch of the interactive archetype: one archetype with recipes in the skill; Vue with TypeScript, free in decomposition, data, logic and rendering; a minimal shell (start page, app page, languages, storage, hash routes); core, view, data and playthroughs.\n- Each interactive app carries an arc42 architecture in English and minimal: a frame from the tooling that lernapps update replaces, and the app's own part. arc42 diff runs before a commit; the code is not checked against responsibilities.\n- Small storage is localStorage through the existing wrapper, with a quota per app. A wrapper for IndexedDB comes only when an app needs it.\n- Accessibility limits go into an optional field of the catalog entry. Low stimulation is advice in the skill, not a duty.\n- The constraints of the tooling's architecture: WCAG 2.1 AA and 360 px are rules of the platform; apps meet them by default and may deviate where their idea needs it, saying so in their entry.\n\n## Dependencies and side effects\n\n- lernapps/.github states the same rule in ORGANIZATION.md and CONTRIBUTING.md (199fecc).\n- Skills and checks still ask every app for WCAG and 360 px until the entry field and its checks exist.", "reason": "tooling#87, one after the other on one branch; the five plan commits join 0102d09 by rule (next and parent).", "sources": [{"sha": "4c23f82", "subject": "docs(plan): step 11 done with the first explainer run; interactive before the evals", "date": "2026-10-16T18:05:27+00:00", "pr": null, "plan": true, "moved": []}, {"sha": "730c6b3", "subject": "docs(plan): sketch of the interactive archetype for the owner's decision", "date": "2026-10-16T19:00:50+00:00", "pr": null, "plan": true, "moved": []}, {"sha": "f19102d", "subject": "docs(plan): the app's architecture in English and minimal", "date": "2026-10-16T19:01:57+00:00", "pr": null, "plan": true, "moved": []}, {"sha": "0102d09", "subject": "docs: WCAG and 360 px are rules of the platform; apps may deviate; the interactive sketch minimal", "date": "2026-10-16T19:05:56+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "9caa3dd", "subject": "docs(plan): small storage with a quota per app; IndexedDB only when an app needs it", "date": "2026-10-16T19:11:22+00:00", "pr": null, "plan": true, "moved": []}, {"sha": "b36da7b", "subject": "docs(plan): the interactive sketch decided; low stimulation as advice in the skill", "date": "2026-10-16T19:18:01+00:00", "pr": null, "plan": true, "moved": []}]}, {"repo": ".github", "message": "docs: WCAG 2.1 AA and 360 px are rules of the platform; apps may deviate and say so\n\n## Intent\n\nAccessibility has its limits in some apps, for example a fast typing game. The platform itself must always be accessible, while a single app may deviate where its idea needs it.\n\n## Key changes\n\n- Pages of the platform (the site frame, the catalog and the overview pages) meet WCAG 2.1 AA, are usable at 360 px and are readable without JavaScript.\n- Apps meet WCAG 2.1 AA and are usable at 360 px by default. An app may deviate and says so in its entry.\n\n## Dependencies and side effects\n\n- The tooling's plan and architecture state the same rule (tooling#87, same intent).", "reason": "The only .github commit of this request (lernapps/.github#43).", "sources": [{"sha": "199fecc", "subject": "docs: WCAG 2.1 AA and 360 px are rules of the platform; apps may deviate and say so", "date": "2026-10-16T19:06:13+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 9, "sourceCount": 7, "misplaced": []}, {"id": "i107", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-16T19:06:39.336Z", "to": "2026-10-16T19:44:47+00:00", "repos": ["app-templates"], "commit": "feat(interactive): the runtime of the interactive archetype and a letter-typing template", "intent": "Step 1 of the decided interactive archetype: apps whose doing is the content need a runtime that gives them a static start page, an app page and languages, while the agent stays free in logic and rendering. The core must be deterministic and testable by playthroughs, and the app must stay within a size budget, so that the build can check what a free app does.", "decisions": ["a core contract start(seed, route), step(state, key) and optional tick(state, dt), kept by the runtime", "playthroughs as data, played against the core at build and with the keyboard in the browser", "the explainer's component checks reused for the whole app, with a wider import scope", "one size budget of 100 kB gzip for the app's own code, over a budget per component", "a small letter-typing game as the template", "left out on purpose: the tooling side, the storage quota, the exercise contract with the tutor, and settings"], "trigger": "\"Keine Blitze ist auch keine Pflicht, reizarmheit sollte per skill empfohlen werden. Leg los\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i106", "note": "step 1 of the decided interactive sketch"}], "groups": [{"repo": "app-templates", "message": "feat(interactive): the runtime of the interactive archetype and a letter-typing template\n\n## Intent\n\nStep 1 of the interactive archetype. Apps whose doing is the content need a runtime that gives them a start page, an app page and languages, while the agent stays free in logic and rendering. The build must still be able to check them: a deterministic core, playthroughs and a size budget.\n\n## Key changes\n\n- A new runtime interactive/ with its schemas for src/app.yaml and the playthroughs.\n- A static start page from src/app.yaml without any script, with a <noscript> note, and an app page that mounts the app's root component.\n- German first, and each declared language complete. Routes are app/#<id>, each an anchor of the app page.\n- The runtime keeps the state of the app's core: start(seed, route), step(state, key) and optional tick(state, dt).\n- The build checks the components with the explainer's code checks, now reusable with a wider import scope, plays every playthrough against the core twice, and keeps the app's own code within 100 kB gzip.\n- interactiveTests() checks both pages without JavaScript and plays every playthrough with the keyboard in the browser.\n- The template interactive/ is a small letter-typing game with two lessons as data and two playthroughs, and runs in the CI matrix.\n\n## Dependencies and side effects\n\n- The explainer's component checks move into a shared module; their behaviour for the explainer stays the same.", "reason": "The only commit of this step (app-templates#33).", "sources": [{"sha": "c5e7285", "subject": "feat(interactive): the runtime of the interactive archetype and a letter-typing template", "date": "2026-10-16T19:44:47+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 3, "sourceCount": 1, "misplaced": []}, {"id": "i108", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-16T20:16:51.013Z", "to": "2026-10-16T20:23:43+00:00", "repos": ["app-templates"], "commit": "docs(interactive): the architecture of every interactive app, in arc42", "intent": "Interactive apps need a real architecture, not only a template to copy: frontend-only apps with a static description and an optional client-side tutor. The architecture should guide the very free agent early and stay checkable with arc42.", "decisions": ["a real architecture that every interactive app has, over a template to fill in", "written in the arc42 DSL, in English and minimal", "the tutor's working left as proposed until decided"], "trigger": "\"Mergen darfst Du selbst. Hast Du denn schon eine Architektur geschrieben?\" … \"Wir wollen da keine reine Vorlage! Wir wollen eine echte Architektur für frontend only apps, mit der statischen Beschreibung und einem optionalen Client side ai Tutor\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i107", "note": "the architecture of the runtime built in step 1"}], "groups": [{"repo": "app-templates", "message": "docs(interactive): the architecture of every interactive app, in arc42\n\n## Intent\n\nInteractive apps need a real architecture, not only a template to copy: frontend-only apps with a static description and an optional client-side tutor. It should guide a very free agent early.\n\n## Key changes\n\n- A first arc42 architecture in the interactive template, in English and minimal, in all twelve chapters.\n- It describes apps that run only in the browser, with a start page readable without JavaScript, an app page and an optional tutor.\n- Quality goals: nothing leaves the device without a click, everything replays from seed and inputs, accessible by default with declared limits.\n- Building blocks for the runtime (start page, shell, build checks, tutor bridge) and the app (core, view, data, playthroughs), with interfaces; an app hangs its own blocks below core and view.\n- How the tutor works is marked as proposed, not decided.\n\n## Dependencies and side effects\n\n- Rebuilt with the arc42 guide in the next commit of app-templates#34 (i109).", "reason": "The only commit of this request; the later revisions of app-templates#34 answer other messages.", "sources": [{"sha": "46f41f6", "subject": "docs(interactive): the architecture of every interactive app, in arc42", "date": "2026-10-16T20:23:43+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 1, "misplaced": []}, {"id": "i109", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-16T20:24:36.125Z", "to": "2026-10-16T20:35:25+00:00", "repos": ["app-templates"], "commit": "docs(interactive): the architecture rebuilt with the arc42 guide, before review", "intent": "The architecture should follow the method of the arc42 CLI and its guide, not a free-hand draft. It should name every generic component, also the optional ones that an app may never use, so that the frame is complete before review.", "decisions": ["follow the arc42 guide: evidence file, chapter briefs, waves of parallel agents, a review gate before validating", "list every generic component, also optional and not yet built ones, each marked as such", "discard the first draft instead of patching it"], "trigger": "\"Nutze das arc42 cli und den guide. Notiere einfach alle auch optionalen generischen Komponenten, auch wenn diese dann evtl. nicht ausgeprägt werden\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i108", "note": "rebuilds the first draft with the arc42 guide"}], "groups": [{"repo": "app-templates", "message": "docs(interactive): the architecture rebuilt with the arc42 guide, before review\n\n## Intent\n\nThe architecture should follow the method of the arc42 CLI and its guide, and name every generic component, also the optional ones an app may never use. Open points go to review before validation.\n\n## Key changes\n\n- All twelve chapters rebuilt from the guide's chapter briefs, with an evidence file that lists the sources and marks open questions.\n- Building blocks for runtime, tooling helpers and the app, with interfaces. Optional or not yet built components are included and marked: tutor handoff, tutor model in the browser, task numbers, exercise contract, settings, large storage.\n- Constraints, runtime scenarios, deployment, concepts, decisions, risks and a glossary.\n- Not validated yet: the guide asks for review first.\n\n## Dependencies and side effects\n\n- Revised after review in the next commit of app-templates#34 (i110).", "reason": "The only commit of this request.", "sources": [{"sha": "b63f3fc", "subject": "docs(interactive): the architecture rebuilt with the arc42 guide, before the owner's review", "date": "2026-10-16T20:35:25+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i110", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-16T20:52:25.862Z", "to": "2026-10-16T20:59:25+00:00", "repos": ["app-templates"], "commit": "docs(interactive): the architecture after review", "intent": "Settle the open points of the architecture's review. The client-side tutor means the handoff to the learner's own assistant, as in the explainer, not a model in the browser. The app's size should not be limited but made visible. The skill is an interface that the creator's agent uses as an actor.", "decisions": ["the tutor as a handoff to the learner's own assistant, over a model in the browser", "IndexedDB left out for now", "no size limit; the size goes into the catalog entry, with an optional loading indicator at start", "the skill as a building block with an interface that the agent uses, low stimulation as its concept", "quality goals without smallness; privacy and checkability high, accessibility and understandability medium"], "trigger": "\"Tutor Modell im Browser sehe ich nicht. Ich meinte mit Client Side Tutor dass wir beim explainer (a). Tatsächlich sollen die anderen beiden Typen auch der Architektur folgen. … Index dB kannst du erst mal raus lassen … Die Größe sollten wir nicht einschränken. … As reizarmut: der skill ist auch ein Interface, der Agent ein Akteur, der ihn nutzt.\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i109", "note": "the review gate of the rebuilt architecture"}], "groups": [{"repo": "app-templates", "message": "docs(interactive): the architecture after review\n\n## Intent\n\nSettle the review's open points. The tutor is the handoff to the learner's own assistant, as in the explainer. An app's size should be visible, not limited. The skill is an interface that the creator's agent uses.\n\n## Key changes\n\n- The tutor is a handoff, now an accepted decision; the tutor model in the browser and IndexedDB are gone.\n- No size limit: an optional loading indicator and the size in the catalog entry instead. The 100 kB check in the runtime is recorded as technical debt.\n- The skill lernapps-interactive is a building block with an interface that the creator's agent uses.\n- Every actor requires an interface: start page, app addresses, built files and the tutor handoff.\n- The quality goals drop smallness.\n- The evidence file records the review's decisions. arc42 validate now finds no errors.", "reason": "The only commit of this request.", "sources": [{"sha": "a67c794", "subject": "docs(interactive): the architecture after the owner's review", "date": "2026-10-16T20:59:25+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i111", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-16T21:01:09.036Z", "to": "2026-10-16T21:21:09+00:00", "repos": ["app-templates"], "commit": "docs: one architecture for every archetype, generic at the repo root with an extension per archetype", "intent": "The quiz and the explainer have the same quality goals as interactive apps, so they should follow the same architecture. They stay archetypes of their own, each extending the generic architecture, as interactive apps do. The quiz and the explainer are text-heavy, so being readable without JavaScript is one of their own goals.", "decisions": ["one generic architecture with an extension per archetype, over a separate architecture per archetype", "quiz and explainer stay archetypes of their own, over generic variants of interactive", "only interactive apps write their own part; quiz and explainer are fixed by their notation", "readable without JavaScript as a quality goal of the quiz and the explainer only", "the root README points to both parts, as the templates have no README of their own"], "trigger": "\"Tatsächlich sollen die anderen beiden Typen auch der Architektur folgen.\" … \"Nein, da bleiben trotzdem eigene archetypen. Sie folgen einfach nur der gleichen Architektur, weil sie ja auch die gleichen Qualitäts-Ziele haben. Daher sollte das auch die Quiz und explainer so in der Architektur hinterlegt werden (extends genetic architecture)\" … \"Bei den beid
