g, and the first sketch of the explainer MVP\n\n## Intent\n\nThe quiz's principles (a tightly constrained stack, checks that are as deterministic as possible, pages readable without JavaScript) have only been tried on one archetype. An explainer based on the Mathe-Karte should show whether they hold on a second one. Its plan should be open to review before anything is built, and the plan should show what is already done.\n\n## Key changes\n\n- Steps 9 and 13, the first full run with its lessons and fixes, and the removal of the site rules are marked done, each with its issue and pull requests.\n- The explainer MVP comes before the evals (10); steps 10 and 12 stay open.\n- The sketch: content only as data, YAML per topic validated against a schema at build; formulas as MathML and figures as SVG, rendered at build, so pages need no script.\n- Exercises are declared types, configured as data.\n- Readable without JavaScript becomes a rule of the explainer archetype.\n- Five open questions are listed for review.", "reason": "The first commit of tooling#54: the bookkeeping and the first sketch. The later plan commits of the pull request record the review of the sketch and belong to the next request.", "sources": [{"sha": "c0a3a52", "subject": "docs(plan): steps 9, 13 and the first full run done; sketch of the explainer MVP", "date": "2026-10-13T14:46:42+00:00", "pr": null, "plan": true, "moved": []}]}], "messages": 2, "sourceCount": 1, "misplaced": []}, {"id": "i076", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-13T15:33:15.673Z", "to": "2026-10-14T04:38:31+00:00", "repos": ["app-templates", "tooling"], "commit": "feat(explainer): subject-neutral structure and blocks, rendered at build, with the quiz's questions embedded", "intent": "The explainer sketch was built around maths. Learning apps for biology, physics, chemistry, computer science or history need the same structure, so the explainer has to work for any subject, in several languages, and it should not duplicate what the quiz already does.", "decisions": ["reuse the quiz's six question types as exercises for every subject, rather than a maths-only exercise type", "the quiz itself runs on the per-question functions rather than on a second copy of them, with byte-identical output", "package version stays 0.0.0, since apps pin app-templates by commit", "Vite plugin renders all pages from the built index.html as shell; Eleventy is not needed", "a closed set of subject-neutral blocks; Warum, Regel, Beispiel only a recommended page structure", "chapters mandatory; a single chapter hidden in the navigation but kept in the URL", "a property-based `generated` notation instead of a maths-only `calculation` type", "type `vue-component`, not `component`, so other frameworks can follow; each with a required `nojs` text", "every text may be a language map from the start, German required and first", "a Markdown heading in a text is a build error that points to sections, rather than a silent conversion", "marked over markdown-it, whose dependency licence is not allowed; highlight.js over Shiki"], "trigger": "\"This sounds quite math-specific. What about other topics, such as biology, physics, chemistry, computer science, or even history?\" … \"Fine. I agree to the other question proposals. Update the plan, push it and then start with an mvp.\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i075", "note": "builds the explainer MVP sketched there"}], "groups": [{"repo": "tooling", "message": "docs(plan): the explainer sketch, revised in review and decided\n\n## Intent\n\nThe first sketch was built around maths. Learning apps for biology, physics, chemistry, computer science or history need the same structure, so the explainer has to work for any subject and in several languages, without duplicating what the quiz already does. All of this should be decided before anything is built.\n\n## Key changes\n\n- A page is an ordered list of blocks from a closed set: text, formula, figure, labelled figure, table, timeline, definition, quote, code, example, note, section. Warum, Regel, Beispiel becomes a recommended page structure.\n- Formulas use one LaTeX subset with Temml, chemistry included through mhchem.\n- Structure: app, mandatory chapters (a single one hidden in the navigation, kept in the URL), pages and at most two section levels, with complete order lists and navigation generated without JavaScript.\n- Exercises: the quiz's six question types as blocks, and a property-based `generated` notation instead of a maths-only `calculation` type, run as a property test at build.\n- Components: `vue-component` blocks with typed props, rendered at build and hydrated as islands, each with a required `nojs` text, so the page stays readable without JavaScript.\n- Texts take restricted Markdown; a heading in a text is a build error that points to the section block.\n- Languages: every text may be a language map, German required and first, one page tree per language.\n- The explainer renders with a Vite plugin, Eleventy only as the fallback. The open questions became a list of decisions, and the sketch is marked as decided.\n\n## Dependencies and side effects\n\n- Same intent: app-templates#13 and #14 build steps 1 and 2 of this sketch.", "reason": "The later commits of tooling#54, one after the other and all plan-only: the sketch revised in review until decided. By rule plan-pr they would join the first commit of the pull request, but that one records the first sketch (i075); these serve the review in this intent, so they become one plan commit here.", "sources": [{"sha": "fabeae9", "subject": "docs(plan): explainer sketch revised after the owner's review", "date": "2026-10-13T17:41:11+00:00", "pr": null, "plan": true, "moved": [{"kind": "moved", "from": "i075", "why": "Records the review that asks for other subjects than maths, chapters and sections. A plan commit whose joinsWith commit c0a3a52 stays in i075, which records the first sketch; it joins the plan commits after it here instead."}]}, {"sha": "d6d72ff", "subject": "docs(plan): explainer sketch with generated exercises, Vue components, languages", "date": "2026-10-13T18:25:56+00:00", "pr": null, "plan": true, "moved": [{"kind": "moved", "from": "i075", "why": "Records the decisions on generated exercises, vue-component, languages and mandatory chapters made in this conversation. Its joinsWith commit c0a3a52 stays in i075."}]}, {"sha": "54c1a65", "subject": "docs(plan): explainer sketch decided; nojs for components, sections not headings", "date": "2026-10-13T18:31:55+00:00", "pr": null, "plan": true, "moved": [{"kind": "moved", "from": "i075", "why": "Records Markdown without headings, nojs for components and the agreement to the remaining proposals. Its joinsWith commit c0a3a52 stays in i075."}]}, {"sha": "6eac5f9", "subject": "docs(plan): mark the explainer sketch as decided", "date": "2026-10-13T18:42:44+00:00", "pr": null, "plan": true, "moved": [{"kind": "moved", "from": "i075", "why": "Marks the sketch as decided after \"Update the plan, push it\". Its joinsWith commit c0a3a52 stays in i075."}]}]}, {"repo": "app-templates", "message": "feat(quiz): export each question on its own; the quiz uses the same\n\n## Intent\n\nThe explainer needs exercises for any subject, and the quiz already has six question types that fit: single and multiple choice, statements, ordering, pairs, estimation. Building them a second time would duplicate their validation, rendering and checking. This is step 1 of the explainer MVP.\n\n## Key changes\n\n- A new entry point offers one question at a time: its schema for a $ref from other schemas, validation with the quiz's messages at the caller's path, the rendered controls, the solution as a fragment for a Lösung box without JavaScript, and the checker.\n- The engine gains startQuestion for the feedback and focus of a single question.\n- The quiz's bank validation, page and engine are built from these same functions; rendered pages and messages are unchanged, compared byte for byte.\n- A fixture page embeds one question of each type through the new exports only, tested with and without JavaScript; CI runs lernapps check on it.\n\n## Dependencies and side effects\n\n- Same intent: the decided sketch in the tooling's plan (tooling#54).", "reason": "Both commits of app-templates#13: the tests and the code of one change, the per-question exports.", "sources": [{"sha": "759a397", "subject": "test(quiz): the contract of one question, from a consumer's side", "date": "2026-10-13T18:43:44+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "4202fae", "subject": "feat(quiz): export each question on its own; the quiz uses the same", "date": "2026-10-13T18:43:45+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "spike(explainer): one Vite build writes many pages with one hashed client module\n\n## Intent\n\nRendering many explainer pages should not need a second tool such as Eleventy. Before the runtime is built, prove that a Vite build alone can write every page.\n\n## Key changes\n\n- The explainer's plugin takes the built index.html as the shell of every page and writes each page into its own folder, with one hashed script and stylesheet and the asset URLs rewritten for the page's depth.\n- A build test writes 61 pages this way.\n\n## Dependencies and side effects\n\n- Same intent: the structure and blocks of step 2 follow on this branch after a merge of main; the decided sketch is in the tooling's plan (tooling#54).", "reason": "Stays its own commit: a merge of main lies between it and the rest of step 2.", "sources": [{"sha": "8f3f88b", "subject": "spike(explainer): one Vite build writes many pages with one hashed client module", "date": "2026-10-13T18:54:28+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "feat(explainer): structure, blocks and languages, rendered at build\n\n## Intent\n\nStep 2 of the explainer MVP. Authors should write only content, for any subject, and get complete pages that read without JavaScript, with every mistake in the content reported by the build. Rendering many pages should not need a second tool such as Eleventy.\n\n## Key changes\n\n- Content is YAML in src/: app.yaml with languages and chapter order, a folder per chapter with chapter.yaml and pages, data/ and images/, covered by a published schema with the closed set of blocks.\n- The build reports each problem as one line with file, line, place and language: incomplete order lists, depth, ids, raw HTML, Markdown headings, unknown formula commands, missing source or licence, missing translations, broken section links, extra files.\n- The plugin renders every page: restricted Markdown, MathML formulas, inline SVG figures, code highlighted at build, generated navigation, a glossary, a hidden single chapter kept in the URL, and a page tree per language with a switch that works without JavaScript.\n- The language-map logic sits in a shared module, for the quiz's questions to reuse.\n- The template holds the chapter Prozent from the Mathe-Karte; explainerTests() checks every page in every language without JavaScript.\n- Fixtures: a large one with every block type, a history app with one hidden chapter, and broken fixtures that each fail with exactly one line; CI runs lernapps check on them.\n- New pinned dependencies: temml, marked (over markdown-it, whose dependency licence is not allowed), highlight.js (over Shiki, for contrast from our own styles), yaml.\n\n## Dependencies and side effects\n\n- Same intent: the spike before it on this branch (Vite alone writes many pages) and the decided sketch in the tooling's plan (tooling#54).\n- The language-map logic is shared, for the quiz's questions to reuse in step 3.", "reason": "The four commits of app-templates#14 for step 2, directly one after the other on the branch: tests, runtime, template and CI of the same feature. The spike before them stays its own commit, because a merge of main lies between.", "sources": [{"sha": "bbd74b9", "subject": "test(explainer): the end-to-end tests of every explainer, the fixtures and the broken ones", "date": "2026-10-14T04:38:18+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i077", "why": "Step 2 of the explainer MVP the owner asked to start in i076; only resumed here after the usage limit."}]}, {"sha": "329f40b", "subject": "feat(explainer): the runtime: schema, validation, rendering and navigation", "date": "2026-10-14T04:38:31+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i077", "why": "Step 2 of the explainer MVP (runtime, schema, rendering), requested in i076."}]}, {"sha": "155b10c", "subject": "feat(explainer): the template, with the chapter Prozent", "date": "2026-10-14T04:38:31+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i077", "why": "Step 2 of the explainer MVP (the template with the Prozent chapter), requested in i076."}]}, {"sha": "8d88434", "subject": "ci(explainer): the template in the matrix, the 60-page and history fixtures", "date": "2026-10-14T04:38:31+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i077", "why": "Step 2 of the explainer MVP (CI for the template and fixtures), requested in i076."}]}]}], "messages": 8, "sourceCount": 11, "misplaced": []}, {"id": "i077", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T04:19:03.281Z", "to": "2026-10-14T06:27:41+00:00", "repos": ["app-templates", "tooling"], "commit": "feat(quiz): language maps in a question's texts, and a multi-language quiz in the plan", "intent": "Every explainer text may be a language map, and the explainer embeds quiz questions through the shared question schema, so a multi-language explainer page breaks on a question with plain strings only. Quiz and explainer should also handle languages the same way before the first explainer run.", "decisions": ["language maps in the shared question schema already in step 3, rather than later as the decided sketch had planned (Q5)", "the multi-language quiz as a small step 4 of its own, not folded into step 3", "plain strings stay valid next to language maps, so existing quiz banks need no change"], "trigger": "\"did you also plan to update the quiz template for multi-language blocks/shapes?\" … \"limit has been reset, resume the agents and add the i18n for the quiz blocks in step 3\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i076", "note": "the decided sketch had deferred language maps in the quiz's schema to later (Q5)"}], "groups": [{"repo": "tooling", "message": "docs(plan): language maps for quiz questions in step 3, a multi-language quiz as step 4\n\n## Intent\n\nThe plan deferred language maps in the quiz's schema to later. But the explainer embeds quiz questions through the shared question schema, and every explainer text must accept a language map, so embedded questions need them already in step 3. Quiz and explainer should also handle languages the same way before the first explainer run.\n\n## Key changes\n\n- Step 3 includes language maps for every text of an embedded quiz question, German required, completeness checked, existing banks valid unchanged.\n- A new step 4 makes the quiz template multi-language: a languages field, a page per language, a switch without JavaScript, tests per language. Later steps move up by one.\n- The decisions list records the decision of 2026-10-14, and the languages section no longer says later for the quiz.\n\n## Dependencies and side effects\n\n- Same intent: app-templates#15 gives a question's learner texts language maps.", "reason": "The only commit of tooling#55; a plan change of its own.", "sources": [{"sha": "b1eab5d", "subject": "docs(plan): language maps for quiz blocks in step 3, multi-language quiz as step 4", "date": "2026-10-14T04:27:49+00:00", "pr": null, "plan": true, "moved": []}]}, {"repo": "app-templates", "message": "feat(quiz): language maps in a question's learner texts\n\n## Intent\n\nThe explainer embeds the quiz's question types, and every explainer text may be a language map. A question that accepts only plain strings would break a multi-language explainer page. This belongs to step 3 of the explainer MVP.\n\n## Key changes\n\n- Every learner text of a question (question, options and their info, items, pairs, unit, explanation, link titles) is a string or a map like { de: …, en: … }.\n- Validation takes the declared languages and checks each text with the explainer's language messages; German is always required.\n- Rendering, solution and engine take the page's language, with English engine texts; a wrong answer can carry a diagnosis.\n- Banks with plain strings stay valid and render as before.\n\n## Dependencies and side effects\n\n- Same intent: the tooling's plan puts this into step 3 (tooling#55).", "reason": "The first commit of app-templates#15, a thought of its own: language maps in quiz questions. The exercises that follow in the same pull request are in i080.", "sources": [{"sha": "52dc5e0", "subject": "feat(quiz): language maps in a question's learner texts", "date": "2026-10-14T06:27:41+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i080", "why": "The language maps for quiz questions the owner asked for in i077 (\"add the i18n for the quiz blocks in step 3\"), built as part of step 3."}]}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i078", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T04:54:45.014Z", "to": "2026-10-14T05:49:36+00:00", "repos": ["app-templates", "tooling"], "commit": "test(explainer): two of each instead of 60 pages; lernapps check visits every page of a bundle", "intent": "A 60-page fixture took 4:43 in CI: too slow for CI and far too slow for a pre-push hook, although a much smaller one covers the same cases. And lernapps check stopped silently at 100 pages, so a large explainer bundle would go partly unchecked.", "decisions": ["two of each (chapters, pages, section levels, languages), with every block type on every page, rather than a large fixture", "the history fixture and all broken fixtures stay", "the quiz's 64-question test stays, because it guards a real bug where test time grew with the number of questions", "the page cap: no cap on a built bundle, a cap with an explicit hint on a live address", "the cap's test on a five-page app with a lowered limit, in the fast set, instead of a 120-page app"], "trigger": "\"a 60-page fixture across four chapters in two languages, which takes 4:43 in CI … This sounds unnecessary huge for a test running in CI (let alone pre-push). We should validate 2 of each should be sufficient. What about the cap?\" … \"yes, do the cap change now\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i076", "note": "replaces the 60-page fixture of step 2 (app-templates#14)"}], "groups": [{"repo": "app-templates", "message": "test(explainer): two of each instead of 60 pages\n\n## Intent\n\nA 60-page fixture took 4:43 in CI: too long for CI and far too long for pre-push. Tests must stay fast enough for both and still cover every structure and block type.\n\n## Key changes\n\n- The fixture explainer-all-blocks has two chapters of two pages, in German and English, with two section levels and every block type on every page, so each block type appears four times, with previous and next across chapters.\n- It replaces the 60-page fixture; the longest CI job goes from 4:43 to 1:23.\n\n## Dependencies and side effects\n\n- Same intent: tooling#56 lets lernapps check visit every page of a bundle.", "reason": "The last commit of app-templates#14; the commits before it are step 2, in i076.", "sources": [{"sha": "66ec975", "subject": "test(explainer): two of each instead of 60 pages", "date": "2026-10-14T04:58:51+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "feat(check): visit every page of a bundle; on a URL, say when the limit stops the visit\n\n## Intent\n\nlernapps check stopped at 100 pages and skipped the rest silently, against the rule of no silent cutoff, so a large explainer bundle would have gone partly unchecked. The test of the page limit should also stay small, so hooks stay fast.\n\n## Key changes\n\n- A bundle has a finite list of pages, so its check visits all of them: first those reachable by links from the start page, then every other .html file.\n- A page no link reaches is an error of the new rule pages-reachable; a page marked noindex is checked but need not be reached; the 404 page and files without a doctype are not pages.\n- On a URL the limit of 100 pages stays, and reaching it gives a hint of the same rule instead of stopping silently.\n- Pages are visited four at a time, in the order a single visit would take, so reports stay deterministic.\n- The tooling's own tests can lower the limit on a URL through an environment variable, not a flag and not in the help. A five-page app with a limit of 3 proves the same as a 120-page app did, in about 5 s instead of 35 s, so the test moves to the fast set.\n\n## Dependencies and side effects\n\n- Same intent: app-templates#14 shrinks the explainer fixture to two of each.", "reason": "Both commits of tooling#56, one after the other: the change to the visit, and a smaller, faster test of it.", "sources": [{"sha": "9cbaf95", "subject": "feat(check): visit every page of a bundle; on a URL, say when the limit stops the visit", "date": "2026-10-14T05:26:39+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i079", "why": "The page-cap change the owner approved in i078 (\"yes, do the cap change now\")."}]}, {"sha": "ba0f7e0", "subject": "test(check): prove the visit's limits on a tiny app, in the fast set", "date": "2026-10-14T05:49:36+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i080", "why": "Shrinks the test of the page-cap change (tooling#56) the owner approved in i078; prompted by wish here to keep tests minimal."}]}]}], "messages": 2, "sourceCount": 3, "misplaced": []}, {"id": "i079", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T05:08:06.487Z", "to": "2026-10-14T05:44:40+00:00", "repos": ["tooling"], "commit": "feat: the change scope decides what hooks and CI run", "intent": "Hooks and CI ran every check and build whatever a commit changed, which wastes time on commits that touch only the plan or only the docs. Each change should trigger only the work it needs, decided in one central place for every repo rather than in each one.", "decisions": ["one classifier in the tooling (`lernapps changes`), used by hooks and CI in every repo", "allowlists for none (.vibe/**) and docs (docs/**/*.md only); any other or unknown path runs everything", "README and AGENTS.md count as code, not docs", "gated jobs plus one always-running final job, instead of workflow path filters that leave required checks pending", "the reusable workflow lives in the tooling, not in lernapps/.github", "the generated publish workflow drops its paths-ignore for .vibe"], "trigger": "\"we currently run all checks and builds pre-commit/pre-push and in ci independent of the scope of the change. Plan file commits (.vibe) should not trigger anything, docs should only trigger site related validations and deployments. Can we adapt this in a central place?\" … \"Only docs/*.md. Agree to put it in tooling\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i074", "note": "replaces the paths-ignore for plan-only changes in the generated publish workflow"}], "groups": [{"repo": "tooling", "message": "feat: the change scope decides what hooks and CI run\n\n## Intent\n\nHooks and CI ran every check and build whatever a commit changed. A change of only the plan needs no checks at all, and a change of only docs needs only site work. This should be decided in one central place for every repo, not in each repo on its own.\n\n## Key changes\n\n- A classifier, `lernapps changes`, names the scope: none for only .vibe/**, docs for only docs/**/*.md (with or without the plan), all for anything else or when the changed files cannot be known.\n- The lists are allowlists with a default per kind of repo (app, tooling, site); a repo may declare exceptions in package.json, and invalid entries fail.\n- lernapps check --pre-commit and --pre-push ask it first: with none, and with docs in an app, they print one line and check nothing; with docs in a repo with a site, only the site is built and checked. The tooling's own heavy-test gating uses the same patterns.\n- The app-check and app-publish actions classify the event themselves, so generated apps skip plan-only and docs-only changes with no configuration.\n- A reusable workflow outputs the scope; each workflow gates its jobs on it and has one always-running final job as the required check, since a check skipped by a workflow path filter would stay pending.\n- The generated publish workflow drops its paths-ignore for .vibe.\n- The classifier's tests ignore a hook's git variables and give git a timeout, so they also pass under the pre-push hook and on a busy machine.", "reason": "Both commits of tooling#57, one after the other: the classifier, and a fix of its tests under the pre-push hook.", "sources": [{"sha": "db30e2e", "subject": "feat: the change scope decides what hooks and CI run", "date": "2026-10-14T05:28:57+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "6bd4f21", "subject": "test(changes): independent of a hook's git variables, with timeouts for git", "date": "2026-10-14T05:44:40+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i080", "why": "A test fix inside tooling#57, the change-scope classifier."}]}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i080", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T05:34:55.152Z", "to": "2026-10-14T06:31:09+00:00", "repos": ["app-templates"], "commit": "feat(explainer): exercises on every page, with the quiz's types and generated exercises", "intent": "Learners should practise on every explainer page, not only read: for any subject, and with tasks drawn from new values each time. This is step 3 of the explainer MVP, and its tests must stay minimal, because git hooks must stay as fast as possible.", "decisions": ["property test over 200 seeds, since it costs about 30 ms per exercise", "browser tests with JavaScript only in German at 360 px, one exercise per type per page; the checks without JavaScript stay per page and language", "broken cases as build-only tests, no new apps and no new CI jobs", "an expression language on exact fractions, parsed and walked, never eval", "without JavaScript a generated exercise shows three worked tasks from fixed seeds"], "trigger": "\"I merged #14, start step 3\" … \"Keep the test minimal. We must keep particularly git hooks s as fast as possible\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i076", "note": "step 3 of the explainer MVP"}, {"type": "continues", "intent": "i077", "note": "uses the language maps of quiz questions"}], "groups": [{"repo": "app-templates", "message": "feat(explainer): exercises on every page, with the quiz's types and generated exercises\n\n## Intent\n\nStep 3 of the explainer MVP. Learners should practise on every page, not only read: for any subject, and with tasks drawn from new values each time, as the decided sketch requires. The tests must stay minimal, so hooks stay fast.\n\n## Key changes\n\n- A small expression language on exact fractions, parsed into a tree and evaluated without eval, with comparisons, record fields, list access and a few list functions; errors say what to change.\n- A generated exercise declares what is drawn (numbers, picks from lists or data files, shuffles), conditions, a task template, an answer with a comparator mapped onto the quiz's answer kinds, mistakes with messages, a hint and steps. The same module runs at build and in the browser.\n- The build runs each generated exercise as a property test over 200 seeds: conditions do not starve, the answer passes its comparator, no mistake equals it, the task is deterministic and the figure does not show the answer.\n- Without JavaScript a question shows its Lösung box and a generated exercise three worked tasks from fixed seeds; with JavaScript they become live, with feedback in view and a seed in the address for every task.\n- The schema requires an exercise on every page; the template's Prozent pages get theirs from the Mathe-Karte's generators.\n- explainerTests() checks every exercise without JavaScript in every language, and with JavaScript only in German at 360 px, one exercise of each type per page; broken cases are build-only tests.\n\n## Dependencies and side effects\n\n- Builds on the language maps of quiz questions, the first commit of app-templates#15 (52dc5e0).", "reason": "The commits of app-templates#15 after the language maps, one after the other; together one feature, exercises in explainer pages. The expression language exists for the generated exercises, and the last commit only formats the template's content.", "sources": [{"sha": "b9885b4", "subject": "feat(explainer): the expression language of generated exercises", "date": "2026-10-14T06:27:41+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "30f9917", "subject": "feat(explainer): generated exercises, drawn from a seed and property-tested", "date": "2026-10-14T06:27:41+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "7140404", "subject": "feat(explainer): exercises on every page", "date": "2026-10-14T06:27:41+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "b6cdfd9", "subject": "style(explainer): the template's Übung formatted as the app's formatter wants it", "date": "2026-10-14T06:31:09+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 3, "sourceCount": 4, "misplaced": []}, {"id": "i081", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T10:10:16.741Z", "to": "2026-10-14T10:30:30+00:00", "repos": ["app-templates"], "commit": "feat(quiz): the quiz in several languages", "intent": "A quiz should be possible in several languages, as an explainer is, so that both archetypes behave the same before the first explainer run. This is step 4 of the explainer MVP.", "decisions": ["no new template or archetype: the existing quiz runtime and template are extended", "a skill change alone cannot work, because quiz-only-data forbids code and the runtime built one page in one language", "the explainer's page-tree and language-switch code moves into the shared runtime instead of being copied", "full tests in German only; other languages get a short no-JavaScript test and one answered question", "single-language banks render byte for byte as before"], "trigger": "\"Why do we need a separate template for it, not only an expansion in the specific skill?\" … \"Agreed\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i077", "note": "step 4, added to the plan there"}], "groups": [{"repo": "app-templates", "message": "feat(quiz): the quiz in several languages\n\n## Intent\n\nA quiz should be possible in several languages, as an explainer is, so that both archetypes behave the same before the first explainer run. A quiz app may only write its question bank, and the runtime built exactly one page in one language, so a skill alone cannot give a quiz a second language. This is step 4 of the explainer MVP.\n\n## Key changes\n\n- The explainer's page trees, page language, hreflang alternates and language switch of plain links move to the shared runtime; every explainer page renders byte for byte as before.\n- A bank may declare its languages, German first; every learner text, the title, intro and source titles too, is then a map with each of them. The build fails on a missing translation, an undeclared language, or German not first.\n- The build writes a page per language: German at the root, others below /<language>/, each with hreflang, a switch that works without JavaScript, the worksheet with solutions, and the engine's texts in that language.\n- quizTests() runs in full in German; for every other language it checks the page without JavaScript and one answered question.\n- A German-only bank builds the same page as before; a small bilingual fixture runs in its own CI job.", "reason": "Both commits of app-templates#16 serve one thought: the refactor moves the language code into the shared runtime only so that the quiz can use it.", "sources": [{"sha": "915a1f1", "subject": "refactor(explainer): page trees and the language switch in runtime/shared", "date": "2026-10-14T10:30:30+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "63663c3", "subject": "feat(quiz): the quiz in several languages", "date": "2026-10-14T10:30:30+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i082", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T11:22:23.787Z", "to": "2026-10-14T11:33:06+00:00", "repos": ["app-templates"], "commit": "feat(explainer): explicit {{placeholders}} in generated exercises, checked at build", "intent": "In the formulas of a generated exercise, every declared variable name was replaced automatically, so a letter meant to stay a letter could be filled in. Placeholders should be unambiguous, and every mistake in them should be caught at build.", "decisions": ["placeholders are always explicit, also in formulas; a bare letter is always the letter", "{{name}} over {name}, because single braces are LaTeX grouping and ambiguous, and over a bracket like ⟨G⟩, which is hard to type", "unknown placeholders, a declared name in single braces, spaces inside braces and unused variables are build errors"], "trigger": "\"WRT placeholders: whatever is more safe/checkable.\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i080", "note": "changes the placeholder syntax of generated exercises built in step 3"}], "groups": [{"repo": "app-templates", "message": "feat(explainer): explicit {{placeholders}} in generated exercises, checked at build\n\n## Intent\n\nInside formulas, every declared variable name of a generated exercise was replaced automatically, so a letter meant to stay a letter could be filled in. Placeholders should be unambiguous, and every mistake in them should be caught at build.\n\n## Key changes\n\n- A placeholder is two braces around a declared name or a field, with nothing else inside: {{G}}, {{e.name}}, {{answer}}, the same in prose and in formulas.\n- One brace is never a placeholder, so in a formula G, {G} and \\frac{W}{G} stay letters; a group around a value keeps its own braces, as in \\frac{{{W}}}{{{G}}}.\n- The build fails, naming file, line, block, language and placeholder, on an unknown placeholder, on a declared name in single braces in prose, on spaces inside the braces, on a variable no placeholder or expression uses, and on a placeholder left after filling in, now also in a figure's alt text.\n- The template's Prozent pages, the fixtures and the schema's descriptions use the new syntax.", "reason": "The only commit of app-templates#17.", "sources": [{"sha": "7d99da2", "subject": "feat(explainer): explicit {{placeholders}} in generated exercises, checked at build", "date": "2026-10-14T11:33:06+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i083", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T13:28:42.414Z", "to": "2026-10-14T14:19:09+00:00", "repos": ["app-templates"], "commit": "feat(explainer): vue-component blocks, rendered at build and hydrated as islands", "intent": "Data-driven exercises carry maths and some sciences, but a cell diagram to label or a circuit to switch needs real interface code. Pages that use such code must still read without JavaScript. This is step 5 of the explainer MVP.", "decisions": ["Vue first, as type vue-component, so other frameworks can come in later under their own names", "props checked with Vue's own SFC compiler rather than vue-component-meta, which would add about 23 MB of tooling and seconds per start", "pages without a component load no Vue at all", "the logic module gets generate(seed, props), because a task often depends on the content", "browser globals allowed in onMounted and the unmount hooks; property test over 50 seeds"], "trigger": "\"It’s merged\" (step 5 as decided earlier: \"we should allow for components too … type vue-component\", \"A component might get an explanatory nojs explanation text though. Then it should hold\")", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i076", "note": "step 5 of the explainer MVP decided in the sketch"}], "groups": [{"repo": "app-templates", "message": "feat(explainer): vue-component blocks, rendered at build and hydrated as islands\n\n## Intent\n\nData-driven exercises carry maths and some sciences, but a cell diagram to label or a circuit to switch needs real interface code. Pages that use such code must still read without JavaScript. This is step 5 of the explainer MVP.\n\n## Key changes\n\n- A vue-component block names a component in src/components/, gives its props and requires a nojs text in every language, which the page shows without JavaScript.\n- The build renders each component on the server into a hidden island; in the browser it hydrates and replaces the nojs text, or keeps it as a caption if the component declares that. Only pages with a component load Vue.\n- Props are checked against the component's declared types; a string prop is a learner text, checked in every language.\n- Build checks with one line per problem: no network, no eval, innerHTML or v-html, imports only from allowed modules, browser globals only while mounted, a test file per component, 20 kB gzip per component.\n- A component that emits answered is an exercise: its logic module exports generate, check, solution and wrong, property-tested over 50 seeds, and answered drives the quiz's feedback.\n- explainerTests() checks each nojs text without JavaScript and, with JavaScript in German, that each component hydrates without errors.\n- The history fixture gets a component where the learner labels a pyramid; vue and the Vue plugin are pinned, and vue-tsc type-checks .vue files in CI.", "reason": "The only commit of app-templates#18.", "sources": [{"sha": "fd04888", "subject": "feat(explainer): vue-component blocks, rendered at build and hydrated as islands", "date": "2026-10-14T14:19:09+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i084", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T14:43:02.469Z", "to": "2026-10-14T15:29:50+00:00", "repos": ["app-templates", "apps", "docs", "lernapps.github.io"], "commit": "ci: the change scope gates hooks and CI in the catalog, the docs, the main site and app-templates", "intent": "Roll the change scope out to every repo, so a plan-only change runs nothing and a docs-only change only the site, with required checks that never stay pending. Give app-templates git hooks that check only what a push touches.", "decisions": ["the final jobs keep the names branch protection already requires; require only the final jobs", "app-templates' hook fetches the classifier at a pinned tooling commit, not as a devDependency (every app install would fetch and build the tooling again) and not through npx (fails on npm 10, slow)", "app-templates' pre-push checks only the templates a push affects, by an explicit path list; the fixtures run only in CI"], "trigger": "\"which required checks need adjustment? Send me a quick instruction for my local agent that has gh cli access\" … \"done. continue\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i079", "note": "rolls the change scope out to the other repos"}, {"type": "continues", "intent": "i082", "note": "app-templates' root hooks, proposed when asked which hooks"}], "groups": [{"repo": "apps", "message": "ci: the change scope gates the catalog's site jobs\n\n## Intent\n\nEvery change to the catalog ran all tests, the build and the deploy. With the change scope in the tooling, a plan-only change should run nothing and a docs-only change only the site.\n\n## Key changes\n\n- Pages and preview ask the tooling's reusable scope workflow first: only the plan runs nothing, only docs runs the site's build, check and deployment, anything else runs everything.\n- The jobs site and preview always run and report, so the required checks keep their names and never stay pending; the listing workflow keeps its own paths filter.\n- The pin of the tooling moves to the commit whose classifier the workflows run.\n\n## Dependencies and side effects\n\n- Same intent: lernapps/docs and lernapps.github.io gate their site jobs the same way; app-templates gets root hooks and gated CI.", "reason": "The first commit of apps#16; its later commits are in i085 (hooks) and i087 (test fixes).", "sources": [{"sha": "85f1f99", "subject": "ci: the change scope gates the site's jobs", "date": "2026-10-14T14:55:25+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "docs", "message": "ci: the change scope gates the docs site's jobs\n\n## Intent\n\nEvery change to the docs repo built and deployed the site, plan-only changes included. The change scope lets a plan-only change skip it.\n\n## Key changes\n\n- Pages and preview ask the tooling's reusable scope workflow first; a change of only the plan builds and deploys nothing; docs and anything else run the site as before.\n- The jobs site and preview always run and report, so the required checks keep their names and never stay pending.\n\n## Dependencies and side effects\n\n- Same intent: lernapps/apps and lernapps.github.io gate their site jobs the same way; app-templates gets root hooks and gated CI.", "reason": "The only commit of docs#18.", "sources": [{"sha": "889f7fa", "subject": "ci: the change scope gates the site's jobs", "date": "2026-10-14T14:57:20+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "lernapps.github.io", "message": "ci: the change scope gates the main site's jobs\n\n## Intent\n\nEvery change to the main site built and deployed it, plan-only changes included. The change scope lets a plan-only change skip it.\n\n## Key changes\n\n- Pages and preview ask the tooling's reusable scope workflow first; a change of only the plan builds and deploys nothing; docs and anything else run the site as before.\n- The jobs site and preview always run and report, so the required checks keep their names and never stay pending.\n\n## Dependencies and side effects\n\n- Same intent: lernapps/apps and lernapps/docs gate their site jobs the same way; app-templates gets root hooks and gated CI.", "reason": "The first commit of lernapps.github.io#32; its hooks commit is in i085.", "sources": [{"sha": "852466f", "subject": "ci: the change scope gates the site's jobs", "date": "2026-10-14T14:58:07+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "app-templates", "message": "feat(hooks): root git hooks and CI, gated by the change scope\n\n## Intent\n\napp-templates had no git hooks, so a formatting error of step 3 was first caught in CI, and every push ran every check. A plan-only or docs-only push should check nothing, and a push should check only the templates it touches.\n\n## Key changes\n\n- npm ci installs the repo's own hooks. Pre-commit formats and lints the staged files, quietly.\n- Pre-push asks the tooling's classifier first, so a plan-only or docs-only push checks nothing; otherwise it runs the root checks and lernapps check only in the template folders the push affects, by an explicit path list. The fixture jobs stay in CI.\n- The hook fetches only the classifier from the tooling at a pinned commit into .git/lernapps/ and runs it with Node: 1.7 s the first time, 0.3 s after. A devDependency made every app's install fetch and build the tooling once more; npx fails on npm 10 and is slow.\n- A test checks that the hook's tooling commit is the one CI uses.\n- CI gates every job on the scope, keeps the job names, adds actionlint, and has one final job check, the one to require.\n\n## Dependencies and side effects\n\n- Same intent: lernapps/apps, lernapps/docs and lernapps.github.io gate their site jobs with the same classifier.", "reason": "All commits of app-templates#19 serve one thought, hooks and CI gated by the change scope; the later ones fix the CI order and replace the devDependency the first one added.", "sources": [{"sha": "a39cc03", "subject": "feat(hooks): root git hooks, gated by the change scope", "date": "2026-10-14T15:08:07+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "9e377a3", "subject": "ci(check): gate every job on the change scope; one final job `check`", "date": "2026-10-14T15:08:17+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "b9da258", "subject": "ci(check): the unit tests before the type check's tooling; the root's hooks are allowed", "date": "2026-10-14T15:13:48+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "0a6e65f", "subject": "fix(hooks): no tooling devDependency; the hook fetches the classifier itself", "date": "2026-10-14T15:29:50+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 3, "sourceCount": 7, "misplaced": []}, {"id": "i084b", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T14:49:06.636Z", "to": "2026-10-14T15:29:42+00:00", "repos": ["tooling"], "commit": "feat: the explainer archetype in the tooling", "intent": "Let lernapps create make an explainer app that passes lernapps check, checks its Vue components as the build does, and tells the assistant how to write it. This is step 6 of the explainer MVP, now that app-templates#18 is merged.", "decisions": ["vue-tsc runs only in apps that have a .vue file", "the component lint rules share ids and wording with the build checks; v-html stays a build check, since Oxlint does not see the template", "one new skill, lernapps-explainer, shaped like lernapps-quiz"], "trigger": "\"done\" (app-templates#18 merged, which the step waited for)", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i083", "note": "step 6 of the explainer MVP, the tooling side"}], "groups": [{"repo": "tooling", "message": "feat: the explainer archetype in the tooling\n\n## Intent\n\nSteps 1 to 5 built the explainer runtime in app-templates. Let `lernapps create --archetype explainer` make an app that passes lernapps check, checks its Vue components in the editor and at commit as the build does, and tells the assistant how to write it.\n\n## Key changes\n\n- The pin moves to the app-templates commit with every explainer step, and explainer joins the archetypes the generator offers; explainer apps get vue-tsc and typescript.\n- lernapps check runs vue-tsc only where the project has a .vue file, so other apps pay nothing.\n- Four lint rules for component code carry the ids and wording of the build checks: no network, no HTML injection, allowed imports, browser globals.\n- The new skill lernapps-explainer covers structure, blocks, formulas, languages, data files, exercises with generated and {{…}}, components and 26 rules; lernapps-quiz gains its languages; the quiz rules also apply to the explainer.\n- The explainer gets its review rubric, and the docs site publishes its schema.\n- The architecture states the runtime's responsibility for both archetypes, components under a contract, and the decision to render with Vite; the plan records steps 1 to 5 as done, with the spike's result and the deviations.\n- A heavy generator test creates, installs, checks and updates an explainer app, and a type error in a component fails at vue-tsc; the runtime-bug test finds quizTests in the shared chunk.", "reason": "All commits of tooling#59 are step 6 of the explainer MVP, one thought: the generator, checks, lint, skills, architecture and plan for the new archetype, and a test fix the new pin made necessary. The plan commit joins the architecture commit.", "sources": [{"sha": "5198643", "subject": "feat: the archetype explainer: pin, vue-tsc in the type step, component lint rules", "date": "2026-10-14T15:13:12+00:00", "pr": null, "plan": false, "moved": [{"kind": "split", "from": "i084", "why": "The time cut held two unrelated requests; this one became its own intent."}]}, {"sha": "c8401e7", "subject": "docs(skills): the skill lernapps-explainer, the quiz's languages, the explainer's rubric and schema", "date": "2026-10-14T15:19:04+00:00", "pr": null, "plan": false, "moved": [{"kind": "split", "from": "i084", "why": "The time cut held two unrelated requests; this one became its own intent."}]}, {"sha": "6c22d67", "subject": "docs(arc42): the explainer's runtime, its content, components under a contract, rendering with Vite", "date": "2026-10-14T15:20:29+00:00", "pr": null, "plan": false, "moved": [{"kind": "split", "from": "i084", "why": "The time cut held two unrelated requests; this one became its own intent."}]}, {"sha": "113532b", "subject": "docs(plan): steps 1–5 of the explainer MVP completed, the spike's result and the deviations", "date": "2026-10-14T15:21:11+00:00", "pr": null, "plan": true, "moved": [{"kind": "split", "from": "i084", "why": "The time cut held two unrelated requests; this one became its own intent."}]}, {"sha": "670dcc7", "subject": "test(create): find quizTests in the runtime's chunks, which it now shares with the explainer's", "date": "2026-10-14T15:29:42+00:00", "pr": null, "plan": false, "moved": [{"kind": "split", "from": "i084", "why": "The time cut held two unrelated requests; this one became its own intent."}]}]}], "messages": 3, "sourceCount": 5, "misplaced": []}, {"id": "i085", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T15:40:21.008Z", "to": "2026-10-14T16:09:20+00:00", "repos": ["apps", "lernapps.github.io"], "commit": "chore(hooks): the catalog and the main site get hooks with the change scope and site checks", "intent": "Give the catalog and the main site git hooks like the other repos, with the change scope and the site checks.", "decisions": ["a prepare script points git at .githooks/, since these repos do not use vite-plus", "no formatter or linter added, since neither repo has one and CI runs none (a formatter offered as a later step)", "the catalog's entry-point tests stay in CI: they need the network, take over a minute and fail on a passing 503", "the classifier is fetched at a pinned tooling commit, as app-templates does"], "trigger": "\"There are merge conflicts in the open PRs\" … \"The catalog and main site should have hooks too, with site checks of course\"", "kind": "chore", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i084", "note": "adds hooks to the change-scope pull requests apps#16 and lernapps.github.io#32"}], "groups": [{"repo": "apps", "message": "chore(hooks): pre-commit and pre-push hooks with the change scope and the site checks\n\n## Intent\n\nGive the catalog git hooks like the other repos, with the change scope and the site checks.\n\n## Key changes\n\n- npm ci points git at .githooks/. Both hooks are quiet: they print one line, or on a failure the step and its log.\n- Pre-commit checks whitespace and conflict markers, that staged JavaScript, JSON and YAML parse, and that the schema is in sync. The repo has no formatter or linter, so the hook adds none.\n- Pre-push asks the tooling's classifier at a pinned commit: only the plan checks nothing; docs or code run the site's build and check, as CI's build job does; code also runs the offline listing and review tests.\n- The entry-point tests stay in CI: they need the network and fail on a passing 503 of a remote; the containerised review build needs Docker.\n- A test checks that the hook's tooling commit matches every workflow and the tooling pin.\n\n## Dependencies and side effects\n\n- Same intent: lernapps.github.io gets the same hooks.", "reason": "One commit in apps#16 for this request; the commits before and after it are in i084 and i087.", "sources": [{"sha": "60e6f69", "subject": "chore(hooks): pre-commit and pre-push hooks, with the change scope and the site checks", "date": "2026-10-14T16:07:10+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "lernapps.github.io", "message": "chore(hooks): pre-commit and pre-push hooks with the change scope and the site checks\n\n## Intent\n\nGive the main site git hooks like the other repos, with the change scope and the site checks.\n\n## Key changes\n\n- npm ci points git at .githooks/; this costs the sites that install the package from git nothing.\n- Pre-commit checks whitespace and conflict markers and that staged JavaScript and JSON parse. The repo has no formatter or linter, so the hook adds none.\n- Pre-push asks the tooling's classifier at a pinned commit: only the plan checks nothing; docs or code run the site's build and check, as CI does.\n- A test, now also a CI job under the required check site, checks that the hook's tooling commit matches every workflow.\n\n## Dependencies and side effects\n\n- Same intent: lernapps/apps gets the same hooks.", "reason": "One commit in lernapps.github.io#32 for this request.", "sources": [{"sha": "37a34ec", "subject": "chore(hooks): pre-commit and pre-push hooks, with the change scope and the site checks", "date": "2026-10-14T16:09:20+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i086", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T17:37:47.577Z", "to": "2026-10-14T17:52:06+00:00", "repos": ["tooling"], "commit": "fix(renovate): move every pin of the tooling commit in one pull request", "intent": "Let Renovate move every pin of the tooling commit, the plain strings in hooks and workflows included, in one pull request, so a partial bump never turns CI red. Do it in the org's shared preset, not in a personal one.", "decisions": ["regex custom managers for tooling-ref in workflows and TOOLING_REF in hooks", "the group lernapps building blocks covers all @lernapps/* packages, so everything moves in one pull request; this supersedes tooling#39", "the personal preset stays untouched", "a fast test runs the patterns against snippets of the real files"], "trigger": "\"59 is merged. The other scope PRs are still conflicted\" … \"Teach renovate that trick, in our shared config (not be the mrsimpson one)\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i085", "note": "the hooks pin the tooling commit as a plain string"}], "groups": [{"repo": "tooling", "message": "fix(renovate): move every pin of the tooling commit in one pull request\n\n## Intent\n\nRepos pin the tooling commit not only in action refs and the npm dependency, which Renovate moves, but also as plain strings: tooling-ref in workflows and TOOLING_REF in the hooks. Tests require all of them to be the same commit, so a partial bump turns CI red, and the change-scope pull requests kept falling into conflict. Teach Renovate to move all of them at once, in the org's shared preset, not in a personal one.\n\n## Key changes\n\n- Two regex custom managers read tooling-ref and TOOLING_REF as the git reference lernapps/tooling at main.\n- The group lernapps building blocks now matches all @lernapps/* packages, so the tooling and app-templates move in the same pull request as the actions, the scope workflow and the plain strings. This supersedes tooling#39.\n- A test runs the match patterns as Renovate does against snippets of the real workflows and hooks, and checks the group.", "reason": "The only commit of tooling#62.", "sources": [{"sha": "7d54698", "subject": "fix(renovate): move every pin of the tooling commit in one pull request", "date": "2026-10-14T17:52:06+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 1, "misplaced": []}, {"id": "i086b", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T17:37:47.577Z", "to": "2026-10-14T18:29:58+00:00", "repos": ["tooling"], "commit": "feat(check): explainer pages checked without JavaScript at the gate, and section anchors of an entry", "intent": "Check at the gate what an explainer promises: pages readable without JavaScript, so the listing and /review see it, not only the template's own tests. Let an entry's topics link sections of a page, and make sure those links resolve. This is step 7 of the explainer MVP, after tooling#59.", "decisions": ["a second visit with JavaScript off only for pages with the explainer marker; other apps get no extra visit", "no formula count against the content on a URL, which has no content; explainerTests() keeps that", "a topic's #section is read from the served HTML in the same fetch, without a browser", "pages-reachable needed no change for explainer bundles"], "trigger": "\"59 is merged. The other scope PRs are still conflicted\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i084b", "note": "step 7 of the explainer MVP, after the archetype step"}], "groups": [{"repo": "tooling", "message": "feat(check): explainer pages checked without JavaScript at the gate, and section anchors of an entry\n\n## Intent\n\nCheck the explainer's promise of being readable without JavaScript at the gate too, so the listing validation and /review see it, not only the template's own tests. Catalog entries may link sections of a page, so make sure those links resolve.\n\n## Key changes\n\n- Pages marked as explainer pages are visited a second time with JavaScript off, in one shared browser context, on a bundle and on a deployed address; other apps get no extra visit and the rule is left out of their report.\n- The new error rule explainer-readable-without-js checks an h1, that every heading, formula and figure is visible, every figure has an accessible name, every exercise has a non-empty Lösung and every component's nojs text is visible.\n- An entry's topic page#section must name an element id of its page, read from the HTML as the server sends it.\n- The explainer and app skills say which rules lernapps check now enforces; the plan records step 7.\n- Tests in the fast set: a passing and a broken explainer fixture, proof from the server log that unmarked pages get no second visit, and the anchors.\n\n## Dependencies and side effects\n\n- lernapps check on an explainer bundle takes a fraction of a second longer; quiz and other bundles are unchanged.", "reason": "The step 7 commits of tooling#64, one after the other: its tests, its code, the skill text and the plan; the plan commits join the docs commit. The last commit of the pull request is in i089.", "sources": [{"sha": "f49dc70", "subject": "test(check): explainer pages without JavaScript, and section anchors of an entry's topics", "date": "2026-10-14T18:08:24+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i087", "why": "Step 7 of the explainer MVP, started right after \"59 is merged\" in i086."}]}, {"sha": "96c3633", "subject": "feat(check): explainer-readable-without-js, and section anchors in entry-links-resolve", "date": "2026-10-14T18:08:49+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i087", "why": "Step 7 of the explainer MVP, started in i086."}]}, {"sha": "24bc63c", "subject": "docs(skills): the explainer's rules name lernapps check; the entry's section anchors", "date": "2026-10-14T18:08:56+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i087", "why": "Step 7 of the explainer MVP (skill and arc42 text), started in i086."}]}, {"sha": "2cc0a6c", "subject": "docs(plan): step 6 of the explainer MVP merged, step 7 as built", "date": "2026-10-14T18:09:00+00:00", "pr": null, "plan": true, "moved": [{"kind": "moved", "from": "i087", "why": "Plan commit of step 7, started in i086."}]}, {"sha": "59849ae", "subject": "docs(plan): step 7 is in review in #64", "date": "2026-10-14T18:29:58+00:00", "pr": null, "plan": true, "moved": [{"kind": "moved", "from": "i087", "why": "Plan commit of step 7, started in i086."}]}]}], "messages": 2, "sourceCount": 5, "misplaced": []}, {"id": "i087", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T18:08:07.143Z", "to": "2026-10-14T18:52:50+00:00", "repos": ["apps"], "commit": "test(entry-point): an outside host's passing 5xx or 429 is a note; the archetypes run at the same time", "intent": "Bring the catalog's entry-point test back to a reasonable time now that it builds two archetypes, and keep the catalog's main from failing when an outside host briefly answers 5xx.", "decisions": ["our own hosts stay strict; an outside 5xx or 429 is retried after 2 s and 5 s, then reported as a note", "the fixes go into apps#16 rather than a new pull request", "the archetypes' create commands run one after the other, their installs and checks at the same time, because npx shares one cache folder"], "trigger": "\"The app pr tests timeout: https://github.com/lernapps/apps/pull/16\" … \"re-use #16 for both. it anyway got another conflict.\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i084b", "note": "since the explainer archetype, the test creates and checks two apps"}, {"type": "continues", "intent": "i084", "note": "the fixes go into apps#16, the catalog's change-scope pull request"}], "groups": [{"repo": "apps", "message": "test(entry-point): an outside host's passing 5xx or 429 is a note; the archetypes run at the same time\n\n## Intent\n\nSince the explainer joined, the catalog's entry-point test creates and checks two apps one after the other, about 3.5 minutes, which looked like a timeout. The catalog's main also failed because GitHub briefly answered 503 for a linked page. Fix both in apps#16.\n\n## Key changes\n\n- Our own hosts stay strict: any answer but 2xx after redirects fails, never retried.\n- An outside host that answers 5xx or 429 is asked again after 2 s and after 5 s; if it still fails, the test writes a note instead of failing. A 404 or a failed fetch still fails.\n- The archetypes install and check at the same time, each in its own folder with its own preview port and share of the cores.", "reason": "Stays its own commit: a merge lies between it and the next fix of apps#16.", "sources": [{"sha": "010f00a", "subject": "test(entry-point): an outside host's passing 5xx or 429 is a note; the archetypes run at the same time", "date": "2026-10-14T18:34:12+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i088", "why": "Fixes the catalog tests that time out, which this intent's own message reports (\"The app pr tests timeout\")."}]}]}, {"repo": "apps", "message": "test(entry-point): the archetypes' create commands one after the other\n\n## Intent\n\nRunning the archetypes at the same time broke CI: the two npx runs of lernapps create share one cache folder, and one of them found a half-installed package.\n\n## Key changes\n\n- The create commands run one after the other.\n- Installs and checks still run at the same time, each in its own folder.\n\n## Dependencies and side effects\n\n- Same intent: the commit before it on this branch, which made the archetypes run at the same time.", "reason": "Stays its own commit: a merge lies between it and the commit before.", "sources": [{"sha": "92ab8c9", "subject": "test(entry-point): the archetypes' create commands one after the other, their installs and checks at the same time", "date": "2026-10-14T18:52:50+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i088", "why": "Fixes the catalog tests that time out, which this intent's own message reports (\"The app pr tests timeout\")."}]}]}], "messages": 1, "sourceCount": 2, "misplaced": []}, {"id": "i088", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T18:23:22.733Z", "to": "2026-10-14T18:27:43+00:00", "repos": ["tooling"], "commit": "fix(renovate): the building blocks wait for a three-hour window, not minutes", "intent": "Give open pull requests that touch workflows time to merge: Renovate bumped every repo within minutes of each tooling merge and automerged, so they fell into conflict again and again.", "decisions": ["a schedule window every three hours instead of the asked-for minimumReleaseAge of one hour: references without a release timestamp would be held back for good, a partial bump", "minimumReleaseAge stays 0 so every pin moves; automerge stays on"], "trigger": "\"can you explain why this happens so quickly? we might gie renovate an hour grace period\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i086", "note": "the building-blocks group gets a schedule"}], "groups": [{"repo": "tooling", "message": "fix(renovate): the building blocks wait for a three-hour window, not minutes\n\n## Intent\n\nThe group lernapps building blocks bumped every repo within minutes of each tooling merge and automerged, so open pull requests that touch workflows fell into conflict again and again. Give them a grace period of about an hour.\n\n## Key changes\n\n- The group opens its pull request only in the hours 0, 3, … 21; tooling commits merged in between arrive together, on average about an hour later.\n- Not minimumReleaseAge: only the actions have a release timestamp. The npm git pin and the plain-string pins have none, and Renovate would hold them back for good while the actions moved alone, a partial bump that turns CI red.\n- minimumReleaseAge stays 0 and automerge stays on; a test checks the setting.", "reason": "The only commit of tooling#65.", "sources": [{"sha": "f937d34", "subject": "fix(renovate): the building blocks wait for a three-hour window, not minutes", "date": "2026-10-14T18:27:43+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i089", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T19:09:33.049Z", "to": "2026-10-14T19:11:35+00:00", "repos": ["tooling"], "commit": "docs(arc42): responsibilities only, no implementation details", "intent": "Keep the architecture at the level of responsibilities: say what each part is accountable for, and leave the details to the code, the help texts and the skills.", "decisions": ["bb-check-cli rewritten at the level of responsibility", "a sweep of the whole of docs/arc42 instead of fixing one element", "standards and quality targets such as WCAG 2.1 AA and 360 px stay as constraints", "a guard test against details in arc42 only proposed, not built"], "trigger": "\"`bb-check-cli again contains implementatino details`\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i086b", "note": "step 7 had added implementation details to bb-check-cli"}], "groups": [{"repo": "tooling", "message": "docs(arc42): responsibilities only, no implementation details\n\n## Intent\n\nThe architecture's check CLI element again described implementation details. State what each part is accountable for and why; details belong in the code, the help texts and the skills.\n\n## Key changes\n\n- bb-check-cli says what the check CLI is accountable for: every check of an app, the same command everywhere, a built app or a deployed address as a learner meets it, explainer pages also without JavaScript, the entry against the app, every finding with its rule.\n- A sweep of docs/arc42 removes client-module wording, a named comment command and other details; the evidence table's derived facts name no paths, flags, packages or environment variables, while its source column keeps its sources.", "reason": "A single commit for this review point; it is the last commit of tooling#64, but a separate thought from step 7, whose commits are in i086b.", "sources": [{"sha": "049a3a7", "subject": "docs(arc42): responsibilities only, no implementation details", "date": "2026-10-14T19:11:35+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i090", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T20:13:51.285Z", "to": "2026-10-14T21:23:40+00:00", "repos": ["tooling"], "commit": "feat: archetype-neutral content skills and a content guide in every app", "intent": "Make the guidance teach more than the template: how to research a chapter's content, add content, build reusable exercise patterns, and write the chosen principles down for later agents. Keep it generic across templates and concrete per app.", "decisions": ["three archetype-neutral skills (research, growth, exercise patterns) rather than more text in the explainer skill", "many competencies are grouped into chapters; the app is never split", "the app's guide sits at the fixed path .agents/skills/app-content, with a symlink for Claude Code", "AGENTS.md says to load the filled guide first, fill it after the plan is confirmed and update it with each content decision", "an error rule app-content-guide and a rubric item app-content-matches; no freshness check", "the Mathe-Karte's research, slice and pattern ideas abstracted into the skills"], "trigger": "\"Before we start with anything, we should make sure that the skill not only explains how to use the template, but also - instruct how to research the chapter content - how to add additional content - how to create reusable concepts for exercises - how to write the chosen principles down …\" … \"What about creating dedicated skills and reference those from the genetic agents.md? … Could we do this genetically across templates?\" … \".agents/skills/app-content/ can be fixed. We can also symlink it for Claude\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i084b", "note": "extends the guidance written for the explainer archetype"}], "groups": [{"repo": "tooling", "message": "feat: archetype-neutral content skills and a content guide in every app\n\n## Intent\n\nThe skills explained how to use a template, but not where content comes from or how an app grows. A later agent sees neither the plan nor the conversation, so the content decisions of a first run were lost. Add generic skills across templates, referenced from AGENTS.md, and a guide in every app that is made concrete after the first decisions.\n\n## Key changes\n\n- lernapps-content-research: Land, Schulform, Jahrgang and the creator's material; the official Lehrplan cited with document, page and unit; competencies as \"Ich kann …\" grouped into chapters; second sources opened and checked; never guess.\n- lernapps-content-growth: the app's guide first; one slice per competency (competency, content, exercise, the entry's topic, check, commit); a brief for parallel sub-agents.\n- lernapps-exercise-patterns: data files, patterns written once in the app's guide, then a component or an issue; a catalogue of patterns that worked, adapted from the Mathe-Karte.\n- The generator writes .agents/skills/app-content/SKILL.md with nine fixed headings and placeholders, plus a relative symlink for Claude Code where the system allows it; lernapps update adds them to older apps.\n- AGENTS.md and the plan template: load the filled guide first, else the research skill; fill the guide once the plan is confirmed, before building; update it with every content decision.\n- The error rule app-content-guide checks that the guide exists with its headings and, once the plan is in Commit, has no placeholders; the rubric item app-content-matches judges whether it says what was built.\n- The architecture and the plan record the decision.\n\n## Dependencies and side effects\n\n- Listed apps in the Commit phase fail lernapps check until their guide is added and filled in.", "reason": "All commits of tooling#66 serve one wish, content guidance: generic skills plus the app's own guide that they point to, with architecture and plan; the plan commit joins the architecture commit.", "sources": [{"sha": "1fd3ed5", "subject": "feat(generator): every app gets its content guide, checked by app-content-guide", "date": "2026-10-14T21:16:22+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "d85ab85", "subject": "feat(skills): content research, exercise patterns and growth, archetype-neutral", "date": "2026-10-14T21:16:41+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "bdbe61a", "subject": "docs(arc42): each app keeps its own content guide", "date": "2026-10-14T21:16:47+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "cde843e", "subject": "docs(plan): the content guidance is in review in #66", "date": "2026-10-14T21:23:40+00:00", "pr": null, "plan": true, "moved": []}]}], "messages": 5, "sourceCount": 4, "misplaced": []}, {"id": "i091", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T21:34:28.309Z", "to": "2026-10-14T22:20:18+00:00", "repos": ["tooling"], "commit": "feat(guidance): the creator confirms the research and the content method", "intent": "Let the creator see and confirm the research and the content method before anything is built, in every archetype: process rules in AGENTS.md, the skill-related steps in the plan template.", "decisions": ["process rules for every archetype in AGENTS.md: one or two questions per turn, stop at every checkpoint, explain the method before building", "the skill-related steps in the plan template: a research checkpoint closes Explore, Plan writes a content method the creator confirms, Code fills the guide from it", "the default-branch rule in AGENTS.md shortened to stay within 350 words"], "trigger": "\"Guck dir mal das Session-Transkript an. Was fällt dir auf?\" … \"Wieso hat sie nicht nach explore abgehangen, mich gefragt und auch die Methodik erklärt? Das hatte ich erwartet. … Beim Quiz zuvor hatte das geklappt\" … \"Process guidance gehört in die agents.md. In der plan-Datei konnten wir aber die Skill-bezogenen Interaktionen zusätzlich hinterlegen\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i090", "note": "the content guide was filled only in Code, with no checkpoint for the creator"}], "groups": [{"repo": "tooling", "message": "feat(guidance): the creator confirms the research and the content method\n\n## Intent\n\nThe first explainer run asked its questions in bundled forms, showed the plan without its content method and built everything once the plan was confirmed. The creator never saw how the content was researched or how exercises and figures would be made. Make this a general rule: process rules in AGENTS.md, the skill-related interactions in the plan template.\n\n## Key changes\n\n- AGENTS.md has a section \"With the creator\" for every archetype: one or two questions per turn, stop at every checkpoint, explain the method before building.\n- The plan template ends Explore with a research checkpoint: Lehrplan with its citation, competencies per chapter, sources and how they were checked, what could not be checked, the archetype.\n- Plan writes a content method with the archetype's skill and lernapps-exercise-patterns, and the creator confirms it with the plan; Code fills the content guide from it.\n- The app skill, the research skill, the architecture and the guidance test follow; the test expects four checkpoints in order.", "reason": "The only commit of tooling#67.", "sources": [{"sha": "3e2197f", "subject": "feat(guidance): the creator confirms the research and the content method", "date": "2026-10-14T22:20:18+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 4, "sourceCount": 1, "misplaced": []}, {"id": "i092", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-14T22:27:11.371Z", "to": "2026-10-14T23:11:10+00:00", "repos": ["app-templates", "tooling"], "commit": "fix: read the guidance in full, create only from a confirmed plan, and type-check only the app's own code", "intent": "Make a creator run follow the plan template from the start: read the template and the skills in full from their files, never as a summary, and create no app without a confirmed plan. Limit an app's type check to its own code, so it reports no errors from node_modules.", "decisions": ["describe the method (download the file, read it complete and unchanged, never work from a summary) rather than name a curl command", "Explore starts by installing the skills", "AGENTS.md trimmed to its 350-word limit", "create refuses without a plan, or with one not yet confirmed, instead of writing an empty plan in the phase code", "the template's tsconfig includes src/ only, rather than adding @types/node as the session did, which would keep checking runtime code", "component types move out of a Node module, so what src/ reaches needs no Node", "vite.config.ts, playwright.config.ts and e2e/ stay checked by vp check"], "trigger": "\"Schau dir schon mal den Zwischenstand der Session an. Mich hatte bspw gewundert, dass der Check node_modules beinhaltet hätte. Ist das so gewollt?\" … \"Ein curl Befehl sollte nicht genannt werden, sondern die Methodik (Downloads the file from… don’t truncate/compact it…)\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i091", "note": "the checkpoints of #67 never reached a session that read the plan template as a summary"}, {"type": "revises", "intent": "i084b", "note": "vue-tsc in lernapps check came with the explainer archetype"}], "groups": [{"repo": "tooling", "message": "docs(guidance): read the plan template and the skills in full, from their files\n\n## Intent\n\nThe second explainer run fetched the plan template and the skills with a tool that returned summaries. It never had the plan's tasks and checkpoints, asked for the plan before researching and created the app right after. State the method of reading in the guidance, not a command.\n\n## Key changes\n\n- The quick path in llms.txt, AGENTS.md, lernapps-app and the plan template say how to read: download the file, read it complete and unchanged, never work from a summary.\n- Explore starts by installing the skills, and the skills are read from where they were installed.\n- AGENTS.md stays within its limit of 350 words.\n\n## Dependencies and side effects\n\n- Same intent: app-templates#20 limits an app's type check to src/.", "reason": "Two consecutive commits of tooling#69; the second only trims the first to the word limit of AGENTS.md.", "sources": [{"sha": "da6783f", "subject": "docs(guidance): read the plan template and the skills in full, from their files", "date": "2026-10-14T22:51:05+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "f8ef026", "subject": "docs(guidance): keep AGENTS.md within its word limit", "date": "2026-10-14T22:52:08+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "fix(explainer): pin app-templates whose app type check reads only src/\n\n## Intent\n\nAn explainer app's vue-tsc checked the runtime's build and test code in node_modules and failed with 19 errors on Node's modules. app-templates fixes the template; pin that fix.\n\n## Key changes\n\n- The pin of app-templates moves to the commit that limits the template's tsconfig to src/.\n- The rule keep-the-preset now says to keep tsconfig.json as generated, since it no longer only extends the preset's.\n\n## Dependencies and side effects\n\n- Needs app-templates 98cfbc4 (app-templates#20) merged first; the generator change in this pull
