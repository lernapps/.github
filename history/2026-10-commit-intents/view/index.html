questions per message, a typing game is interactive.\n- The content guide's top comment no longer contains the placeholder marker. The rule page joins wrapped list items.", "reason": "Kept apart from the URL commit after it, which must stay revertable on its own.", "sources": [{"sha": "cfab0e5", "subject": "docs(guidance): compact guidance for agents (experiment)", "date": "2026-10-18T07:51:49+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "chore(experiment): point all URLs to the branch\n\n## Intent\n\nThe agent in the experiment must never read main's guidance, but the guidance, the CLI and a generated app all point to main.\n\n## Key changes\n\n- Every raw URL, create/update/check command and skills install in the guidance, skills, llms.txt, the content guide skeleton and the generator's plan-template hint names exp/compact-guidance instead of main.\n- guidance/experiment-prompt.md is the creator's first prompt, with all must-read URLs.\n\n## Dependencies and side effects\n\n- Revert this commit before anything of the branch is merged.", "reason": "Its own commit, to be reverted before anything of the branch is merged.", "sources": [{"sha": "18ee98c", "subject": "chore(experiment): point all URLs to the branch", "date": "2026-10-18T08:04:17+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i134", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-18T08:16:09.454Z", "to": "2026-10-18T08:36:16+00:00", "repos": ["tooling"], "commit": "docs(site): the evals page becomes Prompt engineering, with how we work", "intent": "Changing the guidance and testing it fast needs a loop: an interactive test, the evals, changes, and an interactive test of the new, unpublished guidance. Record that loop where others can read it, including how the orchestrating session serves the unpublished guidance to a test session.", "decisions": ["the test session asks the orchestrating session for each guidance URL (GET over send_message), over pushing every change to a branch", "a real session as the test session, not a sub-agent", "acceptable for fast iteration in Claude Code on the web, although the agent knows it is tested", "rename the evals page to Prompt engineering; /tooling/evals/ points to it"], "trigger": "\"Er soll daher jedes mal, anstatt eine URL auf lernapps.net oder in unserem Github aufzurufen, Dich nach dem neuen Inhalt der URL fragen.\" … \"Ich finde das für schnelles iterieren in claude code web für vertretbar. Wo können wir das festhalten? Vielleicht auf der evals seite, die wir in \\\"prompt engineering\\\" umbenennen können?\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i130", "note": "the results page grows into the page on prompt engineering"}], "groups": [{"repo": "tooling", "message": "docs(site): the evals page becomes Prompt engineering, with how we work\n\n## Intent\n\nChanging the guidance and testing it fast needs a loop, and others should be able to read it: an interactive test, the evals, changes to the guidance, and an interactive test of the new guidance before it is published.\n\n## Key changes\n\n- The page lives at /tooling/prompt-engineering/ and describes that loop, including the orchestrating session that serves the unpublished guidance to the test session.\n- /tooling/evals/ points to the new page; the report writes its data there.", "reason": "Kept apart from the test timeout that follows it.", "sources": [{"sha": "3d48ea6", "subject": "docs(site): the evals page becomes Prompt engineering, with how we work", "date": "2026-10-18T08:24:59+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "test: the CLI tests get a 20 s timeout\n\n## Intent\n\nThe pull request of the new page failed: each CLI test starts the CLI, about 2 s, and `changes --help` crossed the default 5 s on a busy runner (toolchain job of #106).\n\n## Key changes\n\n- The CLI tests get a 20 s timeout.", "reason": "A test fix to get this request's pull request through; kept apart from the page.", "sources": [{"sha": "ef291bf", "subject": "test: the CLI tests get a 20 s timeout", "date": "2026-10-18T08:36:16+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i135", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-18T09:14:17.733Z", "to": "2026-10-18T11:02:56+00:00", "repos": ["tooling"], "commit": "docs(guidance): content questions in Explore, lessons from the spikes", "intent": "In the two spikes the creator had to step in often: the agents asked for the Land again and again, never asked about didactics, model apps, languages or look, narrowed requests silently, and showed sketches only on request. Research and pedagogic design should be shaped with the creator in Explore, so fewer corrections follow later.", "decisions": ["content questions belong to Explore; Plan only maps the confirmed content onto the scaffold", "the Land only when a school is named, at most once, else the KMK-Bildungsstandards", "the research checkpoint shows the didactic approach and the scope, including what is left out", "Plan names the references to read; the plan checkpoint needs the sketches", "echo a change request in one sentence and never narrow it", "the agent opens the listing pull request from the fork itself"], "trigger": "\"Mich interessiert vor allem, wo ich eingegriffen habe und ob man dies durch besseres Steering im Vorhinein besser hätte machen können. Und vor allem die Interaktivität im Explainer zu Recherche und pädagogischer Ausgestaltung hat mir gefehlt.\" … \"Ja, setz das im Branch um\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i132", "note": "revises the compact guidance on its branch"}], "groups": [{"repo": "tooling", "message": "docs(guidance): content questions in Explore, lessons from the spikes\n\n## Intent\n\nIn the two spikes of the compact guidance the creator had to step in often: repeated questions about the Land, no questions about didactics, model apps, languages or look, silently narrowed requests, and sketches only on request. Explore should shape the content with the creator, so fewer corrections follow.\n\n## Key changes\n\n- Explore asks for model apps, hurdles and misconceptions, languages, look and feel. The research skill is loaded before the first curriculum question. The Land only when a school is named, at most once, else the KMK-Bildungsstandards.\n- The research checkpoint shows the didactic approach and the scope (in, out, data range, languages); Plan only maps the confirmed content onto the scaffold.\n- Plan names the references to read; the plan checkpoint needs the sketches.\n- Code: echo the reading of a change request, never narrow it; screenshot every state against the sketches and the frame.\n- The front matter comments no longer contain \"phase: explore\", which agents replaced instead of the value line.\n- Opening the listing pull request from the fork is the agent's job.", "reason": "One commit for one request.", "sources": [{"sha": "e8b8453", "subject": "docs(guidance): content questions in Explore, lessons from the spikes", "date": "2026-10-18T11:02:56+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 4, "sourceCount": 1, "misplaced": []}, {"id": "i136", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-18T11:14:39.985Z", "to": "2026-10-18T11:15:31+00:00", "repos": ["tooling"], "commit": "docs(guidance): preview of the first version through a draft pull request", "intent": "The first version lived on work without a preview until it was published, so the creator had to merge into main to see it. The creator should see the current state while the app is being built.", "decisions": ["a draft pull request work → main after the first commit, so the existing preview job shows it, over a new preview for branches", "push work after each task", "the publish checkpoint links the preview"], "trigger": "\"Was noch nervt: beim work branch gibt es kein preview. Daher muss ich immer erst nach Main Mergen\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i135", "note": "another lesson from the spikes on the compact guidance"}], "groups": [{"repo": "tooling", "message": "docs(guidance): preview of the first version through a draft pull request\n\n## Intent\n\nThe first version lived on work without a preview until it was published, so the creator had to merge into main to see it. The creator should see the current state while the app is built.\n\n## Key changes\n\n- In Code the agent opens a draft pull request work → main after the generated app's first commit and pushes work after each task, so the existing preview job shows the current state.\n- The creator gets the link to the preview once; the publish checkpoint links it.", "reason": "One commit for one request.", "sources": [{"sha": "f3e14bc", "subject": "docs(guidance): preview of the first version through a draft pull request", "date": "2026-10-18T11:15:31+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i137", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-18T15:20:51.316Z", "to": "2026-10-18T22:54:51+00:00", "repos": ["tooling"], "commit": "feat(check): count failed checks in the plan instead of self-reporting them", "intent": "The third spike showed two gaps. The agent wrote \"none\" for failed checks after five had failed, because the retrospective was self-reported. And the creator kept specifying for hours after the plan, because the agent assumed or bundled the Explore questions and ticked them; GitHub calls that the cloud blocks caused more friction. The failed checks should be counted by the tooling, and Explore should be a real interview.", "decisions": ["count failed rules in the plan's front matter by the tooling, over a running list the agent keeps", "no tick box for the retrospective's failed checks any more", "Explore as an interview: one topic per question; an assumed answer never counts", "find the fork of lernapps/apps over the public API, not by its name", "pull requests over REST, and the preview pull request is no draft", "no hard checkpoints, no instruction to merge by the creator, no rules on waiting or cleanup commands"], "trigger": "\"Ich habe noch recht lange weiter spezifiziert. Eigentlich hätten die meisten dieser Diskussionen in explore angeregt werden sollen. Auch gab es wieder Aufstand mit GitHub.\" … \"Können wir den fork anders als über den Namen ermitteln?\" … \"Ich würde lieber vier statt Anleitung ändern. Ankreuzen brauchen wir dann gar nicht.\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i135", "note": "lessons from the third spike of the compact guidance"}], "groups": [{"repo": "tooling", "message": "feat(check): count failed rules in the plan's front matter\n\n## Intent\n\nThe retrospective's \"Failed checks\" was self-reported, and the third spike's agent wrote \"none\" after five failed checks. The number should come from the tooling, not from memory.\n\n## Key changes\n\n- Every failed run of `lernapps check` in the repo, the hooks included, counts each rule with an error in `failedChecks` of the current plan's front matter, a one-line flow map next to prePushFailures, when the plan has the key.\n- The templates get the key and lose the retrospective part on failed checks.\n- Schema, review, the evals verifier and the docs follow; the retrospective's prose names both counters.\n- The changed files are formatted with the repo's formatter.\n\n## Dependencies and side effects\n\n- 66e21d4 (same intent) changes the compact guidance on its experiment branch.", "reason": "The counter, its glossary entry and the formatting of the same files follow each other directly on one branch; one change.", "sources": [{"sha": "111d987", "subject": "feat(check): count failed rules in the plan's front matter", "date": "2026-10-18T22:43:55+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "22800da", "subject": "docs(arc42): the retrospective's prose names both counters", "date": "2026-10-18T22:46:57+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "9e6b1cf", "subject": "style: format with the repo's formatter (vp check --fix)", "date": "2026-10-18T22:54:51+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "docs(guidance): Explore as an interview; find the fork, open pull requests over REST\n\n## Intent\n\nIn the third spike the agent assumed or bundled the new Explore questions and ticked them, and the creator specified for hours after the plan. GitHub calls that the cloud blocks caused more friction.\n\n## Key changes\n\n- \"Answers\" holds the interview topics: goal, learners, model and focus, hurdles, content and how it is made, amount, languages, look and feel, terms.\n- One topic per question; an assumed answer never counts. No answer: ask once more, then \"(guess)\", shown at the research checkpoint.\n- The fork of lernapps/apps is found over the public API, not by its name; attaching lernapps/apps per repo (add_repo) is allowed for the pull request.\n- Pull requests over REST: gh pr create and gh pr ready need GraphQL, which the cloud proxy blocks. The first version's preview pull request is no draft, so it needs no \"ready\".\n\n## Dependencies and side effects\n\n- 111d987 (same intent) counts the failed checks on main.", "reason": "On the experiment branch, apart from the counter on main.", "sources": [{"sha": "66e21d4", "subject": "docs(guidance): Explore as an interview; find the fork, open pull requests over REST", "date": "2026-10-18T22:45:12+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 5, "sourceCount": 4, "misplaced": []}, {"id": "i138", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T06:01:55.583Z", "to": "2026-10-20T07:53:55+00:00", "repos": ["tooling"], "commit": "refactor(guidance): one skill per phase, skills grouped by kind, guidance only for the process", "intent": "The \"compact\" guidance is only about 30% shorter, and agents still read too much too early: the entry pages and the skill index link everything at the same level, and skills mix process, tooling and content. The skills are also hard to place in the architecture and in the phases of the build. Each skill should belong to exactly one phase and say when it is needed, the llms.txt pages should only help to navigate, and every statement should have one place. A manual evaluation with test sessions per archetype should show whether agents then read the right thing at the right time.", "decisions": ["group skills on disk by kind: process, tooling, content, archetypes", "one skill, one phase of Explore, Plan, Code and Commit, over skills that span phases", "information hierarchy: llms.txt says where to find what; tooling/llms.txt points to the plan template; the template is the system prompt and loads each skill at its task", "install all phase skills at the start and the archetype's skills lazily; each description says first when the skill is needed", "each link to a reference names the occasion to read it, following agentskills.io best practices", "a Plan skill and a Code skill per archetype; the Code skill describes how to use the generated app", "new skills lernapps-github-setup (Code), lernapps-check (tooling rules) and lernapps-content-questions (question types and quality, also for the explainer)", "cross-phase rules move to guidance/workflow-rules.md, the sub-agent brief to guidance/", "lernapps update installs only the base skills and those of the app's archetype", "evaluate with one Sonnet test session per archetype that asks the orchestrator for every file, over letting them fetch URLs"], "trigger": "\"die compact guidance ist nicht wirklich kompakt, soweit ich das sehe.\" … \"Ich möchte mich noch einmal intensiv den Skills und ihrer Rolle in unserer Architektur widmen. … Ich würde sie gerne aufteilen …\" … \"Mein Vorschlag: Schreib *alles* auf einmal konsistent um. … Wenn Du damit fertig bist, mach eine manuelle Evaluierung …\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i137", "note": "reworks the experiment branch exp/compact-guidance started there"}], "groups": [{"repo": "tooling", "message": "docs(skills): add the internal skill manual-eval for trying guidance with test sessions\n\n## Intent\n\nChanged guidance should be tried with real agents before it is merged. The question is not only whether the app turns out well, but what each agent read, when and why, and where the creator had to steer. Harbor evals measure scores; this measures the reading path.\n\n## Key changes\n\n- An internal skill manual-eval: the orchestrating session starts one test session per archetype, serves every guidance file the session asks for, plays the creator from a short persona, and logs each request with time and phase.\n- A script serves a file of the branch by its path for the answers.", "reason": "The evaluation skill is its own change; the guidance rework after it is a different concern.", "sources": [{"sha": "6134d59", "subject": "docs(skills): add the internal skill manual-eval for trying guidance with test sessions", "date": "2026-10-20T07:17:56+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "refactor(guidance): one skill per phase, skills grouped by kind, guidance only for the process\n\n## Intent\n\nAgents read too much too early: the entry pages and the skill index linked everything at the same level, and skills mixed process, tooling and content. Each skill should belong to exactly one phase and say when it is needed, the entry pages should only help to navigate, and every statement should have one place.\n\n## Key changes\n\n- Skills are grouped on disk into process, tooling, content and archetypes. Every skill belongs to one phase of Explore, Plan, Code and Commit, and its description says first when it is needed.\n- New skills: lernapps-github-setup (Code), lernapps-check (Code, from the tooling rules), lernapps-content-questions (Code, question types and the rules for good questions, for quiz and explainer), and a Plan skill per archetype.\n- guidance/ holds only what spans phases: llms.txt as the entry, AGENTS.md, both plan templates, which load each skill at its task, workflow-rules.md and subagent-brief.md (moved from the skills). The rule catalogue reads guidance/ too.\n- lernapps update installs the skills of every phase and of the plan's archetype only.\n- Tests check one phase per skill and that the templates load each skill in its phase. Architecture chapter 5 shows the skill groups; chapter 9 records the decision \"one skill, one phase\".\n\n## Dependencies and side effects\n\n- Apps get the new layout with lernapps update.\n- The experiment prompts still point to the branch exp/compact-guidance.", "reason": "Follow each other directly: the rework and the fix of two test files that still used the old skill paths.", "sources": [{"sha": "d85eb2c", "subject": "refactor(guidance): one skill per phase, skills grouped by kind, guidance only for the process", "date": "2026-10-20T07:33:19+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "d4768c6", "subject": "test: the planted skill and the package paths in the grouped skills layout", "date": "2026-10-20T07:40:08+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "chore(manual-eval): serve skills by name and package paths\n\n## Intent\n\nTest sessions ask for skills by their name or by their path inside the installed package, as the new templates write them. The evaluation script should serve both.\n\n## Key changes\n\n- The serve script maps a request for a path under the installed @lernapps/tooling package to the file in the branch.", "reason": "A fix of the evaluation script, separated from the evaluation skill by the rework; it stays its own commit.", "sources": [{"sha": "9dd7b27", "subject": "chore(manual-eval): serve skills by name and package paths", "date": "2026-10-20T07:53:55+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 10, "sourceCount": 4, "misplaced": []}, {"id": "i139", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T11:31:28.657Z", "to": "2026-10-20T13:18:33+00:00", "repos": ["app-templates", "tooling"], "commit": "refactor(skills): act on the evaluation: archetype choice from the template's README, GitHub only in Commit", "intent": "The manual evaluation showed what worked and what did not. Agents read less and mostly at the right time, but they did not know what an archetype can do during the interview, pulled Code skills forward, never reread a rule after a red check, bypassed the pre-commit hook for empty commits, and skipped phase changes. Setting up GitHub late keeps technology out of the way at the start. The skills should be cut again where the evaluation shows a need, and what an archetype can do should come from the place that changes with the feature.", "decisions": ["GitHub only in Commit: Code stays local, lernapps-github-setup merges back into lernapps-github", "choose the archetype after the topics goal and learners, then load its design skill (renamed from -plan) for the rest of the interview", "what an archetype can do lives in a README per template in app-templates, read by URL; turned down: a generated capability table, a trial create, examples", "small references fold into SKILL.md (quiz, interactive); exercise patterns are split by subject", "the platform rules move to lernapps-check", "each phase starts by checking the plan's phase", "the pre-commit hook lets commits with nothing staged pass, so agents have no reason to bypass it", "keep lernapps update at the start of Code in increments, since its skill belongs to Code"], "trigger": "\"Ich finde das mit dem späten Github eigentlich ziemlich cool, dann kommt die Technik am Anfang nicht in den Weg\" … \"Setz das jetzt alles auf dem Branch um\" … \"Das mit dem generieren gefällt mir nicht. Könnten wir dafür nicht einfach das readme des templates nutzen?\"", "kind": "rework", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i138", "note": "acts on the manual evaluation of the rework done there"}], "groups": [{"repo": "app-templates", "message": "docs: a README per archetype: what it can and cannot do, what the app supplies\n\n## Intent\n\nAgents need to know what an archetype can do before they choose it, and humans look in the template's README first. A README that changes in the same pull request as the feature cannot fall behind it.\n\n## Key changes\n\n- quiz/, explainer/ and interactive/ each get a README: what the template can do and cannot do, and what the app supplies. No examples.\n- The main README links them.\n\n## Dependencies and side effects\n\n- The tooling's skills read these READMEs by URL before the archetype is chosen (tooling 341e27e).", "reason": "The only app-templates commit of this request.", "sources": [{"sha": "395ecc5", "subject": "docs: a README per archetype: what it can and cannot do, what the app supplies", "date": "2026-10-20T13:01:05+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "refactor(skills): act on the evaluation: archetype choice from the template's README, GitHub only in Commit\n\n## Intent\n\nThe manual evaluation showed that agents did not know what an archetype can do during the interview, pulled Code skills forward, never reread a rule after a red check, bypassed the pre-commit hook for empty commits, and skipped phase changes. Setting up GitHub late keeps technology out of the way at the start.\n\n## Key changes\n\n- Explore: the archetype is chosen after \"Goal\" and \"Learners\", from the README of each template in app-templates, read by URL. Then the agent installs and loads lernapps-<archetype>-design (was -plan) for the rest of the interview.\n- Code stays local on work. lernapps-github, with lernapps-github-setup merged into it, puts the app on GitHub in Commit.\n- Each phase starts by checking the plan's phase.\n- Quiz and interactive: their references are folded into SKILL.md. The exercise patterns are split by subject. The platform rules move to lernapps-check. An exercise component does not count as the page's exercise.\n- create leaves out the template's README; the pre-commit hook passes a commit with nothing staged.\n- Tests, package exports, llms.txt and the architecture follow.\n\n## Dependencies and side effects\n\n- Needs the template READMEs in app-templates (395ecc5).", "reason": "One commit already: the work-in-progress commit was squashed into it before the push.", "sources": [{"sha": "341e27e", "subject": "refactor(skills): the eval's findings - archetype choice from the template's README, GitHub only in Commit", "date": "2026-10-20T13:18:33+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 10, "sourceCount": 2, "misplaced": []}, {"id": "i140", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T13:33:13.443Z", "to": "2026-10-20T14:05:27+00:00", "repos": ["apps", "tooling"], "commit": "docs(arc42): one building block per skill, grouped by phase; the branch ready to merge", "intent": "The skills should appear in the architecture as building blocks that can be placed in the phases of the build: each skill a block with one goal, grouped under its phase. The experiment branch should point its URLs back to main so it can be merged, and the links from the apps repo should match the new skill folders. The page that shows who does what in each phase follows from these blocks.", "decisions": ["each skill is a block with one goal, grouped by phase in chapter 5, while the folders on disk stay grouped by kind", "skills prevent; error messages must explain themselves, so check messages do not point to skill files", "llms.txt files only help to navigate; fix their links, add no content", "rename the evaluation sessions instead of archiving them", "a page \"A workshop, not a factory\" shows per phase what the person decides, what the agent does and which tool supports it"], "trigger": "\"1. das machen wir gleich, erst einmal kümmern wir uns um das Aufräumen der Building blocks und geben jedem Skill einen Block mit einem Ziel und gruppieren sie unter phasen. 2. das wäre auch falsch herum: Skills sind präventiv, fehlermeldungen sollten selbsterklrend sein 3. die llms.txt-Dateien sollten nur beim Navigieren helfen … 4. mach das jetzt …\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i139", "note": "documents the skill layout settled there and readies the branch"}], "groups": [{"repo": "apps", "message": "fix(llms): link the tooling's skills in their grouped folders\n\n## Intent\n\nThe tooling moves its skills into folders by kind and the platform rules into the skill lernapps-check. The links in the apps repo must point to the new places; llms.txt only helps to navigate, so nothing else changes.\n\n## Key changes\n\n- The skill links of the site point to skills/<group>/<name>/ and to the platform rules under lernapps-check.\n\n## Dependencies and side effects\n\n- Merge together with the tooling branch exp/compact-guidance (09b6c86, 1120a6a); against the old layout the links break.", "reason": "The only apps commit of this request.", "sources": [{"sha": "fa3ece3", "subject": "fix(llms): link the tooling's skills in their grouped folders", "date": "2026-10-20T13:34:21+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "chore(experiment): point the URLs back to main\n\n## Intent\n\nThe experiment branch pointed its URLs to itself so test sessions could read it. Before it can be merged, every URL must point to main again.\n\n## Key changes\n\n- The guidance, the skills, llms.txt and the generator point to main again, and skills are installed with the plain npx skills add lernapps/tooling.\n- The experiment's prompt is removed.\n\n## Dependencies and side effects\n\n- New evaluation sessions against the branch now read the guidance of main until the branch is merged.\n- The apps repo's links change in the same step (apps fa3ece3).", "reason": "Follows the evaluation's rework directly but serves this request; the architecture commit after it is a separate concern.", "sources": [{"sha": "09b6c86", "subject": "chore(experiment): point the URLs back to main", "date": "2026-10-20T13:36:58+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "docs(arc42): one building block per skill, with its goal, grouped by phase\n\n## Intent\n\nThe skills should appear in the architecture as building blocks that can be placed in the phases of the build. Modelled as one block from several sources, they could not be mapped to the steps of the work.\n\n## Key changes\n\n- Chapter 5 groups the skills under Explore, Plan, Code and Commit. Each skill is a block with one goal and its folder as path.\n- A level-2 diagram shows the skills by phase.\n- The folders on disk stay grouped by kind; the text says this group tells who changes a skill.\n- The deployment view and the architecture evidence follow.", "reason": "Follows the URL change directly but is a different concern, the architecture; kept apart.", "sources": [{"sha": "1120a6a", "subject": "docs(arc42): one building block per skill, with its goal, grouped by phase", "date": "2026-10-20T13:37:02+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "docs(site): the page \"A workshop, not a factory\": who does what in each phase\n\n## Intent\n\nDevelopers ask what they get, and managers speak of software factories. The tooling site should show that building an app is a workshop: per phase, what the person decides, what the agent does, and which part of the tooling supports it.\n\n## Key changes\n\n- A new page shows per phase what the person decides, what the agent does, and which guidance, skill, CLI command, hook, action or runtime supports it, with the checkpoints and what no machine decides.\n- The start page links it; the build script builds it.", "reason": "Follows a merge of main on the branch, so it cannot join the commits before it.", "sources": [{"sha": "e930dc4", "subject": "docs(site): the page \"A workshop, not a factory\" - who does what in each phase", "date": "2026-10-20T14:05:27+00:00", "pr": null, "plan": false, "moved": [{"kind": "dropped", "from": "i141", "why": "The page visualises the phases and their tools, the documentation point 1 of this request defers to right after the building blocks; i141 only asked for a pull request to view the architecture and has no other commit. Inferred: no message names the page."}]}]}], "messages": 1, "sourceCount": 4, "misplaced": []}, {"id": "i142", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T14:40:52.752Z", "to": "2026-10-20T15:29:36+00:00", "repos": ["apps", "tooling"], "commit": "docs(site): render the workshop page from the building blocks, and finish the pull requests", "intent": "The workshop page was hand-written HTML, so it could drift from the architecture it describes. It should be generated from the modelled building blocks. arc42 cannot yet carry a phase on a block, so an explicit mapping in the docs build is the first step, while the tool gets an issue for custom attributes. At the same time, the open pull requests of the compact guidance (tooling#118 and apps#62) should be brought to a clean merge.", "decisions": ["an explicit mapping in the docs build for now, over x- attributes that arc42 0.37 rejects (WG01) and does not return", "the build fails when the mapping names a block the model lacks or a phase's skills differ from the skill blocks under bb-skills-<phase>", "an issue at docToolchain/arc42-language for x-* attributes, and a separate session to build the fix where it belongs", "silence the two architecture warnings by stating in the model that the process guidance implements the rule catalog", "apps#62 merges only after tooling#118, since its link tests need the new skill paths on main"], "trigger": "\"diese Visualisierung möchte ich gerne ausschließlich aufgrund der Building Blocks, die modelliert sind, generieren\" … \"Mach für den ersten Schritt mal eine explizite Zuordnung innerhalb des Buildprozesses der Docs. Dann eröffne ein Issue bei Ark 42 … wir müssen unseren PR mal irgendwann zum Abschluss bringen\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i141", "note": "the hand-written workshop page becomes generated"}], "groups": [{"repo": "tooling", "message": "docs(site): render the workshop page from the building blocks\n\n## Intent\n\nThe workshop page was hand-written, so it could drift from the architecture it shows. Render it from the modelled building blocks instead. arc42 cannot yet carry a block's phase as a custom attribute, so an explicit mapping comes first.\n\n## Key changes\n\n- The page is rendered at build time from an explicit mapping: per phase the blocks of docs/arc42 that support it, with a short text each, and their titles from arc42 get.\n- The build fails when the mapping names a block the model lacks, or when the skills of a phase differ from the skill blocks under bb-skills-<phase>. Tests cover both.\n- The page looks as before.\n- Once arc42 carries custom attributes, the mapping can shrink to the page's texts.", "reason": "Kept apart from the arc42 fix after it: a different concern.", "sources": [{"sha": "68c5109", "subject": "docs(site): render the workshop page from the building blocks", "date": "2026-10-20T14:53:46+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "docs(arc42): the process guidance implements the rule catalog\n\n## Intent\n\nThe architecture review of the pull request warned that two blocks changed their text but not their model. The process guidance holds the workflow rules with their ids, as chapter 8 says, so the model should say it too.\n\n## Key changes\n\n- bb-process-guidance implements concept-rule-catalog. arc42 diff against main reports nothing.", "reason": "A separate concern: clearing the architecture warnings before the merge.", "sources": [{"sha": "aca4fe8", "subject": "docs(arc42): the process guidance implements the rule catalog", "date": "2026-10-20T15:04:44+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "test(entry-point): follow the tooling's grouped skill folders and compact plan template\n\n## Intent\n\nThe tests of the platform's entry point failed against the reworked tooling: they expected the old skill paths and the old wording of the plan template. They must follow the new layout so apps#62 can merge.\n\n## Key changes\n\n- The tests expect the tooling's skills in their grouped folders.\n- The test that reads where the plan is kept also understands the compact template (\"Path: .vibe/plans/01-<short name>.md\").\n\n## Dependencies and side effects\n\n- The link tests pass only once tooling#118 is on main.", "reason": "Two test fixes on the branch of apps#62 that follow each other directly.", "sources": [{"sha": "f774b8c", "subject": "test(entry-point): expect the tooling's skills in their grouped folders", "date": "2026-10-20T15:17:37+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i143", "why": "Fixes the CI of apps#62, part of bringing the pull requests to a merge as asked here; it does not serve the question about links."}]}, {"sha": "b99e1ec", "subject": "test(entry-point): read where the plan is kept from the compact plan template too", "date": "2026-10-20T15:29:36+00:00", "pr": null, "plan": false, "moved": [{"kind": "moved", "from": "i143", "why": "The second CI fix of apps#62, same reason."}]}]}], "messages": 2, "sourceCount": 4, "misplaced": []}, {"id": "i143", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T15:05:42.565Z", "to": "2026-10-20T15:09:23+00:00", "repos": ["tooling"], "commit": "docs(site): link each block on the workshop page to its card in the architecture", "intent": "The boxes on the workshop page named building blocks but did not lead to them. A reader should get from each box to its description in the architecture.", "decisions": ["link the block's card in the arc42 web app, with the chapter file taken from arc42 get, over a hand-kept path", "a line of several blocks links the first; its neighbours follow in chapter 5", "accept that an outside deep link lands about a screen early, a fault of the arc42 web app"], "trigger": "\"Sind die einzeln Blöcke mit Links hinterlegt?\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i142", "note": "adds links to the generated page"}], "groups": [{"repo": "tooling", "message": "docs(site): link each block on the workshop page to its card in the architecture\n\n## Intent\n\nThe boxes on the workshop page named building blocks but did not lead to them. Each should take the reader to its description in the architecture.\n\n## Key changes\n\n- Every line of the board, the band \"In every phase\" and the catalog links the block's card in the arc42 web app of this site (#<chapter file>:el-<id>). The chapter file comes from arc42 get.\n- A line of several blocks links the first; its neighbours follow in chapter 5.\n- A test checks the link format.", "reason": "One commit for one request.", "sources": [{"sha": "2d08e96", "subject": "docs(site): link each block on the workshop page to its card in the architecture", "date": "2026-10-20T15:09:23+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i144", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T15:41:36.986Z", "to": "2026-10-20T16:10:49+00:00", "repos": ["tooling"], "commit": "docs(site): the workshop page in the style of the lifecycle page from #116", "intent": "The workshop page was noisy. The lifecycle page drafted in tooling#116 showed the same content more calmly and should be the model, without its striped background.", "decisions": ["take the look of #116: a timeline of phases with quiet boxes, over the board with lanes and coloured chips", "what a box does for person and agent opens on hover and keyboard focus, and stands in the card on touch", "a plain tint for the band across all phases, over stripes", "drop the attention bar, the lists per lane and the kind chips", "a new branch and pull request from main, since #118 was merged"], "trigger": "\"Guck Dir mal die Darstellung aus tooling#116 an. Die fand ich besser. Weniger noisy (bis auf den gestreiften Hintergrund der übergreifenden Unterstützung).\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i142", "note": "new look for the generated page"}], "groups": [{"repo": "tooling", "message": "docs(site): the workshop page in the style of the lifecycle page from #116\n\n## Intent\n\nThe workshop page was noisy. Show the same content as calmly as the lifecycle page drafted in #116, without its striped background.\n\n## Key changes\n\n- The phases are a timeline: per phase its question, what the person decides with the checkpoint, and the building blocks as quiet boxes with kind, who works with them and a link.\n- What a box does for the person and the agent opens on hover and keyboard focus; on touch it stands in the card.\n- The band of what runs through every phase has a plain tint instead of stripes.\n- The mapping says per box what it does for the agent and, where the person works with it, for the person. The attention bar, the lists per lane and the coloured kind chips are gone.\n- Light, dark and 390 px checked.", "reason": "One commit for one request; it starts a new branch after a merge.", "sources": [{"sha": "5427296", "subject": "docs(site): the workshop page in the style of the lifecycle page from #116", "date": "2026-10-20T16:10:49+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 1, "misplaced": []}, {"id": "i145", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T16:18:40.154Z", "to": "2026-10-20T16:22:23+00:00", "repos": ["tooling"], "commit": "docs(site): the workshop page takes phase and kind from the blocks (arc42 0.38)", "intent": "arc42 0.38.0 now carries custom x-* attributes. The phase and kind of each block on the workshop page can move from the separate mapping into the architecture model, as first intended.", "decisions": ["x-phase as a list and x-kind on each block the page shows", "the build fails when a phase's boxes and the blocks with that phase differ, a kind is missing or unknown, or a skill's phase is not its group's", "move the arc42 CLI to 0.38.0 in the tooling and in the interactive apps the generator writes", "read the JSON directly from the pipe, since 0.38 no longer cuts it at 64 KiB", "check that the rendered page stays byte-identical"], "trigger": "\"Der fix von arc42 (0.38.0) ist live\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i142", "note": "replaces the explicit mapping that was the first step"}], "groups": [{"repo": "tooling", "message": "docs(site): the workshop page takes phase and kind from the blocks (arc42 0.38)\n\n## Intent\n\narc42 0.38.0 carries custom x-* attributes (docToolchain/arc42-language#130). The phase and kind of each block on the workshop page belong in the architecture model, not in a separate mapping.\n\n## Key changes\n\n- The blocks of the creator's path name the phases they support and their kind (x-phase, x-kind).\n- The page script reads them from arc42 get. The build fails when a phase's boxes and the blocks with that phase differ, when a kind is missing or unknown, or when a skill's phase is not its group's.\n- workshop.yaml keeps only the page's texts. The rendered page is the same.\n\n## Dependencies and side effects\n\n- The arc42 CLI moves to 0.38.0 here and in the interactive apps the generator writes. 0.38.0 delivers the full JSON on a pipe, so the script reads it directly.", "reason": "One commit for one request.", "sources": [{"sha": "cf1cc33", "subject": "docs(site): the workshop page takes phase and kind from the blocks (arc42 0.38)", "date": "2026-10-20T16:22:23+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i146", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T16:29:32.682Z", "to": "2026-10-20T16:32:15+00:00", "repos": ["tooling"], "commit": "docs(site): what an element does for agent and person is in the architecture", "intent": "What a building block does belongs in its description in the architecture, not in a page-specific file. With that, the mapping file can shrink to the phases, and interfaces can be placed on the page too.", "decisions": ["x-agent and x-person on the elements, over texts in workshop.yaml", "interfaces join where they are what the person meets: AGENTS.md and the plan file across all phases, the template READMEs in Explore, the runtime in Code", "the boxes use the element's title and are ordered by kind and chapter 5; labels and per-phase texts go", "one card per design and code skill, over a combined lernapps-<archetype>-design line"], "trigger": "\"Eigentlich sollten wir damit Workshop.yaml signifikant reduzieren können. Das, was der Baustein leistet, gehört in die Bausteinbeschreibung. Dann können wir auch die anderen Elemente zuordnen\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i145", "note": "moves the remaining texts into the model"}], "groups": [{"repo": "tooling", "message": "docs(site): what an element does for agent and person is in the architecture\n\n## Intent\n\nWhat a building block does belongs in its description in the architecture, not in a file of the page. Then the page's own file shrinks to the phases, and interfaces can be placed too.\n\n## Key changes\n\n- Each building block and interface the workshop page shows carries, next to x-phase and x-kind, what it does for the agent and the person (x-agent, x-person).\n- workshop.yaml keeps only the phases: their question, what the person decides and the checkpoint.\n- The boxes come from the model with the element's title, ordered by kind and by chapter 5. Labels and per-phase texts are gone.\n- Interfaces join where the person meets them: AGENTS.md and the plan file across all phases, the templates' READMEs in Explore, the runtime in Code.\n- The build fails on an unknown phase or kind, an element that says nothing for agent or person, or a skill without x-phase.", "reason": "One commit for one request.", "sources": [{"sha": "d6d15e2", "subject": "docs(site): what an element does for agent and person is in the architecture", "date": "2026-10-20T16:32:15+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i147", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T16:51:47.211Z", "to": "2026-10-20T17:01:11+00:00", "repos": ["tooling"], "commit": "docs(site): the workshop page shows a block's technology instead of a kind of its own", "intent": "x-kind duplicated what the architecture already records: the technology of a building block and the protocol of an interface. The page should use those.", "decisions": ["show technology (blocks) and protocol (interfaces), over a custom x-kind", "boxes of a phase follow the order of the chapters", "the technology as a muted line under the title, so long values do not break the cards"], "trigger": "\"x-kind brauchen wir doch nicht, es gibt doch Technology als Teil des Blocks\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i145", "note": "drops x-kind introduced there"}], "groups": [{"repo": "tooling", "message": "docs(site): the workshop page shows a block's technology instead of a kind of its own\n\n## Intent\n\nx-kind repeated what the architecture already says: the technology of a building block and the protocol of an interface. Use those instead.\n\n## Key changes\n\n- A box names what the element is built with: the technology of a block, the protocol of an interface.\n- x-kind and the list of kinds are gone; the boxes of a phase follow the order of the chapters.\n- The technology is a muted line under the title, which keeps the icons on the title's line.", "reason": "One commit for one request.", "sources": [{"sha": "f2be4e6", "subject": "docs(site): the workshop page shows a block's technology instead of a kind of its own", "date": "2026-10-20T17:01:11+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i148", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T17:08:06.793Z", "to": "2026-10-20T17:09:04+00:00", "repos": ["tooling"], "commit": "fix(site): on touch, a workshop box keeps the tool and what it does for whom in one card", "intent": "On a phone, the dividing line under a workshop box separated the tool from what it does for person and agent, so the text read as part of the next box.", "decisions": ["one card with title, technology and the explanation on touch, over the text below a dividing line", "keep the hover on the desktop"], "trigger": "\"Die Zuordnung der Tools/building-blocks zu den Tätigkeiten funktioniert zumindest mobil nicht gut: die Trennlinie trennt Werkzeug und Akteur\"", "kind": "fix", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i144", "note": "fixes the touch layout of the new look"}], "groups": [{"repo": "tooling", "message": "fix(site): on touch, a workshop box keeps the tool and what it does for whom in one card\n\n## Intent\n\nOn touch devices the explanation sat under the box, after a dividing line, and read as part of the next box.\n\n## Key changes\n\n- On touch, each box is one card: the link with title and technology, then what the part does for the person and the agent. No dividing line.\n- The desktop keeps the hover.", "reason": "One commit for one request.", "sources": [{"sha": "5d5f921", "subject": "fix(site): on touch, a workshop box keeps the tool and what it does for whom in one card", "date": "2026-10-20T17:09:04+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i149", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T17:10:09.322Z", "to": "2026-10-20T17:10:23+00:00", "repos": ["tooling"], "commit": "docs(site): in Code the person has nothing to do on the workshop page", "intent": "In the Code phase the agent works largely on its own; the person need not interact. The page should say so plainly.", "decisions": ["\"Nothing. Time for a coffee\" with a note that the agent may come back with a question, over \"at most three questions\""], "trigger": "\"In code brauchen wir allerdings gar keine human interaction: da ist Kaffee-Trinken angesagt. Es kann sein, dass der Agent Rückfragen hat, aber er schafft das weitgehend alleine\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i146", "note": "changes one phase text of the page"}], "groups": [{"repo": "tooling", "message": "docs(site): in Code the person has nothing to do on the workshop page\n\n## Intent\n\nIn the Code phase the agent builds largely on its own, so the person has nothing to do. The page should say so plainly.\n\n## Key changes\n\n- \"You decide\" in Code reads: \"Nothing. Time for a coffee: the agent builds on its own and may come back with a question only you can answer.\"", "reason": "One commit for one request.", "sources": [{"sha": "46085da", "subject": "docs(site): in Code the person has nothing to do on the workshop page", "date": "2026-10-20T17:10:23+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i150", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T17:24:13.431Z", "to": "2026-10-20T17:36:45+00:00", "repos": ["lernapps.github.io", "tooling"], "commit": "feat: the tooling start page leads with the workshop, and the docs get their own header entry", "intent": "The tooling's start page was plain and the tooling site did not show the global navigation. It should present the workshop first, then prompt engineering, architecture and GitHub, and be part of the global header. The docs, as the way into the concepts behind it all, need their own header entry.", "decisions": ["the start page in the look of the workshop page, with the workshop as the one big card whose phases come from workshop.yaml", "move the tooling's site frame to the current main of lernapps.github.io, which already has Tooling in the header", "the docs as their own header entry after Features, and the footer link removed so it is not there twice"], "trigger": "\"Nun sollten wir noch die Tooling-Homepage ansprechend gestalten und auch in die globale Navigation einhängen. Workshop als prominentester Teil, dann prompt Engineering, architecture, GitHub. docs als einstiegspunkt in die Konzepte dahinter als eigener Navigationsounkt in der Header nav\"", "kind": "feature", "confidence": "evidenced", "relations": [], "groups": [{"repo": "lernapps.github.io", "message": "feat(nav): Konzepte (/docs/) as its own entry of the header\n\n## Intent\n\nThe docs are the way into the concepts behind lernapps.net and its tooling: vision, organisation, platform design. They should be easy to find from every page.\n\n## Key changes\n\n- The header gets the entry \"Konzepte\" (en \"Concepts\") for /docs/, after Features.\n- The footer link to the docs goes, so the link is not there twice.\n\n## Dependencies and side effects\n\n- The other sites show the entry once they move to this site frame. The new tooling start page is tooling dec3530.", "reason": "The only commit of this request in the site frame.", "sources": [{"sha": "aaf4a36", "subject": "feat(nav): Konzepte (/docs/) as its own entry of the header", "date": "2026-10-20T17:36:40+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "feat(site): start page with the workshop first, then prompt engineering, architecture and GitHub\n\n## Intent\n\nThe tooling's start page should be inviting and lead with what matters most, the workshop. The tooling site should also be part of the global navigation.\n\n## Key changes\n\n- The start page gets the look of the workshop page: a dark hero and the workshop as the one big card with the phases of the plan, rendered from workshop.yaml.\n- Three cards follow for prompt engineering, architecture and GitHub, then a band that leads to the docs for the concepts behind it, and a reference list of rules, schemas, llms.txt and source.\n- The site frame moves to the current main of lernapps.github.io, whose header has Tooling.\n\n## Dependencies and side effects\n\n- The docs entry of the header comes with lernapps.github.io aaf4a36.", "reason": "The only tooling commit of this request.", "sources": [{"sha": "dec3530", "subject": "Start page: the workshop first, then prompt engineering, architecture and GitHub", "date": "2026-10-20T17:36:45+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 2, "sourceCount": 2, "misplaced": []}, {"id": "i151", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T18:22:31.752Z", "to": "2026-10-20T18:24:42+00:00", "repos": ["docs"], "commit": "feat(site): the docs start page shows the concepts behind lernapps.net", "intent": "The docs start page should invite readers into the concepts behind lernapps.net in the same look as the tooling's start page: the vision, the platform in the sense of platform engineering, the non-profit organisation, and how agents can explore it.", "decisions": ["the vision as the one big card, then three cards for platform (pdt42), organisation (biz42) and agents (llms.txt)", "the parts of lernapps.net as tiles instead of a table, with Tooling linked", "one stylesheet for both languages"], "trigger": "\"Das sieht super aus. Geht das auch dir die docs Seite in der Art? Vision, Plattform im Sinne von Platform Engineering (pdt42), Unternehmung non Profit (biz42), explorable for agents (llms.txt)\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i150", "note": "the same look for the docs start page"}], "groups": [{"repo": "docs", "message": "feat(site): the docs start page shows the concepts behind lernapps.net\n\n## Intent\n\nThe docs start page should invite readers into the concepts behind lernapps.net, in the same look as the tooling's start page.\n\n## Key changes\n\n- /docs/ and /docs/en/ become \"Die Konzepte hinter lernapps.net\": a dark hero and the vision as the one big card with its three promises.\n- Three cards: the platform (pdt42, in the sense of platform engineering), the non-profit organisation (biz42), and the way in for agents (llms.txt and the CLIs).\n- The parts of lernapps.net are tiles, with Tooling linked.\n- One stylesheet serves both languages.\n- The site frame moves to the current main of lernapps.github.io, whose header has Tooling.", "reason": "One commit for one request.", "sources": [{"sha": "3892abb", "subject": "Start page: the concepts behind lernapps.net, in the look of the tooling's", "date": "2026-10-20T18:24:42+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 1, "misplaced": []}, {"id": "i152", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T18:28:19.574Z", "to": "2026-10-20T18:32:49+00:00", "repos": ["docs"], "commit": "feat(site): the vision on the docs start page as the change from personal software to many", "intent": "The most important part of the docs start page, the vision, was weak: it described listing, a dull process. The vision is the change from personal software built for one child or one class to a real change for many, which everyone can use without worry. The wording must not speak to a single persona.", "decisions": ["\"Viele kleine Lösungen. Eine große Veränderung.\" as the heading, over persona-bound headings", "the term personal software in the subline", "tiles for origin, reach and trust, over the steps of listing", "the home page leaves the tiles of the parts of lernapps.net"], "trigger": "\"Das wichtigste auf der Seite, die Formulierung der Vision ist schwach. … worum es geht, von Personal Software für das eigene Kind, die eigene Klasse, zu einer wirklich Veränderung für viele, die sich auch sorgenfrei nutzen können.\" … \"4. aber den Begriff Personal Software in der unterzeile. Die Startseite als Teil der Plattform kann raus.\"", "kind": "docs", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i151", "note": "rewrites the vision card"}], "groups": [{"repo": "docs", "message": "feat(site): the vision on the docs start page as the change from personal software to many\n\n## Intent\n\nThe vision card described how listing works, not what lernapps.net is for. The vision is the change from personal software for one class or child to a change for many, used without worry, and it should speak to no single persona.\n\n## Key changes\n\n- Heading: \"Viele kleine Lösungen. Eine große Veränderung.\" (en \"Many small solutions. One real change.\").\n- Subline: personal software mostly stays where it was made; lernapps.net turns it into a change for many, easy to find, free to use and without worry.\n- Tiles: made where it is needed, reaching far beyond, used without worry.\n- The home page leaves the parts of lernapps.net; three tiles in a row.", "reason": "One commit for one request.", "sources": [{"sha": "8012cc0", "subject": "Start page: the vision as the change from personal software to many", "date": "2026-10-20T18:32:49+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 3, "sourceCount": 1, "misplaced": []}, {"id": "i153", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T18:34:14.407Z", "to": "2026-10-20T18:45:46+00:00", "repos": ["apps", "docs", "lernapps.github.io", "tooling"], "commit": "feat(nav): \"Darum!\" for the docs in the header, on every site", "intent": "\"Konzepte\" was a dry name for the header entry of the docs; \"Darum!\" says why lernapps.net exists. The change should reach main and every site that uses the shared navigation, and all open pull requests should be merged.", "decisions": ["\"Darum!\" (en \"That's why\") over \"Konzepte\"", "merge the site frame first, then move every site that uses it (tooling, docs, apps) to the new commit", "the docs start page takes the name in eyebrow, title and tile; its heading stays", "merge each pull request after green CI"], "trigger": "\"In der Navigation: „Darum!“ statt „Konzepte“. Bring das nach Main, dann aktualisiere alle repos und merge danach alles durch, alle repos\"", "kind": "feature", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i150", "note": "renames the header entry added there"}], "groups": [{"repo": "lernapps.github.io", "message": "feat(nav): \"Darum!\" (en \"That's why\") instead of \"Konzepte\" for /docs/\n\n## Intent\n\nThe header entry of the docs should say why lernapps.net exists, not just name its concepts.\n\n## Key changes\n\n- The header entry for /docs/ reads \"Darum!\" (en \"That's why\").\n\n## Dependencies and side effects\n\n- The docs (365c9c5), tooling (41def31) and apps (4298713) move to this site frame.", "reason": "Kept apart from the entry it renames, which serves an earlier request.", "sources": [{"sha": "38fe83e", "subject": "feat(nav): \"Darum!\" (en \"That's why\") instead of \"Konzepte\" for /docs/", "date": "2026-10-20T18:34:27+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "docs", "message": "chore(deps): site frame with \"Darum!\" in the header; the docs start page takes the name\n\n## Intent\n\nShow the renamed header entry on the docs site, and let the start page use the same name.\n\n## Key changes\n\n- The site frame moves to lernapps.github.io f462934: the header links /docs/ as \"Darum!\" (en \"That's why\").\n- The start page's eyebrow, title and tile follow the new name.\n\n## Dependencies and side effects\n\n- Same frame update in tooling (41def31) and apps (4298713); the rename is lernapps.github.io 38fe83e.", "reason": "The only docs commit of this request.", "sources": [{"sha": "365c9c5", "subject": "Site frame at lernapps.github.io f462934: \"Darum!\" in the header; the page takes its name", "date": "2026-10-20T18:38:26+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "chore(deps): site frame with \"Darum!\" (/docs/) in the header\n\n## Intent\n\nShow the renamed header entry on the tooling site.\n\n## Key changes\n\n- The site frame moves to lernapps.github.io f462934.\n\n## Dependencies and side effects\n\n- Same frame update in docs (365c9c5) and apps (4298713); the rename is lernapps.github.io 38fe83e.", "reason": "The only tooling commit of this request.", "sources": [{"sha": "41def31", "subject": "Site frame at lernapps.github.io f462934: \"Darum!\" (/docs/) in the header", "date": "2026-10-20T18:38:29+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "apps", "message": "chore(deps): site frame with Tooling and \"Darum!\" (/docs/) in the header\n\n## Intent\n\nShow the current header, with Tooling and the renamed docs entry, on the catalog.\n\n## Key changes\n\n- The site frame moves to lernapps.github.io f462934.\n\n## Dependencies and side effects\n\n- Same frame update in docs (365c9c5) and tooling (41def31); the rename is lernapps.github.io 38fe83e.", "reason": "The only apps commit of this request.", "sources": [{"sha": "4298713", "subject": "Site frame at lernapps.github.io f462934: Tooling and \"Darum!\" (/docs/) in the header", "date": "2026-10-20T18:45:46+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 1, "sourceCount": 4, "misplaced": []}, {"id": "i154", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T21:39:25.712Z", "to": "2026-10-20T21:57:51+00:00", "repos": ["app-templates", "tooling"], "commit": "docs(plan): bring the increment's plan and issues up to date before closing it", "intent": "The plan of the agentic app creation increment had not been updated since 18 October, and open issues were missing from it. Before the first end-to-end version of the tooling is closed, the plan, the issues and the small leftovers must reflect what was built and what remains.", "decisions": ["record one skill per phase and the workshop page rendered from the architecture as KD-24, with a mapping file and x-kind as rejected alternatives", "add the open issues to the plan, and mark later work as outside this increment", "#117 and the content error form become issues for later, over fixing them now", "close #20, #115, .github#12 and apps#60, and rename #18 to all three archetypes", "lift app-templates to arc42 0.38.0, as the tooling pins it", "no retrospective in this session; the eval comparison is the last step before closing"], "trigger": "\"Aktualisiere noch mal unseren euren Plan dieses inkrements\" … \"Guck dir auch die issues an. Fehlt da noch etwas?\" … \"1. Leg ein issue an. 2. ist durch 3. wurde ich gerne jetzt gleich machen 4. sofort jetzt aufräumen 5. auch separat. Issue 6. … konnten wir für die Session auch vergessen.\"", "kind": "docs", "confidence": "evidenced", "relations": [], "groups": [{"repo": "tooling", "message": "docs(plan): guidance by phase, the workshop page and the start pages; open issues and clean-up\n\n## Intent\n\nThe plan of the increment had not been updated since 18 October, and open issues were missing. Before the first end-to-end version of the tooling is closed, the plan must say what was built, what was cleaned up and what remains.\n\n## Key changes\n\n- KD-24 records one skill per phase, guidance that only describes the process, and the workshop page rendered from the x-* attributes of the architecture. Rejected: a mapping file beside the architecture, and x-kind.\n- Completed lists the work of 19 and 20 October across the repos; Code lists its follow-ups.\n- The open issues are in the plan: #117 (update cannot be committed), the rest of #115, and later work outside this increment.\n- The interactive pilot is done; #20, #115, .github#12 and apps#60 are closed. The comparison of old and new guidance in the evals is the last step before closing.\n\n## Dependencies and side effects\n\n- app-templates moves to arc42 0.38.0 in 938b582.", "reason": "Three plan commits of tooling#124 that follow each other directly; the later two join the first by rule plan-pr.", "sources": [{"sha": "78e1fbc", "subject": "docs(plan): guidance by phase, the workshop page and the start pages; follow-ups", "date": "2026-10-20T21:42:08+00:00", "pr": null, "plan": true, "moved": []}, {"sha": "cabff15", "subject": "docs(plan): the open issues: #117, the rest of #115, later work, the tracking issue in .github", "date": "2026-10-20T21:43:27+00:00", "pr": null, "plan": true, "moved": []}, {"sha": "9bed402", "subject": "docs(plan): the interactive pilot is through; issues cleaned up, the evals' comparison before closing", "date": "2026-10-20T21:57:51+00:00", "pr": null, "plan": true, "moved": []}]}, {"repo": "app-templates", "message": "chore(deps): @doctc/arc42 0.38.0, as the tooling pins it\n\n## Intent\n\nThe templates should use the same arc42 version as the tooling, which now reports custom x-* attributes.\n\n## Key changes\n\n- @doctc/arc42 moves to 0.38.0. It reports the x-* attributes of an element in arc42 get and no longer cuts its JSON at 64 KiB on a pipe.\n- All three architectures pass arc42 validate --strict unchanged.\n\n## Dependencies and side effects\n\n- The plan of the increment (tooling, 78e1fbc and following) lists this as part of the clean-up.", "reason": "The only app-templates commit of this clean-up.", "sources": [{"sha": "938b582", "subject": "chore(deps): @doctc/arc42 0.38.0, as the tooling pins it", "date": "2026-10-20T21:56:49+00:00", "pr": null, "plan": false, "moved": [{"kind": "dropped", "from": "i155", "why": "The arc42 bump is one item of the clean-up asked for in the same exchange about the plan and the issues; i155 is merged into this intent and has no commits left."}]}]}], "messages": 1, "sourceCount": 4, "misplaced": []}, {"id": "i156", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T21:58:07.393Z", "to": "2026-10-20T22:11:08+00:00", "repos": ["tooling"], "commit": "feat(evals): score the skills loaded in their phase (A2), from the architecture", "intent": "The evals should also show whether the agent loads the right skills in the right phase. The phases of the skills are already in the architecture, so the expectation can come from there. Old runs used other skill names, so the new dimension starts as its own baseline.", "decisions": ["a new dimension beside the existing ones, so old and new runs stay comparable on those", "do not re-score the runs of 18 October, since the skills had other names then", "the expectation comes from x-phase of the skill blocks at the job's guidance commit, written into each job", "conditional skills are named per task in task.toml, not in the architecture", "two values: skills_in_phase and skills_out_of_place"], "trigger": "\"Können wir denn die harbor-Konfiguration ergänzen um bounties für das aktivieren der richtigen skills? Deren Phasen stehen ja in der Architektur bei den Building Blocks\" … \"Die skills hießen bei dem vorherigen Kauf auch noch anders. Replay bringt nicht viel\" … \"ja, bau die Dimension\"", "kind": "eval", "confidence": "evidenced", "relations": [], "groups": [{"repo": "tooling", "message": "feat(evals): score the skills loaded in their phase (A2), from the architecture\n\n## Intent\n\nShow in the evals whether the agent loads the skills its guidance names for a phase, in that phase. The phases of the skills are in the architecture, so the expectation comes from there.\n\n## Key changes\n\n- Two new values per trial: skills_in_phase (the share of expected skills loaded in full within their phase) and skills_out_of_place (a skill of another archetype, or one loaded before its phase).\n- The expected skills come from the x-phase of the skill blocks in the architecture at the job's guidance commit. run.sh writes them into each job, so later changes do not move old scores.\n- Each task names the skills it leaves to a condition (skills_conditional in task.toml).\n- Jobs without the file, like the runs of 18 October, keep their scores; the report shows the two rows empty for them.\n- A read of SKILL.md after cd into the skill's folder counts as a load.", "reason": "One commit for one request.", "sources": [{"sha": "55390a6", "subject": "feat(evals): score the skills loaded in their phase (A2), from the architecture", "date": "2026-10-20T22:11:08+00:00", "pr": null, "plan": false, "moved": []}]}], "messages": 3, "sourceCount": 1, "misplaced": []}, {"id": "i157", "session": "session_01CokaJ6YdJLqEGhHnk4MHJp", "from": "2026-10-20T22:12:33.994Z", "to": "2026-10-21T09:27:47+00:00", "repos": ["tooling"], "commit": "feat(evals): a results file per eval run and the runs on the Prompt engineering page", "intent": "The site should show which eval runs were made, how they went and what was concluded from them. Today one hand-made data file holds one run, and the conclusions are prose in the page. The results need a machine-readable format, cleaned of runs that broke off, with the conclusions beside them, and the page should be generated from it.", "decisions": ["two files per run: results.json generated from the jobs, never by hand, and conclusions.yaml written in review", "fixed cleaning rules in the generator: leave out usage-limit and infrastructure breaks, keep a crashed verifier as partial, never merge a re-run with the job it replaces, keep other guidance commits apart", "a skill counts as loaded when loaded by the end of its phase; early loading counts once, as out of place", "the eval session may push its export to its own branch", "the page keeps the method at its top and shows the runs below in an interactive part, readable without JavaScript", "the build fails when a conclusion names a cell, row, metric or finding its run does not have", "one table per guidance commit, so a harness update during a run does not split it"], "trigger": "\"ich möchte, dass du Die Ergebnisse und die aus der Session … (der erste eval-lauf) in ein maschinenlesbares Format bringst und wir die Webseite der docs zu evals daraus generieren.\" … \"Baue die Korrektur der skill-Bewertung vorher ein, bereinige die Grundlage um die kaputten 429er sessions\"", "kind": "eval", "confidence": "evidenced", "relations": [{"type": "revises", "intent": "i156", "note": "corrects the double penalty of the skill score"}], "groups": [{"repo": "tooling", "message": "feat(evals): one results file per eval run, cleaned of trials that are no results; skills loaded by their phase's end\n\n## Intent\n\nThe results of each eval run should be machine-readable and reproducible, without the trials that are no results. The skill score counted an early load twice.\n\n## Key changes\n\n- evals/results.ts writes evals/runs/<run>/results.json (schema results.v1) from the jobs of one run: its configurations (never mixed), a cell per task, model and configuration with n, mean, min and max, every trial with its status, and the jobs left out with their reason and replacement.\n- Left out: a job with excluded.txt, a trial that hit the usage limit, or one that broke off before its agent started. A trial whose verifier crashed stays, without the verifier's numbers (partial). No transcripts, paths or credentials.\n- The run of 18 October is the first such file; its cells equal the page's data.\n- A skill counts as loaded when it was loaded by the end of its phase; loading it early counts once, as out of place.", "reason": "Kept apart: the format and the score correction, which the eval session uses from this commit.", "sources": [{"sha": "3f298cd", "subject": "feat(evals): one results file per eval run, cleaned of trials that are no results; skills loaded by their phase's end", "date": "2026-10-21T09:08:57+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "feat(site): the eval runs on Prompt engineering, built from each run's results and conclusions\n\n## Intent\n\nThe page mixed the method with one run's results written by hand. Readers should see every run, how it went and what was concluded.\n\n## Key changes\n\n- The page keeps the method at its top (how we work, how an eval works, limits, how to run it) and renders the runs below from each run's results.json and conclusions.yaml: the question, the bottom line, the findings with the cells they rest on, and what became of them.\n- Every run is on the page without JavaScript. With it, one run shows at a time, and its heatmap can show the difference to another run cell by cell.\n- The build fails when a conclusion names a cell, row, metric or finding its run does not have.\n- The first run's findings move into its conclusions.yaml. The old report script and data.json go; rows and metrics live in evals/rows.ts.", "reason": "Kept apart: the page generator is its own step.", "sources": [{"sha": "073d065", "subject": "feat(site): the eval runs on Prompt engineering, built from each run's results and conclusions", "date": "2026-10-21T09:16:06+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "feat(evals): the run of 2026-10-21 with its conclusions; one table per guidance commit\n\n## ooses a pattern per competency from them.\n- The skill says how the kind of practice leads to the archetype; lernapps-app points to it for the choice; the increment template loads it in Explore too. Its building block moves to the Explore skills.\n- The verifier skips an entry it cannot read, such as a dangling symlink, instead of crashing.\n- The fresh tasks expect the commit and listing skills only when the scenario reaches them.\n- The conclusions of run 2 mark both actions as done and drop the action to force the commit and listing skills.", "reason": "Moves the exercise patterns and repairs two measures; the next commit repairs a different measure, so the two stay apart.", "sources": [{"sha": "3184adc", "subject": "feat(guidance): exercise patterns in Explore, before the archetype; evals: no crash on a dangling symlink, commit and listing skills after the scenario's end", "date": "2026-10-21T11:49:10+00:00", "pr": null, "plan": false, "moved": []}]}, {"repo": "tooling", "message": "fix(evals): see the phase a sed, a one-liner or a helper script sets; run 2's early creates read in the transcripts\n\n## Intent\n\nRun 2 counted many more apps as created before the creator confirmed the plan. The score took the first phase a command named, which in a sed is the old value, and did not see a helper script outside the plan folder at all. So the plan counted as unconfirmed and every create as early.\n\n## Key changes\n\n- The score takes the last phase a command or a write names, and the phase the template's grep prints.\n- A create in the turn that sets phase: code still counts as after the confirmation, because the creator's message opens that turn.\n- The conclusions of run 2 record what the transcripts show: 7 of 13 early creates were gaps in the measure, 6 were real, 5 of them after a yes to an early draft. A new open action: only the yes at the Plan checkpoint lets the agent run create.", "reason": "A separate measure; the next commit belongs to another request." ructured end"], "trigger": "\"ja, schick beides los\"", "kind": "eval", "confidence": "evidenced", "relations": [{"type": "continues", "intent": "i160", "note": "applies the new measure of the scenario's end to both earlier runs and corrects it on the way"}], "groups": [{"repo": "tooling", "message": "feat(evals): re-score runs 1 and 2 by the scenario's end\n\n## Intent\n\nThe new measure of the scenario's end is read from the transcripts only, so both earlier runs can be scored again without model calls. They need comparable numbers for \"Code done\", and their conclusions must rest on them.\n\n## Key changes\n\n- The transcript dimension is now scenario_end. Only the creator's last message after the plan's yes counts: the GitHub answer, the stop at publishing or the thanks to a done agent, worded freely. Only the persona's stuck line at the start of that message is the stuck end.\n- Run 1 is re-scored from its transcripts: \"Code done\" is 100 % in every cell. Haiku's explainer runs that stayed at phase: code ended regularly with a green check. The current phase detection moves one Haiku run to \"created before the plan\" and lowers the turns after the plan in three runs.\n- Run 2 is re-scored the same way: \"Code done\" is 3/3 in every cell except Haiku's interactive one (1/3). Creates before the plan drop to 3 runs, and skills in their phase rise to 76–95 % for Sonnet and Opus.\n- The conclusions of both runs follow the new numbers.", "reason": "Each re-score showed a flaw in the rule for the scenario's end, fixed in the next commit; the steps follow each other directly on one branch and only their final state is a result.", "sources": [{"sha": "4359cd2", "subject": "fix(evals): the scenario's regular end includes the creator's thanks when the agent is done", "date": "2026-10-21T13:24:50+00:00", "pr": null, "plan": false, "moved": []}, {"sha": "338c6b3", "subject": "feat(evals): run 1 re-scored from its transcripts with the scenario's end and the current phase d
