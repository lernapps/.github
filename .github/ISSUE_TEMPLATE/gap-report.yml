name: Lücke melden
description: Etwas, das Lernende können sollen, wofür es keine gute App gibt.
title: "Lücke: "
labels: [gap]
body:
  - type: markdown
    attributes:
      value: |
        Danke! Eine gemeldete Lücke ist der Anfang jeder neuen App. Unvollständige Angaben sind in Ordnung – wir fragen nach.
  - type: textarea
    id: kompetenz
    attributes:
      label: Was sollen Lernende können?
      description: Möglichst als Tätigkeit, z. B. „Argumente eines Textes gegeneinander abwägen“.
    validations:
      required: true
  - type: input
    id: stufe
    attributes:
      label: Fach und Klassenstufe
      placeholder: z. B. Deutsch, Klasse 7–8
  - type: textarea
    id: warum
    attributes:
      label: Warum passt nichts Vorhandenes?
      description: Was hast du schon ausprobiert, und woran scheitert es (Datenschutz, Anmeldung, nur Zuschauen, …)?
  - type: input
    id: lehrplan
    attributes:
      label: Bezug zum Lehrplan (optional)
      placeholder: Link oder Dokument und Seite
