name: Inhaltlicher Fehler
description: Eine Erklärung stimmt nicht, eine richtige Antwort wird als falsch gewertet, o. Ä.
title: "Fehler: "
labels: [content-error]
body:
  - type: markdown
    attributes:
      value: |
        Am schnellsten geht es über den Melde-Link unten auf der jeweiligen Seite; er legt das Issue direkt im richtigen Repository an.
  - type: input
    id: adresse
    attributes:
      label: Adresse der Seite
      placeholder: https://lernapps.github.io/…
    validations:
      required: true
  - type: textarea
    id: fehler
    attributes:
      label: Was ist falsch?
      description: Was stand da, was hättest du erwartet? Bei Übungen bitte die Eingabe angeben.
    validations:
      required: true
